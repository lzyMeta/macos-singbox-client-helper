text":"变异测试抓出的两条恒绿断言（都是本次自己写的）","line":337},{"level":3,"text":"覆盖情况（哪些挂载点有专门断言，哪些没有）","line":357},{"level":3,"text":"评审（`/sdlc-kit:review`）抓到的两条，都已修","line":376},{"level":3,"text":"补上的回归防线","line":421},{"level":3,"text":"走人工验收前补的两处","line":432},{"level":3,"text":"落地的结构","line":451},{"level":3,"text":"验证","line":466},{"level":3,"text":"真机人工验收：已完成（2026-09-10，sing-box 1.14.0，live 配置 21 条 `rule_set`）","line":492}],"front":{"kind":"spec","status":"shipped","covers":["tests/config-audit.test.sh"]},"covers":["tests/config-audit.test.sh"],"mentions":[".claude/sdlc.json","config/config.example.json","singbox-selfcheck.sh","singbox.sh","tests/config-audit.test.sh","tests/fixtures/bad-download-detour.json","tests/fixtures/bad-gnu.sh","tests/fixtures/bad-removed-field.json","tests/fixtures/bin/sudo","tests/fixtures/fake-sing-box","tests/fixtures/good-http-client.json","tests/fixtures/schema-min.json","tests/update.test.sh","tests/verify.test.sh"],"links":["README.md","docs/best-practices.md","docs/config-audit-migration-table.md","docs/safe-update.md"],"refs":[],"backlinks":["README.md","docs/config-audit-migration-table.md","docs/safe-update.md"],"backrefs":[],"body":"# 配置审查与一键适配（`config audit`）\n\n> 后续：`docs/config-audit-migration-table.md`（2026-09-10）把发现层从两路扩到四路（加内置迁移表与\n> 沙箱日志档）、改写规则从 1 条扩到 3 条，并把本文预留给「`/rules` 语义 diff」的 `--deep` 改成了\n> 沙箱日志档。本文里与之冲突的描述以那份为准。\n\n## 问题\n\n内核升级会把配置里的字段悄悄变成历史。2026-09-10 实测：本机内核已是 **1.14.0**，而 live 配置里\n21 条 `route.rule_set[]` 全部带着 `download_detour`，内核每次启动都在 `/var/log/sing-box.err` 里写：\n\n```\nWARN legacy `download_detour` remote rule-set option is deprecated in sing-box 1.14.0\n     and will be removed in sing-box 1.16.0.\n```\n\n**现有机制对这条告警全程沉默。** 脚本里有 4 处几乎同构的 `grep -qi deprecated`\n（`singbox.sh:1179-1181` install 阶段 5、`singbox.sh:1991` `cmd_edit`、\n`singbox.sh:2413-2416` `_sb_warn_deprecated`、`singbox.sh:2788` `cmd_doctor`），\n它们全都只看 `sing-box check` 的输出 —— 而实测 `check` 对 `download_detour` 一个字都不打：\n\n```\n$ sing-box check -c /usr/local/etc/sing-box/config.json\n$ echo $?\n0\n```\n\n于是形成一个闭合的盲区：**告警只在 `run` 时出现，而脚本只在 `check` 时找告警。** 到 1.16.0\n字段被真正移除那天，`check` 会从沉默直接跳到 FATAL，配置一次都起不来，而在那之前没有任何\n提示会到达用户手里。\n\n这不是 `download_detour` 一个字段的事。官方弃用清单里 1.14.0 一节共 8 条、全部计划在 1.16.0\n移除；1.10–1.12 还有一批已经移除的（`legacy inbound fields`、旧式 DNS 服务器格式、\n`inet4_address`…）。每次 `update` 升内核，这张表都会长。\n\n## 决定\n\n新增 `singbox config audit`：**用当前安装的那个内核自己**审查配置，报出废弃与不合法之处，\n并对其中一条有明确迁移路径的字段提供 `--apply` 一键改写。\n\n**发现层用两路合流，互补彼此的盲区**（两条都是只读、毫秒级、不要 root、不碰网络）：\n\n| 来源 | 抓什么 | 实测依据 |\n|---|---|---|\n| `sing-box check -c \u003ccfg>` | 废弃但仍接受的字段（WARN，**自带官方 migration 锚点 URL**）；已移除的字段（FATAL，退 1） | `store_rdrc` / `independent_cache` 各报一条 `WARN ... checkout documentation for migration: https://sing-box.sagernet.org/migration/#...` |\n| `sing-box schema` 结构比对 | schema 里不存在的键。**sing-box 的 schema 生成器剔除了全部废弃字段**，所以「未知键」集合 ≈ 废弃 ∪ 已移除 ∪ 拼错 | `store_rdrc`/`independent_cache`/`download_detour`/`rule_set_ip_cidr_accept_empty`/`domain_strategy`/`inet4_address` 在 445KB schema 里的出现次数全是 0；新字段 `initial_path`/`match_response` 在 |\n\n`check` 沉默的 `download_detour` 由 schema 档抓到；schema 不认识的「还合法但已废弃」由 check\n档定性。两路合流的覆盖面严格大于「沙箱 `run` + check」那条路，而且审的是**配置原件**——\n沙箱审的是 `_sb_derive_config`（`singbox.sh:2309-2342`）产出的派生件，它会\n`exp.pop(\"clash_api\")`、换端口、改 cache 路径，被改掉的段落里的废弃项就此不可见，\n是结构性漏报。**沙箱在本功能里的位置是验收层，不是发现层。**\n\n**改写层只做一条规则**，逐字搬移值：\n\n```json\n// 前\n{\"type\":\"remote\",\"tag\":\"geosite-cn\",\"format\":\"binary\",\"url\":\"...\",\"download_detour\":\"vpstrans\",\"update_interval\":\"7d\"}\n// 后\n{\"type\":\"remote\",\"tag\":\"geosite-cn\",\"format\":\"binary\",\"url\":\"...\",\"http_client\":{\"detour\":\"vpstrans\"},\"update_interval\":\"7d\"}\n```\n\n用**内联 `http_client` 对象**，不引顶层 `http_clients[]` 数组、不设 `route.default_http_client`。\n理由是实测出来的：`check` 放过 tag 引用错误，只有真跑起来才炸 ——\n\n```\n$ sing-box check -c mig-badref.json     # http_client: \"rs_dl\"，顶层 tag 实为 \"rs-dl\"\n$ echo $?\n0\n$ sing-box run -c mig-badref.json\nFATAL start service: initialize rule-set[0]: create rule-set http client: http_client not found: rs_dl\n```\n\n内联写法没有 tag 引用，从源头免疫这一类错误。\n\n**落地姿态**：裸跑 `config audit` 只读出报告；`--apply` 才写 live，且必须走完四道验收。\n\n**退出码**（与 `cmd_verify` 的两档约定同构）：\n\n| 码 | 含义 |\n|---|---|\n| 0 | 没有废弃项、没有未知键 |\n| 2 | 有废弃项但内核仍接受（`check` 的 WARN、schema 未知键而 check 无话）—— 配置现在能跑，将来会坏 |\n| 1 | 内核会拒（`check` FATAL）—— 配置已经起不来或升级后必起不来 |\n\n**挂载点**（发现层只读秒级，所以挂进现成流程几乎免费）：\n\n1. `cmd_update` 升级成功后自动跑一次发现层，只报不改，**不影响 update 的退出码与回滚判定**\n   —— 内核版本变了，废弃面和 schema 跟着变，这是最该自动检查的时刻，也正是本次问题的成因。\n2. `cmd_verify` 新增一档「配置现代性」，挂**策略档**（`vpbad`，退 2），不算链路断。\n3. 上述 4 处 `grep -qi deprecated` 全部收敛到发现层的同一个函数，顺便修掉它们只看 `check`\n   输出的盲区。\n\n`singbox.sh:2411-2412` 那段注释（「废弃字段照打照记，但一个字都不自动改 —— 改写配置需要读\nrelease notes 与上游文档，验收标准和『安全升级』完全不是一回事」）是被本次推翻的立场，\n需要改写成新立场：**发现层自动跑、改写只在 `--apply` 且只走白名单内的 1 条规则、\n并以四道验收替代「读 release notes」这个人工前提。**\n\n### 「不更改已配置的功能」怎么机械证明\n\n四道验收，缺一不可。每一道挡的是不同的错，这是按「改写可能出的 6 种错」逐项对照后裁剪出来的：\n\n| 改写可能出的错 | 哪道挡住 |\n|---|---|\n| ① 漏改：21 条只改了 20 条 | **④ 重跑发现层归零**（前三道全漏 —— 漏改不产生 diff，`check` 沉默，沙箱起得来） |\n| ② 值搬错：`http_client:{}` 丢了 `detour` | 四道全漏。**只能靠白名单规则本身精确到值**：新 `http_client.detour` 必须逐字等于旧 `download_detour` |\n| ③ 顺手弄坏别的：`json.dump(indent=2)` 重排时误删 `update_interval` | **① 白名单 diff** |\n| ④ tag 引用写错 | **③ 沙箱起得来**（`check` 实测放过）；内联写法已从源头免疫 |\n| ⑤ 跨段污染：手滑改了某条 `route.rules` 的 `outbound` | **① 白名单 diff** |\n| ⑥ 全局默认副作用：`route.default_http_client` 改变所有隐式下载通道 | 四道全漏 → **靠范围排除解决**，见下节 |\n\n1. **离线白名单 diff**：改写前后的 JSON 结构 diff 必须只落在 `route.rule_set[*]` 的\n   `download_detour` → `http_client` 上，且值逐字相等。落在别处即拒绝落地。\n2. **`sing-box check -c \u003c新配置>`** 通过。\n3. **沙箱起得来**：新配置经 `_sb_derive_config` 派生后在沙箱跑，`_sb_health`\n   （`singbox.sh:2387`）通过。复用现成沙箱，不改 `singbox.sh:2333`。\n4. **重跑发现层归零**：`--apply` 之后再跑一次发现层，`download_detour` 命中数必须为 0。\n\n不做 `/rules` 语义 diff：`download_detour`/`http_client` 是**下载通道**，不进内核解析后的路由表，\n在 `GET /rules` 的输出里根本不出现，A 与 B 恒等，对这条规则增量为 0。不跑 `cmd_verify`：\n规则集已在 `cache.db` 里，通道变化在缓存未过期时根本不走，同样增量为 0，而代价是分钟级耗时\n加 `verify` 本身的偶发假负。\n\n## 不在范围内\n\n1. **`/rules` 语义 diff（`--deep`）不实现。** 只在参数解析里留 flag 位并在 `--deep` 时明确报\n   「尚未实现」。它要到迁移表扩进路由语义类条目（`ip_cidr` 无 `match_response`、\n   `strategy` DNS 规则操作）时才不可替代，届时还需要把 `singbox.sh:2333` 从\n   `exp.pop(\"clash_api\")` 改成换端口保留。\n2. **「隐式默认 HTTP 客户端 → 显式 `http_clients` + `route.default_http_client`」只报不改。**\n   它是上表的 ⑥ 型改动，四道验收全挡不住，且影响面是全局默认值（`external_ui_download`、\n   证书提供者等所有走隐式默认 HTTP 客户端的东西），远超规则集下载。\n3. **1.14.0 弃用表其余 6 条、1.10–1.12 的历史废弃，一律只报不改**（报告里给官方 migration\n   链接）。本机配置里这些一条都没命中，没有真实样本可验，改写代码只能靠造 fixture，而\n   fixture 上的「语义等价」没有真实行为做背书。\n4. **不做性能或策略层面的「优化方向」建议**（规则顺序、DNS 策略、规则集合并/拆分…）。\n   原始需求里提到「优化的方向」，本轮把范围收在**废弃与合法性**上：那部分已由\n   `cmd_verify` 与 `docs/best-practices.md` 覆盖，混进来会让「一键适配」失去可机械验收的边界。\n5. **不新增 `singbox-selfcheck.sh` 的自检项。** 那 13 项查的是 shell 写法，本功能不引入新的\n   shell 反模式类别。\n6. **不碰规则集的自动更新/强制刷新**，也不把 21 条迁到 `type: local`。那是另一件事，\n   已在一次面试后放弃立项。\n7. **不改 `config/config.example.json` 之外的任何真实配置**：`--apply` 只改 `$CFG`，\n   不动订阅、不动凭据、不重排无关字段。\n\n## 受影响的文件与接口\n\n### `singbox.sh`\n\n| 改动 | 位置 |\n|---|---|\n| 新增 `_cfg_audit \u003c配置路径>` —— 发现层，两路合流，输出结构化行到 stdout | 新函数 |\n| 新增 schema 子集校验器（内联 python3，heredoc 一律 `\u003c\u003c'PY'`） | 新函数内 |\n| 新增 `_cfg_migrate \u003c配置路径> \u003c输出路径>` —— 白名单改写，1 条规则，值逐字搬移 | 新函数 |\n| `cmd_config` 的 `case` 新增 `audit)` 分支 | `singbox.sh:2009-2033` |\n| 收敛 4 处 `grep -qi deprecated` 到 `_cfg_audit` | `1179-1181`、`1991`、`2413-2416`、`2788` |\n| 改写 `_sb_warn_deprecated` 上方的立场注释 | `singbox.sh:2411-2412` |\n| `cmd_update` 阶段 3 之后调用发现层（只报，不影响退出码与回滚） | `singbox.sh:2545` 附近 |\n| `cmd_verify` 新增策略档一条（`vpbad`） | `singbox.sh:1658-1792` |\n| `cmd_help` 的 `config \u003csub>` 一行加 `audit` | `singbox.sh:2918` |\n| 内核版本闸门：`\u003c 1.14.0` 时 schema 档标为不可信并降级为只用 check 档；`--apply` 在 `\u003c 1.14.0` 上直接 `die`（`http_client` 那时还不存在） | 复用 `ver_gt`（`827`）与 `\"$BIN\" version \\| head -1 \\| awk '{print $3}'`（`2472-2480` 同款写法） |\n\n**接口约定**\n\n```\nsingbox config audit [--config \u003cpath>] [--apply] [--deep]\n```\n\n- `--config \u003cpath>`：审查任意文件而非 `$CFG`。**这条让测试能完全离线**，不需要 live 配置、\n  不需要 root。\n- 裸跑：只读，退出码 0/2/1 如上。\n- `--apply`：走四道验收后写 `$CFG`，回退点用现有 `backup_config`（`singbox.sh:610`）+\n  `prune_backups 10`，**不新增第二套备份机制** —— 回退走现成的 `config restore` /\n  `config diff`（`singbox.sh:2009-2033`）。\n- `--deep`：保留位，报「尚未实现」。\n\n`_cfg_audit` 的每条发现输出一行，TAB 分隔，供调用方自行渲染：\n\n```\n\u003ctier>\\t\u003csource>\\t\u003cjson路径>\\t\u003c说明>\\t\u003c官方迁移链接或空>\n```\n\n`tier` ∈ `removed`（对应退 1）/ `deprecated`（退 2）；`source` ∈ `check` / `schema`。\n**报告必须点名具体键路径**（如 `route.rule_set[0].download_detour`），不允许只说\n「`rule_set[0]` 不匹配任何分支」—— 见待定问题 1。\n\n### 测试\n\n| 文件 | 改动 |\n|---|---|\n| `tests/config-audit.test.sh` | 新增。全离线，靠 `--config` 指向 fixture |\n| `tests/fixtures/bad-download-detour.json` | 新增。带 `download_detour`，必须被点名 |\n| `tests/fixtures/good-http-client.json` | 新增。已是内联 `http_client`，必须放行（退 0） |\n| `tests/fixtures/bad-removed-field.json` | 新增。带已移除字段，必须退 1 |\n| `tests/fixtures/fake-sing-box` | 需新增 `schema` 子命令（当前未实现的子命令一律 `exit 2`，见 `tests/fixtures/fake-sing-box:78-79`）；`check` 的告警沿用已有的 `SB_FAKE_DEPRECATED` 后门 |\n\nfixture 命名沿用现有 `bad-\u003c问题名>` / `good-\u003c写法>` 约定（`tests/fixtures/bad-gnu.sh`、\n`good-mv-launcher.sh`）。**注意内联 python3 绕过 PATH 假二进制**\n（`singbox.sh:1521,1563` 的注释已记），schema 档的测试需要 `SB_FAKE_*` 式的环境变量后门。\n\n### 文档\n\n| 文件 | 改动 |\n|---|---|\n| `README.md:155` | 「22 个子命令」计数 |\n| `README.md:157-163` | 命令分类表 |\n| `docs/script-usage.md:114-127` | 命令速查表 | \u003c!-- doc:gone -->\n| `docs/script-usage.md` | 新增一节讲 `config audit` 与两路合流的盲区互补 | \u003c!-- doc:gone -->\n| `docs/safe-update.md` | 记一笔「阶段 3 之后自动跑发现层」这个新决定（与 `:134` 那条「升级后不自动跑 `cmd_rules`」并列，但是另一件事） |\n| `.claude/sdlc.json` | `docs.context7.libraries.sing-box.version` `1.13.14` → `1.14.0`（取实测安装版本） |\n\n## 待定问题\n\n1. **schema 子集校验器的 `oneOf` 错误归因。** ——已定（结论见「实现计划」）\n   `$defs/RuleSet` 是三分支 `oneOf`（`inline`/`local`/`remote`，各自 `additionalProperties: false`），带 `download_detour` 的\n   条目会同时不匹配三个分支。必须先按 `type` 的 `const` 选定分支再校验，才能报出具体键名。\n   没有 discriminator 的分支（如 `$defs/HTTPClientReference` 是 `anyOf: [string, object]`）\n   怎么归因，由实现阶段定。**spec 只约束结果**：报告必须点名键路径。—— 责任人：实现者\n2. **`\u003c 1.14.0` 的内核，schema 里是否同样剔除废弃字段？** ——已定（结论见「实现计划」）\n   未实测（手上只有 1.14.0）。闸门保守取 1.14.0：低于它只用 check 档。要不要为老内核补兼容 —— 责任人：lzyMeta\n3. **`--apply` 的沙箱验收依赖网络。** ——已定（结论见「实现计划」）\n   沙箱里 `cache.db` 是空的，真配置 21 个 `type: remote` 规则集冷启动要现下一遍（`docs/safe-update.md:246` 已记，`SANDBOX_WAIT=40` 就是为此加的）。\n   网络不通时第三道验收该算失败、还是跳过并降级为「只过了 1/2/4 三道」—— 责任人：lzyMeta\n4. **`fake-sing-box` 的 `schema` 子命令吐什么。** ——已定（结论见「实现计划」）\n   吐一份裁剪过的固定 schema fixture（够覆盖 `route.rule_set` 三分支即可），还是吐真内核 schema 的快照（445KB 进仓库）\n   —— 责任人：实现者\n5. **报告里要不要带 `sing-box schema` 的建议新写法片段。** ——已定（结论见「实现计划」）\n   `$defs/RuleSet` remote 分支给出了 `http_client` 与 `initial_path` 的完整结构，可以直接生成可粘贴的 JSON 片段；\n   但对「只报不改」的那些条目，生成片段等于在做第 2、3 条被排除的改写工作\n   —— 责任人：lzyMeta\n\n## 验证\n\n### 验收条件\n\n- AC1 ★ `config audit --config tests/fixtures/bad-download-detour.json` 退出码 2，输出按键路径点名 `route.rule_set[0].download_detour`（不是「不匹配任何分支」），且不误报同名合法字段 `external_ui_download_detour`。反例：把 schema 档整个关掉 → 对脏配置退 0；把键路径比对换成子串 `grep -c download_detour` → 多出一行 `external_ui_download_detour` 的误报。\n- AC2 `good-http-client.json` 退 0 且无任何发现；`bad-removed-field.json` 退 1。反例：「起不来」与「将来会坏」两档共用一个退出码 → 后者退 2。\n- AC3 `--apply` 对 `bad-download-detour.json` 的结构 diff 只落在 `route.rule_set[*]` 的 `download_detour` → `http_client.detour`，值逐字相同、`update_interval` 等同级字段一字不变，改写后重跑发现层命中数为 0。反例：用 `SB_FAKE_MIGRATED` 注入「`route.rules[3].outbound` 被额外改动」或「`http_client` 为空对象」→ 第 1 道白名单 diff 必须拒绝；把第 1 道或第 4 道改成永远通过 → 断言 6/7 与「① 漏改」红。\n- AC4 假内核报 `1.13.14` 时 `--apply` 直接失败并说明 `http_client` 需要 ≥ 1.14.0。反例：版本闸门只比 major → `1.13.14` 被放行。\n\n### 机械验收（离线，进 CI 口径）\n\n```\n./singbox-selfcheck.sh && ./tests/run.sh\n```\n\n`tests/config-audit.test.sh` 至少断言：\n\n| # | 断言 |\n|---|---|\n| 1 | `config audit --config tests/fixtures/bad-download-detour.json` 退出码为 **2**，输出点名 `route.rule_set[0].download_detour`（不是「不匹配任何分支」） |\n| 2 | `config audit --config tests/fixtures/good-http-client.json` 退出码为 **0**，无任何发现 |\n| 3 | `config audit --config tests/fixtures/bad-removed-field.json` 退出码为 **1** |\n| 4 | 对 `bad-download-detour.json` 做改写后，结构 diff **只**落在 `route.rule_set[*]` 的 `download_detour`/`http_client` 上，且 `http_client.detour` 逐字等于原 `download_detour`；`update_interval` 等同级字段一字不变 |\n| 5 | 改写后重跑发现层，`download_detour` 命中数为 **0** |\n| 6 | 在一份「`route.rules[3].outbound` 被额外改动」的伪改写结果上，白名单 diff 必须**拒绝**（防 ⑤ 跨段污染） |\n| 7 | 在一份「`http_client` 为空对象」的伪改写结果上，白名单 diff 必须**拒绝**（防 ② 值搬错） |\n| 8 | 假内核版本报 `1.13.14` 时，`--apply` 直接失败并说明 `http_client` 需要 ≥ 1.14.0 |\n| 9 | `--deep` 报「尚未实现」且退出码非 0 |\n\n### 人工验收（要动 live，已 deny，须本人跑）\n\n```bash\n./singbox.sh config audit            # 期望 退 2，点名 21 处 download_detour，附官方 migration 链接\n./singbox.sh config audit --apply    # 期望 四道验收全过后落地并重启\n./singbox.sh config audit            # 期望 退 0\nsudo grep -ci deprecated /var/log/sing-box.err   # 重启后应不再增长\n./singbox.sh config diff             # 期望 diff 只有 21 处 download_detour → http_client\n```\n\n外部 API 口径：全部断言针对 **sing-box 1.14.0**（`/sagernet/sing-box`，Context7 ID 已在\n`.claude/sdlc.json`）。`sing-box schema` 与 `check` 的行为随内核版本变化，升级后这些断言\n需要复核 —— 这正是挂载点 1（`update` 后自动跑发现层）要解决的问题。\n\n## 实现计划\n\n2026-09-10 落地。按栈拆成三个单元，各自自带测试、独立跑绿：\n\n| 单元 | 内容 |\n|---|---|\n| **A 发现层** | `_cfg_audit`（两路合流）＋ schema 子集校验器 ＋ `config audit` 子命令与参数解析 |\n| **B 改写层** | `_cfg_migrate` ＋ `_cfg_whitelist_diff` ＋ `_cfg_apply` 的四道验收 ＋ 版本闸门 |\n| **C 挂载与文档** | 收敛 4 处 `grep -qi deprecated`、`update` 阶段 3 后、`verify` 第 6 步、README / script-usage / safe-update |\n\n### 三个待定问题的落地结论\n\n| # | 结论 | 谁定的 |\n|---|---|---|\n| 1 | `oneOf` 归因**有 discriminator 可用**：`$defs/RuleSet` 三分支靠 `type` 的 `const`/`enum` 分派，`$defs/HTTPClientReference` 的 `anyOf` 靠 JSON 类型本身分派（string / object）。报告点名到具体键路径，spec 的约束满足 | 实现者 |\n| 2 | 闸门保守取 1.14.0：低于它只用 check 档，`--apply` 直接 `die`。老内核兼容**不做** | 照 spec 的保守方案 |\n| 3 | 网络不通时第 3 道**降级为 3/4 道并在输出里明说**，`--apply` 仍落地 | lzyMeta |\n| 4 | `fake-sing-box` 的 `schema` 吐一份**裁剪过的 schema fixture**（`tests/fixtures/schema-min.json`，3.7KB，从真内核 schema 程序化裁出），不把 445KB 快照塞进仓库 | 实现者 |\n| 5 | 报告**不生成**可粘贴的 JSON 片段，只给官方 migration 链接。生成片段等于把「不在范围内」第 2、3 条排除掉的改写工作挪到人手上，而那些条目本机零命中、没有真实样本可验 | lzyMeta |\n\n### spec 与实测不符的四处\n\n**① `download_detour` 在 schema 里的出现次数是 1，不是 0。**\n那一处是 `$defs.ClashAPIOptions.properties.external_ui_download_detour` —— 一个 1.14.0\n**仍然有效**的字段。spec 用子串计数得出「全是 0」，撞上了子串包含。\n\n这一条改变了实现：schema 档**必须走结构化键路径比对**，任何 `grep -c download_detour`\n形状都会假阳性，而断言 5「改写后命中数为 0」若照子串写，在真配置上永远是假红。\n`tests/fixtures/bad-download-detour.json` 里特意保留了这个合法的同名字段，并配一条\n「不许误报 `external_ui_download_detour`」的断言，把这个坑钉住。\n\n**② `fake-sing-box` 的 `schema` 子命令不需要新的「绕过 PATH 桩」后门。**\n`singbox.sh:1521 / 1563` 那两条注释针对的是**内联 python3 自己去联网**（PATH 桩拦不住）；\n这里内联 python3 只**消费** schema 文本，产生它的是 `\"$BIN\" schema` 这个外部调用，桩完全\n拦得住。只加了一个 `SB_FAKE_SCHEMA=\u003c路径>` 给桩**指路**（模板被 sed 到临时目录后 `$0`\n已不在仓库里，读不到相对路径），性质与那两个后门不同，已在 fixture 头部注明。\n\n**③ `cmd_doctor` 那处 `grep deprecated` 不在盲区里，没有被收敛掉。**\n它的输入 `$out` 里含 `tail \"$ERRFILE\"`，也就是**内核运行日志** —— 那恰恰是\n`download_detour` 告警唯一真正出现的地方。四处里只有它看得见。所以那一行**保留**，\n另加一次发现层调用，让 doctor 同时有运行时视角和配置视角。删掉它是退步。\n\n**④ README 的「22 个子命令」计数不用改。** `audit` 是 `config` 的子命令，不新增顶层命令。\n改的是分类表里点出 `config audit`，以及 `verify` **五步 → 六步**（这条 spec 没提，但加了\n第 6 步不改就是文档与实现不一致）。\n\n### 实现过程中发现的一个真 bug（不在 spec 里）\n\n发现层最初把「内核跑不起来」误判成「配置里有已移除字段」：`$BIN` 损坏、权限不对、根本\n没装的时候 `check` 同样退非 0，而那种失败长得跟「内核拒绝配置」一模一样。一个装坏了的\n内核会被报成配置有问题，结论完全是误导的。\n\n是 `tests/verify.test.sh` 暴露的——那里 `$BIN` 是个空文件，加上第 6 步之后 16 条断言里\n挂了 5 条。修法是在 `_cfg_audit` 开头加前置闸门：`\"$BIN\" version` 问不出版本号就直接返回；\n`_cfg_audit_report` 则明确 `die \"内核不可用…审查无法进行\"`，不静默报「干净」。\n\n### 变异测试抓出的两条恒绿断言（都是本次自己写的）\n\n实现绿了之后，故意破坏实现跑了三组变异，确认断言不是恒绿的。前两组各抓出一条：\n\n- 「⑤ 拒绝后 live 配置保持原样」原本用 `\"download_detour\" in json.dumps(...)` 判 ——\n  改写后 `external_ui_download_detour` 仍在，子串恒命中。**正是上面 ① 那个坑，写测试时\n  自己踩了一遍。** 改成结构化地数 `route.rule_set` 里的命中条数。\n- 「② 拒绝时说明了 detour 没搬过来」原本 `grep 'detour'`，而正常输出里到处都是 detour。\n  改成钉住实现给出的那句「detour 丢了」。\n\n三组变异的结果（还原后全绿）：\n\n| 变异 | 应该红的断言 |\n|---|---|\n| 第 4 道（发现层归零）永远通过 | ① 漏改那 2 条 ✓ |\n| 第 1 道（白名单 diff）永远通过 | ⑤ 跨段污染 3 条 ＋ ② 值搬错 2 条 ✓ |\n| schema 档整个关掉 | 发现层 6 条 ✓（`config audit` 对脏配置退 0） |\n\n另外自检抓到一处 `$CFG，` —— 变量紧贴全角逗号，正是 CLAUDE.md 点名的 bash 3.2 坑。\n\n### 覆盖情况（哪些挂载点有专门断言，哪些没有）\n\n有专门断言的：\n\n- `verify` 第 6 步 —— `tests/verify.test.sh` 里 `$BIN` 是空文件，前置闸门会直接返回，\n  那 16 条**从没碰过**第 6 步。所以在 `config-audit.test.sh` 里补了 4 条（脏配置点名 2 处、\n  走策略档退 2、干净配置打 ok、第 6 步真的跑了）。\n- `update` 阶段 3 之后 —— `tests/update.test.sh` 的现网配置是干净的，那 20 条同样从没触发过\n  这个挂载点。补了 2 条独立用例（脏配置下 update **仍退 0 且新内核在位**、日志里确有废弃项），\n  用 `store_rdrc` 驱动而非 `download_detour`：后者只有 schema 档看得见，而那条用例升的是\n  1.13.19，schema 档被版本闸门关掉了。\n- `--apply` 的第 3 道（沙箱）—— 用 `SB_FAKE_UDP=alive` / `dead` 各跑一条，确认它既会真跑\n  也会降级。只测降级路径的话第 3 道就是死代码。\n\n**没有专门断言的**：`install` 阶段 5、`edit` 校验后、`doctor` 自动判读三处收敛。它们与\n`update` 挂载点同构（都调 `_cfg_audit_notice`，返回值恒 0、只 `warn`），契约已由 update\n那 2 条覆盖；`install.test.sh` / `cli.test.sh` 的回归证明没改坏。残余风险：这三处的新输出\n文案没有被钉住。\n\n### 评审（`/sdlc-kit:review`）抓到的两条，都已修\n\n**① 发现层用 sudo，且「审不了」被报成了「配置已经坏了」。**（推翻了上面「实现过程中\n发现的一个真 bug」那节的完成声明——前置闸门只挡住了 `$BIN` 那一半。）\n\n`_cfg_audit` 原先对 `$CFG` 跑的是 `sudo \"$BIN\" check`。**sudo 自己失败时同样 `rc != 0`**，\n输出里没有 `unknown field`，于是走兜底分支把 sudo 的错误行整行当成一条 `removed` 发现：\n\n```\n  [removed/check] -\n      sudo: a terminal is required to read the password; ...\n  ✗ 1 项已被本版本内核移除，配置起不来\nEXIT=1\n```\n\n后果比误报更重：`cmd_verify` 原先**通篇没有一次 sudo**（1-5 步只有 curl/dig/ping，也没有\n`need_root`），第 6 步让一个只读诊断命令第一次开始要提权，于是干净配置在无 TTY 环境\n（cron、`ssh host singbox verify`）下会退 2 —— 而 `update` 阶段 3 读的正是这个退出码。\n需求来源 §决定 和 §接口约定 两处都写明发现层「不要 root」。\n\n测试抓不到它，因为 `tests/fixtures/bin/sudo` 是个恒成功的透传桩。\n\n修法分三层：\n\n1. **发现层彻底去 sudo**。`sing-box check -c` 只读配置，`$CFG` 是 644，本来就不需要提权。\n   `_cfg_apply` 第 2 道的 `sudo \"$BIN\" check` 一并去掉（`$new` 是 `mktmp` 建的）；真正需要\n   root 的只有落地那几行，那里本来就有 `need_root`。\n2. **把「审不了」和「配置坏了」分开**。`_cfg_audit` 的返回值从此有意义：0 = 审完了，\n   1 = 审不了。判据是输出像不像内核自己的诊断（有 `unknown field`，或至少有 `FATAL`）；\n   两样都没有就是审查本身没做成，返回 1，**不产生任何发现**。\n3. **各调用方分别处置**：`config audit` 明确 `die \"审查没做成…这不代表配置没问题\"`；\n   `verify` 第 6 步打 info 跳过、**不 vpbad**；`_cfg_audit_notice`（install/edit/update/doctor\n   四个搭车的挂载点）静默退场；`_cfg_apply` 第 4 道**拒绝落地**——那一道是漏改的唯一防线，\n   跳过它等于四道只剩三道。\n\n顺带修正同一类误导的反方向：前置闸门原先在内核问不出版本号时 `return 0`（＝审完了、\n没发现），会让 verify 打出「配置里没有废弃字段」。改成 `return 1`。\n\n**② `inlog '沙箱'` 是恒绿断言，「第 3 道真跑了」那一路其实没被覆盖。**\n\n`step \"验收 3/4　沙箱起得来\"` 是无条件打印的，降级分支的 warn 里也写着「沙箱」二字 ——\n把整段沙箱代码删掉换成 `passed=3`，那条断言照样 PASS。改成钉住只有真跑才会出现的\n`沙箱建链成功`，外加 `! inlog '只过了 3/4 道'`（不能只写 `3/4`：会撞上 step 标题「验收 3/4」，\n那是假红）。\n\n### 补上的回归防线\n\n评审那条 bug 的原始形状——「文件可读，但 check 退非 0 且输出一个字都不像内核诊断」——\n原先没有任何东西能驱动它（`chmod 000` 会被 `[ -r \"$cfg\" ]` 提前拦下，走不到兜底分支）。\n给 `fake-sing-box` 加了 `SB_FAKE_CHECK_NOISE=1`：check 退 1，只吐一行\n`sudo: a terminal is required to read the password`。配套 2 条断言钉住「不是内核在说话就\n不许报 removed」。变异验证：把兜底分支退回原样，这 2 条立刻红。\n\n`tests/verify.test.sh` 那 16 条是这条防线的另一半——那里 `$BIN` 是空文件，第 6 步走的正是\n「审不了 → 跳过」分支，它们全绿就意味着 verify 没有被审查失败带偏。\n\n### 走人工验收前补的两处\n\n对着 spec §验证 的人工验收步骤逐条比对时，发现实现漏了两件 spec 明写或脚本通用约定要求的事：\n\n1. **`--apply` 落地后没有重启服务。** spec §验证 写的是「四道验收全过后落地**并重启**」，\n   而实现只写文件就返回了 —— 内核还在跑旧配置，`sing-box.err` 里的 deprecated 告警不会停，\n   验收第 4 步（`grep -ci deprecated` 不再增长）永远对不上。`cmd_config restore` 本来就是\n   用 `cmd_restart` 收尾的，照它补上。\n2. **`--apply` 不认全局 `-n`。** 干跑是这个脚本的通用约定（`cmd_edit` 就有），而 `--apply`\n   改的是 live 配置，恰恰最该能先预演。四道验收本身全是只读的，所以 `-n` 在**落地那一步**\n   收手就够了 —— `-n config audit --apply` 是一次完整预演：会改成什么、四道过不过，全说清楚，\n   只是不写盘。\n\n顺带加了一次落地前确认（`ask`，**默认 y**）。默认不能写 n：`ask` 在 `-y` / 非交互下取的是\n**默认值**而不是「一律同意」，写 n 会让自动化场景永远落不了地。\n\n两处都补了断言，并各自变异验证过（拿掉 `-n` 分支 → 「配置一个字节都没被写」红；拿掉\n`cmd_restart` → 「落地后重启了服务」红）。\n\n### 落地的结构\n\n```\n_cfg_audit          发现层，两路合流，输出 TAB 行。**不用 sudo。**\n                    返回 0 = 审完了 / 1 = 审不了（这两件事不能混）\n_cfg_audit_report   渲染 + 按 tier 定退出码（0/2/1），config audit 用\n_cfg_audit_notice   挂载点专用：只报，返回值恒 0，不参与调用方的成败判定；审不了就静默退场\n_cfg_migrate        改写层，一条规则，逐字搬移；SB_FAKE_MIGRATED 是测试注入点\n_cfg_whitelist_diff 第 1 道，结构 diff（不是文本 diff）\n_cfg_apply          四道验收 + 版本闸门 + backup_config/prune_backups 落地\n```\n\n`SB_FAKE_MIGRATED` 存在的理由：不给这个注入点，第 1 道验收就只能被自己产出的**正确**\n结果喂 —— 它永远绿，也就永远测不出它到底拦不拦得住。断言 6/7 和「① 漏改」三条都靠它。\n\n### 验证\n\n```\n./singbox-selfcheck.sh && ./tests/run.sh     # 退出码 0\n```\n\n160 条断言全绿，其中 `tests/config-audit.test.sh` 48 条：\n\n| 覆盖 | 条数 |\n|---|---|\n| 发现层（退出码三档、键路径点名、两路各自的来源、不误报同名子串与 `type: local`） | 16 |\n| `--apply` 四道验收（含 ①②⑤ 三型错各自被哪道拦住、版本闸门、3/4 降级与完整路径） | 17 |\n| `verify` 第 6 步挂载点 | 4 |\n| 「审不了 ≠ 有问题」（评审后补） | 7 |\n| `-n` 干跑不写盘、落地后重启（人工验收前补） | 4 |\n\n⚠️ **`./tests/run.sh` 连跑会偶发 2 条红**（`cli` 的 `-n restart`、`selfupdate` 的\n「远端 == 本地」），报的是 `另一个 singbox 实例正在运行（PID …）` —— 全局互斥锁争用，\n单独重跑各自全绿。这是**既有的** flakiness，不是本次改动引入的，但值得单列一笔。\n\n真内核旁证（1.14.0，只读 fixture，不碰 live 配置）：把 `singbox.sh` 里 schema 档那段\npython 原样抽出来喂真 schema —— `bad-download-detour.json` 恰好 2 条命中且都是\n`route.rule_set[N].download_detour`、没有误报 `external_ui_download_detour`；\n`good-http-client.json` 0 条；`bad-removed-field.json` 真 schema 还多抓到\n`inbounds[1].inet4_address`（真 schema 约束 `inbounds`，裁剪版不约束）。\n\n### 真机人工验收：已完成（2026-09-10，sing-box 1.14.0，live 配置 21 条 `rule_set`）\n\n| 步 | 命令 | 结果 |\n|---|---|---|\n| 1 只读审查 | `config audit` | 退 **2**；恰好 21 行 `route.rule_set[0..20].download_detour`；**来源栏全是 `schema`，一条 `check` 都没有**（check 对它全程沉默，spec 开头那个盲区的真机证据）；`external_ui_download_detour` 一次都没冒出来（live 配置里确实有这个合法字段） |\n| 2 干跑 | `-n config audit --apply` | 四道全过，第 3 道**真跑**（`沙箱建链成功，出口 95.169.17.163`，21 个 remote 规则集在空 cache 上下完了），落地前收手，配置未动 |\n| 3 落地 | `config audit --apply` | 用 `!` 前缀跑时被 `need_root` 挡住（无 TTY，sudo 要不到密码）—— **配置一字未动**，`need_root` 排在 `backup_config` 之前。在终端重跑后落地，备份 `config.json.20260910-192012.bak`，服务已重启 |\n| 4a 归零 | `config audit` | 退 **0**，`✓ 没有废弃项，也没有未知键` |\n| 4b 结构 diff | 对最新备份做扁平化比对 | 删 21 键（全是 `.download_detour`）、增 21 键（全是 `.http_client.detour`）、**值变了的 0**、**白名单外的改动 0**；搬移的值去重后只有 `vpstrans`；文件 10,791 → 11,379 字节，差 588 = 21 × 28 |\n| 4c verify | `verify` | 六步全过，退 **0**，第 6 步 `✓` |\n| 4d 日志增量 | `sudo grep -ci deprecated /var/log/sing-box.err` 隔时段两次 | 计数**没有增加**（lzyMeta 在终端核对）—— 重启后内核不再写 `download_detour` 告警，改动确实生效了 |\n\n验收过程中顺手修的：`verify` 前五步的标题分母还是 `/5`、第六步却是 `6/6` —— 加步骤时漏改。\n统一成 `/6`，README 与 script-usage 里的「五步」同步；`docs/safe-update.md` 里的「五步」是\n那份 spec 落地时的历史记录，不动。\n\n一处记下不改的：`need_root` 打的「TUN 建虚拟网卡、改路由表必须 root」是给 `install` 写的\n文案，落在 `--apply` 上不贴切。不阻塞，不在本轮范围。\n"},{"path":"docs/config-audit-findings-guide.md","title":"`config audit` 结论解读手册：每条「怎么办」背后的问题、实例与判断方法","summary":"`config audit` 的报告只有一张汇总表加编号详情。「怎么办」一列是十几个字的短语，详情区只给 sagernet 官方迁移页的链接。这对 `--apply` 能自动改的 3 条够用，对其余 19 条「只报不改」的条目 不够——尤其是 2 条 `notice`，它们要求人来判断要不要改，报告却没给判断依据。","hash":"972b231dea20b4e6","kind":"spec","inferred":false,"status":"shipped","headings":[{"level":1,"text":"`config audit` 结论解读手册：每条「怎么办」背后的问题、实例与判断方法","line":9},{"level":2,"text":"问题","line":11},{"level":2,"text":"决定","line":43},{"level":3,"text":"文档结构","line":53},{"level":3,"text":"两条 `notice` 的正文（本规格先把它们写定，其余 17 条由 build 按同一模板补）","line":80},{"level":3,"text":"报告端的三处改动","line":117},{"level":3,"text":"机械同步（`tests/docs.test.sh` 新增一项）","line":132},{"level":2,"text":"不在范围内","line":142},{"level":2,"text":"受影响的文件与接口","line":156},{"level":2,"text":"待定问题","line":171},{"level":2,"text":"验证","line":186},{"level":2,"text":"实现计划","line":213}],"front":{"kind":"spec","status":"shipped","covers":["docs/config-audit-findings.md","tests/docs.test.sh","tests/config-audit.test.sh"]},"covers":["docs/config-audit-findings.md","tests/docs.test.sh","tests/config-audit.test.sh"],"mentions":[".claude/sdlc.json","config/config.example.json","docs/","singbox.sh","tests/config-audit.test.sh","tests/docs.test.sh"],"links":["CLAUDE.md","README.md","docs/config-audit-findings.md","docs/maintaining.md","docs/manual-config.md"],"refs":[],"backlinks":["README.md"],"backrefs":[],"body":"# `config audit` 结论解读手册：每条「怎么办」背后的问题、实例与判断方法\n\n## 问题\n\n`config audit` 的报告只有一张汇总表加编号详情。「怎么办」一列是十几个字的短语，详情区只给\nsagernet 官方迁移页的链接。这对 `--apply` 能自动改的 3 条够用，对其余 19 条「只报不改」的条目\n不够——尤其是 2 条 `notice`，它们要求**人来判断**要不要改，报告却没给判断依据。\n\n2026-09-12 真机还原（配置与 `config/config.example.json` 逐键相同）：\n\n```\n$ singbox config audit\n#  结论  在哪                       谁发现的  怎么办\n1  提示  dns.rules[0]               表        确认内部解析也受它影响是想要的\n2  提示  dns.rules[1] dns.rules[2]  表        --deep 定性；是的话改 evaluate + match_response（2 处）\n\n$ singbox config audit --deep\n#  结论  在哪          谁发现的  怎么办\n1  提示  dns.rules[0]  表        确认内部解析也受它影响是想要的\n```\n\n两处看不懂：\n\n1. **第 2 条为什么 `--deep` 后消失了。** 脚本内部确实做了定性（沙箱建链成功、内核没打\n   `Legacy Address Filter Fields` 这条 WARN → 规则集不含 IP 条目 → 撤掉），但报告一个字都不说，\n   用户只能对比两次输出来猜「大概是没事了」。\n2. **第 1 条「内部解析」是什么、「受它影响」指什么、「确认」要怎么做。** 表条目的 `note` 字段\n   里有答案的一半（`1.14.0 起 query_type / ip_version 也作用于内部解析（resolve 动作、direct 出站的\n   ICMP、endpoint 自身地址…）`），但 `note` 不打印；另一半——「在我这份配置里到底有没有影响」——\n   哪里都没写。\n\n不做的后果：`notice` 档的设计意图是「配置合法，但行为变了，人要确认」。确认不了，用户要么忽略\n（等于这一档白报），要么照着官方英文迁移页硬改一份本来不需要改的配置。\n\n## 决定\n\n新增一份用户文档 `docs/config-audit-findings.md`（`kind: design`，与 `best-practices.md` 同级，\n是要时刻准确、被测试守着的文档，不是设计记录），迁移表里**每个 `fix` 不是 `auto` 的条目一节**\n（19 条：17 条 `deprecated` + 2 条 `notice`），节标题就是条目 `id`（GitHub 锚点即 `#\u003cid>`），\n每节固定四段：**问题是什么 → 拿 `config/config.example.json` 举例 → 怎么判断要不要改 → 改成什么样**。\n报告端做三处小改：详情区每条多一行 `解读：\u003cGitHub blob URL>#\u003cid>`；`--deep` 撤掉离线 `notice` 时\n打一行撤条说明；`legacy_address_filter_rs` 的「怎么办」短语改成不跑 `--deep` 也能先自判的写法。\n`tests/docs.test.sh` 新增一项把文档与迁移表机械钉死。\n\n### 文档结构\n\n```\ndocs/config-audit-findings.md\n# config audit 结论解读\n## 怎么读这份文档               ← 报告三档（起不来/将来会坏/提示）各自意味着什么；「谁发现的」四种来源；\n                                  --deep 与离线的差别；「--deep 后消失 = 已定性为不需要改」\n## 只报不改的 19 条              ← 每条一节，标题为 `### \u003cid>`，下一行加粗写报告里的「怎么办」原话\n### query_type_ip_version_semantics\n**报告原话：确认内部解析也受它影响是想要的**\n问题是什么 / 模板里的例子 / 怎么判断 / 改成什么样\n### legacy_address_filter_rs\n...\n```\n\n每节四段的写法要求：\n\n- **问题是什么**：一段话，说清 1.14.0 前后行为差在哪、哪个版本移除（`removed_in: None` 的写「不移除，\n  只是行为变了」）。不复述官方页，给官方页链接。\n- **模板里的例子**：贴 `config/config.example.json` 命中的那段 JSON（模板与 live 逐键全等，\n  `template.test.sh` 在守，所以拿模板举例就是拿用户的真机举例，又不会把订阅地址写进仓库）。\n  模板没命中的条目（`wireguard_outbound`、`hysteria_v1_tuning`、`inline_acme`、`legacy_dns_servers`\n  等）用官方迁移页的最小片段，并**明写「模板未命中，以下是官方页的例子」**。\n- **怎么判断**：可操作的判据，最好是一条命令或一个「看配置里 X 字段」的动作。禁止只写「视情况而定」。\n- **改成什么样**：`fix: snippet` 的条目直接引用报告详情区已生成的建议写法；`fix: report` 的写\n  改前/改后两段 JSON。\n\n### 两条 `notice` 的正文（本规格先把它们写定，其余 17 条由 build 按同一模板补）\n\n**`query_type_ip_version_semantics`**\n\n- 问题：1.14.0 之前，`dns.rules` 里的 `query_type` / `ip_version` 只匹配**应用发来的** DNS 查询。\n  1.14.0 起它们也匹配 sing-box **自己发起的**解析——「内部解析」指的就是这一类：路由动作\n  `resolve` 把域名换成 IP 时的查询、`direct` 出站为 ICMP 做的解析、endpoint 自身地址的解析、\n  给出站服务器域名做的 `domain_resolver` 查询。不移除，只是范围变大。另外这类规则不能与遗留地址过滤 /\n  `strategy` / `rule_set_ip_cidr_accept_empty` 共存于同一份 DNS 配置。\n- 模板例子：`dns.rules[0]` 是 `{\"query_type\": [\"AAAA\",\"HTTPS\"], \"action\": \"predefined\", \"rcode\": \"NOERROR\"}`\n  ——所有 AAAA / HTTPS 查询回空答案。1.14.0 起，内核自己查出站服务器地址、`resolve` 动作查目标域名时，\n  AAAA 也一律拿到空答案，即**内核自己永远拿不到任何 IPv6 地址**。\n- 怎么判断：看 `dns.strategy` 与各出站的 `domain_resolver.strategy`。模板是 `\"strategy\": \"ipv4_only\"`\n  ——内核本来就只用 IPv4，AAAA 回空对它零影响，**这条提示对模板/真机配置是「想要的」，不用改**。\n  什么时候要改：`strategy` 是 `prefer_ipv6` / `ipv6_only`，或某个出站服务器只有 AAAA 记录（纯 IPv6 VPS），\n  或有 `resolve` 动作且后面的路由规则依赖 IPv6 `ip_cidr`。\n- 改成什么样：把这条规则限定到应用查询——给它加 `\"inbound\": [\"tun-in\"]`（只匹配从 TUN 进来的查询，\n  内部解析没有 inbound，不命中）；或者删掉它、改用 `strategy` 控制。文档里给出改后 JSON。\n\n**`legacy_address_filter_rs`**\n\n- 问题：1.14.0 把 DNS 规则里按**响应 IP** 过滤（`ip_cidr` / `ip_is_private` / `ip_accept_any`）的写法\n  废弃，1.16.0 移除，改成 `action: route-options` + `evaluate` 取响应再 `match_response` 匹配。\n  DNS 规则引用规则集时，如果规则集里有 `ip_cidr` 条目（典型是 `geoip-*`），内核就把它当成这种\n  废弃用法。离线审只看得到规则集**名字**，看不到内容，所以只能报 `notice`。\n- 模板例子：`dns.rules[1]` 引用 `geosite-category-ads-all`，`dns.rules[2]` 引用\n  `geosite-cn` / `geosite-apple-cn` / `geosite-microsoft-cn`。四个都是 `geosite-*`，纯域名规则集，\n  不含任何 IP 条目。\n- 怎么判断：先看名字——`geosite-*` 是域名集，`geoip-*` 是 IP 集，前者可忽略、后者就是废弃用法；\n  名字看不出来（自建规则集）就跑 `singbox config audit --deep`：沙箱真跑一次内核，规则集含 IP 条目\n  内核会打 WARN，这条升为「将来会坏」；不含，这条撤掉并打一行撤条说明。**`--deep` 后这条消失 =\n  已定性为不是废弃用法，不用改。** 模板/真机就是这种情况。\n- 改成什么样：确实是 `geoip-*` 时，把 `rule_set` 从该条 DNS 规则里拆出去，改成两条——先\n  `{\"action\": \"route-options\", ... \"evaluate\": true}` 之类取响应，再 `{\"match_response\": true, \"rule_set\": \"geoip-xx\", ...}`\n  匹配；具体片段引用官方页 `#migrate-address-filter-fields-to-response-matching`，build 时对着\n  v1.14.0 的 `docs/migration.md` 核一遍再写。\n\n### 报告端的三处改动\n\n1. **详情区每条加一行解读链接**。在 `desc` / `url` 之后加\n   `    解读：https://github.com/lzyMeta/macos-singbox-client-helper/blob/main/docs/config-audit-findings.md#\u003cid>`。\n   只有 `fix != auto` 的条目有这一行（文档只写这 19 条）；A/B 路的表外发现（`unknown field`、\n   schema 未知键、表外 WARN）没有 `id`，不加。URL 前缀放一个常量（如 `DOC_FINDINGS_URL`），\n   不要在 python 段里拼字面量——`docs.test.sh` 要从这里抓值核对。\n2. **`--deep` 撤条说明**。`singbox.sh` 里 `rows = [r for r in rows if not (...)]` 那一步，把撤掉的\n   路径收起来，报告末尾（表格之后、退出码统计之前）打一行：\n   `--deep 已排除 1 条：dns.rules[1] dns.rules[2] 引用的规则集经沙箱确认不含 IP 条目，不是废弃的地址过滤用法`。\n   撤了 0 条不打。这行文案要出现在 `tests/config-audit.test.sh:785-799` 那个已有的反向定性用例里作为断言。\n3. **短语改写**。`legacy_address_filter_rs` 的 `action` 从 `--deep 定性；是的话改 evaluate + match_response`\n   改为 `规则集是 geoip/IP 类才算；纯域名（geosite-*）可忽略，拿不准用 --deep 定性`。其余 18 条短语不动。\n   `tests/config-audit.test.sh` 里以 `row` / `inlog` 钉住旧短语的断言跟着改。\n\n### 机械同步（`tests/docs.test.sh` 新增一项）\n\n- 从 `singbox.sh` 的 `TABLE` 抓出所有 `fix` 不为 `auto` 的 `id`（复用 T13 抓 `sagernet.org/migration/#` 锚点的\n  `grep -o` 思路，别 `source` 脚本）；每个 `id` 在 `docs/config-audit-findings.md` 里必须有且只有一个\n  `^### \u003cid>$` 标题。\n- 反向：文档里每个 `### ` 标题都必须是表里现存的 `id`——防止删了条目文档还留着一节。\n- `DOC_FINDINGS_URL` 常量里的文件名必须与 `docs/` 下实际文件名一致。\n- 每节四段的小标题（「问题是什么 / 模板里的例子 / 怎么判断 / 改成什么样」）每节都要齐——防止\n  写到后面偷懒只剩链接。\n\n## 不在范围内\n\n- **不改 `--apply`**：3 条 `fix: auto` 的条目不写进文档，也不新增任何自动改写规则。\n  「改成什么样」是给人看的，不是给脚本执行的。\n- **不把文档装到本机**：`install` 仍只装 `singbox.sh` 到 `/usr/local/bin/singbox`，解读一律走 GitHub URL。\n  离线看不到解读是接受的代价。\n- **不解析规则集内容**：离线 `notice` 的定性仍只靠 `--deep` 沙箱日志与规则集名字前缀，不下载\n  `.srs` 文件做本地判断。\n- **不改表格列**：五列不变，不加「id」列。`id` 只在详情区的解读 URL 里出现。\n- **不改 A/B 路表外发现的文案**：`unknown field`、schema 未知键、表外 WARN 三类没有 `id`，不进文档。\n- **不翻译或镜像官方迁移页**：每节只写「对本仓库模板配置意味着什么」，官方页的完整语义仍以链接为准。\n- **不动 `manual-config.md` 的结构**：它是 `kind: manual`（≤ 120 行、四个固定 H2），只在「深入阅读」\n  加一条链接。\n\n## 受影响的文件与接口\n\n| 文件 | 改动 |\n|---|---|\n| `docs/config-audit-findings.md` | **新建**。`kind: design`；「怎么读」+ 19 节；每节 `### \u003cid>` + 四段 |\n| `singbox.sh` | `_cfg_audit_report` 详情区加「解读」行（仅 `fix != auto`）；新增 `DOC_FINDINGS_URL` 常量；`--deep` 撤条处收集路径并在报告末尾打一行；`legacy_address_filter_rs` 的 `action` 短语改写；`VERSION` 不在本规格里推 |\n| `tests/config-audit.test.sh` | 反向定性用例加撤条文案断言；钉旧短语的断言改新短语；新增一例：`--config config/config.example.json` 的详情区含 `解读：…#query_type_ip_version_semantics` |\n| `tests/docs.test.sh` | 新增一项：19 个 `id` ↔ 文档 `### ` 标题双向一致、四段小标题齐全、URL 文件名与实际文件一致 |\n| `README.md` | 第 4 节文档索引加一行；第 5 节仓库结构树加一行（`docs.test.sh` 第 3/4 项会红着等你） |\n| `docs/manual-config.md` | 「深入阅读」加链接；第 3 步那句「只看『结论』与『怎么办』两列」后补半句「看不懂的按详情区『解读』链接」 |\n| `docs/maintaining.md` | 「迁移表怎么维护」一节加一步：往 `TABLE` 加 `fix != auto` 的条目时，必须同时在 findings 文档加一节，`docs.test.sh` 守着 |\n| `CLAUDE.md` | 验收段里 `docs` 测试的描述加上「findings 文档与迁移表双向一致」 |\n\n不涉及跨栈契约。`.claude/sdlc.json` 不改。\n\n## 待定问题\n\n- **`kind: design` 能否有第二份** ——已定（答案见「实现计划」）\n  `sdlc-doc lint` 的 D 规则对 `design` 有没有「仅一份」之类限制，build 第一步跑 `sdlc-doc lint` 验证；不行就换 `kind: manual` 之外的其他合法值，绝不能是 `manual`\n  （会撞 D4 的 120 行上限）。责任人：build。\n- **`legacy_address_filter_rs` 的「改成什么样」片段** ——已定（答案见「实现计划」）\n  `route-options` + `evaluate` + `match_response` 的确切写法要对着 v1.14.0 tag 的 `docs/migration.md` 核，不要凭记忆。责任人：build（用 `sdlc-docs`，\n  库 `/sagernet/sing-box` 1.14.0 已在 `docs.context7.libraries`）。\n- **`query_type_ip_version_semantics` 改法里 `inbound` 字段是否真能排除内部解析** ——已定（答案见「实现计划」）\n  内部解析的 DNS 查询上下文没有 inbound tag 是源码层面的推断（`dns/router.go` 的 `adapter.InboundContext`），\n  build 时用 `--deep` 沙箱或直接读 v1.14.0 源码确认；确认不了就把「改成什么样」写成\n  「删掉本条、改用 `strategy`」这一种。责任人：build。\n- **模板未命中的条目例子来源** ——已定（答案见「实现计划」）\n  官方迁移页片段是否有版权顾虑——是 MIT/GPL 文档，引用附链接即可，build 时统一在文档开头注一句出处。责任人：build。\n\n## 验证\n\n- AC1 ★ 迁移表里 `fix != auto` 的每个 id 在 `docs/config-audit-findings.md` 有且只有一节 `### \u003cid>`，反向每个 `### ` 都是表里现存的 id，每节四段小标题齐全（`tests/docs.test.sh` 第 9 项，19 条）。反例：删掉文档里任一节、或把表里一个 id 改名 → 第 9 项红并点名那个 id。\n- AC2 `config audit --config config/config.example.json` 的输出里 `解读：…/docs/config-audit-findings.md#` 行 ≥ 2（`query_type_ip_version_semantics` 与 `legacy_address_filter_rs` 各一），`fix: auto` 的条目没有解读行。反例：报告端不读 TSV 第 8 列 `doc_id` → grep 计数为 0，T14 红。\n- AC3 `legacy_address_filter_rs` 的报告短语含「规则集是 geoip/IP 类才算；纯域名（geosite-*）可忽略，拿不准用 --deep 定性」。反例：文案退回旧句 → `grep -F 'geosite-*'` 无命中。\n- AC4 `--deep` 用 `SB_FAKE_RUN_LOG` 去掉 `Address Filter` 行后，报告打 `--deep 已排除 1 条`；不带 `--deep` 时不打。反例：撤条行无条件打印 → 「离线不打」的反向断言红。\n\n```bash\n./singbox-selfcheck.sh && ./tests/run.sh          # 全绿，含 docs.test.sh 新增项与 config-audit.test.sh 改过的断言\nsdlc-doc lint                                      # 新文档 kind/covers 合法，README 索引不失联\n\n# 报告端三处改动的直接观察（不需要 root，审模板）\n./singbox.sh config audit --config config/config.example.json | grep -c '解读：https://github.com/lzyMeta/macos-singbox-client-helper/blob/main/docs/config-audit-findings.md#'\n# 期望 ≥ 2（query_type_ip_version_semantics 与 legacy_address_filter_rs 各一行）\n./singbox.sh config audit --config config/config.example.json | grep -F 'geosite-*'\n# 期望命中新短语「规则集是 geoip/IP 类才算；纯域名（geosite-*）可忽略，拿不准用 --deep 定性」\n\n# 文档与表双向一致（docs.test.sh 新项的手工等价）\nids=$(grep -o '{\"id\": \"[a-z0-9_]*\", \"action\"' singbox.sh | sed 's/.*\"id\": \"\\([^\"]*\\)\".*/\\1/')\nfor id in $ids; do grep -q \"^### $id\\$\" docs/config-audit-findings.md && echo \"有 $id\"; done | wc -l   # 期望 19\ngrep -c '^### ' docs/config-audit-findings.md                                                        # 期望 19\n```\n\n`--deep` 撤条说明那行走 `tests/config-audit.test.sh` 的假沙箱日志用例（`SB_FAKE_RUN_LOG` 去掉\n`Address Filter` 行后 `audit --deep`），断言 `inlog '--deep 已排除 1 条'`；真机 `--deep` 要网络，\n人自己跑一次对照即可。\n\n## 实现计划\n\n2026-09-12 build 落地，顺序与证据：\n\n1. `tests/docs.test.sh` 第 9 项（表 ↔ 文档双向、四段齐全、`DOC_FINDINGS_URL` 文件名）——先跑：红，\n   点名 `docs/config-audit-findings.md 不存在——迁移表里 19 条只报不改的条目没有解读`。\n2. `tests/config-audit.test.sh`：T7b 反向定性用例加 `--deep 已排除 1 条` 断言与「离线不打」反例；新增 T14\n   （模板配置两条 notice 的解读行、新短语、auto 条目无解读行）——先跑：退 1，4 条 FAIL 各自点名。\n3. `singbox.sh`：`DOC_FINDINGS_URL` 常量；`_cfg_audit` TSV 加第 8 列 `doc_id`（`fix != auto` 才填）；`--deep`\n   撤条处收集路径、以 `tier=dropped` 行传给报告端；`_cfg_audit_report` 表格后打撤条行、详情区 `url` 后打\n   `解读：` 行；`legacy_address_filter_rs` 短语改写；两处挂载点跳过 `dropped`。再跑：`config-audit` 122/0、`docs` 12/0。\n4. `docs/config-audit-findings.md`：导读 + 19 节。两条 notice 按本规格写，其余 17 条的例子取自 v1.14.0 tag\n   的 `docs/migration.md` / `deprecated.md` / `changelog.md`。\n5. README 索引与结构树、`manual-config.md`（第 3 步半句 + 深入阅读）、`maintaining.md` 第 6 步、`CLAUDE.md`\n   验收段。`sdlc-check` 全绿（`main` 退 0、`doc` 退 0）。\n\n待定问题的答案：\n\n- `kind: design` 可以有第二份，`sdlc-doc lint` 通过。`covers` 写 `singbox.sh` + `config/config.example.json`——\n  迁移表或模板一变，`sdlc-doc stale` 就点名它。\n- `legacy_address_filter_rs` 改法：官方是 `\"action\": \"evaluate\"` 取响应 + 下一条 `\"match_response\": true`，\n  **不是**本规格猜的 `route-options` + `evaluate: true`；文档按官方片段写。\n- **`inbound` 排除不了内部解析**：`route/conn.go` 的 `adapter.WithContext(ctx, &metadata)` 把连接的入站上下文带进了\n  `resolve` / direct 出站触发的解析。文档「改成什么样」只写「删掉本条、改用 `strategy`」与「给出站配 `domain_resolver`\n  绕开 DNS 规则」两条。另一个更准的判据来自官方迁移页：指定了服务器的解析（`domain_resolver` /\n  `default_domain_resolver` / 带 `server` 的动作）**不过 DNS 规则**——模板全配了，所以这条提示对模板实际无影响。\n- 官方片段出处在文档开头注明（GPL-3.0-or-later，引用附链接）。\n- **`DOC_FINDINGS_URL` 钉在 `blob/v${VERSION}` 而不是 `blob/main`**（2026-09-12 打 tag 前改）：装在本机的\n  脚本与它的迁移表是同一提交，链接指向同一提交的文档快照，`main` 往前走、某条 `id` 撤了也不会断旧脚本的链接。\n  代价是 tag 推上去之前链接 404，开发期看本地 md。测试按脚本自己的 `VERSION` / `SELF_REPO` 展开后核对。\n"},{"path":"docs/config-audit-findings.md","title":"config audit 结论解读","summary":"报告三档各意味着什么。 `起不来`：内核拒绝这份配置，现在就跑不起来，退出码 1；`将来会坏`：字段已废弃、 内核仍接受，下个大版本会拒收，退出码 2；`提示`：配置合法，只是行为变了，要人确认是不是想要的，不影响退出码。","hash":"2b8c8f26fb635fab","kind":"design","inferred":false,"status":null,"headings":[{"level":1,"text":"config audit 结论解读","line":7},{"level":2,"text":"怎么读这份文档","line":17},{"level":2,"text":"只报不改的 19 条","line":39},{"level":3,"text":"query_type_ip_version_semantics","line":41},{"level":3,"text":"legacy_address_filter_rs","line":87},{"level":3,"text":"implicit_http_client","line":148},{"level":3,"text":"inline_acme","line":180},{"level":3,"text":"dns_rule_strategy","line":205},{"level":3,"text":"accept_empty","line":225},{"level":3,"text":"legacy_address_filter","line":247},{"level":3,"text":"hysteria_v1_tuning","line":267},{"level":3,"text":"tun_removed_fields","line":286},{"level":3,"text":"dns_rule_outbound","line":301},{"level":3,"text":"outbound_domain_strategy","line":326},{"level":3,"text":"missing_domain_resolver","line":352},{"level":3,"text":"legacy_dns_servers","line":376},{"level":3,"text":"legacy_special_outbounds","line":405},{"level":3,"text":"legacy_inbound_fields","line":431},{"level":3,"text":"destination_override","line":462},{"level":3,"text":"wireguard_outbound","line":486},{"level":3,"text":"tun_address_fields","line":513},{"level":3,"text":"ipcidr_match_source","line":537}],"front":{"kind":"design","covers":["singbox.sh","config/config.example.json"]},"covers":["singbox.sh","config/config.example.json"],"mentions":["config/config.example.json","docs/","singbox.sh","tests/template.test.sh"],"links":[],"refs":[],"backlinks":["README.md","docs/config-audit-findings-guide.md","docs/maintaining.md","docs/manual-config.md"],"backrefs":[],"body":"# config audit 结论解读\n\n> `singbox config audit` 报告里每条「怎么办」背后的问题、拿仓库模板举的例子、怎么判断要不要改、改成什么样。\n> 报告详情区的「解读」链接锚到本文的对应小节（`#\u003c条目 id>`）。\n> 官方迁移页（[migration](https://sing-box.sagernet.org/migration/)、[deprecated](https://sing-box.sagernet.org/deprecated/)）\n> 的完整语义以链接为准，本文只写「对本仓库模板这份配置意味着什么」。\n> 「模板未命中」的条目，例子取自 sing-box v1.14.0 tag 下 `docs/` 的官方片段（GPL-3.0-or-later，引用附链接）。\n\n---\n\n## 怎么读这份文档\n\n**报告三档各意味着什么。** `起不来`：内核拒绝这份配置，现在就跑不起来，退出码 1；`将来会坏`：字段已废弃、\n内核仍接受，下个大版本会拒收，退出码 2；`提示`：配置合法，只是**行为变了**，要人确认是不是想要的，不影响退出码。\n\n**「谁发现的」四种来源。** `check`：内核 `sing-box check` 打出的 WARN / FATAL；`schema`：内核 JSON schema 不认识的键；\n`表`：脚本自带的迁移表（`singbox.sh` 里的 `TABLE`）按 JSON 路径与具名谓词逐条对配置求值；`run`：`--deep` 在沙箱里\n真跑一次内核，收割 `Start()` 阶段才打的 WARN。同一处被多路发现时合并成一行，来源并列。\n\n**`--deep` 与离线的差别。** 离线审只看配置文本，看不到远程规则集的内容；`--deep` 起沙箱把规则集下下来、走完\n`Start()`。所以有两条只有 `--deep` 能定性：规则集里到底有没有 IP 条目，以及只在 `Start()` 阶段告警的废弃用法。\n\n**「`--deep` 后消失」= 已定性为不需要改。** 离线报的 `提示` 若在 `--deep` 后不见了，报告会在表格下面打一行\n`--deep 已排除 N 条：\u003c位置> \u003c原因>`——不是漏报，是沙箱证明了它不成立。\n\n**本文覆盖哪些条目。** 迁移表里 `fix` 不是 `auto` 的全部条目（`--apply` 能自动改的 3 条不在这里：\n`download_detour` / `independent_cache` / `store_rdrc`，跑 `config audit --apply` 就行）。每节标题是条目 `id`，\n固定四段：**问题是什么 → 模板里的例子 → 怎么判断 → 改成什么样**。「模板」指 `config/config.example.json`，\n它与真机 live 配置逐键全等（`tests/template.test.sh` 在守），所以拿模板举例就是拿你的配置举例。\n\n---\n\n## 只报不改的 19 条\n\n### query_type_ip_version_semantics\n\n**报告原话：确认内部解析也受它影响是想要的**\n\n**问题是什么**：1.14.0 之前，`dns.rules` 里的 `query_type` / `ip_version` 只对**应用发来的** DNS 查询生效\n（TUN 截获的、DNS 入站收到的）。1.14.0 起它们对**每一次** DNS 规则求值都生效，包括 sing-box **自己发起**、\n又没有指定 DNS 服务器的解析——官方页称之为「内部解析」：路由动作 `resolve` 不带 `server` 时的查询、\n`direct` 出站为 ICMP 目标做的解析、WireGuard / Tailscale endpoint 解析自己的服务器地址、SOCKS4 出站的本地解析、\nDERP 的 bootstrap DNS。不移除，只是范围变大。另外这类规则不能与遗留地址过滤 / `strategy` 动作 /\n`rule_set_ip_cidr_accept_empty` 共存于同一份 DNS 配置（内核会拒绝）。\n官方页：[ip_version and query_type behavior changes in DNS rules](https://sing-box.sagernet.org/migration/#ip_version-and-query_type-behavior-changes-in-dns-rules)。\n\n**模板里的例子**：`dns.rules[0]`——所有 AAAA / HTTPS 查询直接回空答案，是「DNS 层拦 IPv6」的实现：\n\n```json\n{\n  \"query_type\": [\"AAAA\", \"HTTPS\"],\n  \"action\": \"predefined\",\n  \"rcode\": \"NOERROR\"\n}\n```\n\n1.14.0 起，凡是走 DNS 规则的内部解析，AAAA 也一律拿到空答案——内核自己**永远拿不到任何 IPv6 地址**。\n\n**怎么判断**：看两处。\n\n1. 内部解析**过不过 DNS 规则**。官方页明说：指定了服务器的解析——出站拨号字段 `domain_resolver`、\n   `route.default_domain_resolver`、DNS 动作或 `resolve` 动作里显式的 `server`——**不经过 DNS 规则匹配，不受影响**。\n   模板三个出站都配了 `\"domain_resolver\": {\"server\": \"dns-direct\", \"strategy\": \"ipv4_only\"}`，`route.default_domain_resolver`\n   也指到 `dns-direct`，`resolve` 动作一条都没有。所以模板里这条规则实际影响不到任何内部解析。\n2. 就算过了 DNS 规则，**想不想要 IPv6**。看 `dns.strategy` 与各 `domain_resolver.strategy`：模板全是 `ipv4_only`，\n   内核本来就只用 IPv4，AAAA 回空对它零影响。\n\n两条都成立，**这条提示对模板 / 真机配置是「想要的」，不用改**。什么时候要改：`strategy` 是 `prefer_ipv6` / `ipv6_only`；\n或某个出站服务器只有 AAAA 记录（纯 IPv6 VPS）且它没配 `domain_resolver`；或新加了不带 `server` 的 `resolve`\n动作、后面的路由规则又依赖 IPv6 `ip_cidr`。\n\n**改成什么样**：把「限定到应用查询」的想法先放下——DNS 规则的 `inbound` 字段**排除不了**内部解析，因为由连接触发的\n内部解析（`resolve` 动作、direct 出站）继承了那条连接的入站上下文（`route/conn.go` 的 `adapter.WithContext`）。\n两种可行改法：\n\n- 删掉 `dns.rules[0]`，靠 `strategy` 控制：`\"dns\": {\"strategy\": \"ipv4_only\"}` 本身就让 AAAA 回空 NOERROR、\n  HTTPS 应答剥掉 `ipv6hint`（`dns/client.go`），效果与这条规则等价，且只影响你指定它的那一层。\n- 要保留这条规则又要内核自己能用 IPv6：给每个出站配 `domain_resolver: {\"server\": ..., \"strategy\": \"prefer_ipv6\"}`，\n  让它们的解析绕开 DNS 规则。\n\n### legacy_address_filter_rs\n\n**报告原话：规则集是 geoip/IP 类才算；纯域名（geosite-*）可忽略，拿不准用 --deep 定性**\n\n**问题是什么**：1.14.0 把 DNS 规则里按**响应 IP** 过滤的写法（`ip_cidr` / `ip_is_private` / `ip_accept_any` 不带\n`match_response`）废弃，1.16.0 移除；改成先 `\"action\": \"evaluate\"` 取到响应，再在下一条用 `match_response`\n显式匹配。DNS 规则引用规则集时，如果规则集**只含 `ip_cidr` 条目**（典型是 `geoip-*`）又没开 `match_response`，\n内核就把它当成这种废弃用法（`dns/router.go` 靠规则集元数据判）。离线审只看得到规则集**名字**，看不到内容，\n所以只能报 `提示`。官方页：[Migrate address filter fields to response matching](https://sing-box.sagernet.org/migration/#migrate-address-filter-fields-to-response-matching)。\n\n**模板里的例子**：`dns.rules[1]` 引用 `geosite-category-ads-all`，`dns.rules[2]` 引用 `geosite-cn` / `geosite-apple-cn` /\n`geosite-microsoft-cn`：\n\n```json\n{\n  \"rule_set\": \"geosite-category-ads-all\",\n  \"action\": \"predefined\",\n  \"rcode\": \"NXDOMAIN\"\n},\n{\n  \"rule_set\": [\"geosite-cn\", \"geosite-apple-cn\", \"geosite-microsoft-cn\"],\n  \"server\": \"dns-direct\"\n}\n```\n\n四个都是 `geosite-*`，纯域名规则集，不含任何 IP 条目。\n\n**怎么判断**：先看名字——`geosite-*` 是域名集，`geoip-*` 是 IP 集；前者可忽略，后者就是废弃用法。\n名字看不出来的（自建规则集）跑 `singbox config audit --deep`：沙箱真跑一次内核，规则集含 IP 条目内核会打\n`Legacy Address Filter Fields` 这条 WARN，本条升为「将来会坏」；不含，本条撤掉并在表格下打一行\n`--deep 已排除 1 条：… 引用的规则集经沙箱确认不含 IP 条目`。**`--deep` 后这条消失 = 已定性为不是废弃用法，不用改。**\n模板 / 真机就是这种情况。\n\n**改成什么样**：确实是 `geoip-*` 时，把 IP 规则集从原来那条 DNS 规则里拆出去，改成官方页的两条形式——先\n`evaluate` 用某个服务器查到响应，再 `match_response` 按响应 IP 命中规则集决定用哪个服务器：\n\n```json\n{\n  \"dns\": {\n    \"rules\": [\n      {\n        \"action\": \"evaluate\",\n        \"server\": \"remote\"\n      },\n      {\n        \"match_response\": true,\n        \"rule_set\": \"geoip-cn\",\n        \"action\": \"route\",\n        \"server\": \"local\"\n      },\n      {\n        \"action\": \"route\",\n        \"server\": \"remote\"\n      }\n    ]\n  }\n}\n```\n\n（官方示例；`server` 名按你自己的 `dns.servers` 替换。规则里若同时带了 `query_type`，两条都要带。）\n\n### implicit_http_client\n\n**报告原话：给这条规则集写内联 http_client**\n\n**问题是什么**：远程规则集下载走哪个出站，1.14.0 之前可以什么都不写——既没有 `http_client` 也没有\n`download_detour`、顶层 `http_clients` 与 `route.default_http_client` 也都空时，内核隐式用**默认出站**下载。\n1.14.0 起这个隐式默认是废弃行为，1.16.0 移除；内核 `Start()` 阶段打 `implicit default HTTP client` WARN，\n离线审靠 `表` 的谓词抓，`--deep` 也抓得到。官方页：[rule-set › http_client](https://sing-box.sagernet.org/configuration/rule-set/#http_client)。\n\n**模板里的例子**：模板未命中——模板每条远程规则集都写了 `\"http_client\": {\"detour\": \"vpstrans\"}`。\n官方页无改前/改后 JSON，原话是：*When neither `http_clients` nor `default_http_client` is configured, an implicit HTTP\nclient connecting through the default outbound is used. This implicit default is deprecated in sing-box 1.14.0.*\n\n**怎么判断**：报告「在哪」列出的每条 `route.rule_set[N]`，看它是否 `type: remote` 且没有 `http_client`：\n`python3 -c 'import json,sys; [print(r[\"tag\"]) for r in json.load(open(sys.argv[1]))[\"route\"][\"rule_set\"] if r.get(\"type\")==\"remote\" and \"http_client\" not in r and \"download_detour\" not in r]' config.json`。\n列出来的就是要改的；一条都没有而报告仍报，看顶层 `http_clients` 是否存在但为空。\n\n**改成什么样**：给每条远程规则集写内联 `http_client`，`detour` 指到你希望用来下载的出站（通常是代理出站）：\n\n```json\n{\n  \"type\": \"remote\",\n  \"tag\": \"geosite-cn\",\n  \"format\": \"binary\",\n  \"url\": \"https://…/geosite-cn.srs\",\n  \"http_client\": {\"detour\": \"vpstrans\"}\n}\n```\n\n不建议改用 `route.default_http_client`：它是全局副作用，会改掉所有没写 `http_client` 的规则集的下载路径。\n有 `download_detour` 的规则集属 `download_detour` 条目，`config audit --apply` 会自动改。\n\n### inline_acme\n\n**报告原话：改用 certificate_providers**\n\n**问题是什么**：入站 TLS 里内联的 `tls.acme` 1.14.0 废弃，1.16.0 移除；证书签发改由 `certificate_providers`\n统一管理，TLS 只引用一个 provider。内核 `New()` 阶段打 `inline ACME` WARN，`check` 能抓。\n官方页：[Migrate inline ACME to certificate provider](https://sing-box.sagernet.org/migration/#migrate-inline-acme-to-certificate-provider)。\n\n**模板里的例子**：模板未命中——模板只有 `tun` 与 `mixed` 两个入站，没有 TLS。以下是官方页的例子。改前：\n\n```json\n{\"tls\": {\"enabled\": true, \"acme\": {\"domain\": [\"example.com\"], \"email\": \"admin@example.com\"}}}\n```\n\n**怎么判断**：报告「在哪」给出 `inbounds[N].tls.acme` 就是它，没有别的判断——这个键存在即废弃。\n只跑 sing-box 客户端、没有对外服务的入站，不会碰到这条。\n\n**改成什么样**：把 `acme` 块整体搬到 `certificate_providers[]`，TLS 里用 `certificate_provider` 引用：\n\n```json\n{\"tls\": {\"enabled\": true, \"certificate_provider\": {\"type\": \"acme\", \"domain\": [\"example.com\"], \"email\": \"admin@example.com\"}}}\n```\n\n（官方示例的最小形式，`domain` / `email` 等原字段照搬。）\n\n### dns_rule_strategy\n\n**报告原话：ipv4_only / ipv6_only 按详情里的片段改；prefer_* 直接删**\n\n**问题是什么**：DNS 规则动作里的 `strategy`（1.12.0 加入）1.14.0 废弃、1.16.0 移除，官方没给替代写法\n（内核 WARN 里的迁移链接是死链）。它做的事按内核源码是：`ipv4_only` = AAAA 查询直接回空 `NOERROR`、HTTPS 应答剥掉\n`ipv6hint`；`ipv6_only` 对称；`prefer_*` 只影响内部 Lookup 的排序，对客户端查询没有效果。内核 `Start()` 阶段\n打 WARN，离线靠 `表` 抓。官方页：[DNS rule action › strategy](https://sing-box.sagernet.org/configuration/dns/rule_action/#strategy)。\n\n**模板里的例子**：模板未命中——模板的 IPv6 控制走 `dns.strategy: \"ipv4_only\"` 与各出站的\n`domain_resolver.strategy`，DNS 规则里没有 `strategy`。官方页无改前/改后 JSON。\n\n**怎么判断**：看报告「在哪」那条规则的 `strategy` 值：`prefer_ipv4` / `prefer_ipv6` 直接删，行为不变；\n`ipv4_only` / `ipv6_only` 按下面改。\n\n**改成什么样**：这条是 `fix: snippet`，报告详情区已经按你的规则生成了「建议写法」——在原规则**之前**插入一条\n`predefined` 规则（条件照抄原规则，`query_type` 限定 AAAA 或 A，`action: predefined`、`rcode: NOERROR`），\n再删掉原规则的 `strategy`。片段按 v1.14.0 源码语义推导、未经行为验证，且 HTTPS 应答里 `ipv6hint` /\n`ipv4hint` 的剥离没有等价写法——只拦 AAAA 与官方 `ipv4_only` 差这一点，照抄前核对一下。\n\n### accept_empty\n\n**报告原话：删掉，改用 evaluate + match_response**\n\n**问题是什么**：`rule_set_ip_cidr_accept_empty` 是遗留地址过滤的配套项（规则集按响应 IP 匹配时，空响应算不算命中），\n1.14.0 与地址过滤一起废弃、1.16.0 移除。内核 `New()` 阶段打 WARN，`check` 能抓。\n官方页：[Migrate address filter fields to response matching](https://sing-box.sagernet.org/migration/#migrate-address-filter-fields-to-response-matching)。\n\n**模板里的例子**：模板未命中。官方页的例子（改前）：\n\n```json\n{\"dns\": {\"rules\": [\n  {\"rule_set\": \"geoip-cn\", \"action\": \"route\", \"server\": \"local\"},\n  {\"action\": \"route\", \"server\": \"remote\"}\n]}}\n```\n\n**怎么判断**：键存在即废弃，没有别的判断。它一定伴随一条按 IP 规则集过滤的 DNS 规则，改那条规则时一并删。\n\n**改成什么样**：删掉这个键，所在规则按 [legacy_address_filter](#legacy_address_filter) 改成 `evaluate` +\n`match_response` 两条；新写法里空响应不再需要单独处理。\n\n### legacy_address_filter\n\n**报告原话：改为 evaluate + match_response（见详情建议写法）**\n\n**问题是什么**：DNS 规则直接带 `ip_cidr` / `ip_is_private` / `ip_accept_any` 却没开 `match_response`——键都合法，\n用法废弃（1.14.0），1.16.0 起拒绝。旧语义是「用本条 `server` 查，响应 IP 不匹配就继续下一条」，而且**对非地址查询整条跳过**；\n新写法要显式两步：`\"action\": \"evaluate\"` 取响应，再 `match_response` 匹配。内核 `Start()` 阶段打\n`Legacy Address Filter Fields` WARN。官方页同 [accept_empty](#accept_empty)。\n\n**模板里的例子**：模板未命中——模板的 DNS 规则不按响应 IP 过滤。官方页的改前 / 改后见 [legacy_address_filter_rs](#legacy_address_filter_rs)\n的「改成什么样」。\n\n**怎么判断**：报告「在哪」列出的规则里有上面三个键之一、且没有 `match_response: true`，就是它；\n有 `match_response` 的已经是新写法，不会被报。\n\n**改成什么样**：这条是 `fix: snippet`，报告详情区已经按你的规则生成了两条替换写法：第一条 `evaluate`\n用**原规则的 `server`**（不是官方示例里换成 remote——那会换掉决定服务器，不等价），第二条 `match_response` 引用第一条的\n`tag`、带上原来的 IP 条件、`action: respond`；两条都限定 `query_type: [\"A\",\"AAAA\",\"HTTPS\"]`，对应旧语义「非地址查询整条跳过」。\n片段按 v1.14.0 源码语义推导、未经行为验证，照抄前核对。\n\n### hysteria_v1_tuning\n\n**报告原话：删掉，改用共享的 quic 参数**\n\n**问题是什么**：1.14.0 把 HTTP/2 与 QUIC 参数统一成所有 QUIC 出入站（Hysteria / Hysteria2 / TUIC）与 HTTP 客户端共享，\nHysteria v1 自己那套调优字段 `recv_window_conn` / `recv_window` / `recv_window_client` / `max_conn_client` /\n`disable_mtu_discovery` 随之废弃，1.16.0 移除。**内核不会告警**（字段标了 `schema:\"omit\"` 但没有对应的 deprecated Note），\ndeprecated 页也没列——只有 `表` 能抓。官方页：[changelog 1.14.0](https://sing-box.sagernet.org/changelog/#1140)（脚注）。\n\n**模板里的例子**：模板未命中——模板出站是 vless，没有 Hysteria。官方页无 JSON，原话：*This deprecates the Hysteria v1\ntuning fields `recv_window_conn`, `recv_window`, `recv_window_client`, `max_conn_client` and `disable_mtu_discovery`; they\nwill be removed in sing-box 1.16.0.*\n\n**怎么判断**：`type: hysteria`（v1，不是 `hysteria2`）的出站或入站里有这五个键之一即命中。这些值多半是照抄服务端\n或客户端示例来的，删掉后用默认值通常没有可感知差异。\n\n**改成什么样**：删掉这五个键。确实需要调窗口大小的，改用共享的 `quic` 参数块（官方页未给最小示例，字段名以\n[QUIC 共享参数](https://sing-box.sagernet.org/configuration/shared/quic/) 页为准）。\n\n### tun_removed_fields\n\n**报告原话：删掉即可**\n\n**问题是什么**：`tun` 入站的 `endpoint_independent_nat` 与 `gso` 在源码里标 `Deprecated: removed`，1.11.0 废弃、1.13.0 起\n内核**静默忽略**——不告警、不报错，只是不生效。文档有出入：官方 tun 页仍把 `endpoint_independent_nat` 列为有效字段、\n未标废弃；`gso` 有小节说明 1.11.0 起不再生效。以迁移表（对着源码核过）为准：留着没坏处，也没作用。\n官方页：[TUN inbound](https://sing-box.sagernet.org/configuration/inbound/tun/)。\n\n**模板里的例子**：模板未命中——模板的 `tun-in` 没有这两个键。官方页无改前/改后 JSON；改前形如 `\"gso\": false`。\n\n**怎么判断**：键存在即命中。想确认它确实没作用：`--deep` 沙箱日志里不会出现任何与它相关的行。\n\n**改成什么样**：删掉这两个键，其余不动。\n\n### dns_rule_outbound\n\n**报告原话：改用出站的 domain_resolver**\n\n**问题是什么**：DNS 规则的 `outbound` 项（「给某个出站解析服务器域名时用这条」）1.12.0 废弃、1.14.0 移除；\n解析出站服务器域名改由出站自己的拨号字段 `domain_resolver` 指定。内核 `Start()` 阶段打 `` `outbound` DNS rule `` WARN。\n官方页：[Migrate outbound DNS rule items to domain resolver](https://sing-box.sagernet.org/migration/#migrate-outbound-dns-rule-items-to-domain-resolver)。\n\n**模板里的例子**：模板未命中——模板三个出站都带 `domain_resolver`。官方页的例子，改前：\n\n```json\n{\"dns\": {\"servers\": [{\"address\": \"local\", \"tag\": \"local\"}], \"rules\": [{\"outbound\": \"any\", \"server\": \"local\"}]},\n \"outbounds\": [{\"type\": \"socks\", \"server\": \"example.org\", \"server_port\": 2080}]}\n```\n\n**怎么判断**：报告「在哪」那条 DNS 规则带 `outbound` 键就是它。看它的 `server` 是哪个 DNS 服务器——那就是要搬到出站\n`domain_resolver.server` 里的值。\n\n**改成什么样**：删掉这条 DNS 规则，给每个 `server` 是域名的出站写 `domain_resolver`（或统一设\n`route.default_domain_resolver`）：\n\n```json\n{\"outbounds\": [{\"type\": \"socks\", \"server\": \"example.org\", \"server_port\": 2080, \"domain_resolver\": {\"server\": \"local\"}}]}\n```\n\n### outbound_domain_strategy\n\n**报告原话：改为 domain_resolver: {server, strategy}**\n\n**问题是什么**：出站 / endpoint 拨号字段 `domain_strategy` 1.12.0 废弃、1.14.0 移除，并入 `domain_resolver.strategy`。\n内核 `Start()` 阶段打 WARN。官方页：[Migrate outbound domain strategy option to domain resolver](https://sing-box.sagernet.org/migration/#migrate-outbound-domain-strategy-option-to-domain-resolver)。\n\n**模板里的例子**：模板未命中——模板出站写的已经是 `\"domain_resolver\": {\"server\": \"dns-direct\", \"strategy\": \"ipv4_only\"}`。\n官方页的例子，改前：\n\n```json\n{\"type\": \"socks\", \"server\": \"example.org\", \"server_port\": 2080, \"domain_strategy\": \"prefer_ipv4\"}\n```\n\n**怎么判断**：报告「在哪」给出 `outbounds[N].domain_strategy` / `endpoints[N].domain_strategy` 就是它。\n同时看该出站有没有 `domain_resolver`：没有，就要一起补 `server`（见 [missing_domain_resolver](#missing_domain_resolver)）。\n\n**改成什么样**：\n\n```json\n{\"type\": \"socks\", \"server\": \"example.org\", \"server_port\": 2080,\n \"domain_resolver\": {\"server\": \"local\", \"strategy\": \"prefer_ipv4\"}}\n```\n\n`strategy` 的值原样搬过去，`server` 填一个 `dns.servers` 里的 tag。\n\n### missing_domain_resolver\n\n**报告原话：给出站加 domain_resolver，或设 route.default_domain_resolver**\n\n**问题是什么**：出站的 `server` 是域名，却既没有 `domain_resolver`、`route` 也没有 `default_domain_resolver`——\n1.12.0 起靠隐式默认解析是废弃行为，1.14.0 内核 `Start()` 阶段打 `missing domain resolver` WARN。官方没有单独的小节，\n语义在 `domain_resolver` 那章：[Migrate outbound domain strategy option to domain resolver](https://sing-box.sagernet.org/migration/#migrate-outbound-domain-strategy-option-to-domain-resolver)。\n\n**模板里的例子**：模板未命中——模板既给每个出站写了 `domain_resolver`，又设了\n`\"default_domain_resolver\": {\"server\": \"dns-direct\", \"strategy\": \"ipv4_only\"}`。模板这样写是有意的：出站服务器域名\n走直连 DNS 解析，避免「解析代理服务器的地址要先过代理」的死循环。\n\n**怎么判断**：报告「在哪」列出的出站，`server` 是域名（不是 IP）且没有 `domain_resolver`，再看 `route` 有没有\n`default_domain_resolver`。两个都没有就是它。\n\n**改成什么样**：二选一。逐个出站加：\n\n```json\n{\"type\": \"vless\", \"server\": \"your.server.example\", \"server_port\": 443,\n \"domain_resolver\": {\"server\": \"dns-direct\", \"strategy\": \"ipv4_only\"}}\n```\n\n或在 `route` 里统一兜底：`\"default_domain_resolver\": {\"server\": \"dns-direct\", \"strategy\": \"ipv4_only\"}`。模板两个都写了。\n\n### legacy_dns_servers\n\n**报告原话：改为 type + server 的新格式**\n\n**问题是什么**：旧式 DNS 服务器用一个带前缀的 `address` 字符串（`tls://`、`https://…/dns-query`、`local`、`dhcp://auto`…）\n表达类型与地址，1.12.0 废弃、1.14.0 **移除**——现在的内核直接拒绝，报告会同时给「起不来」。新格式是 `type` + `server`\n分开写。官方页：[Migrate to new DNS server formats](https://sing-box.sagernet.org/migration/#migrate-to-new-dns-server-formats)。\n\n**模板里的例子**：模板未命中——模板已是新格式：`{\"type\": \"https\", \"tag\": \"dns-remote\", \"detour\": \"vpstrans\", \"server\": \"1.1.1.1\"}`。\n官方页以 HTTPS 为例，改前：\n\n```json\n{\"servers\": [{\"address\": \"https://1.1.1.1/dns-query\"}]}\n```\n\n**怎么判断**：`dns.servers[]` 里有 `address` 键就是它。按前缀对到新 `type`：`local` → `local`；`tcp://` → `tcp`；\n纯 IP → `udp`；`tls://` → `tls`；`https://…/dns-query` → `https`；`quic://` → `quic`；`h3://…/dns-query` → `h3`；\n`dhcp://auto` / `dhcp://en0` → `dhcp`（网卡名进 `interface`）；`fakeip` → `type: \"fakeip\"`；`rcode://refused` 之类\n不再是服务器，改成 DNS 规则动作 `predefined` + `rcode`。服务器地址是域名的还要配 `domain_resolver`；\n原来写在服务器上的 `strategy` / `client_subnet` 移到规则层。\n\n**改成什么样**：\n\n```json\n{\"servers\": [{\"type\": \"https\", \"server\": \"1.1.1.1\"}]}\n```\n\n其余类型照上面的映射逐个改；每种都有官方改前/改后对照，锚点在同一章。\n\n### legacy_special_outbounds\n\n**报告原话：改用规则动作 reject / hijack-dns**\n\n**问题是什么**：`type: block` 与 `type: dns` 两种特殊出站 1.11.0 废弃、1.13.0 移除，功能改由路由规则动作承担：\n`block` → `action: reject`，`dns` → `action: hijack-dns`。官方页说已移除，实测内核 1.14.0 对 `block` 仍接受\n（迁移表 `note` 记了这个出入），但下个版本没有保证。官方页：[Migrate legacy special outbounds to rule actions](https://sing-box.sagernet.org/migration/#migrate-legacy-special-outbounds-to-rule-actions)。\n\n**模板里的例子**：模板未命中——模板的拦截与 DNS 劫持都已是规则动作（`\"action\": \"reject\"`、`\"action\": \"hijack-dns\"`）。\n官方页的例子（block），改前：\n\n```json\n{\"outbounds\": [{\"type\": \"block\", \"tag\": \"block\"}], \"route\": {\"rules\": [{\"outbound\": \"block\"}]}}\n```\n\n**怎么判断**：`outbounds[]` 里有 `type: block` 或 `type: dns` 即命中；再找路由规则里 `\"outbound\": \"\u003c它的 tag>\"` 的引用，\n那些规则要改动作。\n\n**改成什么样**：删掉特殊出站，引用它的规则把 `outbound` 换成动作：\n\n```json\n{\"route\": {\"rules\": [{\"action\": \"reject\"}]}}\n```\n\n`dns` 出站对应 `{\"action\": \"hijack-dns\"}`，条件照抄原规则（通常是 `\"protocol\": \"dns\"`）。\n\n### legacy_inbound_fields\n\n**报告原话：改用路由规则动作 sniff / resolve**\n\n**问题是什么**：入站上的 `sniff` / `sniff_override_destination` / `sniff_timeout` / `domain_strategy` /\n`udp_disable_domain_unmapping` 1.11.0 废弃、1.13.0 移除，嗅探与域名解析改成路由规则动作 `sniff` / `resolve`，\n按规则条件决定对哪些连接做。官方页：[Migrate legacy inbound fields to rule actions](https://sing-box.sagernet.org/migration/#migrate-legacy-inbound-fields-to-rule-actions)。\n\n**模板里的例子**：模板未命中——模板的嗅探写在路由规则里（`{\"action\": \"sniff\"}`，不限入站），\n且刻意不插 `resolve`（原因见 best-practices「IP 规则匹配不到域名连接」）。官方页的例子，改前：\n\n```json\n{\"inbounds\": [{\"type\": \"mixed\", \"sniff\": true, \"sniff_timeout\": \"1s\", \"domain_strategy\": \"prefer_ipv4\"}]}\n```\n\n**怎么判断**：报告「在哪」给出 `inbounds[N].\u003c字段>` 即命中。记下每个入站的 tag——新写法要用 `inbound` 条件把动作限定回\n原来的入站。\n\n**改成什么样**：删掉入站上的这些键，在 `route.rules` 最前面加对应动作（`sniff_timeout` → `timeout`，\n`domain_strategy` → `resolve` 的 `strategy`）：\n\n```json\n{\"route\": {\"rules\": [\n  {\"inbound\": \"in\", \"action\": \"resolve\", \"strategy\": \"prefer_ipv4\"},\n  {\"inbound\": \"in\", \"action\": \"sniff\", \"timeout\": \"1s\"}\n]}}\n```\n\n`sniff_override_destination: true` 对应 `sniff` 动作后再加一条 `{\"action\": \"route-options\", \"override_address\": …}`\n的场景很少见，通常直接去掉。\n\n### destination_override\n\n**报告原话：改用 route 动作的 override_address / override_port**\n\n**问题是什么**：`direct` 出站的 `override_address` / `override_port` 1.11.0 废弃、1.13.0 移除，改为路由规则动作\n`route-options`（或 `route`）里的同名选项——覆盖目标从「出站的属性」变成「规则的属性」。\n官方页：[Migrate destination override fields to route options](https://sing-box.sagernet.org/migration/#migrate-destination-override-fields-to-route-options)。\n\n**模板里的例子**：模板未命中——模板的 `direct` 出站只有 `domain_resolver`。官方页的例子，改前：\n\n```json\n{\"outbounds\": [{\"type\": \"direct\", \"override_address\": \"1.1.1.1\", \"override_port\": 443}]}\n```\n\n**怎么判断**：`type: direct` 的出站有这两个键之一即命中。找路由规则里指到这个出站的那条——覆盖要搬到它身上。\n\n**改成什么样**：\n\n```json\n{\"route\": {\"rules\": [{\"action\": \"route-options\", \"override_address\": \"1.1.1.1\", \"override_port\": 443}]}}\n```\n\n条件照抄原来指向该出站的规则；出站上的两个键删掉。\n\n### wireguard_outbound\n\n**报告原话：改为 endpoints[] 的 wireguard 端点**\n\n**问题是什么**：`type: wireguard` 出站 1.11.0 废弃、1.13.0 移除，WireGuard 改为顶层 `endpoints[]` 里的端点——\n既能当出站用，也能收入站流量。字段结构变了：`server` / `server_port` / `peer_public_key` 合并进 `peers[]`。\n官方页：[Migrate WireGuard outbound to endpoint](https://sing-box.sagernet.org/migration/#migrate-wireguard-outbound-to-endpoint)。\n\n**模板里的例子**：模板未命中——模板没有 WireGuard。官方页的例子，改前：\n\n```json\n{\"outbounds\": [{\"type\": \"wireguard\", \"tag\": \"wg-out\", \"server\": \"127.0.0.1\", \"server_port\": 10001,\n  \"private_key\": \"\u003cprivate_key>\", \"peer_public_key\": \"\u003cpeer_public_key>\"}]}\n```\n\n**怎么判断**：`outbounds[]` 里 `type: wireguard` 即命中。记下引用它的路由规则与 `final`——tag 可以沿用，\n引用处不用改。\n\n**改成什么样**：\n\n```json\n{\"endpoints\": [{\"type\": \"wireguard\", \"tag\": \"wg-ep\", \"private_key\": \"\u003cprivate_key>\",\n  \"peers\": [{\"address\": \"127.0.0.1\", \"port\": 10001, \"public_key\": \"\u003cpeer_public_key>\"}]}]}\n```\n\n`local_address` → `address`，`pre_shared_key` / `allowed_ips` / `reserved` 进对应 peer；完整字段对照见官方页。\n\n### tun_address_fields\n\n**报告原话：改为 address / route_address / route_exclude_address**\n\n**问题是什么**：`tun` 入站的 `inet4_address` / `inet6_address` 1.10.0 合并为 `address`，`inet4_route_address` /\n`inet6_route_address` 合并为 `route_address`，`inet4_route_exclude_address` / `inet6_route_exclude_address` 合并为\n`route_exclude_address`；1.12.0 移除旧名。官方页：[TUN address fields are merged](https://sing-box.sagernet.org/migration/#tun-address-fields-are-merged)。\n\n**模板里的例子**：模板未命中——模板已是 `\"address\": [\"172.19.0.1/30\"]`。官方页的例子，改前：\n\n```json\n{\"type\": \"tun\", \"inet4_address\": \"172.19.0.1/30\", \"inet6_address\": \"fdfe:dcba:9876::1/126\"}\n```\n\n**怎么判断**：键存在即命中。这是 1.10.0 就改掉的字段，还带着它多半是从很老的示例抄来的配置。\n\n**改成什么样**：\n\n```json\n{\"type\": \"tun\", \"address\": [\"172.19.0.1/30\", \"fdfe:dcba:9876::1/126\"]}\n```\n\n`route_address` / `route_exclude_address` 同样把 v4 / v6 两个列表并成一个。\n\n### ipcidr_match_source\n\n**报告原话：改名为 rule_set_ip_cidr_match_source**\n\n**问题是什么**：路由与 DNS 规则里的 `rule_set_ipcidr_match_source` 1.10.0 改名为 `rule_set_ip_cidr_match_source`，\n1.11.0 移除旧名。纯改名，语义不变。官方页：[Match source rule items are renamed](https://sing-box.sagernet.org/deprecated/#match-source-rule-items-are-renamed)。\n\n**模板里的例子**：模板未命中——模板没有按源 IP 匹配规则集的规则。官方页无独立示例，旧名出现在 GeoIP 迁移示例里：\n`\"rule_set_ipcidr_match_source\": true`。\n\n**怎么判断**：键存在即命中。\n\n**改成什么样**：`\"rule_set_ipcidr_match_source\": true` → `\"rule_set_ip_cidr_match_source\": true`，值不动。\n"},{"path":"docs/config-audit-migration-table.md","title":"`config audit` 数据源扩展：内置迁移表与沙箱日志档","summary":"上一轮（`docs/config-audit-and-modernize.md`）落地的 `config audit` 只有两路发现层：内核 `check` 的输出和内核 `schema` 的结构比对。真机上它抓到了 21 处 `download_detour`，然后报「干净」—— 但 1.14.0 的弃用清单有 8 条，它对其中大半是盲的。2026-09-10 用真内核逐条实测（fixture 在 `scratchpad/probe/`，全部只读、不碰 live）：","hash":"13cff2363dfadd62","kind":"spec","inferred":false,"status":"shipped","headings":[{"level":1,"text":"`config audit` 数据源扩展：内置迁移表与沙箱日志档","line":9},{"level":2,"text":"问题","line":11},{"level":2,"text":"决定","line":54},{"level":3,"text":"四路发现层","line":59},{"level":3,"text":"迁移表的条目与来源","line":77},{"level":3,"text":"分档规则（承上一轮的三档，加一档）","line":113},{"level":3,"text":"改写层：3 条纯键名规则","line":138},{"level":3,"text":"其他四件","line":168},{"level":2,"text":"不在范围内","line":186},{"level":2,"text":"受影响的文件与接口","line":206},{"level":3,"text":"`singbox.sh`","line":208},{"level":3,"text":"测试","line":233},{"level":3,"text":"文档与配置","line":249},{"level":2,"text":"待定问题","line":260},{"level":2,"text":"验证","line":276},{"level":3,"text":"验收条件","line":278},{"level":3,"text":"机械验收（离线）","line":287},{"level":3,"text":"真内核旁证（只读 fixture，不碰 live）","line":315},{"level":3,"text":"人工验收（要动 live，已 deny，须本人跑）","line":320},{"level":2,"text":"实现计划","line":333},{"level":3,"text":"待定问题的裁定","line":346},{"level":3,"text":"实现中发现、与本文不同的事","line":356},{"level":3,"text":"人工验收（要动 live，本人跑）","line":388}],"front":{"kind":"spec","status":"shipped","covers":["tests/config-audit.test.sh","tests/fixtures/migration-anchors.txt","tests/fixtures/schema-min.json"]},"covers":["tests/config-audit.test.sh","tests/fixtures/migration-anchors.txt","tests/fixtures/schema-min.json"],"mentions":[".claude/sdlc.json","config/config.example.json","docs/","singbox.sh","tests/config-audit.test.sh","tests/fixtures/bad-hysteria-tuning.json","tests/fixtures/bad-implicit-http-client.json","tests/fixtures/bad-legacy-address-filter.json","tests/fixtures/bad-store-rdrc.json","tests/fixtures/fake-sing-box","tests/fixtures/good-explicit-http-clients.json","tests/fixtures/migration-anchors.txt","tests/fixtures/notice-query-type.json","tests/fixtures/sandbox-run.log","tests/fixtures/schema-min.json","tests/run.sh","tests/template.test.sh"],"links":["CLAUDE.md","README.md","docs/best-practices.md","docs/config-audit-and-modernize.md"],"refs":[],"backlinks":["README.md","docs/config-audit-and-modernize.md","docs/maintaining.md","docs/manual-config.md"],"backrefs":[],"body":"# `config audit` 数据源扩展：内置迁移表与沙箱日志档\n\n## 问题\n\n上一轮（`docs/config-audit-and-modernize.md`）落地的 `config audit` 只有两路发现层：内核 `check`\n的输出和内核 `schema` 的结构比对。真机上它抓到了 21 处 `download_detour`，然后报「干净」——\n但 1.14.0 的弃用清单有 8 条，它对其中大半是盲的。2026-09-10 用真内核逐条实测（fixture 在\n`scratchpad/probe/`，全部只读、不碰 live）：\n\n| 1.14.0 弃用项 | `check` | `schema` | `run` |\n|---|---|---|---|\n| `download_detour` | 沉默 | ✓ 未知键 | WARN |\n| 隐式默认 HTTP client | 沉默 | **看不见**（不是键，是「没写键」） | WARN |\n| `tls.acme` | WARN | ✓ | WARN |\n| DNS 规则动作 `strategy` | 沉默 | ✓ | WARN |\n| `rule_set_ip_cidr_accept_empty` | WARN | ✓ | WARN |\n| `independent_cache` | WARN | ✓ | WARN |\n| `store_rdrc` | WARN | ✓ | WARN |\n| 不带 `match_response` 的 `ip_cidr` / `ip_is_private` | 沉默 | **看不见**（键合法，用法废弃） | WARN |\n| Hysteria v1 调优字段（changelog 才有，deprecated 页没列） | 沉默 | ✓ | **沉默** |\n\n两个结构性盲区：**「键合法但用法废弃」**的两条，`check` 与 `schema` 都无能为力；`run`\n虽然全报，但 WARN 是在 `dns.Router.Start`（`dns/router.go:156-161`）和规则集\n`resolveTransport`（`route/rule/rule_set_remote.go:311`）里打的——远程规则集下不到时进程\n在 `initialize rule-set` 就死了，DNS 那几条 WARN 根本走不到（实测 `combo_nonet.json`：只有\n隐式 HTTP client 一条 WARN，地址过滤与 strategy 两条没出现）。所以 `run` 档**依赖网络**。\n\n另外三个数据源层面的事实，决定了这次不能只「再多抓几个字段」：\n\n1. **网站是活的，内核是死的。** `https://sing-box.sagernet.org/changelog/` 现在最上面是\n   1.15.0-alpha.2；审查的对象却是本机装的 1.14.0。三个页面在源码仓库里就是\n   `docs/deprecated.md` / `docs/migration.md` / `docs/changelog.md`，按 git tag 取才对得上内核。\n2. **文档与内核互有遗漏，且两个方向都有。** 内核 WARN 给的 `strategy` 迁移链接\n   `#migrate-dns-rule-action-strategy-to-rule-items` 在 v1.14.0 的 `docs/migration.md` 里\n   **不存在**（死链）；deprecated 页漏了 Hysteria v1 调优字段（源码 `option/hysteria.go:17-51`\n   标 `schema:\"omit\"`，但 `experimental/deprecated/constants.go` 里没有对应 Note，内核永远不\n   告警）和 `tun.endpoint_independent_nat`（`option/tun.go:71` 注释 `Deprecated: removed`，\n   `docs/configuration/inbound/tun.md:551` 仍当有效字段讲）。反方向：deprecated 页说 `block`\n   出站 1.13.0 已移除，实测 1.14.0 的 `check` 与 `run` 都放行，schema 的 outbound `type` 枚举里\n   `block` 还在。\n3. **概括性文字复现不出正确的改写。** 地址过滤字段的文档只说「Only takes effect for\n   address requests」，读成「非地址查询时过滤不生效但规则仍命中」是自然的——而源码\n   `dns/router.go:296` 是 `if currentRule.WithAddressLimit() && !isAddressQuery { continue }`：\n   **整条规则跳过**。按文档写出的等价形式会多出一条永远不该有的兜底。语义只能从源码取。\n\n## 决定\n\n发现层从两路扩到**四路**，改写层从 1 条规则扩到 **3 条纯键名规则**，报告加一档不影响退出码的\n`notice`。所有数据源**以本机内核版本对应的 git tag 为准**，网站只做人工核对。\n\n### 四路发现层\n\n| 路 | 抓什么 | 代价 | 新旧 |\n|---|---|---|---|\n| A `check` | 内核在 `New()` 阶段上报的 WARN / FATAL（自带官方链接） | 毫秒、离线 | 已有 |\n| B `schema` | 源码里 `schema:\"omit\"` 的全部字段 —— 即「未知键」 | 毫秒、离线 | 已有 |\n| C **迁移表** | 内置于 `singbox.sh` 的一张表，每条是一个 JSON 路径谓词。能表达 A/B 表达不了的**用法条件**：「远程规则集既无 `http_client` 也无 `download_detour`，且 `route.default_http_client` 与 `http_clients` 都空」（隐式 HTTP client 的精确判定，`common/httpclient/manager.go:41-44,76-80`）、「DNS 规则有 `ip_cidr`/`ip_is_private`/`ip_accept_any` 且 `match_response` 未开」（`dns/router.go:1383-1386`） | 毫秒、离线；**要人维护** | 新增 |\n| D **沙箱 run 日志** | 内核 `Start()` 阶段上报的 WARN（`grep 'deprecated in sing-box'`），版本无关，表里没收录的新条目也抓得到 | 分钟级、**要网络**（冷 cache 要下全部远程规则集） | 新增 |\n\n裸跑 `config audit` = A + B + C，仍是毫秒级离线。`--deep` 加 D（把上一轮预留给\n「`/rules` 语义 diff」的 flag 位挪作此用，那个用途已随上一轮「不在范围内」第 1 条一起放弃）。\nD **不额外起沙箱**：凡是已经在跑沙箱的地方（`cmd_update` 阶段 1、`--apply` 第 3 道）顺手收割\n日志，`--deep` 只是让裸审查也起一次。无网络时 D 降级并在输出里明说，与第 3 道现有的 3/4 降级\n同一口径。\n\n同一条发现可能被多路抓到（`store_rdrc` 四路全中），**按路径去重**，来源栏列出所有命中的路\n（`check+schema+table`），这样报告本身就是覆盖矩阵的真机证据。\n\n### 迁移表的条目与来源\n\n表的每条：`id`、谓词、`deprecated_in`、`removed_in`、`tier`、经核对的迁移链接、说明、\n`fix`（`auto` / `snippet` / `report`）。**表头记 `covers=1.14.0`**：内核 minor 高于它时打一行\n「迁移表只覆盖到 1.14.0，内核 X 新增的废弃项请用 `--deep` 或查 \u003cdeprecated 页>」，退出码不受\n影响。\n\n条目从四处整理，全部钉在 **sing-box `v1.14.0` tag**：\n\n- `docs/deprecated.md`、`docs/migration.md`、`docs/changelog.md`（三页的源）\n- `experimental/deprecated/constants.go`（内核真正会告警的 11 条 Note，含 1.12 排期到 1.14 的 3 条）\n- `option/*.go` 里 `schema:\"omit\"` 的字段（B 路的精确定义，共 50 处）\n- 上报点位置（`deprecated.Report` 的 15 处调用），用来标每条是 `New()` 阶段（A 能抓）还是\n  `Start()` 阶段（只有 D 能抓）\n\n1.14.0 一节的条目与裁定：\n\n| id | 谓词 | A | B | C | D | fix |\n|---|---|---|---|---|---|---|\n| `download_detour` | `route.rule_set[type=remote].download_detour` | – | ✓ | ✓ | ✓ | **auto**（已有） |\n| `independent_cache` | `dns.independent_cache` 存在 | ✓ | ✓ | ✓ | ✓ | **auto**：删键（migration 原话「Simply remove the field」） |\n| `store_rdrc` | `experimental.cache_file.store_rdrc` 存在 | ✓ | ✓ | ✓ | ✓ | **auto**：值为 true 且无 `store_dns` → 改名为 `store_dns: true`；否则删键 |\n| `implicit_http_client` | 见上表 C 列 | – | – | ✓ | ✓ | report（⑥ 型全局副作用，上一轮已排除） |\n| `inline_acme` | `inbounds[].tls.acme` | ✓ | ✓ | ✓ | ✓ | report（服务端 TLS，客户端项目零命中） |\n| `dns_rule_strategy` | `dns.rules[**].strategy`（含 logical 子规则与 `route-options` 动作） | – | ✓ | ✓ | ✓ | **snippet**：`ipv4_only` / `ipv6_only` 给等价片段；`prefer_*` 无等价；链接指向 DNS rule action 页的 `strategy` 小节并注明「v1.14.0 无 migration 章节，内核链接为死链」 |\n| `accept_empty` | `dns.rules[**].rule_set_ip_cidr_accept_empty` | ✓ | ✓ | ✓ | ✓ | report |\n| `legacy_address_filter` | `dns.rules[**]` 有 `ip_cidr`/`ip_is_private`/`ip_accept_any` 且 `match_response` 未开 | – | – | ✓ | ✓ | **snippet** |\n| `legacy_address_filter_rs` | `dns.rules[**]` 引用 `rule_set` 且 `match_response` 未开 | – | – | ✓（**notice**） | ✓（升为 deprecated） | report。离线不知道规则集里有没有 `ip_cidr` 条目（`dns/router.go:1631-1638` 靠规则集元数据判），表只能报 notice「若该规则集含 ip_cidr 则为废弃用法，用 `--deep` 定性」 |\n| `hysteria_v1_tuning` | `outbounds[type=hysteria]` / `inbounds[type=hysteria]` 的 `recv_window_conn` / `recv_window` / `recv_window_client` / `max_conn_client` / `disable_mtu_discovery` | – | ✓ | ✓ | – | report，说明「内核不会告警，deprecated 页未列，见 changelog 1.14.0 注 23」 |\n| `tun_removed_fields` | `inbounds[type=tun].endpoint_independent_nat` / `.gso` | – | ✓ | ✓ | – | report，说明「源码标 removed、静默忽略；tun 文档仍列为有效」 |\n\n1.12 排期到 1.14、内核 1.14.0 仍在 `Start()` 阶段告警的 3 条也进表（`outbound` DNS 规则项、\n出站 `domain_strategy`、缺 `domain_resolver`），前两条 B 能抓，第三条是用法条件，只有 C/D。\n1.10–1.13 已被内核拒绝的（`inet4_address`、legacy inbound fields、旧 DNS 服务器格式…）进表只为\n给链接和解释——它们的 `removed` 定性来自 A 的 FATAL，不来自表。\n\n### 分档规则（承上一轮的三档，加一档）\n\n| 档 | 谁能给 | 退出码 |\n|---|---|---|\n| `removed` | **只有 A**（`unknown field` 或 FATAL） | 1 |\n| `deprecated` | A 的 WARN、B 的未知键、C 的谓词命中、D 的 WARN | 2 |\n| `notice` | 只有 C 的行为变更条目 | **不影响** |\n\n表里 `removed_in ≤ 内核版本` 但 A 沉默的条目（`block` 出站那种），报 `deprecated` 并附一句\n「文档称已在 X 移除，本内核仍接受」。**表自己永远不产生 `removed`**——内核会不会拒，只有\n内核说了算。\n\n`notice` 条目（1.14.0）：\n\n- `dns.rules[**]` 用了 `query_type` 或 `ip_version` → 「1.14.0 起也作用于内部解析」，链接\n  `migration/#ip_version-and-query_type-behavior-changes-in-dns-rules`。样例配置 `dns.rules[0]`\n  命中。\n- 规则集合并匹配语义纠正（changelog 注 14）：**只在 `cmd_update` 挂载点、旧版本 \u003c 1.14.0 ≤ 新版本\n  时打一次**，裸审查不打——它没有可离线判定的谓词，每次都打就是噪音。\n\n`$schema` 顶层字段（实测 `check` 接受，`option/options.go:17`）**不进 audit**，只写进\n`config/config.example.json` 与 `docs/best-practices.md`：它是给手写配置的人用的编辑器补全，\n符合项目理念，但「建议引入 X」是策略不是合法性。其余 1.14 新功能一律不引入，理由见\n「不在范围内」。\n\n### 改写层：3 条纯键名规则\n\n边界：**官方 `docs/migration.md` 有完整前后 JSON 对照，且语义无分支**。三条都满足；\n`_cfg_migrate` 与 `_cfg_whitelist_diff` 改为**共用一张规则表**（路径、旧键、新键、值映射），\n不再各自硬编码 `download_detour`。四道验收原样通用：白名单 diff 只许落在规则表列出的路径上、\n值逐字（`store_rdrc → store_dns` 的值映射是恒等）、`check` 过、沙箱起得来、发现层归零。\n\n`--apply` 的确认提示要**逐条列出将改哪些键、各几处**——三条规则同时命中时，人要看得出\n改了什么。\n\n`snippet` 型条目不落地，报告里打「建议写法（按 v1.14.0 源码语义推导，未经行为验证，\n需人工核对）」。片段的语义依据：\n\n- **地址过滤**（`dns/router.go:294-298, 1120-1176, 1338-1346`）：遗留 = 非 A/AAAA/HTTPS\n  查询**整条跳过**；地址查询用**本条的 server** 查，响应不匹配则从下一条继续。等价新形式是\n  两条，且两条都要限定 `query_type`：\n\n  ```json\n  {\"\u003c原匹配条件>\", \"query_type\": [\"A\",\"AAAA\",\"HTTPS\"], \"action\": \"evaluate\", \"server\": \"\u003c原 server>\", \"tag\": \"mig-af-N\"}\n  {\"\u003c原匹配条件>\", \"query_type\": [\"A\",\"AAAA\",\"HTTPS\"], \"match_response\": \"mig-af-N\", \"\u003c原地址过滤字段>\", \"action\": \"respond\"}\n  ```\n\n  不照官方示例（用 remote evaluate 再 route 到 local）：那换了决定服务器，不是等价改写。\n  原规则若带 `rewrite_ttl` / `disable_cache` / `client_subnet`，搬到 evaluate 那条。\n- **`strategy`**（`dns/client.go:261-266, 616-630`；`dns/router.go:319-321`）：`ipv4_only` =\n  AAAA 查询直接回空 NOERROR、HTTPS 应答剥掉 ipv6hint；`ipv6_only` 对称；`prefer_*` 只影响内部\n  `Lookup` 的排序，对客户端查询无效果。所以 `ipv4_only` 的片段是在原规则前插一条\n  `{\"\u003c原匹配条件>\", \"query_type\": [\"AAAA\"], \"action\": \"predefined\", \"rcode\": \"NOERROR\"}`（HTTPS\n  hint 剥离无等价，注明）；`prefer_*` 只报「删掉即可，客户端查询路径上它本来就没作用」。\n\n### 其他四件\n\n1. **死链与文档遗漏**：表里每条链接都是核对过 v1.14.0 `docs/` 后的；A/D 路从内核 WARN 抠出的\n   链接若在表里有同 id 条目，**以表为准覆盖**。\n2. **「文档称已移除、内核仍接受」**：见分档规则。\n3. **`tests/run.sh` 连跑偶发 2 条红**：`LOCKDIR=/tmp/.singbox-sh.lock`（`singbox.sh:69`）写死，\n   测试与 live 的 `singbox` 命令、以及测试之间共用一把锁；`acquire_lock` 等 3×2 秒就 `die`。\n   改为 `LOCKDIR=\"${SB_LOCKDIR:-/tmp/.singbox-sh.lock}\"`，`tests/run.sh` 给每个测试文件一个\n   `mktemp -d` 下的锁目录。根因（残留锁的 PID 恰好是活着的测试进程、还是与 live 命令撞锁）\n   在 build 阶段用 `SB_LOCKDIR` 隔离后复跑 10 次确认——隔离后仍红就说明不是锁的事，另立项。\n4. **脚本 `networksetup` 切 DNS 与 1.14 `dns_mode` 的关系——定立场：保留，不引入 `dns_mode`。**\n   依据：sing-box v1.14.0 依赖 sing-tun `v0.9.0-beta.4`，其 `tun_darwin.go` **没有任何设置\n   接口 DNS 的代码**（只有 `tun_windows.go:84-109` 的 `luid.SetDNS` 与 Linux 的 nftables/\n   iproute2 分支）；文档「per-interface DNS on Apple platforms」指的是图形客户端的\n   NetworkExtension 路径。真机旁证：内核 1.14.0 运行中 Wi-Fi 的 DNS 仍是脚本设的 1.1.1.1，\n   `scutil --dns` 没有 utun 作用域解析器。把这段依据写进 `docs/best-practices.md`，并留一句\n   「sing-tun 在 darwin 上实现 DNS 设置的那天要重评」。\n\n## 不在范围内\n\n1. **结构性改写不自动落地。** 地址过滤、`strategy` 只出片段；`tls.acme`、隐式 HTTP client、\n   Hysteria 调优只报。片段按源码推导，但没有行为差分验证（需要旧内核二进制，本机\n   `$BIN.prev` 只在 `update` 后才有），所以不落地。\n2. **不引入 1.14 的其余新功能**，逐条否决理由：`optimistic` / `store_dns` / `dns.timeout` 是\n   DNS 策略，属 `best-practices.md` 而非合法性；`initial_path` 解决的是启动阻塞，live 有\n   `cache.db` 不阻塞；多 tag 规则集 + `{tag}` 占位会把 21 条重排成几条，是配置重构不是适配；\n   `http_clients` + `route.default_http_client` 是 ⑥ 型全局默认；API service / dashboard /\n   `sing-box api` 与脚本用的 clash_api 并行存在，无替换必要；`udp_*` NAT、`preferred_by`、\n   mDNS、TLS spoof、`bridge` 出站与 macOS 单机客户端场景无关。\n3. **不在运行时抓网页。** 表是人维护的，源是 git tag；`config audit` 保持离线。\n4. **不做 `/rules` 语义 diff。** `--deep` 的含义改为沙箱日志档，原预留用途作废。\n5. **不解析 `cache.db` 去判断规则集内容。** `legacy_address_filter_rs` 的定性交给 D。\n6. **不改 `_sb_derive_config` 的派生规则**（`clash_api` 仍 pop、inbound 仍换成 mixed）。派生件\n   看不见的段落里的废弃项由 A/B/C 覆盖，D 只是补「用法废弃」那两条。\n7. **不动 `dns_backup_save` / `dns_apply_proxy` 的行为**，只写立场。\n8. **不为老内核（\u003c 1.14.0）补表条目的兼容测试。** 版本闸门维持上一轮：低于 1.14.0 只用 A 路，\n   `--apply` 直接 `die`。\n\n## 受影响的文件与接口\n\n### `singbox.sh`\n\n| 改动 | 位置 |\n|---|---|\n| `LOCKDIR` 可由 `SB_LOCKDIR` 覆盖 | `singbox.sh:69` |\n| 新增迁移表（heredoc 常量，内联 python 消费；`\u003c\u003c'PY'` 不展开） | `_cfg_audit` 附近，新函数 `_cfg_table` |\n| `_cfg_audit` 加 C 路；加按路径去重与来源合并；加 `covers` 版本告警 | `singbox.sh:2060-2249` |\n| `_cfg_audit` 加 D 路：接受一个沙箱日志路径参数；`--deep` 时自己起沙箱 | 同上；沙箱复用 `_sb_derive_config` / `_sb_health`（`2850-2949`） |\n| `_cfg_audit_report` 加 `notice` 渲染，退出码不看它 | 现有函数 |\n| `_cfg_migrate` / `_cfg_whitelist_diff` 改为共用规则表，3 条规则 | `singbox.sh:2282-2366` |\n| `_cfg_apply` 确认提示逐条列规则与命中数；第 3 道沙箱日志喂给 D | `singbox.sh:2375-2472` |\n| `cmd_update` 阶段 1 沙箱日志喂给 D；旧 \u003c 1.14.0 ≤ 新时打规则集语义 notice | `singbox.sh:3090, 3141` |\n| `--deep` 从「尚未实现」改为 D 路 | `config audit` 参数解析 |\n\n**接口约定**（增量）：\n\n```\nsingbox config audit [--config \u003cpath>] [--apply] [--deep]\n```\n\n- `--deep`：加沙箱日志档。无网络时降级并打 `warn`，退出码按 A/B/C 定。\n- 发现行格式不变（`\u003ctier>\\t\u003csource>\\t\u003cjson路径>\\t\u003c说明>\\t\u003c链接>`），`tier` 增加 `notice`，\n  `source` 允许 `+` 连接多路（`check+schema+table`）。\n- 环境变量 `SB_LOCKDIR`：锁目录，默认不变。\n\n### 测试\n\n| 文件 | 改动 |\n|---|---|\n| `tests/run.sh` | 每个测试文件独立 `SB_LOCKDIR` |\n| `tests/config-audit.test.sh` | 新增断言见「验证」 |\n| `tests/fixtures/bad-implicit-http-client.json` | 新增：远程规则集无 `http_client` 无 `download_detour`，`http_clients` 空 |\n| `tests/fixtures/good-explicit-http-clients.json` | 新增：同上但 `http_clients` 非空 —— 不许报（`manager.go:42-44`） |\n| `tests/fixtures/bad-legacy-address-filter.json` | 新增：`ip_is_private` 无 `match_response`；另含一条带 `match_response: true` 的同类规则，不许报 |\n| `tests/fixtures/bad-store-rdrc.json` / `bad-independent-cache.json` | 新增：各自的 `--apply` 样本，前者含一份已有 `store_dns` 的变体 |\n| `tests/fixtures/bad-hysteria-tuning.json` | 新增：只有 B/C 能抓，D 必须沉默 |\n| `tests/fixtures/notice-query-type.json` | 新增：只命中 notice，退 0 |\n| `tests/fixtures/sandbox-run.log` | 新增：一份含 3 条 WARN 的假沙箱日志，D 路离线用 |\n| `tests/fixtures/fake-sing-box` | `run` 子命令加 `SB_FAKE_RUN_LOG=\u003c路径>` 后门，把指定日志吐到 stderr |\n| `tests/fixtures/schema-min.json` | 补 `DNSRule` / `DNSRuleAction` / `CacheFileOptions` / `HysteriaOutbound` 的裁剪定义 |\n\n### 文档与配置\n\n| 文件 | 改动 |\n|---|---|\n| `config/config.example.json` | 顶层加 `\"$schema\"` |\n| `docs/best-practices.md` | 加 `$schema` 一段；加「系统 DNS 切换与 `dns_mode`」立场一段（含 sing-tun 依据） |\n| `docs/script-usage.md` | `config audit` 一节：四路、`notice`、`--deep`、`SB_LOCKDIR`；**加「迁移表怎么维护」小节**：内核出新 minor 时，按 `git tag` 读那四处源，更新表与 `covers`，网站只做核对 | \u003c!-- doc:gone -->\n| `docs/config-audit-and-modernize.md` | 顶部加一行指向本文（`--deep` 语义变更、改写规则从 1 条到 3 条） |\n| `README.md` | `config audit` 那行提 `--deep` |\n| `CLAUDE.md` | 「八个测试文件」→ 九个；提 `SB_LOCKDIR` |\n\n## 待定问题\n\n1. **D 路在 `--deep` 下的沙箱等待时长。** ——已定（裁定见「实现计划」）\n   现有 `SANDBOX_WAIT=40` 是为 `--apply` 第 3 道定的；`--deep` 只要等到 `dns.Router.Start` 打完 WARN，理论上比建链短，但没有可靠的「打完了」信号。\n   先沿用 40 秒 —— 责任人：实现者\n2. **`legacy_address_filter_rs` 的 notice 会不会太吵。** ——已定（裁定见「实现计划」）\n   样例配置 `dns.rules[1-2]` 都引用规则集且无 `match_response`，裸审查每次都会打 2 条 notice。若真机上嫌吵，改为只在 `--deep` 无法\n   定性时打 —— 责任人：lzyMeta（真机看过报告后定）\n3. **`snippet` 片段要不要带 `tag`。** ——已定（裁定见「实现计划」）\n   `mig-af-N` 的 N 取原规则下标；若配置里已有同名 tag（不太可能但可能），片段就撞了。片段不落地，所以撞了也只是人抄的时候要改 —— 责任人：实现者\n4. **flaky 的根因** ——已定（裁定见「实现计划」）\n   见「其他四件」第 3 条，隔离后复跑 10 次仍红则另立项 —— 责任人：实现者\n5. **`covers` 告警的阈值用 minor 还是完整版本。** ——已定（裁定见「实现计划」）\n   1.14.1 不该告警，1.15.0 该；用 minor 比较即可，但 `ver_gt`（`singbox.sh:827`）是三段比较，要么加个 minor 比较，要么表头写\n   `covers=1.15.0`（表示「1.15.0 之前」）—— 责任人：实现者\n\n## 验证\n\n### 验收条件\n\n- AC1 ★ C 路（迁移表）能独立发现：`bad-implicit-http-client.json` 退 2、点名 `route.rule_set[0]`、来源含 `table`；`bad-legacy-address-filter.json` 只点名无 `match_response` 那条；`bad-hysteria-tuning.json` 来源不含 `run`。反例：关掉 C 路 → 断言 1/2/4 红。\n- AC2 四路同中 `bad-store-rdrc.json` 时输出一行，来源 `check+schema+table`（去重）。反例：去重逻辑退化为不去重 → 断言 3 红（同一路径出三行）。\n- AC3 `notice-query-type.json` 退 0 且含 `notice` 行与官方链接；假内核报 `1.15.3` 时打「迁移表只覆盖到 1.14.0」且退出码不变，报 `1.14.9` 时不打。反例：`notice` 参与退出码 → 断言 5 红；`covers` 按三段比较 → `1.14.9` 也打，断言 6 红。\n- AC4 `--deep` 用 `SB_FAKE_RUN_LOG` 喂 `sandbox-run.log` 时 3 条 WARN 全部出现、来源 `run`；`SB_FAKE_UDP=dead` 时打降级 warn 且退出码按 A/B/C。反例：D 路不读日志 → 4 条红。\n- AC5 `--apply` 对 `bad-store-rdrc.json` 的结构 diff 只有 `experimental.cache_file.store_rdrc` 删、`store_dns` 增且值 `true`；`bad-independent-cache.json` 只删 `dns.independent_cache`；`SB_FAKE_MIGRATED` 注入「`store_dns` 值为 false」时第 1 道拒绝。反例：跳过 `rename_if_true` → 断言 8/9/10 红。\n- AC6 表里每条链接的 `migration/#` 锚点都在 `tests/fixtures/migration-anchors.txt` 内；`SB_LOCKDIR` 指向临时目录时两个测试文件背靠背 `-n restart` 不出现「另一个 singbox 实例」。反例：表里加一个清单外的锚点 → 断言 13 红；去掉 `SB_LOCKDIR` 覆盖 → 断言 14 撞锁。\n\n### 机械验收（离线）\n\n```\n./singbox-selfcheck.sh && ./tests/run.sh\n```\n\n`tests/config-audit.test.sh` 新增断言：\n\n| # | 断言 |\n|---|---|\n| 1 | `bad-implicit-http-client.json` 退 2，点名 `route.rule_set[0]`，来源含 `table`；`good-explicit-http-clients.json` 对此项 0 命中 |\n| 2 | `bad-legacy-address-filter.json` 退 2，点名无 `match_response` 那条，**不**点名带 `match_response: true` 那条 |\n| 3 | `bad-store-rdrc.json` 四路全中时输出**一行**，来源 `check+schema+table`（去重） |\n| 4 | `bad-hysteria-tuning.json` 退 2，来源不含 `run`；用 `SB_FAKE_RUN_LOG` 喂一份没有它的日志时 D 不误报 |\n| 5 | `notice-query-type.json` 退 **0**，输出含 `notice` 行与官方链接 |\n| 6 | 假内核报 `1.15.3` 时输出「迁移表只覆盖到 1.14.0」一行且退出码不变；报 `1.14.9` 时不打 |\n| 7 | `--deep` 用 `SB_FAKE_RUN_LOG` 喂 `sandbox-run.log`：3 条 WARN 全部出现，来源 `run`；`SB_FAKE_UDP=dead` 时打降级 warn 且退出码按 A/B/C |\n| 8 | `--apply` 对 `bad-store-rdrc.json`：结构 diff 只有 `experimental.cache_file.store_rdrc` 删、`store_dns` 增，值 `true`；变体（已有 `store_dns`）只删不增 |\n| 9 | `--apply` 对 `bad-independent-cache.json`：只删 `dns.independent_cache` |\n| 10 | 三条规则同时命中的 fixture：确认提示列出 3 条各自的命中数；`SB_FAKE_MIGRATED` 注入「`store_dns` 值为 false」时第 1 道拒绝 |\n| 11 | `dns_rule_strategy` 的 fixture：报告含「建议写法」片段、含 `query_type: [\"AAAA\"]`、含「无 migration 章节」字样；`prefer_ipv4` 变体不给片段 |\n| 12 | 地址过滤 fixture 的片段：两条都含 `query_type`，evaluate 的 `server` 等于原规则的 server（不是 `dns.final`） |\n| 13 | 表里每条链接：用 `tests/fixtures/migration-anchors.txt`（从 v1.14.0 `docs/migration.md` 抽出的锚点清单）核对，不许出现清单外的 `migration/#` 锚点 |\n| 14 | `SB_LOCKDIR` 指向临时目录时，两个测试文件背靠背各跑一次 `-n restart`，都不出现「另一个 singbox 实例」 |\n\n变异验证（与上一轮同法，实现绿了之后做）：关掉 C 路 → 断言 1/2/4 红；去重逻辑退化为不去重\n→ 断言 3 红；`notice` 参与退出码 → 断言 5 红。\n\n### 真内核旁证（只读 fixture，不碰 live）\n\n把 C 路那段 python 抽出来喂真 `sing-box schema` 与 `probe/` 下 17 个 fixture，命中矩阵必须与\n本文「问题」一节的实测表一致。这是表条目「谓词写对了」的证据。\n\n### 人工验收（要动 live，已 deny，须本人跑）\n\n```bash\n./singbox.sh config audit             # 期望：退 0 或只有 notice；notice 点名 dns.rules 里的 query_type\n./singbox.sh config audit --deep      # 期望：沙箱建链成功，D 路无新增发现（live 已迁完 download_detour）\n./singbox.sh -n config audit --apply  # 期望：三条规则命中数 0/0/0，「无需改写」\nfor i in 1 2 3 4 5; do ./tests/run.sh >/dev/null 2>&1 || echo \"第 $i 次红\"; done   # 期望：无输出\n```\n\n外部 API 口径：全部断言针对 **sing-box 1.14.0**（`/sagernet/sing-box`，Context7 ID 在\n`.claude/sdlc.json`）；源码引用行号取 git tag `v1.14.0`；sing-tun 取 `v0.9.0-beta.4`\n（`go.mod:58`）。\n\n## 实现计划\n\n由 build 于 2026-09-10 追加。基线 `876ccad`，按 5 个可独立验证的单元顺序落地，每单元先写断言看红、\n再实现看绿、`sdlc-check`（`./singbox-selfcheck.sh && ./tests/run.sh`）退 0 后提交一次：\n\n| 单元 | 提交 | 内容 | 证据 |\n|---|---|---|---|\n| U0 锁隔离 | `fd32969` | `LOCKDIR=\"${SB_LOCKDIR:-…}\"`；`tests/run.sh` 每个测试文件一把 `mktemp -d` 下的锁；7 个测试文件的 teardown 从 `rm -rf /tmp/.singbox-sh.lock` 改为删 `$SB_LOCKDIR`（原来那句会删掉 **live** 命令的锁） | 断言 14 先红（`退出 0，没撞上指定目录里的锁`）后绿；连跑 10 次红 0 次 |\n| U1 迁移表 | `2b659a4` | `_cfg_pylib`（表 + 路径谓词 + 片段生成）、C 路、按路径去重与来源合并、`notice` 档、`covers` 提示；B 路 walker 认 `allOf` / `unevaluatedProperties` | 18 条断言先红后绿；真内核 1.14.0 对 17 个 probe fixture 的命中矩阵与「问题」表逐行一致；5 个变异全被抓 |\n| U2 沙箱日志档 | `07b8cfc` | `--deep`（`_cfg_deep_runlog`，复用 `--apply` 第 3 道那套沙箱）、`_cfg_audit cfg [runlog]`、第 3 道与 `update` 阶段 1 的 `run.log` 喂 D 路、跨 1.14.0 升级打规则集语义 notice、假内核 `run` 的 `SB_FAKE_RUN_LOG` 后门 | 11 条断言先红（`--deep` 仍 `die 尚未实现`）后绿；关掉 D 路读日志 → 4 条红 |\n| U3 改写层 | `88e958f` | `_cfg_migrate` / `_cfg_whitelist_diff` 共用表里 `fix: auto` 的 3 条；`_cfg_auto_hits`；确认提示逐条列命中数；命中 0 时「无需改写」早退；第 4 道按命中数归零 | 断言 8/9/10 先红（`store_rdrc` 落地后 diff 为空）后绿；跳过 `rename_if_true` → 5 条红；配对检查 + 新增侧检查同时变异 → T10 红 |\n| U4 文档 | 本次 | `config.example.json` 加 `$schema`；`best-practices.md` 的 `$schema` 段与 4.2.1 `dns_
