mode` 立场；`script-usage.md` 重写 audit 节 + 「迁移表怎么维护」；README、CLAUDE.md、上一轮文档顶部指针 | `sdlc-check` 退 0 | \u003c!-- doc:gone -->\n\n### 待定问题的裁定\n\n1. `--deep` 等待时长：沿用 `SANDBOX_WAIT=40`，与第 3 道同一套 `_sb_probe_socks`。\n2. `legacy_address_filter_rs` 的 notice：裸审查每次都打（真机 live 配置打 2 条）；`--deep` 建链成功而内核没打\n   地址过滤 WARN 时**撤掉**（真机验收时发现原实现定性完仍留着「用 --deep 定性」那句，已补）。裸审查嫌吵再改。\n3. `snippet` 的 `tag`：带 `mig-af-\u003c原规则下标>`，不查撞名，片段不落地。\n4. flaky 根因：基线单跑本来就没红，隔离后 10 次全绿；2026-09-11 真机 **live 服务运行中**（原来撞锁的场景）\n   连跑 5 次 0 红。仍只能说「隔离后没复现」，但撞锁场景已覆盖。\n5. `covers` 阈值：按 **minor** 比——把内核版本的 patch 位抹成 0 再用三段的 `ver_gt`（1.14.9 不打，1.15.0 打）。\n\n### 实现中发现、与本文不同的事\n\n- **B 路在真内核上对 DNS / 路由规则整段是盲的。** 真 schema 的 `DNSRule` / `Rule` 是\n  `oneOf[{unevaluatedProperties:false, allOf:[{匹配字段}, {oneOf: 动作分支}]}]`，上一轮的 walker 不认 `allOf`\n  就收手，所以「问题」表里 `strategy` / `rule_set_ip_cidr_accept_empty` 的 schema ✓ 在真机上原本抓不到\n  （那两个 ✓ 的依据是源码 `schema:\"omit\"`，不是 walker 实测）。修 walker 时又踩到 `reject` 分支的 `method`\n  枚举含 `\"\"`：「缺键算隐式命中」会把没写 `action` 的规则误归到 `reject`。两处都修了，`schema-min.json`\n  照真 schema 的形状重写让测试守住它。修完后 17 个 probe fixture 在真 schema 上零误报。\n- 发现行格式**尾部加了第 6 列** `snippet`（换行/制表符转义）与**第 7 列** `action`（「怎么办」一句话），前 5 列不变；\n  旧消费者（挂载点、verify）只读前 4 列，不受影响。报告渲染改为汇总表 + 编号详情（2026-09-11，按真机反馈重做：\n  同一问题的多处合并成一行，档位用人话），断言随之改写为 `row \u003c结论> \u003c路径> \u003c来源串>`。\n- `deprecated.md` 里 `download_detour` 那条的 Migration 链接误指 ACME 一节；v1.14.0 的 `migration.md` 既无\n  `download_detour` 也无 `strategy` 的章节。表里这两条链接分别指向 rule-set 配置页的 `http_client` 小节和\n  DNS rule action 页的 `strategy` 小节，`note` 里注明。\n- `config/config.example.json` 里还有 21 条 `download_detour`（模板没跟着 live 迁）。本文只让它加 `$schema`，\n  没动——2026-09-11 已同步：模板改成 live 的形状（`sing-box format` 后由 `--apply` 原位 wrap），\n  `tests/template.test.sh` 守住它过 audit、且与 live 逐键全等。\n- `tests/fixtures/migration-anchors.txt` 在 U0 提交前就已生成，被一起带进了 `fd32969`。\n- review（verifier）抓到合并逻辑两处：表外的 A/D 路发现都以路径 `-` 进合并、互相吞掉（改为无路径的行以原文为去重键）；\n  `unknown field X` 在 B 路同键之前处理、贴不上去、报成两行两档（改为 B 路先于 A 路处理）。均已补断言修复。\n  第三条（直接地址过滤规则与 rule_set 规则共存时反向定性会误撤 rs 的 notice）用 v1.14.0 `dns/router.go:156`\n  定案：`common.Any(newRules, WithAddressLimit)`，WARN **全局只打一次**——所以配置里有直接地址过滤规则时不撤、\n  也不升 rs 的 notice；没有直接规则时 WARN 才归 rs 规则（分不出是哪条，全部升为 deprecated）。已补断言修复。\n- **D 路的沙箱探测原本会把别人的监听当成自己的**（2026-09-12，第三轮 review 时 verifier 撞到的 R1 偶发）。\n  `--deep` 与 `--apply` 第 4 道都不持锁，两个 `singbox.sh` 同时 `_sb_free_port` 会拿到同一个端口——它只是\n  bind 一下再放手；`_sb_probe_socks` 又只看「端口有人听」，后起的那个立刻判「建链成功」，随即 `kill` 掉自己那个\n  还没吐日志的沙箱，`run.log` 空 → `[ -s ]` 失败 → D 路整个跳过，报告成「没有废弃项」。串行 30 次不出，\n  并行 20 次出 1 次。判据改为 `_sb_port_listening_by`（`lsof -nP -a -p \u003cpid> -iTCP:\u003cport> -sTCP:LISTEN`，\n  认**自己的 pid** 在听）；端口有人听但不是自己时明说「另一个 singbox.sh 正在起沙箱？」，日志照旧交给 D 路、\n  标为不完整。`config-audit.test.sh` R5 用假内核的 `SB_FAKE_RUN_SQUAT`（别的 pid 占端口、自己活 3 秒退出）\n  守着：改前对着别人的监听打「建链成功」，改后判「没能起来」且 WARN 仍进报告。\n\n### 人工验收（要动 live，本人跑）\n\n```bash\n./singbox.sh config audit             # 期望：退 0 或只有 notice；notice 点名 dns.rules 里的 query_type\n./singbox.sh config audit --deep      # 期望：沙箱建链成功，D 路无新增发现\n./singbox.sh -n config audit --apply  # 期望：三条规则 0/0/0 处，「无需改写」\nfor i in 1 2 3 4 5; do ./tests/run.sh >/dev/null 2>&1 || echo \"第 $i 次红\"; done\n```\n"},{"path":"docs/config-export.md","title":"`config export \u003cpath>`：把当前生效的配置导出到自定义路径","summary":"live 配置在 `/usr/local/etc/sing-box/config.json`（root 所有，0644），要拿走一份只能 `singbox config show > x.json` 或者手写 `cp`。两条路都有毛病：`config show` 走 `sudo cat`， 无谓地要一次 sudo；重定向会先把目标清空再写，敲错路径就把自己的旧备份覆盖了，且什么也不提示； `cp` 出来的文件沿用 0644，一份含订阅地址与节点凭据的 JSON 就以世界可读落","hash":"edd9ba9cd89b2927","kind":"spec","inferred":false,"status":"shipped","headings":[{"level":1,"text":"`config export \u003cpath>`：把当前生效的配置导出到自定义路径","line":10},{"level":2,"text":"问题","line":12},{"level":2,"text":"决定","line":28},{"level":2,"text":"不在范围内","line":66},{"level":2,"text":"受影响的文件与接口","line":76},{"level":2,"text":"待定问题","line":92},{"level":2,"text":"验证","line":98},{"level":3,"text":"验收条件","line":100},{"level":3,"text":"检查命令","line":110},{"level":2,"text":"实现计划","line":115}],"front":{"kind":"spec","status":"shipped","covers":["singbox.sh","tests/config-export.test.sh","docs/manual-config.md"],"appetite":"{diffLines: 200, phases: 3}"},"covers":["singbox.sh","tests/config-export.test.sh","docs/manual-config.md"],"mentions":["singbox.sh","tests/config-export.test.sh","tests/docs.test.sh","tests/fixtures/bin/"],"links":["CLAUDE.md","README.md","docs/manual-config.md"],"refs":[],"backlinks":["README.md"],"backrefs":[],"body":"# `config export \u003cpath>`：把当前生效的配置导出到自定义路径\n\n## 问题\n\nlive 配置在 `/usr/local/etc/sing-box/config.json`（root 所有，0644），要拿走一份只能\n`singbox config show > x.json` 或者手写 `cp`。两条路都有毛病：`config show` 走 `sudo cat`，\n无谓地要一次 sudo；重定向会**先把目标清空再写**，敲错路径就把自己的旧备份覆盖了，且什么也不提示；\n`cp` 出来的文件沿用 0644，一份含订阅地址与节点凭据的 JSON 就以世界可读落在了 `~/Downloads`。\n\n还有一个只有本仓库知道的坑：`edit` 与 `config audit --apply` 改的是磁盘文件，进程要 `restart` 才吃到；\n重启失败或人忘了重启时，磁盘上那份**不是**正在跑的那份。现在没有任何命令会告诉你这一点。\n\n不做也不会坏——它是便利功能。但换机、给别人复现问题、给 `config audit --config` 喂一份快照，\n每次都得手工凑这三件事（免 sudo、防覆盖、收权限），迟早有人把带凭据的文件权限敞开。\n\n外部可抄的实现：没有。仓库内 `cmd_edit`（`singbox.sh:1996`）里 `sudo cp \"$CFG\" \"$tmp\"; chown; chmod`\n那三行是同一动作的现成写法，直接复用它的形状。\n\n## 决定\n\n给 `cmd_config`（`singbox.sh:3323`）加一个 `export \u003cpath> [--force]` 分支：把 `$CFG` **逐字节**复制到\n`\u003cpath>`，不解析、不改写、不脱敏。目标已存在则拒绝，`--force` 才覆盖；目标是目录或父目录不存在则拒绝\n（不学 `cp` 往目录里补文件名——省一个分支，也省一条「到底写到了哪」的猜测）。导出物 owner 是调用者\n（走 sudo 时取 `$SUDO_UID:$SUDO_GID`），mode **0600**——它带凭据。读 `$CFG` 不需要 root（0644），\n所以整条命令**不 `need_root`、不 `acquire_lock`**，只 `require_installed`；`-n` 走仓库惯例「动手前打印计划\n再 return」。复制完 `cmp` 一次源与目标，不等就 die 并删掉半截文件。\n\n「当前生效」以**磁盘 `$CFG` 为准**——launchd 只会从它起进程，磁盘是唯一事实源。但如果 sing-box 正在跑且\n进程启动时刻早于 `$CFG` 的 mtime（`ps -o etime=` 反推启动时间，对 `stat -f %m`；macOS `ps` 没有 `etimes`），\nstderr `warn` 一句「磁盘配置比运行中的进程新，导出的是磁盘版；要导出进程正在用的那版，先 `restart`」。\n只警告，不阻断——「先导出再重启」是合理顺序，不能卡死它。\n\n因此什么会变差：`config` 又多一个子命令，help 那三行变四行；导出物是 0600，用户想拿去分享得自己 `chmod`，\n而分享之前本来就该先脱敏——这是故意的摩擦。\n\n**备选与否决**\n- 默认脱敏、`--raw` 才原样 —— 「哪些键算凭据」要跟 sing-box 每个协议的字段对表维护，漏一个就是假安全；\n  且脱敏后的文件不能直接回灌，不再是「当前所应用的配置」。脱敏留作独立立项。\n- 目标存在时交互 `ask`，`-y` 免问 —— 脚本场景要多记一个全局旗标；`--force` 与 `--apply`/`--deep` 同款，\n  局部、可 grep。\n- 进程比文件旧时拒绝导出 —— 会卡死「先导出再重启」这条最常见的顺序。\n- 顶层子命令 `export` —— 备份/恢复/审查全在 `config` 下，它是同一族；顶层多一个词要改 README 命令表、\n  分发表、docs 测试三处，换不来任何清晰度。\n- `config show` 加 `--out` —— `show` 的语义是「打到终端」，塞文件语义进去要处理 stdout 与文件的互斥。\n\n\u003cdetails>\u003csummary>面试原始问答\u003c/summary>\n\n| # | 问 | 答 |\n|---|---|---|\n| 1 | 导出的配置里含真实订阅地址与节点凭据。默认行为选哪种？ | 默认原样导出（不提供脱敏旗标，脱敏留给以后单独立项） |\n| 2 | 目标路径已存在文件时怎么办？ | 拒绝，需 `--force` 才覆盖 |\n| 3 | 「当前所应用」以谁为准？磁盘 `$CFG` 可能比正在跑的进程新。 | 以磁盘 `$CFG` 为准，检测到进程比文件旧时 warn 一句，不阻断 |\n| 4 | appetite（天花板 diffLines=400、phases=6；近 50 提交 p50=29、p90=415） | diffLines 200，phases 3 |\n\n\u003c/details>\n\n## 不在范围内\n\n- **脱敏 / 去凭据**：不提供 `--redact`，不改写任何键。要分享请自己处理。\n- **导出 `$CFG` 以外的东西**：`prefs`、`dns-backup`、`config.json.*.bak`、内核二进制、plist 都不导。不做「打包一整套」。\n- **导入 / 回灌**：反方向已有 `config restore`（只认 `$CFG.*.bak`）与 `install --config`，不新增 `config import`。\n- **格式转换**：不 `jq` 重排、不压缩、不转 YAML；输出与源 `cmp` 全等。\n- **写到 stdout**（`-` 作路径）：`config show` 已经干这个。\n- **目标是目录时自动补 `config.json`**：拒绝并提示，让人写全路径。\n- **远程目标**（`scp://`、iCloud 特殊处理）：路径只当本地路径。\n\n## 受影响的文件与接口\n\n（本表行号只在 build 期间有效；shipped 后不保证，以文件名为准。）\n\n| 文件 | 位置 | 改法 |\n|---|---|---|\n| `singbox.sh` | `cmd_config` `singbox.sh:3323`，`case` 里 `audit)` 之前 | 新增 `export)` 分支：解析 `\u003cpath>` 与 `--force`（每个 `shift 2` 前查 `${2:-}`），存在性/目录/父目录三查，`-n` 早退，`cp` → `chown` → `chmod 600` → `cmp`，进程陈旧性 warn |\n| `singbox.sh` | 文件头注释 `singbox.sh:19` 与 `cmd_help` `singbox.sh:4345-4347` | `config \u003csub>` 一行加 `export \u003cpath> [--force]` |\n| `singbox.sh` | `cmd_config` 末尾 `*) die \"config: 未知子命令 …\"` | 错误提示的子命令清单加 `export` |\n| `tests/config-export.test.sh` | 新建 | 用 `--prefix \u003cmktemp -d>` 造假 `$CFG`，覆盖下面每条 AC；进程陈旧性用 `PATH` 前置的假 `pgrep`/`ps` 桩 |\n| `tests/docs.test.sh` | 「参数解析」那一节 | `config export` 的 `--force` 与手册对表（沿用 `config audit` 旗标核对的写法） |\n| `docs/manual-config.md` | §2「备份与回退」`docs/manual-config.md:33` 之后 | 加 `singbox config export \u003cpath> [--force]` 一行与 0600 / 陈旧性警告两句 |\n| `README.md` | `README.md:89` 命令表 | 不改——`config` 已在表里，子命令不展开 |\n\n不跨栈，无契约文件。\n\n## 待定问题\n\n- 走 sudo 时导出物归 `$SUDO_UID:$SUDO_GID`，不走 sudo 时归 `$(id -u):$(id -g)`——build 时确认 macOS 的 `sudo` 确实导出这两个变量（`SUDO_UID` 是 sudo 标准行为，但 `chown` 要接受数字 uid:gid 形式） —— 已定\n- `cmp` 失败后删半截文件：目标原本存在且带 `--force` 的情形，删掉等于把用户的旧文件也丢了。build 时选「先写到同目录的临时名再 `mv`」还是「失败就留半截并明说」 —— 已定（2026-09-14 用户选「临时名再 `mv`」：`\u003cdir>/.\u003cname>.tmp.$$`，chown/chmod/cmp 都在临时文件上做，全过才 `mv -f`，失败只删临时文件）\n- 进程陈旧性判据只比 `$CFG` 的 mtime 与进程启动时间；`audit --apply` 走 `sudo cp` 会刷新 mtime，`restore` 也会——都符合预期。但 `touch` 也会触发误警告，接受 —— 已定\n\n## 验证\n\n### 验收条件\n- AC1 ★ `singbox --prefix \u003ctmp> config export \u003ctmp>/out.json` 退出 0，`cmp \u003ctmp>/etc/sing-box/config.json \u003ctmp>/out.json` 全等。反例：把复制源改成 `$CFG.bak` 或往输出多写一个换行，`cmp` 红。\n- AC2 目标已存在且无 `--force`：退出非 0、stderr 含「已存在」、目标内容与执行前逐字节不变；加 `--force` 后覆盖成功。反例：删掉存在性检查，「目标不变」断言红；把 `--force` 解析漏掉，第二次调用红。\n- AC3 不给路径、或路径是已存在目录、或父目录不存在：退出非 0 且 stderr 带用法/原因，不创建任何文件。反例：让 `${2:-}` 默认成空串直接进 `cp`，退出码是 `cp` 的而非 `die` 的、提示语断言红。\n- AC4 导出物 mode 是 `0600`（`stat -f %Lp` = `600`），owner 是调用者的 uid。反例：漏掉 `chmod`，继承源的 `644`，红。\n  [revised] build 时实测：真正的守卫是 `( umask 077; cp )`——临时文件出生即 0600，不留「cp 完、chmod 前」的 0644 窗口；`chmod 600` 只是保险，单删它测试仍绿。反例改为「去掉 umask 且删 chmod」才红。\n- AC5 `-n config export \u003cpath>` 打印计划、退出 0、目标不出现。反例：把早退点挪到 `cp` 之后，目标出现，红。\n- AC6 假 `pgrep` 报有进程、假 `ps -o etime=` 报进程已跑 1 小时、`$CFG` mtime 是现在：stderr 含「比运行中的进程新」且退出仍为 0；进程比文件新、或 `pgrep` 报没进程时不出现该行。反例：把比较方向反过来，前者不警告、后者误警告，两条断言各红一条。\n- AC7 `docs.test.sh` 能在 `cmd_help` 与 `docs/manual-config.md` 里都找到 `config export`。反例：删掉手册那一行，红。\n\n### 检查命令\n```bash\n./singbox-selfcheck.sh && ./tests/run.sh\n```\n\n## 实现计划\n\n2026-09-14 build，Claude Code 实现。先写测试看红（`config: 未知子命令 export`，13/13 红，退出 1；`docs.test.sh` 退出 1），再实现看绿。\n\n1. `tests/config-export.test.sh`（新建）：仿 `verify.test.sh` 骨架；`pgrep` 用 `tests/fixtures/bin`，假 `ps` 在测试里自造（读 `SB_FAKE_STATE/etime`，否则透传 `/bin/ps`）。AC1–AC6 共 13 条断言，含 `dd-hh:mm:ss` 形态一条。\n2. `tests/docs.test.sh` §2：旗标抓取循环 `for sub in audit export`，从 `config \u003csub>: 未知参数 $1（…）` die 文案抓；新增 AC7 断言（help 含 `export \u003cpath>`、手册含 `singbox config export`）。\n3. `singbox.sh`：`_cfg_export_stale_warn`（`ps -o etime=` 解析为秒反推启动时刻，对 `stat -f %m`）；`cmd_config` 的 `export)` 分支放在 `audit)` 之前；头注释、`cmd_help`、`*)` die 清单加 `export`。\n4. `docs/manual-config.md` §2 加命令行与三句说明；`README.md` §5 结构树加 `config-export.test.sh`；`CLAUDE.md` 测试清单加一项、计数由 `sdlc-doc gen --write` 重算。\n\n变异验证：AC6 比较方向反转 → 3 条红；AC4 单删 `chmod` 不红（见 AC4 `[revised]`）。\n踩坑一条：`\"$e_dst（0600）\"` 在 bash 3.2 报 `unbound variable`，必须 `${e_dst}`——CLAUDE.md 已有记载。\n"},{"path":"docs/maintaining.md","title":"维护者手册","summary":"改代码的人看的。操作手册是 `manual-*.md`（README 第 4 节有表），方案与原理在 best-practices.md， 每轮改动的设计记录见 README 第 4 节。","hash":"d2480f414ff92c4e","kind":"manual","inferred":false,"status":null,"headings":[{"level":1,"text":"维护者手册","line":4},{"level":2,"text":"前提","line":9},{"level":2,"text":"步骤","line":31},{"level":3,"text":"验收","line":33},{"level":3,"text":"发版","line":39},{"level":3,"text":"迁移表怎么维护","line":49},{"level":2,"text":"出错了看哪","line":79},{"level":2,"text":"深入阅读","line":89}],"front":{"kind":"manual"},"covers":[],"mentions":[".claude/sdlc.json","config/config.example.json","singbox.sh","tests/config-audit.test.sh","tests/docs.test.sh","tests/fixtures/migration-anchors.txt"],"links":["CLAUDE.md","docs/best-practices.md","docs/config-audit-findings.md","docs/config-audit-migration-table.md"],"refs":[],"backlinks":["README.md","docs/config-audit-findings-guide.md","docs/manual-config.md"],"backrefs":[],"body":"# 维护者手册\n\n改代码的人看的。操作手册是 `manual-*.md`（README 第 4 节有表），方案与原理在 [best-practices.md](best-practices.md)，\n每轮改动的设计记录见 README 第 4 节。\n\n## 前提\n\n- 验收命令、每个测试文件盯什么、运行环境的硬约束（bash 3.2、BSD 工具链、Rosetta 下的架构判定）、\n  这台机器上有 live sing-box 时哪些命令不能跑——都在仓库根目录的 `CLAUDE.md`，不在这里重复。\n- 发版走两个技能 `/sdlc-kit:tag` 与 `/sdlc-kit:release`，不手工敲 `git tag` / `git push` / `gh release`。\n  配置在 `.claude/sdlc.json` 的 `release` 节（`channel: release`、版本文件 `singbox.sh` 的 `VERSION=` 行、\n  asset `singbox.sh`）；契约三条在 `.github/workflows/release.yml` 文件头。\n- 文档不漂移靠两层，各管一半：\n  - **sdlc-kit 的 `sdlc-doc`**（通用规则 D1–D8 与 D11–D13；D9/D10 是 `sdlc-doc stale` 子命令）：引用了已删除的路径、\n    「订正」贴在旁边不折回正文、两处逐字重复的段落、手册超过 120 行或混进原理、设计记录没标 `status`、\n    `covers` 点名的文件改了而文档没动（改提交时提醒）。`sdlc-doc lint` 已注册为 `check.commands` 的 `doc` 项\n    （sdlc-kit ≥ 0.2.8：`sdlc-check` 会把自己的 bin 放进检查命令的 PATH，闸门的裸 PATH 下也能找到它）。\n  - **`tests/docs.test.sh`**（本项目特有的事实，通用工具不可能知道）：分发表里的子命令要出现在\n    README 命令表、内置 help 和某份手册里；`config audit` 的旗标；README 仓库结构与文档索引；自检项数；\n    `best-practices.md` 的配置全文（必须与 `config/config.example.json` 逐字相同）；README 与\n    best-practices 的目录；手册里不许出现 `singbox.sh:行号`。测试文件数是 CLAUDE.md 里的 `sdlc-doc:n` 块，归 D2。\n- 文档的 `kind`：5 份操作手册是 `manual`（D4：≤ 120 行、四个固定 H2「前提 / 步骤 / 出错了看哪 / 深入阅读」、\n  不许有原理段——原理写进 `best-practices.md` 第 9 节，手册只留链接）；5 份设计记录是 `spec`（`status: shipped`）；\n  `best-practices.md` 是 `design`；本文也是 `manual`。`covers` 写的是「改了这些文件就该回看这份文档」。\n- 迁移表的原则：**网站是活的，内核是死的。** 首页 changelog 已经是下一个 alpha，而审查对象是本机装着的那个版本。\n  表的每条都钉在 sing-box 的 **git tag**，网站只做人工核对。\n\n## 步骤\n\n### 验收\n\n```bash\n./singbox-selfcheck.sh && ./tests/run.sh\n```\n\n### 发版\n\n```\n/sdlc-kit:tag [patch|minor|major|\u003c版本号>]   # bump singbox.sh 的 VERSION、提交、打 annotated tag、只推这一个 ref\n/sdlc-kit:release                           # 触发 release.yml 建 Release，核实 releases/latest 已指向它\n```\n\n`tag` 打完对用户**不可见**——`update` 阶段 S 读的是 `releases/latest`，不是 tag；`release` 的最后一步\n`sdlc-release verify` 才是「发好了」的凭据。\n\n### 迁移表怎么维护\n\n内核出新 minor 时，按下面的顺序走：\n\n1. 按 tag 读四处源：`docs/deprecated.md` / `docs/migration.md` / `docs/changelog.md`（三页的源）、\n   `experimental/deprecated/constants.go`（内核真正会告警的 Note）、`option/*.go` 里 `schema:\"omit\"` 的字段\n   （schema 路的精确定义）、`deprecated.Report` 的调用点（标每条是 `New()` 阶段 `check` 能抓，还是 `Start()` 阶段只有沙箱日志能抓）。\n   ```bash\n   curl -fsSL https://raw.githubusercontent.com/SagerNet/sing-box/v1.15.0/docs/migration.md\n   ```\n2. 往 `_cfg_pylib` 的 `TABLE` 加条目：`id` / `match`（`key` 路径模式或 `usage` 具名谓词）/ `deprecated_in` /\n   `removed_in` / `tier` / `stage` / `warn`（把 WARN 原文对回本条的正则）/ `link` / `note` / `fix` / `rewrite`。\n   **链接写整段字面量，不拼接**——`tests/config-audit.test.sh` 的锚点核对是 grep 源码做的。\n   `snippet` 型条目的语义只从源码取，概括性文字复现不出正确的改写（例子：文档说地址过滤「只对地址查询生效」，\n   源码是整条规则跳过——按文档写出的等价形式会多一条永远不该有的兜底）。\n   ```bash\n   grep -n '^TABLE = \\[' singbox.sh\n   ```\n3. 从新 tag 的 `docs/migration.md` 重新生成 `tests/fixtures/migration-anchors.txt`（生成规则写在文件头注），\n   把 `CFG_TABLE_COVERS` 改成新 minor。\n   ```bash\n   head -4 tests/fixtures/migration-anchors.txt && grep -n '^CFG_TABLE_COVERS=' singbox.sh\n   ```\n4. `fix` 不是 `auto` 的条目，**同时**在 [config-audit-findings.md](config-audit-findings.md) 加一节 `### \u003cid>`，\n   四段（问题是什么 / 模板里的例子 / 怎么判断 / 改成什么样）都要写——报告详情区的「解读」链接锚到这一节。\n   `tests/docs.test.sh` 第 9 项把表与文档双向钉死：多一条、少一节、缺一段都红。\n   ```bash\n   ./tests/docs.test.sh\n   ```\n\n## 出错了看哪\n\n- 换过 `release.yml` 之后要先随一个普通 commit 推到 `main`，`gh workflow run` 才找得到它。\n- `ver_gt()` 把非数字段按 0 处理（`1.3.0-rc.1` 的第三段按 0 算），所以装了 `-rc` 版的用户\n  **不会被推到同号正式版**。目前没有给测试者发 rc 的需求；有了再改 `ver_gt()`，不在这里绕。\n- 迁移表：文档与内核互有遗漏，两个方向都有——内核 WARN 给的链接可能是死链（1.14.0 的 `strategy`）；deprecated 页会漏\n  （Hysteria v1 调优字段、`tun.endpoint_independent_nat`）；也会说已移除而内核仍接受（`block` 出站）。\n  每条的 `note` 里把这类出入写清楚。\n- `sdlc-doc lint` 红了：输出的 D 编号对应上面「前提」里那一层的规则；`tests/docs.test.sh` 红了：它报的是本项目特有的事实对不上。\n\n## 深入阅读\n\n- [best-practices.md](best-practices.md)\n- [config-audit-migration-table.md](config-audit-migration-table.md)\n- [config-audit-findings.md](config-audit-findings.md)\n- [../CLAUDE.md](../CLAUDE.md)\n"},{"path":"docs/manual-check.md","title":"检查与排查","summary":"装完、换了网络、感觉分流不对、想知道哪坏了——按这个顺序跑。","hash":"d217823c00119043","kind":"manual","inferred":false,"status":null,"headings":[{"level":1,"text":"检查与排查","line":4},{"level":2,"text":"前提","line":8},{"level":2,"text":"步骤","line":12},{"level":2,"text":"出错了看哪","line":65},{"level":2,"text":"深入阅读","line":76}],"front":{"kind":"manual"},"covers":[],"mentions":[],"links":["docs/best-practices.md","docs/manual-install.md","docs/verify-hardening.md"],"refs":[],"backlinks":["README.md","docs/manual-daily.md","docs/manual-update.md"],"backrefs":[],"body":"# 检查与排查\n\n装完、换了网络、感觉分流不对、想知道哪坏了——按这个顺序跑。\n\n## 前提\n\n- 服务在跑（`singbox status`）。`verify` / `syscheck` / `rules` 不需要 sudo\n\n## 步骤\n\n1. 完整验证\n\n   ```bash\n   singbox verify\n   ```\n\n   六步：① SOCKS 出口（绕开 TUN）② 两个出口 IP 必须不同 ③ DNS 是否被投毒\n   ④ IPv6 / QUIC ⑤ 国内直连与局域网 ⑥ 配置里有没有废弃字段。没有任何一步会静默跳过。\n\n   | 退出码 | 含义 |\n   |---|---|\n   | `0` | 全过 |\n   | `1` | 链路档失败：SOCKS 不通、取不到出口 IP、两个出口相同、有全局 IPv6。换内核可能修好 |\n   | `2` | 策略档失败：DNS 污染或无解析手段、QUIC 没被阻断、国内出口等于代理出口、网关不通、参照站取不到、配置有废弃字段。回滚内核换不回来 |\n\n2. 换过网络就复查系统层\n\n   ```bash\n   singbox syscheck     # 退 0 全合格；1 有服务 IPv6 未关或 DNS 是内网地址\n   singbox sysprep      # 不合格时修复\n   ```\n\n   IPv6 与 DNS 设置按网络服务生效、不会继承：插网线转接器、iPhone USB 热点、\n   公司 VPN 退出没还原 DNS、切换「位置」，都会留下缺口，而代理看起来一切正常。\n\n3. 验证规则集\n\n   ```bash\n   singbox rules        # 退 0 全可达；1 有不可达\n   ```\n\n   规则集下载失败时内核照样启动，只是那条规则永远不命中。内核大版本升级后也跑一次。\n\n4. 看每条连接走了哪个出站\n\n   ```bash\n   singbox debug        # 停掉服务、前台 debug 跑；Ctrl-C 后自动恢复服务\n   ```\n\n   正常浏览，看日志里 `outbound/vless[vpsre]` 方括号里的 tag——那就是路由结果。\n\n5. 一键诊断\n\n   ```bash\n   singbox doctor       # 退 0 未发现已知问题；1 命中了判据\n   ```\n\n   自动判读十类问题：权限、端口占用、规则集下载失败、FakeIP 泄漏、DNS 投毒、废弃字段、\n   路由未接管或只接管了一半、plist 语法、IPv6 未关、服务未运行。全套信息写到\n   `/tmp/singbox-keep-*/doctor-*.txt`（0600，含访问过的域名与日志，贴出去前先看一眼）。\n\n## 出错了看哪\n\n- **`verify` 第 1 步失败** → 节点参数错，与 TUN、路由无关。见 [首次安装](manual-install.md) 的出错项。\n- **第 2 步两个 IP 相同** → 服务端 UUID 分流没生效或住宅中转断了。日志里照样打 `[vpsre]`，这是客户端唯一能发现它的手段。不确定就 `debug` + 另开终端 `curl -s https://ipinfo.io/json`。\n- **退出 2 但上网正常** → 你正在失去的是分流本身。按打 `✗` 的那步查：`rules` 看规则集下来没、`debug` 看连接落在哪。\n- **报「本机没有可用解析手段」** → 不是污染，是 `dig` / `host` / `dscacheutil` / `python3` 都没拿到 A 记录。先确认能上网，再看 `syscheck` 的系统 DNS。\n- **`rules` 报 404** → 分类名不对：`x` 上游可能叫 `twitter`、`meta` 叫 `facebook`、`apple@cn` 有的源写 `apple-cn`。\n- **`doctor` 报「TUN 只接管了一半默认路由」** → 比「未接管」更隐蔽：另一半地址正从 en0 直连。`restart` 后再看。\n- **`syscheck` 报 `fe80::` / `::1`** → 不会。那是链路本地与环回，脚本只报全局地址。\n- **`syscheck` 注了一行 `fdxx::` ULA** → 也不算。多半是 Xcode 设备隧道（插着 iPhone 时 `utunN` 上的 `fdf8:…::2`）或 Docker 的虚拟网卡，公网不可路由；脚本点名它只是让你知道它被看见了。\n\n## 深入阅读\n\n- [验证清单：每步的「不通过时」分支](best-practices.md#5-验证清单)\n- [故障排查速查表](best-practices.md#71-速查表)\n- [verify 为什么分两档退出码、第 2 步为什么最关键](best-practices.md#92-verify-的两档退出码)\n- [verify 收紧（设计记录）](verify-hardening.md)\n"},{"path":"docs/manual-config.md","title":"改配置与配置审查","summary":"安全地改 live 配置、备份与回退、审查废弃字段并自动迁移。","hash":"e67b820c0eee1a20","kind":"manual","inferred":false,"status":null,"headings":[{"level":1,"text":"改配置与配置审查","line":6},{"level":2,"text":"前提","line":10},{"level":2,"text":"步骤","line":14},{"level":2,"text":"出错了看哪","line":75},{"level":2,"text":"深入阅读","line":87}],"front":{"kind":"manual","covers":["config/config.example.json"]},"covers":["config/config.example.json"],"mentions":[],"links":["docs/best-practices.md","docs/config-audit-findings.md","docs/config-audit-migration-table.md","docs/maintaining.md","docs/manual-update.md"],"refs":[],"backlinks":["README.md","docs/config-audit-findings-guide.md","docs/config-export.md"],"backrefs":[],"body":"# 改配置与配置审查\n\n安全地改 live 配置、备份与回退、审查废弃字段并自动迁移。\n\n## 前提\n\n- 已安装。`config audit --config \u003c文件>` 审任意文件不需要 root，其余要 sudo\n\n## 步骤\n\n1. 改配置\n\n   ```bash\n   singbox edit                        # 编辑器打开 → 验语法 → sing-box check → 备份 → 写入 → 重启\n   singbox edit --editor nano          # 指定编辑器并记住\n   singbox edit --editor \"code -w\"     # GUI 编辑器务必带等待参数\n   singbox edit --editor mate --once   # 只用这一次\n   singbox edit --show-editor          # 看当前会用哪个\n   singbox edit --reset-editor         # 清除偏好\n   ```\n\n   两关校验都过才写入；任一关不过，原配置不动，你的修改保留在 `/tmp/sb-edit-failed-*.json`。\n   编辑器优先级：`--editor` > 记住的偏好 > `$EDITOR` > `vi`，不可用就逐级降。\n\n2. 备份与回退\n\n   ```bash\n   singbox config show\n   singbox config backup\n   singbox config list                 # 带时间戳，自动保留最近 10 份\n   singbox config diff [备份路径]       # 默认与最近一次比\n   singbox config restore [备份路径]    # 默认恢复最近一次\n   singbox config export \u003cpath> [--force]   # 逐字节导出生效配置到自定义路径\n   ```\n\n   `export` 不要 sudo、不解析不脱敏，导出物是 **0600** 且归调用者——它带订阅地址与节点凭据，\n   要分享请先自己脱敏再 `chmod`。目标已存在只有 `--force` 才覆盖；目标是目录或父目录不存在直接拒绝。\n   若 sing-box 正在跑、且磁盘配置比进程启动时刻新（`edit` / `audit --apply` 之后没 `restart`），\n   会 warn 一句「磁盘配置比运行中的进程新」但照常导出——导出的永远是磁盘上那份。\n\n3. 审查废弃字段\n\n   ```bash\n   singbox config audit                        # 审 live 配置，离线、毫秒级\n   singbox config audit --config ./some.json   # 审任意文件\n   singbox config audit --deep                 # 再起一次沙箱收内核运行时的告警，要网络\n   ```\n\n   报告是一张汇总表加编号详情，只看「结论」与「怎么办」两列，看不懂的按详情区「解读」链接过去：\n   「将来会坏」按编号到详情找链接；\n   「提示」是行为变更提醒，配置照旧合法。退出码：`0` 干净、`2` 有废弃项但现在能跑、\n   `1` 内核已经不接受。升级内核前跑一次。\n\n4. 自动迁移\n\n   ```bash\n   singbox -n config audit --apply    # 预演：列出会改哪些键、各几处，四道验收过不过\n   singbox config audit --apply       # 真改：备份 → 改写 → 验收 → 落地并重启\n   ```\n\n   | 旧写法 | 改成 |\n   |---|---|\n   | 规则集的 `download_detour: \"X\"` | `http_client: {\"detour\": \"X\"}` |\n   | `dns.independent_cache` | 删掉 |\n   | `experimental.cache_file.store_rdrc: true` | `store_dns: true`（已有 `store_dns` 或值为 false 则只删） |\n\n   只改这三类，别的一律只报不改。四道验收（结构 diff 只落在这三处、`sing-box check`、\n   沙箱起得来、重跑审查归零）任一道不过就不落地。三处命中都是 0 时报「无需改写」直接退出。\n\n## 出错了看哪\n\n- **`edit` 保存后报校验失败** → 修改在 `/tmp/sb-edit-failed-*.json`，改好后 `edit` 再粘回去。\n- **`edit` 一打开就说「没改动」** → GUI 编辑器没带等待参数，用 `--editor \"code -w\"`。\n- **记住的编辑器被卸载了** → 会自动清除偏好并降级，重新 `--editor` 指定即可。\n- **`--apply` 改坏了** → `singbox config restore`，回到 `--apply` 前的备份。\n- **`--apply` 被拒「内核低于 1.14.0」** → 先升内核（[升级](manual-update.md)），再迁移。\n- **`--apply` 与 `--config` 不能同用** → `--apply` 只作用于 live 配置，它的回退点是 `config restore`。\n- **报告说「迁移表只覆盖到 1.14.0」** → 内核比表新，用 `--deep` 或查官方 deprecated 页。\n- **`--deep` 注明「日志可能不完整」** → 远程规则集没下到，沙箱没起来；联网后重跑。\n- 直接 `sudo vi` 改也行，但没有校验、没有备份、不会重启——sing-box 不监听文件变化，改了不重启等于没改。\n\n## 深入阅读\n\n- [配置逐字段详解](best-practices.md#2-配置逐字段详解)\n- [版本兼容对照](best-practices.md#29-版本兼容对照)\n- [编辑器偏好为什么只记「显式指定且可用」的](best-practices.md#95-edit-的编辑器回退)\n- [config audit 的四路发现层与四道验收（设计记录）](config-audit-migration-table.md)\n- [config audit 结论解读：每条「怎么办」背后的问题、模板例子与判断方法](config-audit-findings.md)\n- [迁移表怎么维护](maintaining.md#迁移表怎么维护)\n"},{"path":"docs/manual-daily.md","title":"日常运行","summary":"看状态、启停、开机自启、停服时的系统 DNS、日志。","hash":"38783c0d53ff1cef","kind":"manual","inferred":false,"status":null,"headings":[{"level":1,"text":"日常运行","line":4},{"level":2,"text":"前提","line":8},{"level":2,"text":"步骤","line":12},{"level":2,"text":"出错了看哪","line":80},{"level":2,"text":"深入阅读","line":90}],"front":{"kind":"manual"},"covers":[],"mentions":[],"links":["docs/best-practices.md","docs/manual-check.md","docs/manual-install.md"],"refs":[],"backlinks":["README.md"],"backrefs":[],"body":"# 日常运行\n\n看状态、启停、开机自启、停服时的系统 DNS、日志。\n\n## 前提\n\n- 已按 [首次安装](manual-install.md) 装好，`singbox` 命令可用\n\n## 步骤\n\n1. 看状态\n\n   ```bash\n   singbox status     # 不带命令也是它\n   ```\n\n   三段：服务（进程、LaunchDaemon、自启）、TUN 与路由、监听端口。指向 `en0` 的那条\n   `default` 是正常的，内核自己的出站要靠它；判据是「有没有一条指向 utun」。\n\n2. 启停与重启\n\n   ```bash\n   singbox stop       # 本次开机内停止，重启电脑后照样自启\n   singbox start\n   singbox restart    # 改完配置用这个\n   ```\n\n3. 跨重启地停用 / 启用\n\n   ```bash\n   singbox disable    # 立即停止，并且重启后也不起\n   singbox enable\n   ```\n\n   调试期间用 `disable`，否则重启后服务自己回来，还会占着端口。它管不了 `debug`\n   或手动前台跑的实例，那些要回终端 `Ctrl-C`。\n\n4. 停服时处理系统 DNS\n\n   ```bash\n   singbox stop --dns-dhcp        # 交回路由器下发，不问\n   singbox stop --restore-dns     # 按安装时的备份回滚，不问\n   singbox stop --keep-dns        # 保留 1.1.1.1，不问\n   singbox stop --dns 223.5.5.5   # 指定地址\n   singbox disable --dns-dhcp     # disable / uninstall 同样支持\n   ```\n\n   代理运行时系统 DNS 是 `1.1.1.1`；代理一停，这个地址的明文查询在国内会被污染，\n   所以 `stop` / `disable` / `uninstall` 都会问是否还原。不带参数就是问一句，默认按备份回滚。\n\n5. 单独查看或切换 DNS\n\n   ```bash\n   singbox dns status          # 当前 DNS、是否与服务状态匹配、备份内容\n   singbox dns dhcp            # 交回 DHCP\n   singbox dns backup          # 按备份还原\n   singbox dns proxy           # 设回 1.1.1.1\n   singbox dns set 223.5.5.5\n   ```\n\n   `dns status` 会交叉核对：服务在跑但 DNS 不是代理模式 → 查询可能不进 TUN；\n   服务没跑但 DNS 是 `1.1.1.1` → 明文查询会被污染。`start` 时发现前者也会提醒并询问。\n\n6. 看日志、回收空间\n\n   ```bash\n   singbox logs           # 先报体积，再打后 50 行\n   singbox logs 200\n   singbox logs -f        # 跟随\n   singbox logs size      # 只看体积\n   singbox logs truncate  # 原地清空，服务不受影响、不用重启\n   ```\n\n   launchd 不做日志轮转，`/var/log/sing-box.log` 与 `.err` 只涨不落。超过 64 MB\n   （`SB_LOG_WARN_MB` 可改）时 `status` 与 `doctor` 会点名。\n\n## 出错了看哪\n\n- **停服后某些网站解析出错误 IP** → `singbox dns dhcp`。\n- **`start` 后能上网但分流不对** → `singbox dns status`，DNS 不是代理模式就 `dns proxy`。\n- **`status` 显示监听 `*:10808`** → 配置里 `listen` 写成了 `0.0.0.0`，局域网内谁都能用你的代理，改回 `127.0.0.1`。\n- **日志几百 MB** → `singbox logs truncate`。不要 `mv` / `rm` 日志文件：守护进程会继续往旧 inode 写，空间收不回来，新日志也看不到。\n- **`disable` 后端口仍被占** → 是前台 `debug` 或手动跑的实例，回那个终端 `Ctrl-C`。\n- **备份里的 DNS 是 `1.1.1.1`** → 会被当成 DHCP 处理（装脚本前手动设过的情况）。拿不准直接 `--dns-dhcp`。\n- 更多症状：`singbox doctor`，见 [检查与排查](manual-check.md)。\n\n## 深入阅读\n\n- [运行与开机自启：三个必须知道的坑](best-practices.md#63-三个必须知道的坑)\n- [日志为什么只能原地截断](best-practices.md#93-日志为什么只能原地截断)\n- [DNS 备份为什么把 1.1.1.1 当 DHCP](best-practices.md#94-dns-备份的归一化)\n"},{"path":"docs/manual-install.md","title":"首次安装","summary":"从零到代理跑起来：取脚本、填配置、`install`、验证。装完 `singbox` 命令全局可用。","hash":"ea23e5e68ef200f7","kind":"manual","inferred":false,"status":null,"headings":[{"level":1,"text":"首次安装","line":6},{"level":2,"text":"前提","line":10},{"level":2,"text":"步骤","line":16},{"level":2,"text":"出错了看哪","line":75},{"level":2,"text":"深入阅读","line":87}],"front":{"kind":"manual","covers":["config/config.example.json"]},"covers":["config/config.example.json"],"mentions":[],"links":["docs/best-practices.md","docs/manual-update.md","docs/self-install-and-self-update.md"],"refs":[],"backlinks":["README.md","docs/manual-check.md","docs/manual-daily.md","docs/manual-update.md"],"backrefs":[],"body":"# 首次安装\n\n从零到代理跑起来：取脚本、填配置、`install`、验证。装完 `singbox` 命令全局可用。\n\n## 前提\n\n- macOS（Intel 或 Apple Silicon 都行，架构自动判断）\n- 管理员密码：TUN 建虚拟网卡、改路由表必须 root\n- 服务端两条节点的参数：地址、SNI、REALITY 公钥、short ID、两个 UUID\n\n## 步骤\n\n1. 取脚本\n\n   ```bash\n   git clone https://github.com/lzyMeta/macos-singbox-client-helper.git\n   cd macos-singbox-client-helper\n   chmod +x singbox.sh\n   ```\n\n   从浏览器下载 zip 的先解除隔离标记：`xattr -dr com.apple.quarantine .`。\n   只要脚本不要仓库：`curl -fsSLO https://github.com/lzyMeta/macos-singbox-client-helper/releases/latest/download/singbox.sh`。\n\n2. 填配置\n\n   ```bash\n   cp config/config.example.json config.json\n   $EDITOR config.json\n   ```\n\n   | 占位符 | 换成 |\n   |---|---|\n   | `YOUR_VPSTRANS_ADDR` | vpstrans 的 IP 或域名（两条节点都连它） |\n   | `YOUR_SNI` | REALITY 的 SNI，与服务端 dest 一致 |\n   | `YOUR_PUBLIC_KEY` | 服务端 REALITY 公钥 |\n   | `YOUR_SHORT_ID` | 服务端签发的 short ID |\n   | `YOUR_UUID_VPSTRANS` | 走机房出口的 UUID |\n   | `YOUR_UUID_VPSRE` | 走住宅出口的 UUID |\n   | `YOUR_CLASH_SECRET` | Clash 面板口令，一串随机字符 |\n\n   两个 UUID 必须是标准的 `8-4-4-4-12` 格式。\n\n3. 先空跑，再安装\n\n   ```bash\n   ./singbox.sh -n install --config ./config.json    # 只打印将做什么\n   ./singbox.sh install --config ./config.json       # 真正执行\n   ```\n\n   八步：环境与配置检查 → 装内核 → 装 `singbox` 命令到 `/usr/local/bin` → 系统层准备\n   （关 IPv6、系统 DNS 指向 `1.1.1.1`、检测冲突的 VPN）→ 放置配置 → `sing-box check` →\n   前台试跑 25 秒 → 装服务并自动 `verify`。可选参数：`--version \u003cv>` 指定内核版本、\n   `--arch amd64|arm64` 覆盖架构判断、`--force` 已安装时直接重装、`--prefix \u003cdir>` 换安装位置。\n\n4. 关闭浏览器内置 DoH——脚本做不了这件事\n\n   ```text\n   Chrome   chrome://settings/security → 关闭「使用安全 DNS」\n   Firefox  about:config → network.trr.mode = 5\n   ```\n\n5. 验证\n\n   ```bash\n   singbox status     # 服务、TUN 路由、监听端口\n   singbox verify     # 六步验证，退出 0 才算全过\n   singbox rules      # 规则集 URL 是否可达\n   ```\n\n## 出错了看哪\n\n- **报「配置里还有占位符」** → 第 2 步没填全。这个检查在下载内核之前，改完重跑即可。\n- **`install` 中途失败** → 直接重跑，是安全的：已装的内核会问是否重装，已有配置先备份，已加载的服务先卸。\n- **`verify` 第 1 步就失败** → 问题在节点参数，与 TUN、路由无关。逐字符比对 `uuid`、`server_name`、`public_key`、`short_id`，确认 `flow` 两端一致、Mux 已关。这一步不过，后面的结果没有参考价值。\n- **`verify` 第 2 步两个出口 IP 相同** → 服务端按 UUID 分流没生效或住宅中转断了，客户端怎么改都没用。\n- **Google 打不开、别的站正常** → 第 4 步的浏览器 DoH 没关。\n- **每步都要输密码** → 先 `sudo -v` 预热。不要给脚本配免密 sudo，它能改路由表。\n- **Apple Silicon 上装成了 Intel 内核** → 终端在 Rosetta 下运行；`install` 会提示，用 `arch -arm64 zsh` 开原生 shell 重装，或 `--arch arm64`。\n- **以前手工放过 `~/bin/singbox`** → 自己删掉。新装的在 `/usr/local/bin`，PATH 里谁在前谁生效。\n- 卸载：`singbox uninstall`，见 [升级、回退与卸载](manual-update.md)。\n\n## 深入阅读\n\n- [为什么用官方 release 不用 Homebrew](best-practices.md#31-用官方-release别用-homebrew)\n- [系统层准备为什么不能跳](best-practices.md#4-macos-系统层准备不可跳过)\n- [架构判定为什么不用 uname -m](best-practices.md#98-架构判定)\n- [`singbox` 命令的自动安装与自更新（设计记录）](self-install-and-self-update.md)\n"},{"path":"docs/manual-update.md","title":"升级、回退与卸载","summary":"升级脚本与内核、退回上一版、GitHub 下不动时换镜像、卸载。","hash":"2357e885ed0eef24","kind":"manual","inferred":false,"status":null,"headings":[{"level":1,"text":"升级、回退与卸载","line":4},{"level":2,"text":"前提","line":8},{"level":2,"text":"步骤","line":13},{"level":2,"text":"出错了看哪","line":69},{"level":2,"text":"深入阅读","line":80}],"front":{"kind":"manual"},"covers":[],"mentions":[],"links":["docs/best-practices.md","docs/manual-check.md","docs/manual-install.md","docs/safe-update.md","docs/self-install-and-self-update.md"],"refs":[],"backlinks":["README.md","docs/manual-config.md","docs/manual-install.md"],"backrefs":[],"body":"# 升级、回退与卸载\n\n升级脚本与内核、退回上一版、GitHub 下不动时换镜像、卸载。\n\n## 前提\n\n- 已安装；`update` / `rollback` / `uninstall` 要 sudo\n- 能访问 GitHub，或至少有一个能用的镜像\n\n## 步骤\n\n1. 升级\n\n   ```bash\n   singbox update          # 跨 minor 时停下来问一次\n   singbox -y update       # 非交互；跨 minor 那道确认默认 n，会跳过而不是闷头升\n   ```\n\n   顺序：先升脚本自己（远端 release 严格更高才换，取不到只 warn）→ 预检 → 用临时前缀\n   和一份去掉 `tun`、换了端口的派生配置把新内核实跑一遍并实测建链 → 换掉\n   `/usr/local/bin/sing-box` 并重启 → 跑 `verify` 验收。任一阶段失败自动回滚；\n   `verify` 只在退 `1`（链路档）时回滚，退 `2` 打条 warn 放行。旧内核保留为 `sing-box.prev`。\n\n2. 退回上一版\n\n   ```bash\n   singbox rollback        # 内核与 singbox 命令一起退，然后重新验收\n   ```\n\n   只保留一份 `.prev`，只能退一步；要更老的版本用 `singbox install --version \u003cv>`。\n\n3. GitHub 下不动时看镜像\n\n   ```bash\n   singbox mirror test              # 探测直连与各镜像此刻是否可用\n   singbox mirror show              # 候选顺序与已记住的镜像\n   singbox mirror set https://xxx   # 固定一个首选镜像\n   singbox mirror reset\n   ```\n\n   `install` / `update` 会自动探测并切换（每个源最多等 6 秒，下载 20 秒内低于 2 KB/s 就换下一个），\n   成功的镜像会被记住，但直连始终排最前。内置列表全挂就用自己的：\n\n   ```bash\n   export SB_MIRRORS=\"https://your-mirror.example https://another.example\"\n   ```\n\n4. 实在都不通：手动下载内核\n\n   ```bash\n   sudo install -m 755 ./sing-box /usr/local/bin/sing-box     # 别的机器下好拷过来\n   sudo xattr -d com.apple.quarantine /usr/local/bin/sing-box\n   singbox install --config ./config.json                      # 检测到已安装会跳过下载\n   ```\n\n5. 卸载\n\n   ```bash\n   singbox uninstall\n   ```\n\n   移除服务、停用自启，逐项询问：删内核、删配置目录、DNS 按备份回滚、IPv6 恢复自动。\n   还会在 `~/bin`、家目录等处查找前台运行留下的 `ui/` 与 `cache.db` 并询问删除。\n   你自己的源配置文件（`config.json`）不会被动。\n\n## 出错了看哪\n\n- **「GitHub 与所有镜像均不可达」** → `singbox mirror test` 看是哪层的问题；代理能跑就先 `start`，直连往往就通了。\n- **升级后某个网站进不去** → `singbox rollback`。半小时后才发现也来得及，`.prev` 留到下一次 `update` 才被覆盖。\n- **升级后 `verify` 退 2** → 路由策略问题，回滚修不了。按 [检查与排查](manual-check.md) 处理。\n- **升级后规则集报错** → `.srs` 有格式版本，跑 `singbox rules`；必要时换与内核匹配的规则集源。\n- **旧版脚本没有自更新** → `v1.2.0` 之前装的脚本不带阶段 S，按 [首次安装](manual-install.md) 第 1 步取一次最新 release 手工重装，之后就闭环了。\n- **升级中冒出莫名其妙的语法错误** → 不该发生：脚本替换用的是 `mv` 而非 `cp`。若发生，重跑 `update`。\n- **`update` 后再跑 `install`** → 不会删掉 `.prev`，两者的回滚点是分开的。\n- **卸载后仍有残留路由** → 脚本一律 SIGTERM 等 8 秒，不 `kill -9`。若你手动强杀过，重启电脑。\n\n## 深入阅读\n\n- [升级为什么要先在沙箱里实跑、校验做到哪一步](best-practices.md#96-update-的沙箱与完整性校验)\n- [内核安全升级（设计记录）](safe-update.md)\n- [脚本自更新（设计记录）](self-install-and-self-update.md)\n- [安全与维护](best-practices.md#8-安全与维护)\n"},{"path":"docs/safe-update.md","title":"内核安全升级（update 重做 + rollback）","summary":"`cmd_update`（`singbox.sh:1409-1447`）从来没有被实跑验证过，而代码里有三处会在「新内核有大改动」 这个正好最需要它的场景下失效：","hash":"4b7c9087de63c26c","kind":"spec","inferred":false,"status":"shipped","headings":[{"level":1,"text":"内核安全升级（update 重做 + rollback）","line":7},{"level":2,"text":"问题","line":9},{"level":2,"text":"决定","line":31},{"level":2,"text":"不在范围内","line":85},{"level":2,"text":"受影响的文件与接口","line":97},{"level":2,"text":"待定问题","line":133},{"level":2,"text":"验证","line":144},{"level":2,"text":"实现计划","line":180},{"level":3,"text":"待定问题的落地结论","line":182},{"level":3,"text":"顺带修掉的两处（spec 没写，但不修就落不了地）","line":190},{"level":3,"text":"「五步全部算硬失败」的收窄解读（**已作废，见下**）","line":195},{"level":3,"text":"现行判据：`cmd_verify` 的两档失败","line":213},{"level":3,"text":"落地的结构","line":228},{"level":3,"text":"实现过程中发现的一个真 bug（不在 spec 里）","line":240},{"level":3,"text":"真机配置暴露出的两个缺陷（spec 与首轮实现都漏了）","line":246},{"level":3,"text":"验证","line":260},{"level":3,"text":"真机手工验证：已完成（2026-09-04，`1.13.18` → `1.14.0`，跨 minor）","line":270},{"level":3,"text":"真机输出暴露的第三个缺陷","line":285}],"front":{"kind":"spec","status":"shipped","covers":["tests/update.test.sh"]},"covers":["tests/update.test.sh"],"mentions":[".claude/sdlc.json","config/config.example.json","singbox.sh","tests/","tests/fixtures/bin/","tests/fixtures/fake-sing-box","tests/run.sh","tests/selfcheck.test.sh","tests/update.test.sh"],"links":["CONTRIBUTING.md","README.md","docs/config-audit-and-modernize.md","docs/self-install-and-self-update.md","docs/verify-hardening.md"],"refs":[],"backlinks":["README.md","docs/config-audit-and-modernize.md","docs/manual-update.md","docs/self-install-and-self-update.md","docs/verify-hardening.md"],"backrefs":[],"body":"# 内核安全升级（update 重做 + rollback）\n\n## 问题\n\n`cmd_update`（`singbox.sh:1409-1447`）从来没有被实跑验证过，而代码里有三处会在「新内核有大改动」\n这个正好最需要它的场景下失效：\n\n**① 回滚点在重启之前就被删掉了。**\n\n```bash\nsudo rm -f \"$BIN.prev\"      # 当时的 cmd_update 内\ncmd_restart                 # 同上 —— 返回值也没有被检查\n```\n\n`sing-box check -c` 通过、但新内核起不来（或起来了但代理坏了）时，旧二进制已经不在。\n这不是理论风险：内核迭代快，`1.11` 的 DNS 格式不兼容、`domain_strategy` 在 `1.14` 被移除、\n`independent_cache` 在 `1.14` 废弃（`README.md:54`、`docs/script-usage.md:392`）。 \u003c!-- doc:gone -->\n\n**② 判定只有静态一层。** `check -c` 校验的是配置文件的语法与字段合法性。字段还在、语义变了\n（升级风险里的「配置逻辑改变」）它照样过。仓库里已经有一套五步功能验证 `cmd_verify`\n（`singbox.sh:996`），但 `update` 一次都没调用它。\n\n**③ 下载的内核没有任何完整性校验。** 解压结构检查之外，拿到的字节是什么没人核对过。\n\n## 决定\n\n把 `update` 从「下载 → 换 → 静态校验 → 重启」改造成**四个阶段，每个阶段都能回到一个已知可用的\n状态**；并新增 `rollback` 子命令，把回滚从「升级过程中的一个分支」变成「任何时候都能按的按钮」。\n\n**阶段 S · 脚本自更新**（`v1.2.0` 新增，排在阶段 0 之前）\n\n查本仓库的 latest release，与本地 `VERSION` 比对；远端**严格更高**才下载 asset\n`singbox.sh`（走与内核完全相同的 `download()` / 镜像 / sha256 校验路径）、`bash -n`\n过一遍、用 `mv` 原子替换 `$LAUNCHER`，再 `exec` 新脚本继续跑阶段 0–3。\n\n顺序是「先脚本后内核」：这样内核升级用的永远是最新的升级逻辑 —— 过去出问题的恰恰是\n升级逻辑本身而不是内核。取不到新版、下载失败、语法不过，一律 warn 一句就照升内核；\n相等或更低一律不动，防止 release 被回退时把用户降级。\n\n`SB_SELF_UPDATED=1` 让 exec 出来的新进程整段跳过阶段 S（防死循环），\n`SB_LOCK_INHERIT=1` 让它沿用同一把锁（exec 保留 PID，不然会把自己判成另一个实例）。\n细节见 [self-install-and-self-update.md](self-install-and-self-update.md)。\n\n**阶段 0 · 预检（不下载）**\n取当前版本与目标版本。**minor 号发生变化时额外确认一次**（`ask` 默认 `n`，所以 `-y` 非交互模式\n下会跳过升级而不是闷头升），提示这类升级历史上移除过字段。\n\n**阶段 1 · 沙箱（现网服务继续跑，完全不受影响）**\n装到临时前缀（复用已有的 `--prefix`），然后：\n\n1. 新内核 `version` 能跑（架构、OS 版本、quarantine 属性都在这一步暴露）\n2. 新内核 `check -c` **当前真实配置** —— 静态兼容性\n3. **派生一份沙箱配置**并用新内核实跑，`curl -x socks5h://` 实测能否建链\n\n派生是必须的：真配置里有 `tun` inbound、`mixed` 监听 `127.0.0.1:10808`、\n`experimental.cache_file.path` 指向 `/usr/local/etc/sing-box/cache.db`。现网服务在跑时，\n第二个实例会在这三处全部冲突。派生规则：\n\n- 删掉 `type == \"tun\"` 的 inbound\n- `mixed` 的 `listen_port` 换成一个探测到的闲置端口\n- `cache_file.path` 指到临时目录\n\n⚠️ **派生用 `python3`，不要引入 `jq`。** 脚本目前对 `jq` 零依赖，但 `python3` 已经是硬依赖\n（`singbox.sh:160` 的必需命令清单，以及 `:186`、`:200` 的 `json_valid`、`:652` 已有的用法）。\n沿用现成写法，不新增依赖。\n\n**阶段 2 · 升级（此时才动现网）**\n`$BIN` → `$BIN.prev`，装新内核，`check -c`，`cmd_restart` **并检查返回值**，然后确认三件确定性\n的事：进程存活、TUN 路由存在、监听端口在听。任一不成立 → 回滚。\n\n**阶段 3 · 验收**\n跑 `cmd_verify` 五步。**五步全部算硬失败**，但失败时隔几秒重试一轮，两轮都不过才回滚——\n第 2/3/4/5 步依赖 `ipinfo.io` / `dig` / `cloudflare-quic.com` / `cip.cc`，一次抖动不该把一次\n成功的升级回滚掉。\n\n**成功之后 `$BIN.prev` 保留**，留到下一次 `update` 才被覆盖（`install` 不碰它 —— 它自己的临时回滚点在临时目录里）。这覆盖了「当时一切正常，半小时后\n才发现某个网站进不去」——那时 `singbox rollback` 一条命令换回去、重启、跑一遍阶段 3 的验收。\n\n## 不在范围内\n\n1. **基于新内核的配置优化方案。** 「哪些字段该改成什么写法」需要读 release notes 与上游文档、\n   需要判断力，验收标准与本功能完全不同。**另开一份 spec**，本轮只做安全升级。\n2. **自动改写配置。** 废弃字段告警照打、照记，但一个字都不自动改。\n3. **无人值守的定时自动升级。** 本功能仍然是人敲一条命令触发的。\n4. **降级到任意历史版本。** 只保留一份 `$BIN.prev`，`rollback` 只能退一步。\n5. **沙箱阶段验证 TUN 与系统路由相关的回归。** 派生配置删掉了 `tun`，这类问题只能在阶段 2/3\n   被发现，靠回滚兜底。这是「不停现网」换来的，是自觉的取舍。\n6. **引入任何新依赖**（`jq`、`bats`、brew 包都不行）。\n7. **macOS 以外的平台。**\n\n## 受影响的文件与接口\n\n**`singbox.sh`**\n\n| 位置 | 改动 |\n|---|---|\n| `cmd_update`（`1409-1447`） | 重写为四阶段 |\n| 新增 `cmd_rollback` | `$BIN.prev` 换回 → `cmd_restart` → 阶段 3 验收 → 没有 `.prev` 时报错退出 |\n| 新增内部 helper | `_sb_stage_prefix` / `_sb_derive_config` / `_sb_free_port` / `_sb_probe_socks` / `_sb_health`（存活+路由+端口） |\n| 调度器（`1764` 附近） | `rollback) cmd_rollback ;;` |\n| 帮助文本（`19` 与 `1697`） | 两处都要加 `rollback`，并更新 `update` 那一行的说明 |\n\n复用而**不要重写**的既有 helper（都已确认存在）：`require_installed` `need_root` `acquire_lock`\n`latest_version` `detect_arch` `mktmpd` `mktmp` `download` `running` `ask` `die` `step` `ok` `bad`\n`warn` `info` `dim` `json_valid` `cmd_restart` `cmd_verify` `cmd_stop`。\n\n**测试（新增）**\n\n- `tests/update.test.sh` —— 状态机断言\n- `tests/fixtures/bin/` —— PATH 前置的桩：`sing-box`（行为由 `SB_FAKE_*` 控制）、`sudo`（直接\n  `exec \"$@\"`，另认 `-n true` 与 `-v`）、`curl`、`launchctl`\n- `tests/run.sh` —— 遍历并运行 `tests/*.test.sh`\n\n**`.claude/sdlc.json`**：`check.command` 改为 `./singbox-selfcheck.sh && ./tests/run.sh`。\n现在是硬编码两条，再加第三条会一直手工维护下去。\n\n**文档**：`docs/script-usage.md` 的 `update` 一节（`388-394`）、`README.md:142` 的命令表、 \u003c!-- doc:gone -->\n`README.md:164` 与 `:200`（顺带补上 `tests/`）。`CONTRIBUTING.md` 已经写了「改了自检规则要补\nfixture」，这条对 `tests/` 同样适用，不必再改。\n\n**契约**：单栈（纯 shell），不涉及跨栈契约，`contracts.files` 不需要动。\n\n**文档源**：`.claude/sdlc.json` 已登记 `sing-box → /sagernet/sing-box` @ `1.13.14`\n（本机内核 `1.13.18`）。实现时如需查 `check` 的退出码语义或 `cache_file` 字段行为，走\n`sdlc-docs get sing-box \"\u003c问题>\"`，不要凭印象。\n\n## 待定问题\n\n| 问题 | 现在按什么做 | 谁拍板（责任人；均已在「实现计划」落地） |\n|---|---|---|\n| GitHub release 是否提供 checksum 文件？**未核实** | 有就校验 sha256；没有则降级为「解压后 `sing-box version` 能跑且架构匹配」，并在输出里说明没有做完整性校验 | build 阶段实测 release 资产列表后自行确定 |\n| 阶段 3 的重试轮数与间隔 | 暂定重试 1 次、间隔 5s | lzyMeta（可事后调） |\n| 沙箱闲置端口的选取 | 暂定从 `10900` 起向上探测第一个没被占用的 | build 阶段自行确定 |\n| 升级成功后是否自动跑 `cmd_rules` | **维持现状**：只打印提醒，不自动跑。`.srs` 重新下载会走网络，不该塞进升级流程 | lzyMeta |\n| 升级成功后是否自动跑**配置审查** | **是**（2026-09-10 新增，与上一行是两件事）。阶段 3 之后跑一次 `config audit` 的发现层：只读、毫秒级、不要 root、不碰网络，所以它没有上一行那条「会走网络」的理由。**只报不改，且不参与退出码与回滚判定**——配置「将来会坏」不等于这次升级失败了，判错就是白白回滚一次好端端的升级。内核版本一变废弃面和 schema 就跟着变，这是最该重查配置的时刻，也正是「21 条 `download_detour` 悄悄变成历史」的成因。见 `docs/config-audit-and-modernize.md` | lzyMeta |\n| `$BIN.prev` 的磁盘占用（约 30-50MB） | 接受，不做清理策略 | lzyMeta |\n\n## 验证\n\n- AC1 ★ 阶段 2 换上新内核后 `check -c` 失败或服务起不来 → 回滚，`$BIN` 是旧版本、`.prev` 被清理（「起不来」这一条是本次的核心修复）。反例：阶段 2 只查 `check -c` 不做 `_sb_health` → 假内核装到现网位后起不来时 `$BIN` 停在新版本，断言红。\n- AC2 一切正常 → 退 0、`$BIN` 是新版本、`$BIN.prev` 存在且是旧版本；阶段 1 沙箱 `check -c` 或建链失败 → 退非 0、`$BIN` 一个字节都没被动过、没有 `.prev`。反例：阶段 1 失败后仍走替换 → `.prev` 出现。\n- AC3 阶段 3 verify 两轮都失败 → 回滚；第一轮失败、第二轮通过 → 不回滚、退 0。反例：重试轮数改成 0 → 后者也回滚。\n- AC4 跨 minor 且非交互 → 不升级、退 0；`rollback` 有 `.prev` 时换回旧版本、重启、跑验收，无 `.prev` 时报错退非 0、点名 `.prev` 且不出现「未知命令」、不动任何文件。反例：`cmd_rollback` 未注册进调度器 → 「未知命令」同样非 0，只有收紧后的断言才会红。\n\n**可机械执行的部分**（进 `check.command`，离线、不需要 sudo、不碰真实系统）：\n\n```bash\n./tests/update.test.sh\n```\n\n做法：把 `tests/fixtures/bin/` 前置到 `PATH`，`--prefix` 指到 `$TMPDIR` 下的临时目录，\n用环境变量驱动假 `sing-box` 的行为，逐条断言状态机：\n\n| 分支 | 断言 |\n|---|---|\n| 一切正常 | 退出 0；`$BIN` 是新版本；`$BIN.prev` **存在**且是旧版本 |\n| 阶段 1 沙箱 `check -c` 失败 | 退出非 0；**`$BIN` 一个字节都没被动过**；没有产生 `.prev` |\n| 阶段 1 沙箱建链失败 | 同上——现网完全没被触碰 |\n| 阶段 2 `check -c` 失败 | 回滚；`$BIN` 是旧版本；`.prev` 被清理 |\n| 阶段 2 起不来 | 回滚（**这一条现在的实现拓不到，是本次的核心修复**） |\n| 阶段 3 verify 两轮都失败 | 回滚；`$BIN` 是旧版本 |\n| 阶段 3 verify 第一轮失败、第二轮通过 | **不回滚**，退出 0（防误判那条的正控） |\n| 跨 minor 且非交互 | 不升级，退出 0（`ask` 默认 `n`） |\n| `rollback` 有 `.prev` | 换回旧版本、重启、跑验收 |\n| `rollback` 无 `.prev` | 报错退出非 0，不动任何东西 |\n\n**不可机械化的部分**（真机手工，升级真实内核时走一遍）：\n\n1. `singbox update` 全程，观察四个阶段的输出顺序与耗时\n2. 升级后 `singbox verify` 五步全过\n3. `singbox rollback`，确认换回旧版本且代理恢复可用\n4. 断网状态下跑 `singbox update`，确认在阶段 0 就干净地失败，不留下半个状态\n\n## 实现计划\n\n### 待定问题的落地结论\n\n| 问题 | 结论 | 依据 |\n|---|---|---|\n| release 有没有 checksum | **没有**。降级为「解压后 `version` 能跑 + `Environment:` 行的 `darwin/\u003carch>` 匹配」，并在输出里明说未做 sha256 | 实测 v1.14.0 的资产列表，无 `checksums.txt` / `.sha256` / `SHA256SUMS` |\n| 沙箱闲置端口 | `python3` 从 `10900` 起 bind 探测，最多试 200 个 | `python3` 已是硬依赖，比 `lsof` 准且不要 sudo |\n| 阶段 3 重试 | `VERIFY_RETRY_WAIT=5`，重试 1 轮 | spec 暂定值，照用 |\n\n### 顺带修掉的两处（spec 没写，但不修就落不了地）\n\n1. **`ask \"升级到 X？\"` 的默认值 `n` → `y`。** 原样下 `singbox -y update` 取默认 `n`，**永远不升级**（帮助文本里还把它当示例）。更要命的是外层闸门恒为 `n` 时，阶段 0 那道跨 minor 确认就是死代码。改成主确认默认 `y`、跨 minor 确认默认 `n`，两道闸门才各司其职。\n2. **`cmd_verify` 的退出码。** 原样下只有第 1 步会 `return 1`，第 2/3/4/5 步打了 `✗` 照样返回 0——阶段 3 拿它当回滚判据，会把坏掉的升级判成成功。加 `VERIFY_BAD` 计数与 `vbad()`，末尾按计数返回。判据是 **`bad`（`✗`）算硬失败、`warn`（`!`）算软告警**，正好对上 spec 说的「一次抖动不该回滚」。\n\n### 「五步全部算硬失败」的收窄解读（**已作废，见下**）\n\n本次提交落地的判据是 **`bad`（`✗`）算硬失败、`warn`（`!`）算软告警**，比「决定」一节\n写的「五步全部算硬失败」窄。当时列出的软分支有 5 处：第 2 步的 `ipinfo.io` 取不到、\n第 3 步的未装 `dig`、第 4 步的 curl 不支持 http3 与 HTTP/3 仍可用、第 5 步的整步无断言\n（`cip.cc` 取不到只 `info`、拿不到网关静默跳过）。\n\n理由是：**这些分支多数不是「失败」而是「测不了」**，把测不了也算失败，每次 `singbox update`\n都会在阶段 3 回滚。2026-09-04 由 lzyMeta 拍板维持现状。\n\n⚠️ **这个结论已被 `docs/verify-hardening.md` 推翻并兑现，上面那张软分支表全部作废。**\n推翻它的是三条：`dig` 本就是 macOS 自带、同目录还有 `host` / `dscacheutil`，第 3 步根本\n不缺解析手段；第 4 步的 QUIC 不必依赖 curl 的编译选项，`python3` 发一个 QUIC 版本协商包\n就能测；而「测不了就会回滚」这个后果可以拆开——**分档之后，收紧判定与不误回滚不再冲突**。\n下面 190-197 行原先标注「另开一条」的第 5 步判据（国内出口 IP 应不等于 SOCKS 出口，\n真机数据：SOCKS 出口 `\u003cvps-socks-ip>` vs `cip.cc` 报的 `\u003chome-cn-ip>` 上海电信），\n也已由那份 spec 兑现。\n\n### 现行判据：`cmd_verify` 的两档失败\n\n判据只有一条：**回滚到旧内核能不能把它换回来**。\n\n| 档 | 计数器 / helper | 哪些分支 | 退出码 | 阶段 3 的动作 |\n|---|---|---|---|---|\n| 链路档 | `VERIFY_BAD` / `vbad()` | 第 1 步 SOCKS 不通（立即 `return 1`）；第 2 步兜底取不到 IP、两个出口相同；第 4 步存在全局 IPv6 | `1` | 重试一轮，仍失败则回滚 |\n| 策略档 | `VERIFY_POLICY_BAD` / `vpbad()` | 第 2 步 `ipinfo.io` 连取 3 次都没结果；第 3 步疑似污染、四级解析全废；第 4 步 QUIC 未被阻断；第 5 步国内出口等于 SOCKS 出口、三家参照站全挂、拿不到默认网关、网关连试 3 次不通 | `2` | **不回滚**，`warn` 后放行 |\n\n两档都失败时返回 `1`，链路优先——链路都断了，策略上的结论没有参考价值。\n`_sb_verify_rounds` 因此改为读退出码而非布尔：`0` 与 `2` 都返回 0，只有 `1` 才进重试与回滚。\n\n**五步里不再有任何静默跳过。** 原先「测不了」与「测过了」在终端上长得一样（都不打 `✗`、\n退出码都是 0），现在测不了本身就是一条打 `✗` 的结论，只是它落在策略档、不触发回滚。\n\n### 落地的结构\n\n`singbox.sh` 新增 helper：`_sb_free_port` / `_sb_port_listening` / `_sb_derive_config` / `_sb_stage_prefix` / `_sb_probe_socks` / `_sb_health` / `_sb_warn_deprecated` / `_sb_verify_rounds` / `_sb_rollback_to_prev`；`cmd_update` 重写为四阶段；新增 `cmd_rollback`；调度器与两处帮助文本跟上。\n\n测试脚手架：`tests/run.sh`、`tests/update.test.sh`（10 条状态机断言）、`tests/fixtures/bin/`（`sudo` `curl` `launchctl` `pgrep` `netstat` `ifconfig` `dig` `ping` `sleep` 九个 PATH 桩）、`tests/fixtures/fake-sing-box`（假内核模板，版本号 `sed` 进去）。\n\n三处值得记下的桩设计：\n\n- **假内核按「装在哪」决定行为**（`$0` 是否等于 `$SB_FAKE_LIVE_BIN`）。阶段 1 与阶段 2 跑的是同一个二进制、同一份配置，只有位置不同——要让这两处能分别失败，判据只能是位置。\n- **`sleep` 桩不能无条件立即返回。** `need_root` 会起一个 `while …; do sudo -n true; sleep 50; done &` 的保活循环，压到 0 就是个吃满 CPU 的忙循环。按时长分流：≥30s 走真 `sleep`，短的压到 0.05s。\n- **`launchctl` 桩真的占住现网端口**，`_sb_health` 的「端口在听」才有东西可测；服务起不起得来由**此刻装在现网位的那个二进制的版本**决定，这正是「阶段 2 换了新内核之后起不来」要走的路径。\n\n### 实现过程中发现的一个真 bug（不在 spec 里）\n\n`_sb_health` 第一版写的是 `netstat -rn -f inet | grep -q utun`。`grep -q` 一命中就退出，`netstat` 吃 SIGPIPE 死掉，`set -o pipefail` 把那个 141 当成整条管道的退出码——**「路由在」被判成「路由没了」，于是回滚一次本来成功的升级**。撞不撞得上取决于调度时机，是偶发的；真机上的路由表比测试桩长得多，只会更容易撞上。改成先落变量再 `case` 匹配（跟 `cmd_status:940` 一个写法）。\n\n这条是测试抓出来的：同一次运行里，阶段 2 报「没有 utun」、几秒后的回滚报「TUN 路由存在」。\n\n### 真机配置暴露出的两个缺陷（spec 与首轮实现都漏了）\n\n拿 `/usr/local/etc/sing-box/config.json`（真实在跑的那份）对派生逻辑做对照时发现的：\n\n**① `experimental.clash_api` 是第四处会撞车的监听。** spec 只列了 `tun` / `mixed` / `cache_file` 三处，真实配置里还有 `clash_api.external_controller = \"127.0.0.1:9090\"`——现网实例占着它，沙箱实例起来就撞死在这个端口上，且与新内核好不好毫无关系。`external_ui: \"monitor\"` 还会在启动时去下载一份 UI。派生逻辑改为：**只保留一个被改到闲置端口的 `mixed`/`socks` inbound，其余 inbound 全丢**；`experimental` 里整块删掉 `clash_api`；`log.output` 若指向文件也改到临时目录。\n\n`config/config.example.json` 这份模板当时**没有** `clash_api`，所以对着模板核对是看不出来的——\n事后已把它补进模板（`external_ui` 用 `\"ui\"`，与 `cmd_uninstall` 清理残留时找的目录名一致），\n这样下次拿模板核派生逻辑就能覆盖到这一处。\n\n**② `tests/` 的现网端口写死 10808，撞上了本机正在跑的真 sing-box。** 桩的监听 bind 失败即死，而 `_sb_health` 的「端口在听」照样成立——**测试是被真实服务喂绿的**，不是被桩。这与本仓库 `tests/selfcheck.test.sh` 头部记的那次回归是同一类：一条不因违规而红的检查比没有检查更糟。修法两条：端口在 `setup` 里从 21800 / 21900 起动态探测；**桩起不来当场 `exit 1`**，不静默放过。\n\n顺带把阶段 1 等待沙箱监听的窗口抽成 `SANDBOX_WAIT=40`（原为写死 15 次 ×1s）。真实配置有 21 个 `type: remote` 的 rule_set 且沙箱缓存是空的，冷启动要现下一遍——这正是评审时列为 UNVERIFIED SUSPICION 的那条。\n\n### 验证\n\n`./singbox-selfcheck.sh && ./tests/run.sh`，已进 `.claude/sdlc.json` 的 `check.command`。\n\n断言 11（沙箱不与现网 `clash_api` 撞车）同样是先红后绿：修桩之后 **通过 7 / 失败 4**，红的内容点名 `沙箱实例没能起来（端口 10900 始终没有监听）`；删掉 `clash_api` 后转绿。\n\n先写断言跑出红（**通过 2 / 失败 8**，红的内容点名 `升级到 1.13.19？ → 取默认（n）`，即上面第 1 条），再写实现跑出绿（**通过 18 / 失败 0**，退出码 0）。因为修掉的是时序相关的偶发 bug，绿连跑了 3 次确认稳定。\n\n⚠️ 红的那一轮里 `rollback 无 .prev` 是**假绿**——「未知命令」同样非 0 退出且不动文件。已收紧为「必须点名 `.prev` 且不得出现『未知命令』」。\n\n### 真机手工验证：已完成（2026-09-04，`1.13.18` → `1.14.0`，跨 minor）\n\nspec「验证」一节的 4 条**全部通过**：\n\n| 项 | 结果 |\n|---|---|\n| 1 · `update` 全程四阶段 | 两道确认按设计分别是 `[Y/n]` 与 `[y/N]`；阶段 1 沙箱 `check` 通过、建链拿到出口 IP；阶段 2 健康检查 4/4；阶段 3 第 1 轮即通过 |\n| 2 · 升级后 `verify` | 五步全过；`rules` 21/21 均 200 |\n| 3 · `rollback` | 换回 `1.13.18`、重启、验收通过；再 `update` 回到 `1.14.0` |\n| 4 · 断网跑 `update` | 阶段 0 干净失败（「GitHub 与所有镜像均不可达」），`/usr/local/bin/` 下无 `.prev`、无残留 |\n\n评审时留的两条 UNVERIFIED SUSPICION **均未出现**：`_sb_health` 紧跟 `cmd_restart` 的时间窗，在 4 次真实重启（2 次 update + 1 次 rollback + 1 次 restart）中全部一次通过；沙箱冷启动也两次都在窗口内起来。⚠️ 这是「未观察到」，不是「不可能」——两者都是竞态。\n\n⚠️ **只有一处没验到**：spec 说「观察四个阶段的输出顺序与耗时」，输出里没有时间戳，**耗时那半没有数据**。顺序是对的。\n\n### 真机输出暴露的第三个缺陷\n\n`_sb_health` 原本拿整张路由表宽匹配 `utun`。真机上 `utun9527` 有 9 条路由，其中只有 `128.0/1` 那条是「接管了流量」的证据，而 `172.18.0.1 … UH utun9527` 只说明**接口建起来了**。接口在、`auto_route` 却没装上时，流量从 `en0` 裸奔，宽匹配会判成健康并接受这次升级——正是本功能存在的理由那种故障。\n\n判据改为与 `cmd_status:940` 一致：先 `grep -E 'default|^0/1|^128\\.0/1'` 过滤，再看 utun。新增断言 12 覆盖（`SB_FAKE_TUN_HOST_ONLY=1`）；顺带补上了此前一条断言都没有的 TUN 分支。\n\n同时修正了阶段 1 那行提示——派生逻辑扩了之后它还在说「去掉 tun、mixed 改端口、cache_file 挪走」，少报了自己删掉 `clash_api` 这件事。\n"},{"path":"docs/self-install-and-self-update.md","title":"singbox 命令的自动安装与脚本自更新","summary":"现在有两件事是脚本自己做得了、却推给了用户手工做的。","hash":"762551c38639952b","kind":"spec","inferred":false,"status":"shipped","headings":[{"level":1,"text":"singbox 命令的自动安装与脚本自更新","line":8},{"level":2,"text":"问题","line":10},{"level":2,"text":"决定","line":35},{"level":3,"text":"承重的实现约束","line":64},{"level":2,"text":"不在范围内","line":105},{"level":2,"text":"受影响的文件与接口","line":123},{"level":2,"text":"待定问题","line":171},{"level":2,"text":"验证","line":203},{"level":2,"text":"实现计划","line":250},{"level":3,"text":"与 spec 的三处偏差","line":270},{"level":3,"text":"两处「不是恒绿」的验证","line":294},{"level":3,"text":"自检第 13 项当场抓到的一个真缺陷","line":307},{"level":3,"text":"`/sdlc-kit:review` 抓到的一个真缺陷（已修）","line":312},{"level":3,"text":"待定问题的状态","line":330}],"front":{"kind":"spec","status":"shipped","covers":["tests/install.test.sh","tests/selfupdate.test.sh"]},"covers":["tests/install.test.sh","tests/selfupdate.test.sh"],"mentions":[".claude/sdlc.json","singbox-selfcheck.sh","singbox.sh","tests/","tests/fixtures/bad-cp-launcher.sh","tests/fixtures/bin/","tests/fixtures/bin/curl","tests/fixtures/bin/networksetup","tests/install.test.sh","tests/selfcheck.test.sh","tests/selfupdate.test.sh","tests/update.test.sh"],"links":["CLAUDE.md","README.md","docs/safe-update.md"],"refs":[],"backlinks":["README.md","docs/manual-install.md","docs/manual-update.md","docs/safe-update.md"],"backrefs":[],"body":"# singbox 命令的自动安装与脚本自更新\n\n## 问题\n\n现在有两件事是脚本自己做得了、却推给了用户手工做的。\n\n**一、把命令装进 PATH 是一段 README 里的手抄命令。** `README.md` 2.5 节写着：\n\n```bash\nmkdir -p ~/bin && cp singbox.sh ~/bin/singbox && chmod +x ~/bin/singbox\necho 'export PATH=\"$HOME/bin:$PATH\"' >> ~/.zshrc && source ~/.zshrc\n```\n\n`install` 已经在 `need_root` 之后往 `$PREFIX/bin` 里放内核了（`singbox.sh:809` 起的 1/7 步），\n就差把自己一并放进去——同一个目录、同一个 sudo 票据、同一个 `--prefix`。让用户去抄两行 shell、\n去改 `~/.zshrc`，还引入了一个 README 里根本没说的分叉：`cp` 出来的那一份从此与仓库副本各活各的，\n仓库里改了脚本，`singbox` 命令还是老的，而没有任何东西会告诉你这件事。\n\n**二、`update` 只升内核，脚本本体永远停在装机那天的版本。** 而这个仓库最近五个 commit\n修的全是脚本自己的严重缺陷——架构判断在 Rosetta 下装错内核（f19b4eb）、日志涨到失控没人管\n（ea52709）、一次全命令审计修了 5 处（327fbd1）。这些修复对已经装好的用户等于不存在：\n他手上那份 `singbox` 不会自己变新，而他唯一会跑的升级命令 `update` 一个字节都不碰它。\n换句话说，**修得越多，装机用户与仓库的差距越大**，而这个差距在终端上完全不可见。\n\n不做的话，这两件事会以同一种方式坏：用户以为自己在用最新的工具，实际在用一份来历不明、\n永不更新、且与仓库任何一次修复都无关的副本。\n\n## 决定\n\n`install` 在装完内核之后，把当前正在执行的这份脚本安装到 `$PREFIX/bin/singbox`（默认\n`/usr/local/bin/singbox`，跟随 `--prefix`），权限 0755，已存在则先把旧的存成\n`$PREFIX/bin/singbox.prev` 再覆盖——与内核 `$BIN` / `$BIN.prev` 的退路语义完全对称。\n选这个位置而不是 `~/bin`，是因为它已经在所有 shell 的默认 PATH 里：**不用碰 `~/.zshrc`，\n自动化才算真的做完了**；而 `install` 本来就已经 `need_root`，不多要一次权限。\n\n`update` 在现有三阶段之前插入**阶段 S（脚本）**：查自家仓库\n`lzyMeta/macos-singbox-client-helper` 的 latest release，比对 `singbox.sh` 里的 `VERSION`，\n远端更新则下载 asset `singbox.sh`（走与内核完全相同的 `download()` / 镜像 / sha256 校验路径）、\n`bash -n` 过一遍、原子替换 `$LAUNCHER`，然后 `exec` 新脚本继续跑阶段 0–3。\n**顺序是「先脚本后内核」**：这样内核升级用的永远是最新的升级逻辑——过去五个 commit 里，\n出问题的恰恰是升级逻辑本身而不是内核。\n\n取不到脚本新版（无 release、GitHub 与所有镜像均不可达）时 `warn` 一句然后照升内核：\n脚本更新不该有权阻断用户真正要的那件事，何况内核升级自带沙箱与回滚。\n\n`rollback` 一并退启动器（`$LAUNCHER.prev` → `$LAUNCHER`），`uninstall` 在整个流程的最后\n一条语句删掉 `$LAUNCHER` 与 `$LAUNCHER.prev`——装的时候是脚本自动放进去的，卸载时就该自动清掉。\n\n发布侧补一个 `.github/workflows/release.yml`：校验 tag 与脚本里的 `VERSION` 一致，然后建 release 并把\n`singbox.sh` 传成 asset。**tag = `v$VERSION`、asset 名 = `singbox.sh`** 是脚本自更新与发布流程之间\n唯一的契约，两边都要照着它写。\n触发方式在 2026-09-11 改过：原来是 `push: tags: ['v*']`（推 tag 即建 release），现在是 `workflow_dispatch`\n（由 `/sdlc-kit:release` 经 `sdlc-release publish` 显式触发，再核实 `releases/latest`）。改的原因：\n`push: tags` 把 tag 与 release 焊死成 1:1，任何推上去的 `v*` tag 都会挪一次 `latest`；而且本地推完 tag\n什么也证明不了——CI 红了只在 Actions 页有痕迹，`update` 那边什么都拿不到。契约三条不变。\n\n### 承重的实现约束\n\n这几条不是风格问题，写错了会以「静默失效」或「把用户的命令弄坏」的形式暴露：\n\n1. **替换 `$LAUNCHER` 必须用 `mv`（rename）而不是 `cp` / `install` 直接覆盖。**\n   bash 是**边执行边按偏移量读脚本文件**的。`cp` 覆盖的是同一个 inode，正在跑的这个进程\n   下一次读取会读到新文件的字节流、落在错误的偏移上——症状是执行到一半冒出莫名其妙的语法错误，\n   且只在「脚本更新自己」这一条路径上出现。`mv` 换的是目录项，旧 inode 被 unlink 但仍被打开着，\n   当前进程读的还是那一份完整的旧内容。同理，`uninstall` 里的 `sudo rm -f \"$LAUNCHER\"`\n   是安全的（unlink 不影响已打开的 fd）。\n   → 为此给 `singbox-selfcheck.sh` 加**第 13 项**：禁止对 `$LAUNCHER` 用 `cp` / `install`\n   直接覆盖。fixtures 里同时放会被抓到与不该被抓到的样本（`mv` 到 `$LAUNCHER` 不该报）。\n\n2. **re-exec 的开关走环境变量 `SB_SELF_UPDATED=1`，不走命令行参数。**\n   顶层 dispatch（`singbox.sh:2742` 附近）对未知参数一律 `die`。用 `--skip-self` 这种 flag\n   意味着**旧脚本 exec 新脚本时，新脚本必须认识旧脚本传的每一个参数**——哪天参数改名，\n   升级路径当场断在「未知参数」上，而这条路径恰恰是用来修 bug 的。未知环境变量不会让谁 die。\n\n3. **`exec` 保留 PID，锁会自己把自己锁死。** `acquire_lock`（`singbox.sh:87` 起）在\n   `LOCKDIR` 已存在时读 `LOCKDIR/pid` 并 `kill -0` 判活；exec 之后 PID 不变，于是新进程\n   判定「另一个实例正在运行（PID 就是我自己）」，等 3 轮然后 `die`——而那时脚本已经换过了。\n   → 把 `LOCK_HELD=0`（`singbox.sh:89` 附近）改成 `LOCK_HELD=\"${SB_LOCK_INHERIT:-0}\"`，\n   exec 时带上 `SB_LOCK_INHERIT=1`。锁文件里存的 PID 在 exec 后依然是对的，不必删了重建，\n   也就没有竞态窗口。\n\n4. **`exec` 不触发 EXIT trap，`TMPFILES` 里的临时目录会泄漏。** 阶段 S 下载用的 `mktmpd`\n   目录必须在 exec 之前显式清掉。`SUDO_KEEPALIVE_PID` 同理会丢：那个后台循环的条件是\n   `kill -0 $$`，PID 没变所以它继续活着、票据继续续期（这是好事），但新进程不知道它存在，\n   会再起一个。多一个循环无害且会随进程退出自终，但要在代码里写明白，别让下一个人以为是 bug。\n\n5. **不能用 `sort -V` 比较版本**——`singbox-selfcheck.sh` 第 4 项（GNU 专有命令）直接禁掉它。\n   手写 `ver_gt a b`：按 `.` 切三段做数值比较。**只有远端严格大于本地才升**，\n   相等或更小一律不动（防止 release 被回退时把用户的脚本降级）。\n\n6. **`install` 时若跑的是仓库副本（`./singbox.sh`），阶段 S 之外的语义要说清楚。**\n   `update` 的阶段 S 更新的对象永远是 `$LAUNCHER`。如果当前进程不是从 `$LAUNCHER` 启动的\n   （比较 `cd \"$(dirname \"$0\")\" && pwd` 得到的实路径，`readlink -f` 在 macOS 上不存在、\n   也被自检禁了），就只更新 `$LAUNCHER`、`warn` 说明「你跑的是仓库副本，已更新的是\n   `/usr/local/bin/singbox`」，**并且不 re-exec**——继续用另一份文件跑下去只会让人搞不清\n   到底是谁在执行。`$LAUNCHER` 根本不存在时（老用户、从未装过），阶段 S 直接把最新版装进去。\n\n## 不在范围内\n\n- **不改 `~/.zshrc` 或任何 shell rc 文件。** 选 `$PREFIX/bin` 的全部理由就是不必碰它。\n  用户若自定了 `--prefix` 到一个不在 PATH 的目录，脚本只提示一句，不代他改环境。\n- **不做 `~/bin` 兼容与迁移。** 已经手工 `cp` 到 `~/bin/singbox` 的旧用户，新 `install`\n  不会去找它、不会删它、也不会警告它——那需要在未知位置扫描一个同名文件，代价与收益不成比例。\n  README 的 2.5 节改写时直接说明「旧的 `~/bin/singbox` 可以自行删掉」。\n- **CI 上不跑 `./singbox-selfcheck.sh && ./tests/run.sh`。** release workflow 只做\n  tag/VERSION 一致性校验与建 release（`workflow_dispatch`，不再由推 tag 触发）。`tests/` 依赖 PATH 桩、python3 和 bash 3.2 的具体行为，\n  从没在 GitHub macOS runner 上验证过；把它塞进发布闸门，等于让「能不能发版」取决于一件\n  从未测过的事。想上 CI 是另一个独立改动。\n- **不做脚本的签名或 GPG 校验。** 沿用内核那套 GitHub API asset digest 的 sha256，\n  可信度边界与 `asset_digest()` 注释里写的一模一样：挡传输损坏与单镜像投毒，不是签名。\n- **不做自动升级 / 定时检查 / 启动时提示新版。** 只有用户显式跑 `update` 才检查脚本更新。\n- **不改内核升级的三阶段逻辑。** 阶段 0–3 一个字节不动，阶段 S 只在它前面插入。\n- **不给 `install` 加 `--no-launcher` 之类的开关。** 装启动器是 `install` 的一部分，\n  不是可选项；多一个参数就要多一条分支和一组测试。\n\n## 受影响的文件与接口\n\n**`singbox.sh`**（修改）\n\n| 位置 | 改动 |\n|---|---|\n| 头部用法注释（第 3–35 行） | `update` 那行改成「升级脚本与内核」；补 `SB_SELF_UPDATED` / `SB_LOCK_INHERIT` 说明 |\n| 全局常量（`:38`–`:75`） | 新增 `SELF_REPO=\"${SB_SELF_REPO:-lzyMeta/macos-singbox-client-helper}\"`、`GH_SELF_API`、`GH_SELF_DL`、`LAUNCHER=\"$PREFIX/bin/singbox\"` |\n| `--prefix` 解析（`:2724`） | 那一行已经重算 `BIN`/`ETC`/`CFG`，把 `LAUNCHER` 一并加进去——漏了它就会出现「内核装进 `/opt`、命令装进 `/usr/local`」 |\n| `LOCK_HELD=0`（`:89`） | 改为 `LOCK_HELD=\"${SB_LOCK_INHERIT:-0}\"` |\n| `latest_version()`（`:445`） | 加可选参数 `[api_url]`，默认 `$GH_API`，供自家 repo 复用 |\n| `asset_digest()`（`:476`） | 加可选第三参数 `[api_repo]`，默认 `$GH_API_REPO`。⚠️ 别并进同一条 `local`（函数里那段注释讲的就是这个坑） |\n| 新增 `ver_gt()` | 纯 bash 3.2 的三段数值比较，无 `sort -V` |\n| 新增 `_install_launcher()` | 写临时文件 → `bash -n` → `chmod 755` → 旧的 `mv` 成 `.prev` → `sudo mv -f` 就位。支持 `DRY` |\n| 新增 `_self_update()` | 阶段 S 全部逻辑，返回值不影响内核阶段 |\n| `cmd_install()`（`:745`） | 内核那步之后插入新的 `2/8　安装 singbox 命令`，`0/7`–`7/7` 全部重编号为 `0/8`–`8/8` |\n| `cmd_update()`（`:2223`） | 开头（`require_installed` 之后）插入阶段 S；`SB_SELF_UPDATED=1` 时整段跳过；`-n` 时打印将要做什么并计入现有的 dry-run 早退分支 |\n| `cmd_rollback()`（`:2359`） | `$LAUNCHER.prev` 存在则一并退回；不存在只退内核并说明 |\n| `cmd_uninstall()`（`:2550`） | 函数最后一条语句删 `$LAUNCHER` 与 `$LAUNCHER.prev` |\n| `cmd_help()` | 同步 |\n\n**`singbox-selfcheck.sh`**（修改）：新增第 13 项——禁止 `cp` / `install` 直接覆盖 `$LAUNCHER`。\n注意它自己是**实现文件**不是测试文件（`fix.testGlobs` 锁的是 `tests/**`）。\n\n**`.github/workflows/release.yml`**（新建；2026-09-11 换成 sdlc-kit `templates/release.yml` 的实例）：\n`on: workflow_dispatch`（输入 `tag`、`notes`），`permissions: contents: write`，checkout 按 SHA 钉住且\n`persist-credentials: false`，校验 `inputs.tag` 等于 `v$(sed -n 's/^VERSION=\"\\(.*\\)\"$/\\1/p' singbox.sh)`，\n不等就退非零；通过则 `gh release create \"$TAG\" singbox.sh`（版本含 `-` 加 `--prerelease`）。\n\n**测试**（新建 / 修改）\n\n- `tests/selfupdate.test.sh`（新建）——阶段 S 状态机\n- `tests/install.test.sh`（新建）——启动器安装\n- `tests/update.test.sh`（修改）——`rollback` 一并退启动器\n- `tests/selfcheck.test.sh`（修改）——第 13 项的正反样本\n- `tests/fixtures/bad-cp-launcher.sh` + 对应的 good 样本（新建）\n- `tests/fixtures/bin/curl`（修改）——加自家 repo 的 release API 与 asset 两个分支（详见「待定问题」末条）\n\n**文档**\n\n- `README.md`：2.1 节加 curl bootstrap（`curl -fsSLO .../releases/latest/download/singbox.sh`）；\n  2.5 节重写成「install 已自动完成」；命令表里 `update` 一行；自检项数 12 → 13；安装七步 → 八步\n- `CLAUDE.md`：验收段落里的「12 项」→ 13 项\n- `docs/safe-update.md`：升级流程补上阶段 S\n\n**不进 `.claude/sdlc.json` 的 `contracts.files`**：这不是跨栈改动，\ntag/asset 命名的约定分散在 `singbox.sh` 与 `release.yml` 两处，没有单独的契约文件可锁。\n\n## 待定问题\n\n**只有一条需要人拍板，且它在 build 之后：**\n\n- **首个 release 由谁发、发什么版本号？** —— 用户（lzyMeta 手工推 `v1.2.0`，见「实现计划 › 待定问题的状态」）\n  workflow 只在有 tag 时才动，而现在仓库一个 tag 都没有。实现方在本次改动里把 `VERSION` bump 到 `1.2.0`；**推 `v1.2.0` 这个 tag 由 lzyMeta（用户本人）\n  手工做**，实现方不代跑 `git push --tags`。在那之前阶段 S 永远走「取不到新版 → warn → 照升内核」，\n  这条路径本身有测试覆盖（验证节第 8 条），所以不阻塞 build 与验收。\n  ⚠️ 先有鸡先有蛋：`v1.2.0` 里那份 `singbox.sh` 是第一份**带**阶段 S 的脚本，\n  而已装机用户手上那份**没有**阶段 S，拿不到它——他们必须手工重装一次（README 的 curl bootstrap\n  就是给这批人的）。自更新从 `v1.2.1` 起才真正闭环。**这一点必须写进 release notes。**\n\n以下三条原本挂在这里，现已定案，实现方照做即可：\n\n- **`SELF_REPO` 写死但可被 `SB_SELF_REPO` 覆盖。** ——已定\n  默认 `lzyMeta/macos-singbox-client-helper`，加一个环境变量的成本是一行，收益有两处：fork 的人能指到自己的 fork；测试能把阶段 S 指向假 repo\n  而不必依赖 URL 里的仓库名匹配。写进头部注释。\n- **`--prefix` 与已装启动器不一致：不记进 `$PREFS`，只 warn。** ——已定\n  `LAUNCHER` 在 `singbox.sh:2724` 那行随 `BIN`/`ETC`/`CFG` 一起重新赋值即可。不把 prefix 记进 prefs 是因为\n  `SB_PREFIX` 环境变量已经是一条覆盖路径，再加一条持久化的会造出「prefs 说 `/opt`、\n  用户这次想装 `/usr/local`」的新歧义——为一个边缘场景引入一个说不清优先级的三方冲突不划算。\n  `update` 时 `$LAUNCHER` 不存在就 warn 一句「启动器不在 ${LAUNCHER}，已按当前 --prefix 装入」。\n- **curl 桩不需要支持 302，需要的是两个新分支。** ——已定\n  已核对 `tests/fixtures/bin/curl`：它按 URL 里的 `SagerNet/sing-box` 路径匹配，自家 repo 的请求会落进 `*) _emit \"\"` 兜底，\n  于是阶段 S 除了「取不到新版」那条路什么都测不了。要加的是\n  `*api.github.com/repos/*/macos-singbox-client-helper/releases/latest*`（吐 `tag_name`，\n  受 `SB_FAKE_SELF_LATEST` 控制）与 `*/releases/download/v*/singbox.sh`（吐一份脚本内容，\n  受 `SB_FAKE_SELF_SCRIPT` 控制）两个分支，digest 沿用现有「由文件实算」的写法。\n  302 完全不涉及：脚本内部下载走的是带版本号的固定 URL（`$GH_SELF_DL/v\u003cver>/singbox.sh`），\n  只有 README 里给人手工用的 `releases/latest/download/...` 会 302，而那条不进代码路径。\n  桩里 `[ \"$head_only\" = 1 ] && exit 0` 那行保持不动。\n\n## 验证\n\n- AC1 ★ 远端 `VERSION` > 本地 → 启动器被换成远端内容、旧的进 `.prev`、新进程确实被 exec 且 `SB_SELF_UPDATED=1` 与 `SB_LOCK_INHERIT=1` 都传到；远端 == 本地或 \u003c 本地 → 启动器 sha256 不变，不降级。反例：把 `if ! ver_gt \"$new\" \"$VERSION\"` 短路成 `if false` → 「远端 == 本地」「远端 \u003c 本地」两条红。\n- AC2 取不到远端版本、下到的脚本 `bash -n` 不过、sha256 不匹配 → 都不替换、有 warn、内核阶段照跑、退出码不受影响；`SB_SELF_UPDATED=1` 时阶段 S 整个跳过。反例：`download()` 那次调用不套子 shell → sha256 失配时 `die` 穿出、整条 `update` 退 1、「到过阶段 0」为 0 次。\n- AC3 `install` 后 `$PREFIX/bin/singbox` 存在、0755、与源脚本逐字节相同；目标已有不同内容 → 旧内容进 `.prev`；相同内容 → 就位且不报错；`-n install` 不创建文件但打 `[dry-run]`。反例：`_install_launcher` 不先备份 → 断言 2 找不到 `.prev`。\n- AC4 `rollback` 同时把内核与启动器退回 `.prev`，只有内核有 `.prev` 时只退内核并说明启动器没有退路；自检第 13 项对 `tests/fixtures/bad-cp-launcher.sh` 报错、对 good 样本不报。反例：`SB_UNDER_TEST` 指向没有启动器逻辑的 `HEAD` 脚本 → rollback 两条红（`.prev 还在=是`）。\n\n```bash\n./singbox-selfcheck.sh && ./tests/run.sh\n```\n\n这条命令必须绿。除现有 12 项自检 + 四个测试文件外，下列断言是本次改动的验收标准，\n全部离线、不要 sudo（`tests/fixtures/bin` 前置到 PATH）、`--prefix` 指向临时目录：\n\n**`tests/install.test.sh`**\n\n1. `install` 之后 `$PREFIX/bin/singbox` 存在、可执行（0755）、内容与源脚本逐字节相同\n2. 目标位置已有**不同内容**的文件 → 旧内容出现在 `$PREFIX/bin/singbox.prev`，新的就位\n3. 目标位置已有**相同内容**的文件 → 仍然就位，且不报错\n4. `-n install` 不创建 `$PREFIX/bin/singbox`，但输出里有 `[dry-run]` 那一行\n\n**`tests/selfupdate.test.sh`**\n\n5. 远端 `VERSION` > 本地 → 启动器被换成远端内容、旧的进 `.prev`，且新进程确实被 exec\n   （桩脚本在被执行时写一个标记文件，断言 `SB_SELF_UPDATED=1` 与 `SB_LOCK_INHERIT=1` 都传到了）\n6. 远端 == 本地 → 启动器 sha256 不变，直接进阶段 0\n7. 远端 \u003c 本地 → **不降级**，sha256 不变\n8. 取不到远端版本（curl 桩返回失败）→ 有 warn，且内核阶段照跑、退出码不受影响\n9. 下到的脚本 `bash -n` 不过（桩返回一段坏语法）→ **不替换**，原文件 sha256 不变\n10. `SB_SELF_UPDATED=1` 时阶段 S 整个跳过（防 exec 死循环）\n11. `$LAUNCHER` 不存在 → 装进去，且不 re-exec\n12. 当前进程不是从 `$LAUNCHER` 启动 → 更新 `$LAUNCHER`、有 warn、不 re-exec\n\n**`tests/update.test.sh`（扩充）**\n\n13. `rollback` 同时把内核与启动器退回 `.prev`\n14. 只有内核有 `.prev`、启动器没有 → 只退内核，输出里说明启动器没有退路\n\n**`tests/selfcheck.test.sh`（扩充）**\n\n15. 第 13 项对 `tests/fixtures/bad-cp-launcher.sh` 报错（不会恒绿）\n16. 第 13 项对 good 样本（`mv` 到 `$LAUNCHER`）不报（不会恒红）\n\n**`release.yml` 的验证不进 `run.sh`**，手工核对两条即可，写进 PR 描述：\ntag 与 `VERSION` 一致时能建出带 `singbox.sh` asset 的 release；\n故意推一个不一致的 tag 时 workflow 红。\n\n## 实现计划\n\n`sdlc-check --scope` 对全部 14 个文件报 `verdict=warn`（单栈但文件多），因此拆成三个\n单元，每个单元自己就跑绿 `./singbox-selfcheck.sh && ./tests/run.sh` 并单独落一个 commit。\n\n**单元 A — 启动器的安装与清理**（commit `6eb59ad`）\n`LAUNCHER` 常量 + `--prefix` 重算、`_install_launcher()`、`install` 插入 `2/8` 并把\n`0/7`–`7/7` 重编号、`rollback` 退启动器、`uninstall` 末尾清理；自检第 13 项与正反\nfixture；`tests/install.test.sh`（验收 1–4）、`selfcheck.test.sh`（15–16）、\n`update.test.sh`（13–14）。\n\n**单元 B — `update` 阶段 S**（commit `a329f06`）\n`LOCK_HELD` 读 `SB_LOCK_INHERIT`、自更新常量、`latest_version()` / `asset_digest()`\n参数化、`ver_gt()`、`_self_update()`、`cmd_update` 接入；`curl` 桩三个新分支；\n`tests/selfupdate.test.sh`（验收 5–12）。\n\n**单元 C — 发布侧与文档**\n`.github/workflows/release.yml`、`VERSION` → `1.2.0`、README / CLAUDE.md /\n`docs/script-usage.md` / `docs/safe-update.md`。 \u003c!-- doc:gone -->\n\n### 与 spec 的三处偏差\n\n1. **验收 1–3 不跑完整的 `install`。** `cmd_install` 第 7/8 步会 `sudo cp` 一份 plist 到\n   `/Library/LaunchDaemons/sing-box.plist` —— 那个路径写死在 `$PLIST` 里，**不跟随\n   `--prefix`**，跑到那一步就会动真实系统。改用 `SB_FAKE_CHECK_FAIL=\"live:\u003c版本>\"`\n   让第 5/8 步静态校验失败而中止；启动器那一步（2/8）紧跟内核（1/8）之后，那时早已\n   执行完，断言对象（存在 / 0755 / 逐字节相同 / `.prev` 的内容）一条不少。\n   要真正跑完 `install`，得先让 `$PLIST` 可覆盖 —— 那是另一个独立改动。\n   为此新增了两个 PATH 桩：`tests/fixtures/bin/networksetup` 与 `scutil`。\n\n2. **判「当前进程是不是从 `$LAUNCHER` 启动的」，两边都过一次 `cd` + `pwd`。**\n   spec 只说了对 `$0` 这么做。承重的是把 `$0`（可能是 `./singbox.sh` 这种相对路径）\n   绝对化；两边都做只是为了对称，不额外解决什么。\n   ⚠️ **这不解析符号链接** —— bash 的 `cd` 与 `pwd` 默认都是 `-L` 逻辑路径，\n   `cd /var/tmp && pwd` 回的仍是 `/var/tmp`。所以 `$PREFIX/bin` 若是一条符号链接，\n   本该 re-exec 的场景会退化成「只更新不重启」，那是安全的降级而不是数据损坏。\n   要真解链接得手写循环读 `ls -l`（`readlink -f` 在 macOS 上不存在、也被自检第 4 项\n   禁了），为这个边缘场景不值当。默认 `--prefix /usr/local` 下无实际影响。\n   （这一条的原始记述把机制讲错了，`/sdlc-kit:review` 指出后改正。）\n\n3. **`docs/script-usage.md` 第 1 节也有同一段 `~/bin` 手抄命令**，spec 只点名了 \u003c!-- doc:gone -->\n   `README.md` 2.5。同一件事说了两遍，只改一处就会自相矛盾，一并改了。\n   另外 `CLAUDE.md` 原先写「四个测试文件」而实际已有六个，本次加到八个，顺手修正。\n\n### 两处「不是恒绿」的验证\n\n仓库的纪律是每一项都要有会被抓到与不该被抓到的样本。有四条断言在功能不存在时也会绿，\n逐条验过：\n\n- `update.test.sh` 的 rollback 两条 —— 用 `SB_UNDER_TEST` 指向 `HEAD` 那份没有启动器\n  逻辑的脚本，两条都红（`.prev 还在=是`）。\n- `selfupdate.test.sh` 的「远端 == 本地」「远端 \u003c 本地」—— 用一份把\n  `if ! ver_gt \"$new\" \"$VERSION\"` 短路成 `if false` 的变异脚本跑，两条都红。\n\n为此给 `update.test.sh` 与 `selfupdate.test.sh` 都加了 `SB_UNDER_TEST`（沿用\n`platform.test.sh` 已有的写法）。\n\n### 自检第 13 项当场抓到的一个真缺陷\n\n把 `--prefix` 那条 case 分支拆成多行去加 `LAUNCHER=` 之后，`shift 2` 与 `|| die` 护栏\n不再相邻，**自检第 8 项立刻报了出来**。已合回一行，并在那里写明为什么不能拆。\n\n### `/sdlc-kit:review` 抓到的一个真缺陷（已修）\n\n**阶段 S 的 sha256 失配会 `die` 掉整条 `update`。** `download()` 在「直连下来的文件\n校验对不上」那一档走的是 `die` 而不是 `return 1`，那个 `die` 会从 `_self_update` 里\n`if ! download …` 的底下穿过去，整条 `update` 退出 1，**阶段 0–3 一个字节都跑不到** ——\n正是「脚本更新不该有权阻断用户真正要的那件事」禁止的。\n\n修法是把那次调用套进子 shell，让 `die` 只杀子 shell。不改 `download()` 本身：它是\n`install` 与内核升级共用的函数，改它的返回语义会波及内核路径，而 spec 明确划了\n「不改内核升级的三阶段逻辑」。子 shell 安全的前提已实测：bash 3.2 的 `( )` **不继承\nEXIT trap**，否则 `cleanup` 会在子 shell 退出时把 `$tmpd` 连同刚下好的文件、以及本进程\n持有的 `$LOCKDIR` 一起删掉（子 shell 里 `$$` 仍是父进程的 PID）。\n\n原先的验收缺口在于第 8 条只覆盖「取不到远端版本」。补第 13 条：curl 桩新增\n`SB_FAKE_SELF_BAD_SHA=1` 报一个对不上的 digest，断言 `update` 仍退出 0、启动器\nsha256 不变、且日志里同时有「sha256 不匹配」与「已是最新」（后者证明确实走到了内核阶段）。\n修之前这条红在「退出 1，到过阶段 0 = 0 次」。\n\n### 待定问题的状态\n\n`v1.2.0` 这个 tag **没有推**，按 spec 归 lzyMeta 手工做。在那之前阶段 S 永远走\n「取不到新版 → warn → 照升内核」，该路径有验收第 8 条覆盖。\n「自更新从 `v1.2.1` 起才真正闭环」已写进 `docs/script-usage.md`，发版时须进 release notes。 \u003c!-- doc:gone -->\n\n`release.yml` 的两条手工核对未做（需要真的推 tag），写进 PR 描述：\ntag 与 `VERSION` 一致时能建出带 `singbox.sh` asset 的 release；故意推一个不一致的 tag 时红。\n\n"},{"path":"docs/verify-hardening.md","title":"cmd_verify 收紧：消除静默跳过，QUIC 改为真探测，第 5 步补上判据","summary":"`cmd_verify`（`singbox.sh:1006-1084`）五步里有 5 处软分支，它们的共同毛病是 「测不了」和「测过了」在终端上长得一样——都不打 ✗，退出码都是 0：","hash":"52ace20a5f9cda61","kind":"spec","inferred":false,"status":"shipped","headings":[{"level":1,"text":"cmd_verify 收紧：消除静默跳过，QUIC 改为真探测，第 5 步补上判据","line":7},{"level":2,"text":"问题","line":9},{"level":2,"text":"决定","line":36},{"level":2,"text":"不在范围内","line":86},{"level":2,"text":"受影响的文件与接口","line":103},{"level":2,"text":"待定问题","line":135},{"level":2,"text":"验证","line":152},{"level":2,"text":"实现计划","line":230}],"front":{"kind":"spec","status":"shipped","covers":["tests/verify.test.sh"]},"covers":["tests/verify.test.sh"],"mentions":["config/config.example.json","singbox-selfcheck.sh","singbox.sh","tests/fixtures/bin/","tests/run.sh","tests/update.test.sh","tests/verify.test.sh"],"links":["CLAUDE.md","README.md","docs/best-practices.md","docs/safe-update.md"],"refs":[],"backlinks":["README.md","docs/manual-check.md","docs/safe-update.md"],"backrefs":[],"body":"# cmd_verify 收紧：消除静默跳过，QUIC 改为真探测，第 5 步补上判据\n\n## 问题\n\n`cmd_verify`（`singbox.sh:1006-1084`）五步里有 **5 处软分支**，它们的共同毛病是\n**「测不了」和「测过了」在终端上长得一样**——都不打 ✗，退出码都是 0：\n\n| 位置 | 现状 | 毛病 |\n|---|---|---|\n| 第 2 步 | `ipinfo.io` 取不到 → `warn` 跳过分流判断 | 分流到底生效没有，无结论 |\n| 第 3 步 | 未装 `dig` → `dim` 跳过整步 | DNS 防泄漏整步不做 |\n| 第 4 步 | curl 不支持 http3 → `dim` 跳过 | **本机 curl 8.7.1 (SecureTransport) 就是不支持，这半步从来没真跑过** |\n| 第 5 步 | `cip.cc` 取不到 → 只 `info` | 整步没有任何断言，永远不会失败 |\n| 第 5 步 | 拿不到默认网关 → `if [ -n \"$gw\" ]` 静默不检查 | 连打印都没有，用户不知道漏了 |\n\n`docs/safe-update.md:169-197` 已经把这几条记录在案，当时的结论是「维持现状」，理由是\n**这些分支多数不是失败而是测不了，把测不了也算失败会让每次 `singbox update` 都在阶段 3 回滚**。\n那条理由现在不成立了：\n\n1. 第 3 步的 `dig` 其实是 macOS 自带的 `/usr/bin/dig`，同目录还有 `host` / `nslookup` /\n   `dscacheutil`，加上脚本已硬依赖的 `python3`——**根本不缺解析手段**，只是代码只认 `dig` 一个。\n2. 第 4 步的 HTTP/3 不必依赖 curl 的编译选项，`python3` 直接发 QUIC 版本协商包就能测。\n3. 「回滚」这个后果可以拆开：DNS 泄漏 / QUIC 没挡住 / 国内直连失效都是**路由策略**问题，\n   回滚旧内核换不回来。分档之后，收紧判定与「不误回滚」不再冲突。\n\n同一处 `docs/safe-update.md:190-197` 还预留了第 5 步的判据（带真机数据：SOCKS 出口\n`\u003cvps-socks-ip>` vs `cip.cc` 报的 `\u003chome-cn-ip>` 上海电信），注明「超出本 spec 范围，**另开一条**」。\n这份 spec 就是那一条。\n\n## 决定\n\n`cmd_verify` 引入**两档失败**，并把 5 处静默跳过全部消除：\n\n**分档.** 现有 `VERIFY_BAD` / `vbad()`（`singbox.sh:95-99`）保留为**链路档**；新增\n`VERIFY_POLICY_BAD` / `vpbad()` 为**策略档**。退出码约定：\n\n| 退出码 | 含义 | 升级阶段 3 的动作 |\n|---|---|---|\n| `0` | 全过 | 通过 |\n| `1` | 链路档有失败（含第 1 步的 `return 1`） | 重试一轮，仍失败则回滚 |\n| `2` | 仅策略档有失败 | **不回滚**，`warn` 后放行 |\n\n两档都失败时返回 `1`（链路优先）。`_sb_verify_rounds`（`singbox.sh:1576-1588`）改为读退出码\n而非布尔：`2` 直接当通过返回，只有 `1` 才进重试与回滚。\n\n**逐步的新判定：**\n\n- **第 1 步**（节点链路，链路档）：不变。\n- **第 2 步**（出口 IP 分流，链路档）：`ipinfo.io` **不换域名**——它被写死在\n  `config/config.example.json:201` 的 `vpsre` 社交组里，是分流判定的固定参照物\n  （`docs/best-practices.md:873`），换端点等于改配置。改为**同一端点重试 3 次**，仍取不到则\n  硬失败、计入**策略档**——第三方站点可用性不是内核问题，回滚换不回来。\n  （**已拍板：lzyMeta，2026-09-04**。此处两条约束字面上会打架：「取不到即硬失败」加上\n  「第 2 步属链路档」等于让 `ipinfo.io` 抽一下就回滚一次好升级。按分档**原则**——\n  策略/环境问题不回滚——判给策略档。）\n  「兜底取不到 IP」「两个出口相同」仍是链路档，不变。\n- **第 3 步**（DNS 防泄漏，策略档）：解析手段降级为 4 级链，**任一级拿到 A 记录即采用**：\n  `dig +short` → `host -W 3` → `dscacheutil -q host -a name` → `python3 socket.getaddrinfo`。\n  四级全废才硬失败（此时报的是「本机没有任何可用解析手段」，与污染分开报）。\n  污染名单沿用现有的 `157.240.*` / `31.13.*` / 空结果，命中则硬失败。\n- **第 4 步**（QUIC，策略档）：**弃用 `curl --http3`**，改为 `python3` 内联的 QUIC\n  版本协商探测——构造 `version=0x1a2a3a4a`（保留版本）的 QUIC long-header Initial 包、\n  填充至 1200 字节，UDP 发往 `cloudflare-quic.com:443`。按 RFC 9000 §6，服务端收到未知版本\n  **必须**回 Version Negotiation 包（`version=0x00000000`）：\n  - 收到回包 → **QUIC 未被阻断** → 硬失败（原为 `warn`）\n  - 全部端点超时 → 已阻断 → `ok`\n  端点配 2 个（`cloudflare-quic.com:443`、`quic.rocks:4433`），**任一收到回包即判未阻断**。\n  这两个域名不在任何路由规则里，加备胎不动配置。IPv6 判定不变，仍是链路档。\n- **第 5 步**（国内直连与局域网，策略档）：整步从「只打印」变成**有断言**。\n  - `cip.cc` 加备胎（`myip.ipip.net`、`ip.3322.net`），逐个试，统一用正则抽第一个 IPv4；\n    **全挂才**硬失败。\n  - **新硬失败**：抽出的国内 IP **等于第 1 步的 SOCKS 出口 IP** → 国内直连没生效，全被代理接走。\n  - 拿不到默认网关 → 硬失败（不再静默跳过）。\n  - `ping` 网关不通 → 硬失败（原为 `warn`），连试 3 次全丢才判失败，避开无线抖动。\n\n**测试可见性.** QUIC 探测是内联 `python3`，PATH 桩拦不住。为此加一个测试后门环境变量\n`SB_FAKE_QUIC=blocked|open`：设置时探测函数直接返回预设结果，不发包。这是让第 4 步可测的\n唯一手段，必须在代码注释里写明它只服务于测试。\n\n## 不在范围内\n\n- **不动任何路由规则或配置模板。** `config/config.example.json` 一个字不改：`ipinfo.io` 继续\n  固定在 `vpsre`，也不新增 `udp` + `443` + `reject` 规则。这份 spec 只改**检查**，不改**策略**。\n- **不做配置静态核对。** 不从 `$CFG` 里找禁 QUIC 规则来辅助判断——第 4 步的判据只有实测探测一条。\n- **`cip.cc` 只跟第 1 步的 SOCKS 出口比**，不跟第 2 步的兜底出口 / 社交出口比。\n  （代价已知：「国内规则排在了兜底之后」这类故障若恰好走兜底出口，这条比不出来。已拍板接受。）\n- **不给 `verify` 加新的 CLI 开关**（`--strict` / `--link-only` 之类）。分档是内部的，\n  调用方只看退出码。\n- **不引入任何新的外部依赖。** 不要 `brew install bind`、不要 `aioquic`、不要第三方 curl。\n  新增能力全部由 `python3` 标准库和 macOS 自带工具提供。\n- **不碰第 1 步、不碰 IPv6 判定、不碰 `cmd_update` 的四阶段结构**——`cmd_update` 只改\n  `_sb_verify_rounds` 里读退出码的那几行。\n- **不做浏览器侧验证的自动化**（`dnsleaktest.com` 的 Extended Test、`test-ipv6.com`）。\n  这些仍是 `dim` 提示，它们本来就不是跳过的检查项，而是给人看的补充手段。\n- **不改 `cmd_syscheck` / `cmd_doctor` / `cmd_status`。**\n\n## 受影响的文件与接口\n\n**`singbox.sh`（唯一的实现文件）**\n\n| 位置 | 改动 |\n|---|---|\n| `:95-99` | `VERIFY_BAD` / `vbad()` 旁新增 `VERIFY_POLICY_BAD` / `vpbad()`，注释说明两档的判据 |\n| `:1006-1084` `cmd_verify` | 五步的判定按上表重写；末尾按两个计数器返回 `0` / `1` / `2` |\n| 新 helper | `_sb_resolve_a`（4 级 DNS 降级链）、`_sb_quic_open`（QUIC VN 探测，含 `SB_FAKE_QUIC` 后门）、`_sb_fetch_cn_ip`（`cip.cc` + 备胎，抽 IPv4） |\n| `:1576-1588` `_sb_verify_rounds` | `cmd_verify && return 0` 改为捕获退出码：`0`/`2` 返回 0，`1` 才重试与回滚 |\n| `:805` | install 第 7 步 `[ \"$DRY\" = 0 ] && cmd_verify || true` —— 退出码本就被吞，行为不变，确认无需改 |\n| `:1988` `:2019` | 帮助文本补一行退出码语义 |\n\n**`tests/fixtures/bin/`（PATH 桩）**\n\n- `dig`：加 `SB_FAKE_DIG_FAIL=1`（输出空并 `exit 1`），用来驱动降级链\n- **新增** `host`、`dscacheutil`：同样受 `SB_FAKE_*_FAIL` 驱动\n- `curl`：新增 `myip.ipip.net` / `ip.3322.net` 两条 URL 分支；加 `SB_FAKE_CN_IP=\u003cip>` 让 `cip.cc`\n  能返回等于 SOCKS 出口（`1.2.3.4`）的值，用来测新硬失败\n- `netstat`：加 `SB_FAKE_NO_GW=1`（默认路由那行不输出）\n- `ping`：加 `SB_FAKE_PING_FAIL=1`\n\n**`tests/verify.test.sh`（新增）**，纳入 `tests/run.sh` 的通配。\n\n**文档同步**（这次改的正是需求来源本身，必须同步，否则下次又会被当成「已拍板维持现状」）：\n\n- `docs/safe-update.md:169-197`：那张软分支表全部作废，改写为两档表 + 退出码约定；\n  190-197 的「另开一条」标注改为「已由 `docs/verify-hardening.md` 兑现」\n- `docs/script-usage.md`（`verify` 一节，约 `:287`）：退出码语义、新的失败原因与排查指引 \u003c!-- doc:gone -->\n- `docs/best-practices.md` 5.8 / 5.9（约 `:1315-1370`）：QUIC 与国内直连的判据说明跟上\n- `README.md`：`verify` 的一句话描述\n\n## 待定问题\n\n1. ~~**QUIC 探测全部超时时，「已阻断」与「本机 UDP 出网整体不通」区分不了。**~~ ——已定\n   **已解决**（v1.1.0）。按当初设想的方向做了：新增 `_sb_udp_alive` 对照组，\n   发一个标准 DNS 查询到公共解析器的 udp/53。判据变成三分支——\n   QUIC 通 → 未阻断（`vpbad`）；QUIC 不通但对照通 → 已阻断（`ok`）；\n   两个都不通 → **这一步没有结论**（`vpbad`），与第 3、5 步「取不到数据就是没有结论」一致。\n   \n   没有改成「多试几次」：QUIC 被挡住是**期望的成功路径**，表现恰恰是全部超时，\n   加重试会给每一次正常的 `verify` 平白加十几秒，还要乘 `_sb_verify_rounds` 的两轮。\n   \n   ⚠️ 对照组证明的是「UDP 有来回」，不是「UDP 直出」——配置里的 DNS 劫持规则\n   完全可能把这个查询接管掉再代答。用作「本机 UDP 是不是整个废了」的判据够用，别当成别的。\n   测试后门 `SB_FAKE_UDP=alive|dead`，与 `SB_FAKE_QUIC` 同理。\n2. **真机验证要你自己跑。** ——已定（2026-09-05 lzyMeta 已跑，结果见「验证」第 2 段）\n   `CLAUDE.md` 写明本机有 live sing-box，`./singbox.sh` 的 install/start/restart 等已 deny。下面「验证」的第 2 段必须由人执行。\n\n## 验证\n\n- AC1 ★ 仅策略档失败（`verify` 退 2）时 `cmd_update` 阶段 3 不回滚，`$BIN` 仍是新版本、`$BIN.prev` 仍在；链路档失败（退 1）时回滚，`$BIN` 换回旧版本。反例：`_sb_verify_rounds` 改回读布尔 → 退 2 也回滚，断言 13 红。\n- AC2 全部桩正常 → 退 0、五步全绿；`SB_FAKE_VERIFY_FAIL=all` → 退 1。反例：`vbad()` 不累计 → 第 2–5 步打了 `✗` 照样退 0（原实现的形状）。\n- AC3 解析降级链：`SB_FAKE_DIG_FAIL=1` 退 0（降到 `host`，不跳过）；`dig`/`host`/`dscacheutil` 全废加 `SB_FAKE_PY_RESOLVE_FAIL=1` 退 2 报「无可用解析手段」；`dig` 返回 `157.240.1.1` 或 `1.2.3.4,157.240.9.9,5.6.7.8` 退 2 报污染，返回 `131.13.5.5` 退 0。反例：污染判据写成子串 `31.13.` → 5c 误报；去掉第 4 级的后门 → 联网机器上断言 4 恒绿。\n- AC4 `SB_FAKE_QUIC=open` 退 2 且第 4 步打 ✗；`blocked` + `SB_FAKE_UDP=alive` → ok；`blocked` + `dead` → 退 2 报「UDP 整体出不去…没有结论」。反例：全部超时直接判「已阻断」→ 7b 假绿。\n- AC5 `SB_FAKE_CN_IP` 等于 SOCKS 出口 → 退 2；`cip.cc` 失败但备胎可用 → 退 0，三家全挂 → 退 2；`SB_FAKE_NO_GW=1` → 退 2；`SB_FAKE_PING_FAIL=1` → 退 2 且确认重试了 3 次。反例：拿不到网关时静默跳过 → 断言 11 红；`ping` 桩不记调用次数 → 「重试 3 次」证不了。\n\n**第 1 段：机械验证（可自动跑，是这份 spec 的验收线）**\n\n```\n./singbox-selfcheck.sh && ./tests/run.sh\n```\n\n`tests/verify.test.sh` 至少要覆盖这些断言（每条都验**退出码**，不只看输出）：\n\n| # | 场景 | 期望 |\n|---|---|---|\n| 1 | 全部桩正常 | 退出码 `0`，五步全绿 |\n| 2 | `SB_FAKE_VERIFY_FAIL=all` | 退出码 `1`（第 1 步链路档） |\n| 3 | `SB_FAKE_DIG_FAIL=1` | 退出码 `0` —— 降级到 `host` 后照样完成检查，**不跳过** |\n| 4 | `dig`/`host`/`dscacheutil` 桩全废 | 退出码 `2`，报「无可用解析手段」，且与污染报错文案不同 |\n| 5 | `dig` 桩返回 `157.240.1.1` | 退出码 `2`，报疑似污染 |\n| 5b | `dig` 桩返回 `1.2.3.4,157.240.9.9,5.6.7.8` | 退出码 `2` —— 污染 IP 不在第一条也要抓到 |\n| 5c | `dig` 桩返回 `131.13.5.5` | 退出码 `0` —— 不许因为子串 `31.13.` 而误报 |\n| 6 | `SB_FAKE_QUIC=open` | 退出码 `2`，第 4 步打 ✗（**不再是 warn，也不再跳过**） |\n| 7 | `SB_FAKE_QUIC=blocked` + `SB_FAKE_UDP=alive` | 第 4 步 `ok` |\n| 7b | `SB_FAKE_QUIC=blocked` + `SB_FAKE_UDP=dead` | 退出码 `2`，报「UDP 整体出不去…没有结论」，**不再假绿** |\n| 8 | `SB_FAKE_CN_IP=1.2.3.4`（等于 SOCKS 出口） | 退出码 `2`，报国内直连失效 |\n| 9 | `cip.cc` 桩失败但备胎可用 | 退出码 `0` |\n| 10 | `cip.cc` 与两个备胎全失败 | 退出码 `2` |\n| 11 | `SB_FAKE_NO_GW=1` | 退出码 `2`（**不再静默跳过**） |\n| 12 | `SB_FAKE_PING_FAIL=1` | 退出码 `2`（原为 warn），且确认重试了 3 次 |\n| 13 | 仅策略档失败时跑 `cmd_update` 阶段 3 | **不回滚**，`$BIN` 仍是新版本、`$BIN.prev` 仍在 |\n| 14 | 链路档失败时跑 `cmd_update` 阶段 3 | 回滚，`$BIN` 换回旧版本 |\n\n第 13/14 条最关键——它们是「分档」这个决定唯一能被机械证伪的地方，\n写法照抄 `tests/update.test.sh` 现有的状态机断言。\n\n`singbox-selfcheck.sh` 的 12 项静态检查同时是硬约束，新代码必须过：bash 3.2（无 `declare -A`\n/ `${x^^}` / `mapfile`）、BSD 工具链（无 `sed -i `、`readlink -f`、`grep -oP`）、\n变量后紧跟全角字符要写 `${VAR}中文`、数组在 `set -u` 下不裸展开。内联 `python3` 用\n`\u003c\u003c'PY'` heredoc（`sock_addr:196` 与 `cmd_debug` 有现成写法）。\n\n**第 2 段：真机验证（人工，脚本已 deny）—— 已于 2026-09-05 由 lzyMeta 执行，全部通过**\n\n实测输出（节选）：五步全部打印判定结果，**一处「跳过」都没有**，`exit=0`。\n\n| 步 | 实测 | 说明 |\n|---|---|---|\n| 1 | SOCKS 出口 `\u003cvps-socks-ip>` | — |\n| 2 | 社交组 `\u003cvpsre-exit-ip>` AS7018 AT&T | 与兜底不同，分流生效 |\n| 3 | `142.251.156.119` 等 3 条 | 走的是第 1 级 `dig`；后三级真机上没被走到（`verify.test.sh` 已逐级驱动） |\n| 4 | `✓ QUIC 已阻断` | 两个端点都超时 |\n| 5 | `\u003chome-cn-ip>` 上海电信 | 与 SOCKS 出口不同 → 国内直连生效。与本文档开头记录的真机数据一致 |\n\n**第 4 步的反证也跑了**：注释掉配置里 `udp + 443 + reject` 那条规则、`restart` 后重跑，\n得到 `exit=2` 且第 4 步打 ✗。这条是第 4 步唯一的证伪手段——探测坏了（包构造错、UDP 发不\n出去、异常被吞）和 QUIC 真被挡住，输出完全一样。同一台机器能产出两种结果，才说明那半步是活的。\n\n⚠️ 评审时列出的存疑项「备胎端点 `quic.rocks:4433` 不被 `udp + 443 + reject` 覆盖，\n可能在配置正确的机器上恒报未阻断」—— **本机不复现**，两个端点都超时。\n\n「待定问题 1」（全超时时「已阻断」与「本机 UDP 整体不通」分不开）**收窄但未消除**：\n反证说明规则去掉后包出得去，即这张网的 UDP/443 本身是通的，那么规则在时的超时可归因于\n规则。换一张网仍然无从区分。\n\n**原始验证步骤（重跑时照此）**\n\n```\n./singbox.sh verify; echo \"exit=$?\"\n```\n\n- 正常状态下应 `exit=0`，且**第 3、4、5 步都真的打印了判定结果**，一处 `dim ... 跳过` 都不该出现。\n- 第 4 步应报「QUIC 已阻断」。手工反证：临时注释掉配置里禁 QUIC 那条规则、`restart` 后重跑，\n  应变成 `exit=2` 且第 4 步打 ✗。\n- 第 5 步打印的国内 IP 应是本地城市与运营商，且与第 1 步的 SOCKS 出口不同。\n\n## 实现计划\n\n（由 `/sdlc-kit:build` 追加，2026-09-04。实现方：Claude Code。）\n\n**顺序**：桩 → 测试（先跑红）→ `singbox.sh` → `update.test.sh` → 跑绿 → 文档。\n\n| # | 文件 | 落地情况 |\n|---|---|---|\n| 1 | `tests/fixtures/bin/{dig,host,dscacheutil,ping,netstat,curl}` | 6 支桩。新增 `host` / `dscacheutil`；`dig` 加 `SB_FAKE_DIG_FAIL` / `SB_FAKE_DIG_IP`；`ping` 把调用次数写进状态目录（否则「重试 3 次」证不了）；`netstat` 加 `SB_FAKE_NO_GW`；`curl` 加 `SB_FAKE_IPINFO_FAIL` / `SB_FAKE_CN_FAIL` / `SB_FAKE_CN_IP` 与两个备胎 URL |\n| 2 | `tests/verify.test.sh`（新增） | spec 表里的 1–12 条，每条验退出码 |\n| 3 | `singbox.sh:95-108` | `VERIFY_POLICY_BAD` / `vpbad()`，注释写清两档的判据是「回滚换不换得回来」 |\n| 4 | `singbox.sh` 新 helper | `_sb_resolve_a`（4 级降级）、`_sb_quic_open`（QUIC VN 探测）、`_sb_fetch_cn_ip`（三家参照站，输出 `\u003cip>|\u003c归属>`） |\n| 5 | `singbox.sh` `cmd_verify` | 五步判定重写，末尾 `1` / `2` / `0` 三档 |\n| 6 | `singbox.sh` `_sb_verify_rounds` | 改读退出码；`2` 打 warn 后返回 0 |\n| 7 | `singbox.sh` 帮助文本 | `verify` 与 `update` 两处补退出码语义 |\n| 8 | `tests/update.test.sh` | setup 钉死 `SB_FAKE_QUIC=blocked`；新增第 13 条「仅策略档失败不回滚」 |\n| 9 | `docs/safe-update.md` `docs/script-usage.md` `docs/best-practices.md` `README.md` | 同步 | \u003c!-- doc:gone -->\n\n**与 spec 的三处偏离（实现时拍的）**\n\n1. **多了一个测试后门 `SB_FAKE_PY_RESOLVE_FAIL=1`。** 降级链第 4 级是内联 `python3\n   socket.getaddrinfo`，PATH 桩拦不住；联网机器上它总会成功，spec 的断言 4「四级全废」\n   会永远假绿。这个后门只作用于第 4 级，1–3 级仍由真实 PATH 桩驱动。\n2. **断言 13/14 落在 `tests/update.test.sh`**，不在 `verify.test.sh`——前者的现网监听 +\n   tar 包 setup 有 60 行，复制一份得不偿失。\n3. **断言 14（链路档失败 → 回滚）已被 `update.test.sh` 原有的第 6 条覆盖**\n   （`SB_FAKE_VERIFY_FAIL=all`），只新增了 13。同时给 `update.test.sh` 的 setup 补\n   `SB_FAKE_QUIC=blocked`——不钉的话原有 8 条用例的阶段 3 会去发真 UDP 包。\n4. **`cmd_rollback` 的行为跟着变了，spec 的「受影响的接口」没列它。** 它与阶段 3 共用\n   `_sb_verify_rounds`（`singbox.sh:1903`），所以回滚之后若只剩策略档失败，`rollback`\n   的退出码从 `1` 变成 `0`、并打印「回滚完成，功能验收通过」。这与分档原则自洽——都已经\n   换回旧内核了，DNS/QUIC/国内直连仍不对，只能说明问题本来就不在内核版本上——所以按\n   现状保留，在此补一句申报。\n\n**评审（`/sdlc-kit:review`）查出并已修的一处**\n\n第 2 步的重试跳出条件原先写的是「响应体非空」（`[ -n \"$soc_json\" ]`），而硬失败的判据是\n**解析出来的** `ip_soc` 为空。限流页 / 502 / Cloudflare 拦截页都是「非空但不是 JSON」且\n`curl -s` 退 0——于是只请求 1 次就落到 `vpbad`，还打一句「连取 3 次都没结果」的假话，\n一次抖动就把本该 `0` 的 verify 判成 `2`。改为在循环内解析、`[ -n \"$ip_soc\" ]` 才跳出，\n并加了 `verify.test.sh` 第 13 条（`SB_FAKE_IPINFO_JUNK=1` → 退出 2 且 `ipinfo_calls` 为 3）\n钉住它：旧写法下这条红（`通过 12，失败 1`），修完绿（`通过 13，失败 0`）。\n\n**验证结果**（`./singbox-selfcheck.sh && ./tests/run.sh`）\n\n- 写完测试、未改实现时：`通过 3，失败 9`，失败点名的是退出码（如「期望 2 实际 0」），不是语法错。\n- 实现之后：静态自检 12 项全过；`selfcheck.test.sh` 26/26、`update.test.sh` 18/18、\n  `verify.test.sh` 13/13（评审后从 12 条增到 13 条），退出码 `0`。\n\n**真机那段仍待人工执行**（`./singbox.sh verify; echo \"exit=$?\"`），脚本已 deny。\n"}],"paths":{".claude/sdlc.json":{"covers":[],"mentions":["AGENTS.md","docs/config-audit-and-modernize.md","docs/config-audit-findings-guide.md","docs/config-audit-migration-table.md","docs/maintaining.md","docs/safe-update.md","docs/self-install-and-self-update.md"]},"config/config.example.json":{"covers":["docs/best-practices.md","docs/config-audit-findings.md","docs/manual-config.md","docs/manual-install.md"],"mentions":["AGENTS.md","CLAUDE.md","docs/best-practice
