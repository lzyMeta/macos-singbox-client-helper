<title>文档站</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --cloth:#EEEFEB;--paper:#FFFFFF;--ink:#1B1F2A;--indigo:#2F3F7F;--indigo-wash:#E9ECF6;--grey:#6B7180;--rule:#D9DBD5;--code:#F2F3EF;--ochre:#9A6700;--ochre-wash:#FBF3DC;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","Source Han Serif CN","Noto Serif SC","SimSun",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"PingFang SC",monospace;
  --topbar:44px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--cloth:#121419;--paper:#1A1D24;--ink:#E3E5EA;--indigo:#9FB2F2;--indigo-wash:#232A42;--grey:#8A90A0;--rule:#2B2F3A;--code:#232730;--ochre:#E2B45A;--ochre-wash:#332A14}}
:root[data-theme="dark"]{--cloth:#121419;--paper:#1A1D24;--ink:#E3E5EA;--indigo:#9FB2F2;--indigo-wash:#232A42;--grey:#8A90A0;--rule:#2B2F3A;--code:#232730;--ochre:#E2B45A;--ochre-wash:#332A14}
*{box-sizing:border-box}
html{background:var(--cloth)}
body{margin:0;background:var(--cloth);color:var(--ink);font:15px/1.75 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--indigo);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:.2em;text-decoration-thickness:1px}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
code,pre,kbd{font-family:var(--mono);font-size:.9em}
code{background:var(--code);padding:.08em .3em;border-radius:2px}
pre{background:var(--code);padding:.9em 1.1em;border-radius:3px;overflow-x:auto;line-height:1.6}pre code{background:none;padding:0}
h1,h2,h3,h4,h5,h6{font-family:var(--serif);font-weight:600;line-height:1.3;margin:0}

/* 页眉：一行，名字用宋体 */
#top{height:var(--topbar);display:flex;align-items:center;gap:1.4em;padding:0 20px;border-bottom:1px solid var(--rule);font-size:13px;color:var(--grey);white-space:nowrap;overflow:hidden}
#top b{font:600 18px/1 var(--serif);color:var(--ink);letter-spacing:.06em}
#top a{color:var(--grey)}
#top span:empty{display:none}
#top button{margin-left:auto;font:inherit;background:none;border:1px solid var(--rule);border-radius:2px;color:var(--ink);padding:.15em .7em;cursor:pointer}

#wrap{display:flex;min-height:calc(100vh - var(--topbar))}

/* 左栏：像书页外侧的边栏，留在布底上 */
#side{width:300px;flex:none;display:flex;flex-direction:column;max-height:calc(100vh - var(--topbar));position:sticky;top:0}
#tabs{display:flex;gap:1.2em;padding:0 20px;border-bottom:1px solid var(--rule);font-size:13px}
#tabs a{padding:.7em 0 .5em;color:var(--grey);border-bottom:2px solid transparent;margin-bottom:-1px}
#tabs a.on{color:var(--ink);border-color:var(--indigo)}
#tabs a:hover{text-decoration:none;color:var(--ink)}
#list{overflow-y:auto;padding:.6em 0 2em;flex:1;scrollbar-width:thin}
#list h4{font:600 13px/1.4 var(--serif);color:var(--ink);margin:1.1em 20px .3em;display:flex;justify-content:space-between;align-items:baseline}
#list h4 em{font:12px/1 var(--sans);color:var(--grey);font-style:normal}
#list .row{display:block;padding:.35em 18px .35em 17px;color:var(--ink);border-left:3px solid transparent;line-height:1.45}
#list .row:hover{text-decoration:none;color:var(--indigo)}
#list .row.on{border-color:var(--indigo);color:var(--indigo);background:var(--indigo-wash)}
#list .row .t{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
#list .row small{display:block;color:var(--grey);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#list .row .seal{margin-right:.4em}
#list details{margin-left:8px}#list details details{margin-left:12px}
#list summary{cursor:pointer;color:var(--grey);padding:.2em 8px;font-size:13px;list-style:none}
#list summary::before{content:"▸";display:inline-block;width:1em;color:var(--grey);font-size:11px}
#list details[open]>summary::before{content:"▾"}
#list input{width:calc(100% - 40px);margin:.8em 20px .4em;padding:.4em 0;font:inherit;border:0;border-bottom:1px solid var(--ink);background:none;color:var(--ink);outline:0}
#list input:focus{border-bottom-color:var(--indigo);border-bottom-width:2px;margin-bottom:calc(.4em - 1px)}
#list .snip{font-size:12px;color:var(--grey);white-space:normal;line-height:1.5}
#list mark{background:var(--ochre-wash);color:inherit}

/* 中栏：一张纸 */
#main{flex:1;min-width:0;display:flex;background:var(--paper);border-left:1px solid var(--rule)}
#content{flex:1;min-width:0;padding:2.2em 44px 6em;max-width:calc(44em + 88px)}
#toc{width:210px;flex:none;padding:2.4em 18px 2em 8px;font-size:12.5px;position:sticky;top:0;max-height:calc(100vh - var(--topbar));overflow-y:auto;scrollbar-width:thin}
#toc h5{font:600 13px/1.4 var(--serif);color:var(--ink);margin:0 0 .5em}
#toc a{display:block;color:var(--grey);padding:.18em 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.5}
#toc a.l3{padding-left:1.2em}
#toc a:hover{color:var(--indigo);text-decoration:none}

/* 藏书章：类型 */
.seal{display:inline-block;font:12px/1 var(--serif);color:var(--indigo);border:1px solid currentColor;padding:.25em .4em .2em;border-radius:1px;letter-spacing:.08em;vertical-align:.15em;white-space:nowrap}
.seal.inf{border-style:dashed}
.state{display:inline-block;font-size:12.5px;color:var(--grey);margin-left:.6em;vertical-align:.15em}
.state.st-draft,.state.st-building{color:var(--ochre)}

/* 文档头 */
.hdr{margin-bottom:1.6em}
.hdr .marks{margin-bottom:.9em}
.hdr h1{font-size:30px;line-height:1.25;letter-spacing:.01em;margin:0 0 .35em}
.hdr .p{color:var(--grey);font-size:13px;word-break:break-all}
.hdr h1 code{background:none;padding:0;font-size:.85em;font-weight:500}
.hdr .lede{color:var(--grey);font-size:15px;line-height:1.7;margin:.6em 0 0;font-family:var(--serif)}

/* frontmatter 与关联：规则线分隔的定义列表 */
.meta{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:.7em 0;margin:1.4em 0 2em;font-size:13px}
.meta dl,.rel dl{display:grid;grid-template-columns:max-content 1fr;gap:.25em 1.4em;margin:0}
.meta dt,.rel dt{color:var(--grey);white-space:nowrap}
.meta dd,.rel dd{margin:0;min-width:0;word-break:break-word}
.rel{border-top:1px solid var(--rule);margin-top:3em;padding-top:1.2em;font-size:13.5px}
.rel h4{font-size:14px;margin:0 0 .8em}
.rel ul{list-style:none;margin:0;padding:0}
.rel li{margin:0 0 .15em}
.rel li small{color:var(--grey);margin-left:.5em;font-size:12px}

/* markdown 正文 */
.md{font-size:15px}
.md>h1:first-child{display:none}
.md h1{font-size:24px;margin:1.8em 0 .6em}
.md h2{font-size:20px;margin:2.2em 0 .7em;padding-bottom:.25em;border-bottom:1px solid var(--rule)}
.md h3{font-size:16.5px;margin:1.8em 0 .5em}
.md h4,.md h5,.md h6{font-size:15px;margin:1.4em 0 .4em}
.md p,.md ul,.md ol{margin:0 0 .9em}
.md li{margin:.15em 0}
.md img{max-width:100%}
.md table{border-collapse:collapse;display:block;overflow-x:auto;max-width:100%;font-size:13.5px;margin:1em 0}
.md th,.md td{border:1px solid var(--rule);padding:.35em .7em;text-align:left;vertical-align:top}
.md th{font-weight:600;background:var(--code)}
.md blockquote{margin:1em 0;padding:.1em 1.1em;border-left:2px solid var(--indigo);color:var(--grey)}
.md blockquote p{margin:.4em 0}
.md hr{border:0;border-top:1px solid var(--rule);margin:2em 0}
.md h1,.md h2,.md h3{scroll-margin-top:.6em}
.md :target{background:var(--indigo-wash)}

/* 首页 */
.home h1{font-size:34px;margin:.4em 0 .4em;letter-spacing:.02em}
.home .lede{font-family:var(--serif);color:var(--grey);font-size:16px;line-height:1.75;max-width:36em}
.tally{display:grid;grid-template-columns:max-content max-content;gap:.2em 1.2em;margin:1.8em 0;font-size:14px;align-items:baseline}
.tally .n{font:600 17px/1 var(--serif);text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.tally a{color:var(--ink)}
.tally a:hover{color:var(--indigo)}
.home .note{font-size:13px;color:var(--grey);border-top:1px solid var(--rule);padding-top:1em;margin-top:2.5em;max-width:40em}
.home .note code{background:none;padding:0;color:var(--ink)}
.empty{color:var(--grey);padding:2em 0}

@media (max-width:900px){
  #top{padding:0 16px;gap:1em}#top span{display:none}
  #wrap{flex-direction:column}
  #side{width:auto;position:static;max-height:none;border-bottom:1px solid var(--rule)}
  #list{max-height:45vh}#side.hide #list,#side.hide #tabs{display:none}
  #tabs{padding:0 16px}#list h4,#list input{margin-left:16px;margin-right:16px}#list input{width:calc(100% - 32px)}
  #main{border-left:0}#toc{display:none}#content{padding:1.6em 16px 4em;max-width:none}
  .hdr h1{font-size:24px}.home h1{font-size:28px}
}
@media (min-width:901px){#top button{display:none}}
@media (prefers-reduced-motion:no-preference){#list .row,#tabs a,a{transition:color .12s}}
</style>

<div id="top"><b>文档站</b><span id="m-count"></span><span id="m-sha"></span><span id="m-built"></span><button id="tgl" type="button">目录</button></div>
<div id="wrap">
  <nav id="side">
    <div id="tabs"><a href="#kind" data-tab="kind">按类型</a><a href="#dir" data-tab="dir">按目录</a><a href="#paths" data-tab="paths">代码路径</a><a href="#q" data-tab="q">搜索</a></div>
    <div id="list"></div>
  </nav>
  <div id="main"><article id="content"></article><aside id="toc"></aside></div>
</div>

nfig.json` / `prefs` / `dns-backup` 是用户真实\n  凭据，被 gitignore，不要读也不要造。\n- 面向用户的输出是中文。\n\n## 坑\n\n- 目标解释器是 macOS 自带的 **bash 3.2.57**，不是 bash 4+：没有 `declare -A`、`${x^^}`、`mapfile`、\n  `&>>`。写完务必用 `bash -n` 过一遍。\n- 工具链是 **BSD 不是 GNU**：没有 `sed -i `（带空格那种）、`readlink -f`、`date -d`、`head -n -N`、\n  `grep -oP`、`grep -P`。selfcheck 里有一条专门查这个。\n- bash 3.2 解析 `$VAR中文` 会出错，变量后紧跟全角字符必须写成 `${VAR}中文`。\n- `mktemp` 模板的 `XXXXXX` 后面不能带后缀，BSD 的 mktemp 不支持。\n- 不要用 `kill -9` 停 sing-box，会留下残留路由；也不要用已废弃的 `launchctl load/unload`。\n- **不要执行 `./singbox.sh` 的任何写操作**（install/uninstall/start/stop/restart/edit）。开发机上跑着\n  真实的 sing-box，这些子命令会动 launchctl、路由表和 `/usr/local`。\n\n## 这个文件不是什么\n\n本仓库同时也在配合 Claude Code 使用，而 Claude Code 读的是 `CLAUDE.md`。那个文件里可能有更多\n项目知识。在那边配置的 hook 和权限规则只约束 Claude Code ——**它们不约束你**。对你生效的边界，\n就是上面写的这些，加上工单里写的那些。\n"},{"path":"CLAUDE.md","title":"macos-singbox-client-helper","summary":"管理 macOS 上 sing-box 内核的 shell 脚本。单文件 `singbox.sh`（约 110KB，`set -uo pipefail`）是全部实现， `singbox-selfcheck.sh` 是它的静态自检。没有 CI、没有包管理器、没有测试框架。","hash":"246b050a335c2ffc","kind":"entry","inferred":true,"status":null,"headings":[{"level":1,"text":"macos-singbox-client-helper","line":1},{"level":2,"text":"验收","line":6},{"level":2,"text":"运行环境的硬约束","line":57},{"level":2,"text":"这台机器上有 live sing-box","line":70},{"level":2,"text":"不进仓库的文件","line":79}],"front":{},"covers":[],"mentions":["config/config.example.json","singbox-selfcheck.sh","singbox.sh","tests/","tests/fixtures/","tests/install.test.sh","tests/run.sh"],"links":[],"refs":[],"backlinks":["AGENTS.md","docs/config-audit-findings-guide.md","docs/config-audit-migration-table.md","docs/config-export.md","docs/maintaining.md","docs/self-install-and-self-update.md","docs/verify-hardening.md"],"backrefs":[],"body":"# macos-singbox-client-helper\n\n管理 macOS 上 sing-box 内核的 shell 脚本。单文件 `singbox.sh`（约 110KB，`set -uo pipefail`）是全部实现，\n`singbox-selfcheck.sh` 是它的静态自检。没有 CI、没有包管理器、没有测试框架。\n\n## 验收\n\n```\n./singbox-selfcheck.sh && ./tests/run.sh\n```\n\n前半段是 `singbox.sh` 的静态自检（13 项），后半段是 `tests/` 下的 \u003c!-- sdlc-doc:n tests/*.test.sh -->13\u003c!-- sdlc-doc:end --> 个测试文件：\n`cli`（参数解析）、`selfcheck`（自检项本身）、`install`（装 `singbox` 命令）、\n`selfupdate`（`update` 阶段 S 的脚本自更新）、`update`（内核升级状态机与 `rollback`）、\n`logs`（日志体积与截断）、`platform`（架构判定）、`verify`（两档退出码）、\n`config-audit`（四路发现层、迁移表、`--apply` 三条规则与四道验收）、\n`config-export`（防覆盖、0600、进程陈旧性 warn：假 `ps -o etime=` 桩在测试文件里自造）、\n`doctor`（TUN 路由判读：`_tun_route_state` 三处共用）、\n`template`（`config/config.example.json` 过 audit、且与 live 逐键全等——live 读得到才比，只打印路径不打印值；\n网卡名、tun 地址、`external_ui` 三条路径允许值不同，模板留通用值）、\n`docs`（手册对着源头核对：子命令与旗标、README 仓库结构与文档索引、计数、best-practices 配置全文、目录、行号引用、\nfindings 文档与迁移表里 `fix != auto` 的条目双向一致且每节四段齐全）。\n\n**TUN 路由的判据是两半都要**：上半 `128.0/1`，下半 `0/1` 或 sing-tun v0.9 起的七段\n`1/8 2/7 4/6 8/5 16/4 32/3 64/2`（避开 `0.0.0.0/8`）。只认 `0/1` 会把真机形状误报成「未接管」，\n只认 `128.0/1` 会把「只有上半」这种真故障判成健康。假 `netstat` 桩默认吐七段形状。\n\n`tests/run.sh` 给每个测试文件一把独立的锁（`SB_LOCKDIR`，`mktemp -d` 下）；`singbox.sh` 的\n`LOCKDIR` 默认 `/tmp/.singbox-sh.lock`，只在测试里用这个变量改。以前测试与 live 的 `singbox`\n命令共用一把锁，teardown 还会顺手删掉 live 的锁——那是连跑偶发红的嫌疑来源之一。\n\n**另一个已证实的偶发根因是并发起沙箱撞端口**：`audit --deep` / `--apply` 不持锁，两个 `singbox.sh`\n同时 `_sb_free_port` 会拿到同一个端口，后起的把先起的监听当成自己的、再 kill 掉自己那个还没吐日志的\n沙箱（2026-09-12 并行复现 1/20）。所以 `_sb_probe_socks` 的判据是 `_sb_port_listening_by`（`lsof -a -p`\n认**自己的 pid** 在听），不是 `_sb_port_listening`；`config-audit.test.sh` 的 R5 用假内核的\n`SB_FAKE_RUN_SQUAT` 守着。两组测试并行跑仍可能各自报「不是沙箱实例」，但那是诚实的失败，D 路照旧收日志。\n\n`selfcheck.test.sh` 验证那 13 项**真的在检查**。两种坏法都踩过，且都不会自己暴露：\n\n- **恒红**：有 2 项用了 GNU 专有的 `grep -P`，在 BSD grep 上恒报 `invalid option`——\n  既抓不到违规，也永远不会绿。\n- **恒绿**：嵌套函数那一项的内层正则写死了「恰好 2 个空格」缩进，于是文件里\n  6 空格缩进的嵌套定义从它旁边大摇大摆走过去，那一项永远报 OK。\n\n所以每一项在 `tests/fixtures/` 里都必须同时有**会被抓到**和**不该被抓到**的样本。\n\nStop 闸门开着（`check.stopHook = \"on-edit\"`）：改完代码要停下时会自动跑一次，红了停不下来，\n连续两次修不好则放行。改 `**/*.md` / `docs/**` / `.claude/**` 不触发。\n\n`docs.context7.maxCallsPerWindow` 是 15 而不是默认的 3（`735bec9`）：桶按 Claude 会话计（`call_bucket` 优先取\n`sdlc_claude_pid`），不按时间窗滚动，3 次等于「一个会话总共 3 次且不恢复」，对要查 sing-box 配置的会话过紧；\n15 留出余量，同时保住「先 `sdlc-docs grep` 查已有片段」的那点摩擦。\n\n修 `singbox-selfcheck.sh` 本身时它是实现文件而不是测试文件——被 `fix.testGlobs` 锁住的是\n`tests/**`。\n\n## 运行环境的硬约束\n\n- 目标是 macOS 自带的 **bash 3.2.57**，不是 bash 4+：没有 `declare -A`、`${x^^}`、`mapfile`。\n- 工具链是 **BSD 不是 GNU**：没有 `sed -i `（带空格）、`readlink -f`、`date -d`、`head -n -N`、`grep -oP`。\n- bash 3.2 解析 `$VAR中文` 会出错，变量后紧跟全角字符必须写 `${VAR}中文`。\n- **判 CPU 架构不能用 `uname -m`**：它报的是当前进程的架构，Rosetta 翻译下会说 `x86_64`。\n  硬件判据是 `sysctl -n hw.optional.arm64`（Intel 上这个键不存在，sysctl 退出 1）；\n  `sysctl -n sysctl.proc_translated` = 1 表示当前 shell 正被翻译。\n- `shift 2` 在参数不够时**返回 1 且不消耗任何参数**，`while [ $# -gt 0 ]` 的解析循环会死转。\n  每个 `shift 2` 之前都要 `[ -n \"${2:-}\" ] || die`。\n- 同一条 `local` 里引用不到前面刚声明的变量：`local a=x b=\"$a\"` 里 `$a` 取的是外层作用域，\n  多半是空，而且**不报错**。要分成两条语句写。\n\n## 这台机器上有 live sing-box\n\n`/usr/local/etc/sing-box/config.json` 是用户正在用的配置（root 所有）。`./singbox.sh` 的\ninstall/uninstall/start/stop/restart/edit 会真的动 launchctl、路由表和 `/usr/local`，已 deny，要试人自己跑。\n\n`install` 现在还会把脚本自己装到 `/usr/local/bin/singbox`，`update` 的阶段 S 会替换它 ——\n同一条 deny 覆盖这两件事。`tests/install.test.sh` 故意在第 5/8 步中止，因为第 7/8 步的\n`$PLIST` 路径写死在 `/Library/LaunchDaemons`，**不跟随 `--prefix`**。\n\n## 不进仓库的文件\n\n`.gitignore` 点名的 `config.json`、`sing-box-client-config.json`、`prefs`、`dns-backup` 含真实订阅地址与节点凭据。\n`config/config.example.json` 才是可以读改的模板。\n"},{"path":"CONTRIBUTING.md","title":"参与说明","summary":"本仓库以个人使用为目的维护，许可不允许再分发。欢迎提 issue 反馈问题； 提交 PR 前请先开 issue 讨论，避免白做。","hash":"7c263b7704aeecde","kind":null,"inferred":true,"status":null,"headings":[{"level":1,"text":"参与说明","line":1},{"level":2,"text":"提问题时","line":6},{"level":2,"text":"改脚本时","line":11},{"level":2,"text":"几条不要破坏的约定","line":38}],"front":{},"covers":[],"mentions":["singbox-selfcheck.sh","tests/fixtures/"],"links":[],"refs":[],"backlinks":["docs/safe-update.md"],"backrefs":[],"body":"# 参与说明\n\n本仓库以个人使用为目的维护，许可不允许再分发。欢迎提 issue 反馈问题；\n提交 PR 前请先开 issue 讨论，避免白做。\n\n## 提问题时\n\n跑一次 `./singbox.sh doctor`，附上诊断文件的内容。\n**贴之前删掉敏感信息**：节点地址、SNI、公钥、UUID、公网 IP。\n\n## 改脚本时\n\n改完先跑这两条，都退出 0 才算过：\n\n```bash\n./singbox-selfcheck.sh singbox.sh    # 静态自检\n./tests/selfcheck.test.sh            # 验证自检项真的在检查\n```\n\n第一条覆盖了几类在 Linux 上测不出来、只在 macOS 上炸的坑：\n\n| 检查 | 为什么 |\n|---|---|\n| 变量紧贴全角字符 | bash 3.2 会把全角字符的字节吞进变量名 |\n| `mktemp` 模板带后缀 | BSD 版要求 `XXXXXX` 必须在末尾 |\n| 数组在 `set -u` 下裸展开 | 空数组会报 unbound |\n| GNU 专有命令 | `sed -i`、`readlink -f`、`grep -P` 等 macOS 没有 |\n| `kill -9` | 强杀会留下残留路由 |\n| 遗留 `launchctl load/unload` | 报错含糊，应用 `bootstrap`/`bootout` |\n\n第二条存在的理由：自检项本身也会坏。曾经有 2 项用了 GNU 专有的 `grep -P`，在 BSD grep 上\n恒报 `invalid option` —— 既抓不到违规，也永远不会通过。`tests/fixtures/` 里放着一个干净样本\n和三个各犯一条规则的样本，用来验证「干净的能过、违规的被点名」。**改了 `singbox-selfcheck.sh`\n的规则，就要在那里补一个对应的 fixture**，否则没人知道新规则是不是空转的。\n\n自检通过不代表功能正确，仍需在真机上验证。\n\n## 几条不要破坏的约定\n\n- 只读命令（`verify`、`syscheck`、`rules`、`status`）不应要求 sudo\n- 任何覆盖配置的操作前必须备份\n- 停止进程一律 SIGTERM，等待后仍在则警告，**不强杀**\n- 交互操作在非 tty 环境下应自动取默认值，不能卡住\n"},{"path":"README.md","title":"macos-singbox-client-helper","summary":"在 macOS 上把 sing-box 作为系统服务直接运行的客户端配置方案与管理脚本。","hash":"cea924435ef85f47","kind":"entry","inferred":true,"status":null,"headings":[{"level":1,"text":"macos-singbox-client-helper","line":1},{"level":2,"text":"目录","line":11},{"level":2,"text":"1. 这是什么","line":22},{"level":3,"text":"双节点的分工","line":24},{"level":3,"text":"方案覆盖的要点","line":43},{"level":3,"text":"适用环境","line":51},{"level":3,"text":"不包含什么","line":58},{"level":2,"text":"2. 快速开始","line":65},{"level":2,"text":"3. 管理脚本 `singbox.sh`","line":80},{"level":3,"text":"脚本遵循的几条规矩","line":105},{"level":2,"text":"4. 文档","line":121},{"level":2,"text":"5. 仓库结构","line":163},{"level":2,"text":"6. 许可","line":218},{"level":2,"text":"免责声明","line":226}],"front":{},"covers":[],"mentions":["singbox.sh","tests/","tests/fixtures/"],"links":["docs/best-practices.md","docs/config-audit-and-modernize.md","docs/config-audit-findings-guide.md","docs/config-audit-findings.md","docs/config-audit-migration-table.md","docs/config-export.md","docs/maintaining.md","docs/manual-check.md","docs/manual-config.md","docs/manual-daily.md","docs/manual-install.md","docs/manual-update.md","docs/safe-update.md","docs/self-install-and-self-update.md","docs/verify-hardening.md"],"refs":[],"backlinks":["docs/config-audit-and-modernize.md","docs/config-audit-findings-guide.md","docs/config-audit-migration-table.md","docs/config-export.md","docs/safe-update.md","docs/self-install-and-self-update.md","docs/verify-hardening.md"],"backrefs":[],"body":"# macos-singbox-client-helper\n\n在 macOS 上把 sing-box 作为系统服务直接运行的**客户端**配置方案与管理脚本。\n\n一份可直接用的双节点分流配置、一个覆盖安装到卸载全流程的管理脚本，外加一份把每个字段\"为什么这么写\"讲清楚的文档。\n\n> **只负责客户端。** 服务端节点请自行搭建，本仓库不涉及服务端配置。\n\n---\n\n## 目录\n\n- [1. 这是什么](#1-这是什么)\n- [2. 快速开始](#2-快速开始)\n- [3. 管理脚本 singbox.sh](#3-管理脚本-singboxsh)\n- [4. 文档](#4-文档)\n- [5. 仓库结构](#5-仓库结构)\n- [6. 许可](#6-许可)\n\n---\n\n## 1. 这是什么\n\n### 双节点的分工\n\n方案使用两条 **VLESS + REALITY + Vision** 节点：\n\n| 节点 | 出口 | 承接什么 |\n|---|---|---|\n| `vpstrans` | 机房 IP | 大部分流量：AI 服务、开发工具、以及未被规则命中的兜底 |\n| `vpsre` | 住宅 IP | 对 IP 纯净度要求高的场景：社交类应用 |\n\n**两条节点的地址、端口、REALITY 参数完全相同，只有 UUID 不同。** 客户端都连 `vpstrans`，服务端按 UUID 决定是本机出网还是转发到住宅节点。这样客户端只需维护一个入口，住宅节点也不必直接暴露。\n\n```\nApp → utun 虚拟网卡 → 嗅探（还原域名）→ DNS 劫持 → 路由规则匹配\n                                                    ├─ reject   → 丢弃\n                                                    ├─ direct   → 物理网卡\n                                                    ├─ vpstrans → REALITY(UUID·A) → 机房 IP 出网\n                                                    └─ vpsre    → REALITY(UUID·B) → vpstrans 中转 → 住宅 IP 出网\n```\n\n### 方案覆盖的要点\n\n- **TUN 全局接管**，不依赖系统代理\n- **全链路禁用 IPv6**（系统接口 + TUN + DNS 三层）\n- **DNS 防泄漏**：境内外解析分流，两端都走 DoH\n- **禁用 QUIC**、广告拦截、局域网直连\n- 按域名分流：AI / 工具 → `vpstrans`，社交 → `vpsre`，中国域名与 IP → 直连\n\n### 适用环境\n\n- macOS，Intel 与 Apple Silicon 都可以（架构自动判断，按硬件而非 `uname -m`，所以 Rosetta 下的 shell 也不会选错）\n- **只有 macOS。** Windows 与 Linux 不在支持范围，也不打算支持：服务管理靠 launchd、网络与 DNS 靠 `networksetup` / `scutil`、配置校验靠 `plutil`，换平台等于另写一个程序。在非 macOS 上运行会点名当前系统并说明缺什么，然后退出\n- sing-box **1.12 / 1.13 / 1.14**（1.11 及更早的 DNS 格式不同，配置不兼容）\n- 本机代理场景，非软路由\n\n### 不包含什么\n\n- **服务端搭建。** 两条节点、UUID 分流、住宅节点中转都在服务端，请自行配置。\n- **节点参数。** 配置里全是占位符，需要你填自己的地址、SNI、公钥、UUID。\n\n---\n\n## 2. 快速开始\n\n```bash\ngit clone https://github.com/lzyMeta/macos-singbox-client-helper.git\ncd macos-singbox-client-helper && chmod +x singbox.sh\ncp config/config.example.json config.json && $EDITOR config.json   # 换掉 7 个 YOUR_ 占位符\n./singbox.sh -n install --config ./config.json                     # 空跑\n./singbox.sh install --config ./config.json                        # 真装，要管理员密码\n```\n\n装完 `singbox` 命令全局可用（`/usr/local/bin/singbox`），`update` 会连它一起升级。\n占位符怎么填、八个安装步骤各做什么、装完还要关浏览器 DoH——见 **[首次安装](docs/manual-install.md)**。\n\n---\n\n## 3. 管理脚本 `singbox.sh`\n\n覆盖安装、配置、验证、运行、排查、升级、卸载的全生命周期，22 个子命令。\n\n| 分类 | 命令 |\n|---|---|\n| 安装 | `install` `sysprep` |\n| 运行 | `status` `start` `stop` `restart` `enable` `disable` `logs` |\n| 检查 | `verify` `syscheck` `rules` `debug` `doctor` |\n| 配置 | `edit` `config`（含 `config audit`） `dns` |\n| 维护 | `update` `rollback` `mirror` `uninstall` |\n\n> `update` 升级的是**脚本与内核两样**；`rollback` 也是两样一起退。\n\n几个值得单独知道的：\n\n- **`verify`** 六步验证，**没有任何一步会被静默跳过**——退出码 `0` 全过、`1` 链路档失败（换内核可能修好）、`2` 仅策略档失败（DNS/QUIC/国内直连，回滚换不回来，`update` 不会因此回滚）。**第 2 步最关键**：两个出口 IP 必须不同——日志只能证明\"流量派给了 `vpsre` 出站\"，证明不了它的出口真是住宅 IP（那段中转在服务端，客户端看不见）。这是客户端侧唯一能发现中转断掉的手段。\n- **`config audit`** 审查配置里的废弃字段与不合法之处，用的是当前装着的那个内核。退出码 `0` 干净、`2` 有废弃项但现在还能跑、`1` 内核已经不接受。`--apply` 能自动改掉三类常见废弃写法（改前备份，改后四道验收，不过就不落地）；`--deep` 起一次沙箱收内核运行时的告警（要网络）。升级内核前跑一次。\n- **`syscheck`** 最容易忘、也最该记住。IPv6 与 DNS 设置**按网络服务生效、不会继承**——插网卡、连手机热点、公司 VPN 退出没还原 DNS，都会留下缺口，而代理看起来一切正常。\n- **`doctor`** 出问题先跑它，自动判读十类常见故障并输出诊断文件（写在 0700 的临时目录里 —— 里面有你访问过的域名与日志，贴出来之前先看一眼）。\n- **`edit`** 改配置走\"校验 → 备份 → 重启\"，两关都过才写入，不过则保留你的修改到临时文件。\n- **`dns`** 查看与切换系统 DNS。停服后 `1.1.1.1` 的明文查询在国内同样会被污染，所以 `stop` / `disable` / `uninstall` 会询问是否交回 DHCP。\n\n每个命令怎么用、出错看哪，见第 4 节的五份操作手册。\n\n### 脚本遵循的几条规矩\n\n- **绝不 `kill -9`**：强杀会留下残留路由，症状是断网且看不出原因。\n- **用 `bootstrap` / `bootout` 而非 `load` / `unload`**：后者报错含糊，`Load failed: 5: Input/output error` 几乎不给线索。\n- **改配置前一定备份**，带时间戳，自动保留最近 10 份。\n- **升级先换脚本再换内核**：`update` 的阶段 S 先把 `/usr/local/bin/singbox` 更新到最新 release 再继续 —— 历史上出问题的恰恰是升级逻辑本身而不是内核。取不到新脚本只 warn，不阻断内核升级。\n- **升级分四个阶段，每个阶段都能退回已知可用的状态**：阶段 1 把新内核装到临时前缀、用一份去掉 `tun`、改了端口的**派生配置**实跑并实测建链——现网服务全程不受影响；到阶段 2 才动 `/usr/local/bin/sing-box`，起不来就回滚；阶段 3 跑一遍 `verify` 六步验收。\n- **`rollback` 是随时能按的按钮**：升级成功后旧内核保留在 `sing-box.prev`，当时一切正常、半小时后才发现某个网站进不去，一条命令换回去。只保留一份，只能退一步。\n- **只读命令不要 sudo**：`verify`、`syscheck`、`rules` 全程无需管理员权限。\n\n改动脚本后跑 `./singbox-selfcheck.sh && ./tests/run.sh`。前半段是静态自检（13 项），覆盖几类 macOS 特有的坑（bash 3.2 的变量解析与 `shift 2` 的参数消耗、BSD `mktemp` 的模板限制、`set -u` 下的空数组展开等）；后半段是 `tests/` 下的测试文件（清单见第 5 节），用 PATH 前置的桩把脚本整个跑一遍——离线、不要 sudo、不碰真实系统。\n\n自检的每一项在 `tests/fixtures/` 里都有「会被抓到」和「不该被抓到」两种样本钉住。这不是形式主义：曾经有 2 项用了 GNU 专有的 `grep -P`，在 BSD grep 上恒报错、永远不绿；也曾有 1 项的正则只匹配恰好 2 空格缩进，于是恒绿、永远不报。两种坏法都不会自己暴露。\n\n---\n\n## 4. 文档\n\n**操作手册**（只讲怎么做，每份不超过 120 行）：\n\n| 手册 | 覆盖的命令 |\n|---|---|\n| [首次安装](docs/manual-install.md) | `install` `sysprep` |\n| [日常运行](docs/manual-daily.md) | `status` `start` `stop` `restart` `enable` `disable` `dns` `logs` |\n| [检查与排查](docs/manual-check.md) | `verify` `syscheck` `rules` `debug` `doctor` |\n| [改配置与配置审查](docs/manual-config.md) | `edit` `config`（含 `config audit`） |\n| [升级、回退与卸载](docs/manual-update.md) | `update` `rollback` `mirror` `uninstall` |\n\n**方案与原理**：\n\n| 文档 | 读它干什么 |\n|---|---|\n| **[docs/best-practices.md](docs/best-practices.md)** | 为什么这么配。配置逐字段详解、系统层准备、验证清单、故障排查、脚本的设计取舍 |\n| [docs/config-audit-findings.md](docs/config-audit-findings.md) | `config audit` 结论解读：只报不改的 19 条各是什么问题、拿模板举例、怎么判断要不要改、改成什么样 |\n| [docs/maintaining.md](docs/maintaining.md) | 维护者手册：验收、文档怎么不漂移、迁移表怎么更新 |\n\n`best-practices.md` 里几个容易踩的点：\n\n- **DNS 层为什么拦 AAAA 用 `NOERROR` 而拦广告用 `NXDOMAIN`**——用反了会把正常网站也弄挂\n- **规则集内部不是顺序匹配**，外层规则表才是；由此带来\"无法在规则集内部做排除\"的限制\n- **IP 规则匹配不到域名连接**，以及本方案刻意不插 `resolve` 的取舍\n- **规则集下载失败不会阻止启动**，只静默让规则永不命中——最隐蔽的一类故障\n- **系统 DNS 若是路由器地址，查询根本不进 TUN**，明文出网被投毒\n\n**设计记录**（按时间；写的是当时的问题与决定，不随代码更新，行号与数字以代码为准）：\n\n| 记录 | 内容 |\n|---|---|\n| [docs/safe-update.md](docs/safe-update.md) | `update` 重做为四阶段 + `rollback` |\n| [docs/verify-hardening.md](docs/verify-hardening.md) | `verify` 消除静默跳过，两档退出码 |\n| [docs/self-install-and-self-update.md](docs/self-install-and-self-update.md) | `install` 装 `singbox` 命令，`update` 阶段 S 脚本自更新 |\n| [docs/config-audit-and-modernize.md](docs/config-audit-and-modernize.md) | `config audit` 第一轮：两路发现层 + `--apply` |\n| [docs/config-audit-migration-table.md](docs/config-audit-migration-table.md) | `config audit` 第二轮：四路发现层、迁移表、三条改写规则 |\n| [docs/config-audit-findings-guide.md](docs/config-audit-findings-guide.md) | `config audit` 第三轮（规格）：每条「怎么办」的解读文档、`--deep` 撤条说明 |\n| [docs/config-export.md](docs/config-export.md) | `config export`（规格）：把生效配置导出到自定义路径，防覆盖、0600、进程陈旧性警告 |\n\n---\n\n## 5. 仓库结构\n\n```\n.\n├── README.md                  本文件\n├── LICENSE                    许可（个人使用）\n├── singbox.sh                 管理脚本\n├── singbox-selfcheck.sh       脚本静态自检\n├── .github/workflows/\n│   └── release.yml            /sdlc-kit:release 触发（workflow_dispatch）：校验 tag == VERSION，建 release 并传 singbox.sh\n├── tests/\n│   ├── run.sh                 跑 tests/ 下所有 *.test.sh\n│   ├── cli.test.sh            参数解析\n│   ├── selfcheck.test.sh      验证自检项真的在检查\n│   ├── install.test.sh        install 把脚本装成 $PREFIX/bin/singbox\n│   ├── selfupdate.test.sh     update 阶段 S（脚本自更新）的状态机\n│   ├── update.test.sh         update / rollback 的状态机断言\n│   ├── logs.test.sh           日志体积可见性与原地截断\n│   ├── platform.test.sh       平台与 CPU 架构判定（Rosetta）\n│   ├── verify.test.sh         verify 的两档退出码\n│   ├── config-audit.test.sh   config audit 的发现层、迁移表与 --apply\n│   ├── config-export.test.sh  config export 的防覆盖、0600 与进程陈旧性警告\n│   ├── doctor.test.sh         doctor / status 对 TUN 路由的判读\n│   ├── template.test.sh       config.example.json 过 audit、且与 live 逐键一致\n│   ├── docs.test.sh           手册对着源头核对（子命令、文件清单、目录、配置全文…）\n│   └── fixtures/              样本脚本与 PATH 桩（假 sudo / curl / launchctl 等）\n├── config/\n│   └── config.example.json    配置模板（占位符）\n└── docs/\n    ├── manual-install.md      操作手册：首次安装\n    ├── manual-daily.md        操作手册：日常运行\n    ├── manual-check.md        操作手册：检查与排查\n    ├── manual-config.md       操作手册：改配置与配置审查\n    ├── manual-update.md       操作手册：升级、回退与卸载\n    ├── best-practices.md      方案文档与字段详解\n    ├── config-audit-findings.md\n    │                          config audit 结论解读：19 条只报不改的条目各一节\n    ├── maintaining.md         维护者手册\n    ├── safe-update.md         设计记录：update 四阶段 + rollback\n    ├── verify-hardening.md    设计记录：verify 收紧\n    ├── self-install-and-self-update.md\n    │                          设计记录：singbox 命令自动安装与脚本自更新\n    ├── config-audit-and-modernize.md\n    │                          设计记录：config audit 第一轮\n    ├── config-audit-migration-table.md\n    │                          设计记录：config audit 第二轮（迁移表）\n    ├── config-audit-findings-guide.md\n    │                          规格：config audit 第三轮（结论解读文档）\n    └── config-export.md       规格：config export 导出生效配置\n```\n\n`.gitignore` 已排除 `config.json`、`*.bak`、`ui/`、`cache.db` 等本地产物——**填好参数的配置不要提交**。\n\n---\n\n## 6. 许可\n\n**仅限个人使用。** 见 [LICENSE](LICENSE)。\n\n允许个人下载、使用、修改；不允许商业使用、再分发或作为服务提供。这不是 OSI 意义上的开源许可，GitHub 也不会将其识别为标准协议。\n\n---\n\n## 免责声明\n\n本仓库仅提供客户端配置与管理工具。使用者需自行确保其使用方式符合所在地区的法律法规。作者不对使用本仓库内容产生的任何后果负责。\n"},{"path":"docs/best-practices.md","title":"在 macOS 上直接运行 sing-box —— 配置最佳实践","summary":"前两章是配置本身（是什么、为什么这么写），第 3、4 章是动手前的环境准备。如果你只想理解方案，读 1、2 就够；要真正跑起来，从第 3 章开始按顺序做。","hash":"8aa8cd9c3702e2ff","kind":"design","inferred":false,"status":null,"headings":[{"level":1,"text":"在 macOS 上直接运行 sing-box —— 配置最佳实践","line":6},{"level":2,"text":"怎么读这份文档","line":15},{"level":2,"text":"目录","line":31},{"level":2,"text":"0. 架构与取舍","line":90},{"level":3,"text":"0.1 数据流向","line":92},{"level":3,"text":"0.2 关键决策","line":102},{"level":2,"text":"1. 配置全文","line":116},{"level":2,"text":"2. 配置逐字段详解","line" \n> 目标：TUN 全局接管 + 全链路禁用 IPv6 + DNS 防泄漏 + VLESS-REALITY-Vision 双节点按域名分流\n> 参考：sing-box 官方文档 `https://sing-box.sagernet.org/configuration/`\n> 适用内核：**sing-box 1.12 / 1.13 / 1.14**（1.11 及更早的 DNS 格式不同，本文配置不兼容）\n\n---\n\n## 怎么读这份文档\n\n| 你的目标 | 看哪几节 |\n|---|---|\n| 从零跑起来 | 3 → 4 → 1 → 5 → 6 |\n| 只想拿配置 | 1 |\n| 搞懂每个字段为什么这么写 | 2 |\n| 验证配置对不对 | 5 |\n| 出问题了 | 7 |\n\n前两章是**配置本身**（是什么、为什么这么写），第 3、4 章是**动手前的环境准备**。如果你只想理解方案，读 1、2 就够；要真正跑起来，从第 3 章开始按顺序做。\n\n**第 4 节不能跳。** 本方案有三件事必须在 macOS 系统层面做，配置文件管不了：关闭 IPv6、把系统 DNS 指向非局域网地址、退掉其他 VPN 客户端。这三件事没做，配置写得再对也会出现\"能连但打不开\"\"IPv6 没禁住\"\"DNS 被投毒\"这类问题——而且症状完全不指向真正的原因。\n\n---\n\n## 目录\n\n- [0. 架构与取舍](#0-架构与取舍)\n  - [0.1 数据流向](#01-数据流向)\n  - [0.2 关键决策](#02-关键决策)\n- [1. 配置全文](#1-配置全文)\n- [2. 配置逐字段详解](#2-配置逐字段详解)\n  - [2.1 顶层结构与 `log`](#21-顶层结构与-log)\n  - [2.2 `dns`](#22-dns)\n  - [2.3 `inbounds`](#23-inbounds)\n  - [2.4 `outbounds`](#24-outbounds)\n  - [2.5 `route` 顶层](#25-route-顶层)\n  - [2.6 `route.rules[]` 与匹配语义](#26-routerules-与匹配语义)\n  - [2.7 `route.rule_set[]`](#27-routerule_set)\n  - [2.8 `experimental.cache_file`](#28-experimentalcache_file)\n  - [2.9 版本兼容对照](#29-版本兼容对照)\n- [3. 安装 sing-box](#3-安装-sing-box)\n  - [3.1 用官方 release，别用 Homebrew](#31-用官方-release别用-homebrew)\n  - [3.2 放置配置](#32-放置配置)\n- [4. macOS 系统层准备（不可跳过）](#4-macos-系统层准备不可跳过)\n  - [4.1 关闭 IPv6](#41-关闭-ipv6)\n  - [4.2 把系统 DNS 指向非局域网地址](#42-把系统-dns-指向非局域网地址)\n  - [4.3 退掉其他 VPN 客户端](#43-退掉其他-vpn-客户端)\n  - [4.4 浏览器自带 DoH 要关掉](#44-浏览器自带-doh-要关掉)\n- [5. 验证清单](#5-验证清单)\n  - [5.1 静态校验（不启动内核）](#51-静态校验不启动内核)\n  - [5.2 规则集验证](#52-规则集验证)\n  - [5.3 连通性快测](#53-连通性快测)\n  - [5.4 前台试跑](#54-前台试跑)\n  - [5.5 服务与 TUN](#55-服务与-tun)\n  - [5.6 先绕开 TUN 验证节点链路](#56-先绕开-tun-验证节点链路)\n  - [5.7 系统层复查](#57-系统层复查)\n  - [5.8 QUIC 与局域网](#58-quic-与局域网)\n  - [5.9 出口 IP 与国内直连](#59-出口-ip-与国内直连)\n- [6. 运行与开机自启](#6-运行与开机自启)\n  - [6.1 LaunchDaemon](#61-launchdaemon)\n  - [6.2 日常操作](#62-日常操作)\n  - [6.3 三个必须知道的坑](#63-三个必须知道的坑)\n  - [6.4 关于路由丢失](#64-关于路由丢失)\n- [7. 故障排查](#7-故障排查)\n  - [7.1 速查表](#71-速查表)\n  - [7.2 端口被占用](#72-端口被占用)\n  - [7.3 日志里出现 FakeIP 地址](#73-日志里出现-fakeip-地址)\n  - [7.4 排查顺序建议](#74-排查顺序建议)\n  - [7.5 服务加载失败](#75-服务加载失败)\n  - [7.6 关于 `strict_route`](#76-关于-strict_route)\n- [8. 安全与维护](#8-安全与维护)\n- [9. 脚本的设计取舍](#9-脚本的设计取舍)\n  - [9.1 几条纪律](#91-几条纪律)\n  - [9.2 verify 的两档退出码](#92-verify-的两档退出码)\n  - [9.3 日志为什么只能原地截断](#93-日志为什么只能原地截断)\n  - [9.4 DNS 备份的归一化](#94-dns-备份的归一化)\n  - [9.5 edit 的编辑器回退](#95-edit-的编辑器回退)\n  - [9.6 update 的沙箱与完整性校验](#96-update-的沙箱与完整性校验)\n  - [9.7 镜像回退](#97-镜像回退)\n  - [9.8 架构判定](#98-架构判定)\n\n---\n\n## 0. 架构与取舍\n\n### 0.1 数据流向\n\n```\nApp → utun 虚拟网卡 → sniff（还原域名）→ DNS 劫持 → 路由规则匹配\n                                                    ├─ reject   → 丢弃\n                                                    ├─ direct   → 物理网卡\n                                                    ├─ vpstrans → REALITY(UUID·A) → 机房 IP 出网\n                                                    └─ vpsre    → REALITY(UUID·B) → vpstrans 中转 → 住宅 IP 出网\n```\n\n### 0.2 关键决策\n\n| 决策点 | 结论 | 原因 |\n|---|---|---|\n| 运行方式 | launchd 系统服务（LaunchDaemon） | TUN 需要 root，用户级 LaunchAgent 拿不到 |\n| 安装来源 | **官方 release 二进制**，不用 Homebrew | 见 3.1 |\n| 两个节点 | 地址/端口/REALITY 参数完全相同，只有 UUID 不同 | 服务端按 UUID 决定本机出网还是转发到住宅 IP |\n| IPv6 | 系统接口 + TUN + DNS 三层全关 | 未接管的 IPv6 绕过全部路由规则直连，是最隐蔽的泄漏面 |\n| 协议栈 | `gvisor` | macOS 上兼容性最好；需内核带 `with_gvisor` 编译标签 |\n| 兜底出站 | `vpstrans`（而非 direct） | 中国域名和 IP 已明确直连，未收录的境外站默认走代理，避免真实 IP 因漏网域名暴露 |\n| FakeIP | **不用** | 能杜绝解析泄漏，但会破坏部分 macOS 原生 App 和局域网发现，本机代理场景收益不大 |\n\n---\n\n## 1. 配置全文\n\n需要替换的占位符：`YOUR_VPSTRANS_ADDR`、`YOUR_SNI`、`YOUR_PUBLIC_KEY`、`YOUR_SHORT_ID`、`YOUR_UUID_VPSTRANS`、`YOUR_UUID_VPSRE`、`YOUR_CLASH_SECRET`。\n\n> 两个 UUID 必须换成标准的 8-4-4-4-12 格式。\n\n```json\n{\n  \"$schema\": \"https://sing-box.sagernet.org/schema.json\",\n  \"log\": {\n    \"level\": \"info\",\n    \"timestamp\": true\n  },\n  \"dns\": {\n    \"servers\": [\n      {\n        \"type\": \"https\",\n        \"tag\": \"dns-remote\",\n        \"detour\": \"vpstrans\",\n        \"server\": \"1.1.1.1\"\n      },\n      {\n        \"type\": \"https\",\n        \"tag\": \"dns-direct\",\n        \"detour\": \"direct\",\n        \"server\": \"223.5.5.5\"\n      }\n    ],\n    \"rules\": [\n      {\n        \"query_type\": [\n          \"AAAA\",\n          \"HTTPS\"\n        ],\n        \"action\": \"predefined\",\n        \"rcode\": \"NOERROR\"\n      },\n      {\n        \"rule_set\": \"geosite-category-ads-all\",\n        \"action\": \"predefined\",\n        \"rcode\": \"NXDOMAIN\"\n      },\n      {\n        \"rule_set\": [\n          \"geosite-cn\",\n          \"geosite-apple-cn\",\n          \"geosite-microsoft-cn\"\n        ],\n        \"server\": \"dns-direct\"\n      }\n    ],\n    \"final\": \"dns-remote\",\n    \"strategy\": \"ipv4_only\"\n  },\n  \"inbounds\": [\n    {\n      \"type\": \"tun\",\n      \"tag\": \"tun-in\",\n      \"interface_name\": \"utun233\",\n      \"mtu\": 9000,\n      \"address\": \"172.19.0.1/30\",\n      \"auto_route\": true,\n      \"stack\": \"gvisor\"\n    },\n    {\n      \"type\": \"mixed\",\n      \"tag\": \"mixed-in\",\n      \"listen\": \"127.0.0.1\",\n      \"listen_port\": 10808\n    }\n  ],\n  \"outbounds\": [\n    {\n      \"type\": \"vless\",\n      \"tag\": \"vpstrans\",\n      \"domain_resolver\": {\n        \"server\": \"dns-direct\",\n        \"strategy\": \"ipv4_only\"\n      },\n      \"server\": \"YOUR_VPSTRANS_ADDR\",\n      \"server_port\": 443,\n      \"uuid\": \"YOUR_UUID_VPSTRANS\",\n      \"flow\": \"xtls-rprx-vision\",\n      \"tls\": {\n        \"enabled\": true,\n        \"server_name\": \"YOUR_SNI\",\n        \"utls\": {\n          \"enabled\": true,\n          \"fingerprint\": \"chrome\"\n        },\n        \"reality\": {\n          \"enabled\": true,\n          \"public_key\": \"YOUR_PUBLIC_KEY\",\n          \"short_id\": \"YOUR_SHORT_ID\"\n        }\n      },\n      \"packet_encoding\": \"xudp\"\n    },\n    {\n      \"type\": \"vless\",\n      \"tag\": \"vpsre\",\n      \"domain_resolver\": {\n  {\n    \"cache_file\": {\n      \"enabled\": true,\n      \"path\": \"/usr/local/etc/sing-box/cache.db\"\n    },\n    \"clash_api\": {\n      \"external_controller\": \"127.0.0.1:9090\",\n      \"external_ui\": \"ui\",\n      \"external_ui_download_url\": \"https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip\",\n      \"external_ui_download_detour\": \"vpstrans\",\n      \"secret\": \"YOUR_CLASH_SECRET\"\n    }\n  }\n}\n```\n\n---\n\n## 2. 配置逐字段详解\n\n本节讲\"每个字段是什么、为什么这么写\"。依据官方文档 `https://sing-box.sagernet.org/configuration/`。\n\n### 2.1 顶层结构与 `log`\n\n官方定义的顶层键有 `log` / `dns` / `ntp` / `certificate` / `endpoints` / `inbounds` / `outbounds` / `route` / `services` / `experimental` 等，本配置用到五个。\n\n`config/config.example.json` 顶层带一行 `\"$schema\": \"https://sing-box.sagernet.org/schema.json\"`：\n这是给手写配置的人用的——VS Code 之类的编辑器读到它就能补全字段名、对拼错的键画红线。\n它本身不是 sing-box 的配置项，内核 1.14.0 的 `check` 与 `schema` 都把它当合法顶层键接受\n（`option/options.go:17`），所以 `config audit` 不会报它。它也**不会**被 `config audit` 建议引入：\n「建议加 X」是策略，审查只管合法性。想要就抄这一行，不想要删掉也没有任何影响。\n\n| `log` 字段 | 值 | 说明 |\n|---|---|---|\n| `level` | `info` | 级别：`trace` `debug` `info` `warn` `error` `fatal` `panic`。排查分流问题时临时调 `debug`，能看到每条连接命中了哪条规则 |\n| `timestamp` | `true` | 排查时间相关问题（如睡眠唤醒）时必须有 |\n\n### 2.2 `dns`\n\n#### `dns.servers[]` — 定义解析器\n\n| 字段 | 说明 |\n|---|---|\n| `type` | 解析器类型。本配置用 `https`（DoH）。另有 `udp` `tcp` `tls` `quic` `h3` `local` `hosts` `fakeip` 等 |\n| `tag` | 名字，供 `dns.rules[].server`、`dns.final`、`domain_resolver.server` 引用，必须唯一 |\n| `server` | 解析器地址。**刻意填 IP 而非域名**，见下 |\n| `detour` | 这条查询走哪个出站。防泄漏的关键字段 |\n\n本配置两个：`dns-remote` = `1.1.1.1` over DoH 走 `vpstrans`（境外域名）；`dns-direct` = `223.5.5.5` over DoH 走 `direct`（国内域名）。两条都是加密的，运营商 DNS 拿不到任何查询记录。\n\n**为什么不写成 `https://dns.google/dns-query` 这类域名形式**：\n\n1. **bootstrap 的鸡蛋问题，且解析结果不可信。** 写域名就得先解析 `dns.google` 本身，用的是 `route.default_domain_resolver`（本配置是国内 DoH）。而 `dns.google` / `cloudflare-dns.com` 在国内是重点污染对象，拿回来很可能是假 IP。虽然连接走 `detour` 出去，但目标 IP 已经错了，TLS 校验必然失败 → 远程 DNS 直接瘫痪，症状是\"代理连得上但什么网站都打不开\"。\n2. **写两个 DoH 不会自动故障转移。** `rules[].server` 是单值、`final` 也只能指一个 tag，没有 mihomo 那种 fallback/竞速机制。\n\n想要冗余就仍用 IP 字面量加第二个 tag：\n\n```json\n{ \"type\": \"https\", \"tag\": \"dns-remote\",  \"server\": \"1.1.1.1\", \"detour\": \"vpstrans\" },\n{ \"type\": \"https\", \"tag\": \"dns-remote2\", \"server\": \"8.8.8.8\", \"detour\": \"vpstrans\" }\n```\n\n`1.1.1.1` 和 `8.8.8.8` 的证书都签了 IP SAN，用 IP 直连 DoH 校验能过。哪条不通了改 `final` 重启即可。顺带一提，`1.1.1.1` 本身就是 anycast，\"用域名能拿多个 A 记录做负载\"这个优势并不存在。\n\n#### `dns.rules[]` — 决定谁用哪个解析器\n\n自上而下匹配，**第一条命中即停**。同一条规则内，同字段多值是\"或\"，不同字段之间是\"与\"。\n\n| `action` | 含义 |\n|---|---|\n| `route`（默认） | 转给 `server` 指定的解析器 |\n| `route-options` | 不改变目标解析器，只调整本次查询的选项 |\n| `reject` | 拒绝。`method: default` 回 REFUSED，`method: drop` 直接丢弃 |\n| `predefined` | 不发查询，直接返回写好的应答。配 `rcode` 使用 |\n\n官方支持的 `rcode`：`NOERROR` `FORMERR` `SERVFAIL` `NXDOMAIN` `NOTIMP` `REFUSED`。\n\n**本配置三条规则**\n\n1. `query_type: [\"AAAA\",\"HTTPS\"]` + `predefined` + `NOERROR`\n   不查询，直接回\"成功但无记录\"。\n   **为什么是 `NOERROR` 而不是 `NXDOMAIN`**：`NOERROR` 的语义是\"域名存在，只是没有这类记录\"，应用会回退到 IPv4；`NXDOMAIN` 是\"域名不存在\"，部分应用据此判定整个域名不可用，连 A 记录都不再问，正常网站也会打不开。\n   拦 `HTTPS`（SVCB/HTTPS 记录）是因为它携带 IPv6 hint 与 ALPN，浏览器可能据此直接发起 IPv6 或 HTTP/3 连接，绕过前两道防线。\n\n2. `rule_set: geosite-category-ads-all` + `predefined` + `NXDOMAIN`\n   广告域名在解析阶段就判\"不存在\"。这里**反过来要用 `NXDOMAIN`**，目的就是让应用彻底放弃。\n   它与路由层的广告 `reject` 是两道独立防线：DNS 层拦下连接根本不会发起；路由层兜底应用绕过系统 DNS 或硬编码 IP 的情况。\n\n3. `rule_set: [geosite-cn, geosite-apple-cn, geosite-microsoft-cn]` + `server: dns-direct`\n   国内域名交给国内 DoH。**这是分流准确性的地基**：国内站点必须由国内解析器解析才能拿到就近 CDN 的 IP，路由层的 `geoip-cn` 才匹配得上。若被境外 DNS 解析，返回境外节点 IP，`geoip-cn` 不命中，流量被兜底送去代理——症状是淘宝、B 站特别慢，极易误判成节点问题。\n\n> **一条必须记住的规律**：`dns.rules` 里判为国内解析的集合，和 `route.rules` 里判为 `direct` 的集合，应当是**同一个集合**。改动其中一边，另一边必须同步。这是这类配置最高频的错误来源，而且大部分情况下不报错、只是变慢。\n\n#### `dns` 顶层字段\n\n| 字段 | 本配置 | 说明 |\n|---|---|---|\n| `final` | `dns-remote` | 都没命中时用哪个解析器。设成境外解析是**防泄漏兜底**：未知域名宁可绕一圈也不交给本地 DNS |\n| `strategy` | `ipv4_only` | 默认解析策略。与第 1 条规则重复设防 |\n| `disable_expire` | 不写（默认 `false`） | 遵守 TTL。设 `true` 会让记录永不过期，CDN 调度变更后会连到失效 IP |\n\n没写但值得知道的：`disable_cache`（排查时有用）、`cache_capacity`、`reverse_mapping`（**官方明确说在 macOS 这类系统代理并缓存 DNS 的环境下容易出问题**，别开）、`client_subnet`。\n\n> `independent_cache` 已在 **1.14 废弃**，所以本配置没有。1.12/1.13 上写它仍有效，但升级后会报废弃告警。\n\n### 2.3 `inbounds`\n\n#### TUN\n\n| 字段 | 本配置 | 说明 |\n|---|---|---|\n| `interface_name` | `utun233` | 固定下来便于 `ifconfig` 排查。如遇冲突可整行删掉让系统自动分配 |\n| `address` | `172.19.0.1/30` | **只给 IPv4 = 不启用 IPv6**。1.10 起 `inet4_address`/`inet6_address` 合并成了这个字段 |\n| `mtu` | `9000` | |\n| `auto_route` | `true` | 把默认路由指向 TUN。官方提醒：为避免流量回环，必须同时设置 `route.auto_detect_interface` 或 `default_interface` 或 `bind_interface`——本配置用前者 |\n| `strict_route` | 不写（默认 `false`） | 官方说明它可让不支持的网络不可达并防 Windows 多网卡 DNS 泄漏，同时可能让某些应用无法工作。**macOS 上开启常导致局域网设备不可达**，故关闭；由此带来的 DNS 问题用 2.2 的方式解决 |\n| `stack` | `gvisor` | `system` 用系统栈，`gvisor` 用虚拟栈，`mixed` 是 system TCP + gvisor UDP。**默认值取决于编译标签**，显式写死更可控 |\n\n> **1.14 新增 `dns_mode` 与 `dns_address`。** 默认 `dns_mode: hijack`，且 `dns_address` 未设置时会自动劫持派生地址上的 DNS，效果等同一条 `hijack-dns` 路由动作。所以在 1.14 上配置里那条显式 `hijack-dns` 是冗余的——保留无害，1.13 及以下必须有。\n\n#### mixed\n\n`127.0.0.1:10808` 同时提供 SOCKS5 和 HTTP 代理。\n\n**别删它。** 没有 GUI 日志窗口之后，它是唯一能绕开 TUN 单独验证节点链路的手段：\n\n```bash\ncurl -s --max-time 10 -x socks5h://127.0.0.1:10808 https://api.ipify.org\n```\n\n能返回 vpstrans 的 IP，说明内核、节点、REALITY 握手全部正常，问题只可能在 TUN 那一层。这一步能把故障范围直接砍一半。\n\n**`listen` 必须写 `127.0.0.1` 而不是 `0.0.0.0`**，否则局域网内任何人都能用你的代理。\n\n### 2.4 `outbounds`\n\n两条 VLESS 出站，**唯一的区别是 `uuid`**：\n\n| 字段 | 说明 |\n|---|---|\n| `tag` | 路由规则里 `outbound` 填的值 |\n| `server` / `server_port` | 两条节点**完全相同**——都连 vpstrans |\n| `uuid` | 身份凭证。服务端据此决定本地出网还是中转到住宅 IP |\n| `flow` | `xtls-rprx-vision` |\n| `packet_encoding` | `xudp`。多目标 UDP（游戏、部分 P2P）需要它 |\n| `tls.server_name` | SNI，必须与服务端 REALITY 的目标一致 |\n| `tls.utls` | uTLS 指纹伪装。**REALITY 必须开** |\n| `tls.reality.public_key` / `short_id` | 服务端签发 |\n| `domain_resolver` | 解析 `server` 里域名时用哪个解析器。本配置 `server` 填 IP 所以用不上，写着是为了兼容 |\n\ndirect 出站的 `domain_resolver` 含义不同——官方明确区分：**`direct` 出站影响的是\"请求里的域名\"，其他出站影响的是\"服务器地址里的域名\"**。所以这里的 `{server: dns-direct, strategy: ipv4_only}` 意思是：走直连的请求用国内 DoH 解析，且只要 IPv4。\n\n> 官方的 `type: block` 和 `type: dns` 出站**都已废弃**，现在用路由动作代替，见 2.9。\n\n### 2.5 `route` 顶层\n\n| 字段 | 说明 |\n|---|---|\n| `auto_detect_interface` | 自动跟随系统默认网卡。与 `auto_route` 配套，是防流量回环的必需项，也是切换 Wi-Fi 后能自愈的原因。**别改成写死 `default_interface`**，那样换网络就断 |\n| `default_domain_resolver` | 所有没单独指定 `domain_resolver` 的出站默认用它。1.12 引入 |\n| `final` | 都没命中时走哪个出站 |\n\n### 2.6 `route.rules[]` 与匹配语义\n\n#### 动作分终止型与非终止型\n\n**这是最容易写错的地方。** 并非所有动作都终止匹配：\n\n| 动作 | 命中后 | 说明 |\n|---|---|---|\n| `route`（写了 `outbound` 就是它） | **终止** | 派给指定出站 |\n| `reject` | **终止** | 拒绝 |\n| `hijack-dns` | **终止** | 交给内置 DNS 模块 |\n| `sniff` | **继续** | 只做协议嗅探，给后续规则补上域名信息 |\n| `resolve` | **继续** | 只把域名解析成 IP，让后面的 IP 类规则有东西可匹配 |\n| `route-options` | **继续** | 只调整本次连接的选项 |\n\n这正是第一条 `{\"action\":\"sniff\"}` 不会把所有流量吞掉的原因——它匹配一切，但不终止。**如果 `sniff` 是终止型动作，后面十几条规则一条都不会执行。**\n\n#### 单条规则内部：同字段\"或\"，跨字段\"与\"\n\n```json\n{ \"network\": \"udp\", \"port\": 443, \"action\": \"reject\" }\n```\n= UDP **且** 443 → 只拦 QUIC，不影响 DNS(53) 和 Discord 语音。\n\n```json\n{ \"rule_set\": [\"geosite-cn\", \"geoip-cn\"], \"outbound\": \"direct\" }\n```\n= 命中 geosite-cn **或** geoip-cn。\n\n所以 `domain_suffix` 和 `rule_set` **不能塞进同一条规则**（会变成\"域名后缀匹配**且**规则集匹配\"，几乎永远不命中），必须拆开。配置里的 TikTok 补丁就是因此单独成条的。\n\n需要跨字段取\"或\"时可用逻辑规则 `{\"type\":\"logical\",\"mode\":\"or\",\"rules\":[...]}`，本配置为可读性选择拆成多条——效果等价，且日志里能一眼看出命中的是哪条。\n\n#### 本配置的规则逐条\n\n| 序 | 规则 | 在做什么 |\n|---|---|---|\n| 1 | `{\"action\":\"sniff\"}` | 对所有流量做嗅探。**必须第一条**：TUN 收到的是 IP 包，不嗅探就没有域名，后面所有域名规则和 `rule_set` 全部失效 |\n| 2 | `{\"protocol\":\"dns\",\"action\":\"hijack-dns\"}` | DNS 流量交给内置模块，不让它出网 |\n| 3 | `{\"ip_is_private\":true}` → `direct` | 私有地址直连。取代老写法 `geoip: private` |\n| 4 | `domain_suffix: local/localhost/lan/home/home.arpa/arpa` → `direct` | 本地域名直连，保 Bonjour、AirDrop、内网主机名。`home` 用于路由器常见的 `*.home`，`home.arpa` 是 RFC 标准写法 |\n| 5 | `rule_set: geosite-private` → `direct` | 规则集里的私有域名 |\n| 6 | `{\"network\":\"udp\",\"port\":443,\"action\":\"reject\"}` | 禁 QUIC |\n| 7 | `rule_set: geosite-category-ads-all` → `reject` | 广告拦截（连接层） |\n| 8 | `rule_set: [anthropic, openai, category-ai-!cn]` → `vpstrans` | AI |\n| 9 | `rule_set: [github, google, bing]` → `vpstrans` | 工具 |\n| 10 | `domain_suffix: [tt* 四个]` → `vpsre` | TikTok 规则集漏掉的 CDN 域补丁 |\n| 11 | `rule_set: [tiktok, meta, x, telegram, discord, whatsapp]` → `vpsre` | 社交 |\n| 12 | `rule_set: geoip-telegram` → `vpsre` | Telegram 会回落到内置 DC IP 直连，这类连接没有域名，靠这条兜住 |\n| 13 | `rule_set: [apple-cn, microsoft-cn]` → `direct` | 中国化直连，**必须排在第 14 条之前**，否则会被 `geolocation-!cn` 捞去代理 |\n| 14 | `rule_set: [gfw, geolocation-!cn]` → `vpstrans` | 墙外兜底 |\n| 15 | `rule_set: [geosite-cn, geoip-cn]` → `direct` | 国内兜底 |\n| — | `final: vpstrans` | 以上全不命中 |\n\n#### 顺序原则\n\n1. **非终止动作放最前**：`sniff`、`hijack-dns` 必须是第 1、2 条。\n2. **越具体越靠前**：局域网 → 拦截 → 具体业务 → 大类地理 → `final`。\n3. **拦截类放在放行类之前**：广告 `reject` 如果排在 `geolocation-!cn → 代理` 后面，绝大多数广告域名会先被后者捞走，拦截形同虚设。\n4. **例外规则压在通用规则之上**：想让某个域名不落进后面的大类规则，就在它之前单独开一条。\n\n#### 关于第 14、15 条的顺序：这是取舍不是最优解\n\n把 `geosite-cn` / `geoip-cn` 放在 `gfw` / `geolocation-!cn` **之后**，两个方向都有代价：\n\n* **收益**：`geosite-cn` 含一条裸的 `domain_suffix: \"cn\"`，匹配**所有** `.cn` 域名，其中一部分实际需要走代理。放到后面，`geolocation-!cn` 先拿到判定权。\n* **代价**：同时出现在两个集合里的域名一律走代理，国内可直连的境外站点会绕路。\n* **次生不一致**：`dns.rules` 里 `geosite-cn` 仍走国内解析，可能出现\"用国内 DNS 拿到国内 IP、却走代理去连它\"。不致命，但会莫名其妙地慢。\n\n**这个收益比看起来小**：第 8/9 条已把 AI、GitHub、Google、Bing 提前捞走，它们的 `.cn` 域名（`googleapis.cn` 等）根本轮不到第 15 条。裸 `cn` 后缀的实际影响只剩\"不属于前面任何业务组、但确实需要代理的 `.cn` 域名\"。别假设 `geosite-google` 一定收录了它们，用 `sing-box rule-set match google.srs services.googleapis.cn` 验一下，不命中就按 2.7 加显式规则。\n\n对\"宁可多绕一圈也不漏出去\"的取向，这个顺序自洽。**日后发现国内站点明显变慢，第一个要怀疑这里，而不是节点。**\n\n#### 一个容易忽略的陷阱：IP 规则匹配不到域名连接\n\n经过嗅探的连接携带的是**域名**。IP 类规则（`ip_cidr`、`geoip-*`）匹配的是目标 IP，对这类连接**不会命中**，除非插入 `{\"action\": \"resolve\"}`。\n\n本配置没有插 `resolve`，是刻意的：\n\n* 域名侧由 `geosite-cn` 覆盖，IP 侧的 `geoip-cn` 兜住直接用裸 IP 发起的连接（很多客户端软件、P2P、Telegram 都这么干）。两者分工，不重叠。\n* 插 `resolve` 意味着每条未命中的连接都要先做一次 DNS 查询才能继续匹配，既增加延迟，也让\"解析走哪个 DNS\"和\"路由走哪个出站\"互相纠缠，出问题极难定位。\n\n代价是：某个境外域名如果 `geosite` 没收录、但它的 IP 在 `geoip-cn` 里，不会被判直连，会走到 `final` 代理。对本方案来说这个方向的错误可以接受。\n\n> 顺带说明：这也解释了为什么删掉 `geoip-telegram` 省不下开销——IP 规则只对裸 IP 连接生效，成本是一次 CIDR 字典树查找，纳秒级。删掉它反而会让 Telegram 的 IP 回落流量落到 `final` 走机房出口，与社交组统一走住宅 IP 的意图冲突。\n\n### 2.7 `route.rule_set[]`\n\n| 字段 | 本配置 | 说明 |\n|---|---|---|\n| `type` | `remote` | 另有 `local`（读本地文件）和 `inline`（直接写在配置里） |\n| `format` | 不写 | 1.10 起按 URL 后缀推断：`.srs` 是 `binary`，`.json` 是 `source`。写了就必须和文件真实格式一致 |\n| `http_client.detour` | `vpstrans` | **通过代理下载**，规则集在国内多半下不动。1.14 起替代 `download_detour`（`config audit --apply` 会自动改） |\n| `update_interval` | `168h0m0s` | 自动更新周期（7 天）。`7d` 也接受，`sing-box format` 会把它写成这个样子 |\n\n#### `.srs` 和 `.json` 的区别\n\n同一份规则集，上游通常两种文件都提供，**内容等价，只是载体不同**：\n\n| | `.json`（`format: \"source\"`） | `.srs`（`format: \"binary\"`） |\n|---|---|---|\n| 可读性 | 纯文本，能看、能 diff、能手改 | 二进制 |\n| 体积 | 大 | 通常只有 json 的几分之一 |\n| 加载 | 每次启动解析文本再建索引 | 已编译好，直接映射，启动快、内存低 |\n| 用途 | 自己写、审查内容 | 日常运行、远程下载 |\n\n显式写 `format` 时必须和文件真实格式对应，写反了会加载失败——这是规则集报错里最常见的一种。\n\n转换与排查命令：\n\n```bash\nsing-box rule-set compile category-ai-!cn.json -o category-ai-!cn.srs\nsing-box rule-set decompile geosite-cn.srs          # 看规则集里到底有什么\nsing-box rule-set match geosite-cn.srs claude.ai    # 测某个域名会不会命中\n```\n\n`match` 是排查分流问题最快的办法——怀疑某域名被误捞时，一条命令就能证实，不用改配置重启试。\n\n> 这些命令需要本地有 `.srs` 文件。**`type: remote` 的规则集存在 `cache.db` 里，磁盘上没有单独文件**，得自己另下一份，见 5.2。\n\n> **`.srs` 有格式版本**，随 sing-box 演进升级。上游用新版生成的 srs，旧内核可能读不了，报错往往只是\"加载失败\"看不出原因。**内核大版本升级后建议手动触发一次规则集更新。**\n\n#### 规则集内部不是顺序匹配\n\n这一点和外层的 `route.rules` 完全不同：\n\n* **外层规则表**：有序，自上而下，命中即终止。\n* **规则集内部**：无序，本质是一个**集合**。只回答\"这个域名/IP 属不属于这个集合\"。\n\n原因是规则集里装的是 *headless rule*（无动作规则），**没有 `outbound`、没有 `action`**，不存在\"先命中哪条决定走哪里\"的问题。编译成 `.srs` 后更是如此：域名走前缀树、IP 走 CIDR 字典树，\"顺序\"在数据结构层面已经不存在。\n\n**由此带来一个限制**：无法在规则集内部做排除。想把某个域名从 `geosite-cn` 里摘出来，只能在外层、在引用该规则集的规则**之前**加一条自己的规则压过去。想反向匹配整个集合则用规则的 `invert` 字段。\n\n#### 多个规则集写一条还是拆成多条\n\n**结果完全一样，性能差别可以忽略。** 两种写法最坏情况下都要做同样多次集合查找，多出来的只是几次\"规则对象字段为空\"的判断，相对于集合查找本身微不足道。真正影响性能的是规则集的数量和体积，不是写成几行。\n\n选择依据是工程性的：\n\n| | 合并 | 拆开 |\n|---|---|---|\n| 日志可读性 | 只知道\"第 13 条命中\" | 能看出**具体哪个集合**命中 |\n| 中间插规则 | 不行，是一个整体 | 可以插入例外 |\n| 动作不同 | 做不到 | 天然支持 |\n| 后续误改风险 | 高：加个 `port` 会 AND 到全部集合 | 低 |\n\n建议：意图和动作都相同、不打算中间插东西的就合并；**调试期临时拆开**，日志里立刻能定位是哪个集合的问题，查完再合回去。\n\n#### 规则集来源：为什么用 MetaCubeX\n\nSagerNet 官方的 sing-geosite 源自 v2fly 数据，**没有 `gfw` 分类**，也没有 `apple-cn` / `microsoft@cn` 这样直接可用的子集。MetaCubeX 的 sing 分支源自 Loyalsoldier 数据，这几个都有。\n\n**但分类命名不都是望文生义的，上线前必须逐个验证 URL**：\n\n```bash\nBASE=https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/sing/geo\nfor f in geosite/private geosite/category-ads-all geosite/anthropic geosite/openai \\\n         \"geosite/category-ai-!cn\" geosite/github geosite/google geosite/bing \\\n         geosite/tiktok geosite/meta geosite/x geosite/telegram geosite/discord \\\n         geosite/whatsapp \"geosite/apple@cn\" \"geosite/microsoft@cn\" geosite/gfw \\\n         \"geosite/geolocation-!cn\" geosite/cn geoip/cn geoip/telegram; do\n  code=$(curl -s -o /dev/null -w \"%{http_code}\" \"$BASE/$f.srs\")\n  echo \"$code  $f\"\ndone\n```\n\n重点怀疑对象：`x.srs`（上游历史分类名是 `twitter`）、`meta.srs`（历史名是 `facebook`）、`anthropic.srs` / `bing.srs`（是否单独成类）、`apple@cn.srs`（MetaCubeX 文档里用的是 `apple-cn`，而 microsoft 确实是 `@cn` 形式，两者写法不同）。\n\n**为什么必须验**：`type: remote` 的规则集下载失败时，sing-box **不会拒绝启动**，只在日志里留一条告警，然后这条规则永远不命中。表现是\"某类流量莫名走了兜底\"，而规则表看起来完全正确。这是本方案最隐蔽的一类故障。\n\n拿不准的分类，用 `sing-box rule-set decompile` 打开看一眼实际域名，比猜名字快。\n\n#### 冷启动的先后问题\n\n规则集要通过代理下载，而代理选择又依赖规则集。实际不会死锁——规则集没就绪时路由退化到 `final`（全走 vpstrans），此时代理可用，规则集下得下来，下一轮就正常。**所以首次启动后等十几秒再测分流。**\n\n#### 规则集 vs 显式域名\n\n**默认用规则集。** 手写域名列表有三个坏处：会过时（新服务上线、老服务换域名，列表不会自己长）、会漏（一家服务往往有主站/API/CDN/鉴权好几个域名）、难维护。\n\n**只有三种情况需要显式域名**：\n\n1. 规则集还没收录（刚上线或小众服务）。加进去，过几个月回头检查，上游收录了就删掉。\n2. 要覆盖规则集的判断。\n3. 绕开规则集的已知缺陷——最实际的用途。\n\n**补丁的写法**是在被覆盖的规则**之前**单独开一条：\n\n```json\n{ \"domain_suffix\": [\"googleapis.cn\", \"gstatic.cn\"], \"outbound\": \"vpstrans\" }\n```\n\n这个例子来自 `geosite/cn.srs` 的裸 `cn` 后缀缺陷（见 2.6）。**本配置多半不需要它**——`geosite-google` 排在中国直连之前，这些域名早被捞走了；先 `match` 验证，命中就别加。留着是为了说明两件事：补丁必须压在通用规则之前，以及上游规则集会有缺陷、需要你自己兜。\n\n判断标准：**规则集是主力，显式域名是补丁。** 补丁应该短、有注释说明为什么加、定期回收。如果显式列表长到几十行还在增长，多半是数据源选错了。\n\n配置里保留的 4 个 `tt*` 域名就是合格的补丁——MetaCubeX 的 tiktok 分类漏了这几个 CDN 域，它们以 `tt` 开头，关键字匹配也捞不到。\n\n同一条规则里还有个 `ipinfo.io`，性质不同：它不是分流需求，而是**诊断用途**——把它固定到 `vpsre`，5.9 的\"两个出口 IP 必须不同\"才有确定的参照物。代价是 IP 查询会走住宅出口，流量极小可以接受。\n\n### 2.8 `experimental.cache_file`\n\n| 字段 | 说明 |\n|---|---|\n| `enabled` | 持久化 DNS 缓存和规则集，重启不用重新下载 |\n| `path` | **必须用绝对路径**，理由见 3.2 |\n| `store_fakeip` | 本配置不用 FakeIP，不写（默认 `false`） |\n\n#### `experimental.clash_api`（可选，排查分流的利器）\n\n开了之后可以用 Clash 面板看**每条活跃连接命中了哪条规则、走了哪个出站**，比翻日志直观得多。\n**`config/config.example.json` 里已经带上了它**，`secret` 是必须替换的占位符之一；不想要就把整个 `clash_api` 块删掉：\n\n```json\n\"experimental\": {\n  \"cache_file\": {\n    \"enabled\": true,\n    \"path\": \"/usr/local/etc/sing-box/cache.db\"\n  },\n  \"clash_api\": {\n    \"external_controller\": \"127.0.0.1:9090\",\n    \"external_ui\": \"ui\",\n    \"external_ui_download_url\": \"https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip\",\n    \"external_ui_download_detour\": \"vpstrans\",\n    \"secret\": \"换成一串随机字符\"\n  }\n}\n```\n\n`sudo launchctl kickstart -k system/sing-box` 重启后打开 `http://127.0.0.1:9090/ui`，首次进入填 `127.0.0.1:9090` 和你设的 secret。\n\n| 字段 | 说明 |\n|---|---|\n| `external_controller` | API 监听地址。**必须绑 `127.0.0.1`** |\n| `external_ui` | 面板文件目录。**相对路径**，相对 plist 里的 `WorkingDirectory`（即解到 `/usr/local/etc/sing-box/ui`）。没设 `WorkingDirectory` 就得写绝对路径 |\n| `external_ui_download_url` | 面板来源。换成 zashboard 等其他面板改这里即可 |\n| `external_ui_download_detour` | **面板要通过代理下载**，指向 `vpstrans` |\n| `secret` | 访问口令，必填 |\n\n**两条安全要求别省**：\n\n* `external_controller` 绑 `127.0.0.1` 而不是 `0.0.0.0`。\n* `secret` 必须设。\n\n这个接口能改配置、切换出站——暴露出去等于把代理控制权交出去。**排查完建议把整段注释掉。**\n\n> 需要内核带 `with_clash_api` 编译标签，官方 release 是带的（用 3.1 的 `sing-box version` 确认）。\n\n#### 不装面板的轻量替代\n\n```bash\nsudo lsof -nP -i -a -p $(pgrep -x sing-box)    # 内核当前的所有连接\nsudo nettop -p $(pgrep -x sing-box)            # 实时流量\n```\n\n但这两个只能看到 IP 和端口，**看不到域名和命中的规则**——分流调试还是得靠面板或 `log.level: debug`。\n\n### 2.9 版本兼容对照\n\n| 废弃写法 | 废弃版本 | 现在的写法 |\n|---|---|---|\n| 入站的 `sniff` / `sniff_override_destination` | 1.11 | 路由规则 `{\"action\":\"sniff\"}` |\n| `type: block` 出站 | 1.11 | 路由规则 `{\"action\":\"reject\"}` |\n| `type: dns` 出站 | 1.11 | 路由规则 `{\"action\":\"hijack-dns\"}` |\n| `geoip` / `geosite` 的 `.db` 数据库 | 1.8 | `rule_set` |\n| DNS 的 `{\"address\":\"https://...\"}` 旧格式 | 1.12 | `{\"type\":\"https\",\"server\":\"...\"}` |\n| 出站的 `domain_strategy` | 1.12（1.14 移除） | `domain_resolver: {server, strategy}` |\n| TUN 的 `inet4_address` / `inet6_address` | 1.10 | 合并为 `address` |\n| TUN 的 `gso` | 1.11 | 已无效，删掉 |\n| `dns.independent_cache` | 1.14 | 删掉 |\n| DNS 规则动作里的 `strategy` | 1.14（1.16 移除） | 用 `domain_resolver` 或 `dns.strategy` |\n| 规则集的 `download_detour` | 1.14（1.16 移除） | `http_client: {\"detour\": \"...\"}` |\n| `cache_file.store_rdrc` | 1.14（1.16 移除） | `store_dns` |\n\n**升级前的固定动作**：`singbox config audit`（上表这类废弃项它都认得，`independent_cache`、`download_detour`、`store_rdrc` 三条能 `--apply` 自动改）。废弃项通常只告警不报错，很容易在一次静默降级之后才发现分流不对了。\n\n---\n\n## 3. 安装 sing-box\n\n### 3.1 用官方 release，别用 Homebrew\n\n```bash\nVER=1.14.0   # 换成 release 页面上的实际版本号\ncd /tmp\ncurl -LO \"https://github.com/SagerNet/sing-box/releases/download/v${VER}/sing-box-${VER}-darwin-amd64.tar.gz\"\ntar xzf \"sing-box-${VER}-darwin-amd64.tar.gz\"\n\nsudo install -m 755 \"sing-box-${VER}-darwin-amd64/sing-box\" /usr/local/bin/sing-box\nsudo xattr -d com.apple.quarantine /usr/local/bin/sing-box 2>/dev/null\nsing-box version\n```\n\nIntel 选 **`darwin-amd64`**（`arm64` 是 Apple Silicon）。\n\n**两个不用 Homebrew 的理由**：\n\n* **构建标签不保证。** 本方案用 `\"stack\": \"gvisor\"`，而 Homebrew 从源码构建时是否带 `with_gvisor` 没有保证。`sing-box version` 的输出会列出编译标签，确认有 `with_gvisor` 才能用 gvisor 栈，否则把配置改成 `\"stack\": \"system\"`。\n* **Homebrew 本体可能跟不上系统。** 在较新的 macOS 上会报 `unknown or unsupported macOS version`，需要 `brew update-reset` 才能恢复。sing-box 是单文件二进制、没有依赖链，手动装反而是更稳的长期选择——升级就是重下一个文件覆盖掉。\n\n### 3.2 放置配置\n\n先把第 1 章的配置存成本地文件（如 `./config.json`，占位符全部替换完），再放到位：\n\n```bash\nsudo mkdir -p /usr/local/etc/sing-box\nsudo cp ./config.json /usr/local/etc/sing-box/config.json\n```\n\n配置里 `experimental.cache_file.path` 用的是**绝对路径** `/usr/local/etc/sing-box/cache.db`。这不是随手写的：相对路径在前台运行时相对当前目录尚可，交给 launchd 后台运行时工作目录不确定，缓存会落到意外位置或直接失败。\n\n---\n\n## 4. macOS 系统层准备（不可跳过）\n\n本节都是**要做的动作**，做完不用马上逐条验证——统一到 [5.7](#57-系统层复查) 一次跑完。之所以单独成章而不并进第 5 章，是因为这些是配置文件管不了的前置条件：不先做，后面的验证不可能通过。\n\n\n### 4.1 关闭 IPv6\n\n**为什么配置里拦了 AAAA 还不够。** TUN 只有 IPv4 地址（`172.19.0.1/30`），`auto_route` 也就只接管 IPv4 默认路由。系统的 IPv6 默认路由仍指向物理网卡——只要有一个可用的 IPv6 地址，流量就直接从 en0 裸奔出去，连路由规则都碰不到。\n\nDNS 层拦 AAAA 是\"让应用拿不到 IPv6 地址\"，属于兜底；关掉系统接口才是\"让机器根本没有 IPv6 可用\"，是根治。**三层缺一不可**：\n\n```bash\n# 第 1 层：系统网络接口 —— 先看你机器上实际有哪些服务\nnetworksetup -listallnetworkservices\n\n# 验证\nifconfig en0 | grep inet6\n```\n\n服务名因机器而异，**照抄别人的命令多半会报错**——比如 `Ethernet` 是有线网卡服务，Intel MacBook Pro 没有内置网口，只有插了 USB/雷雳转以太网适配器才会出现这一条；没插就没有，对它执行 `setv6off` 会提示服务不存在。\n\n> **哪些 inet6 是正常的，不用管：**\n> * `fe80::…` —— 链路本地地址，出不了本地网段，测试站也用不到它。\n> * `::1 prefixlen 128` —— 环回地址，在 `lo0` 上，等价于 IPv6 版的 `127.0.0.1`。它是系统内部通信用的，**关不掉也不该关**，很多本地服务依赖它。\n> * `fdxx:…`（ULA，`fd00::/8`）—— 公网不可路由。macOS 上多半挂在某块 `utunN` 上，是点对点隧道自己配的内网段：插着 iPhone 跑 Xcode 时 CoreDevice 的设备隧道（`mtu 16000`，`fdxx::2` 对 `fdxx::1`）、Docker/OrbStack 的虚拟网卡都是这形状。`syscheck` / `verify` 会另起一行点名它，但不算泄漏、不报 ✗。\n>\n> **要消除的只有全局地址**：`2xxx:` / `2409:` / `240e:` 这类开头、且出现在 `en0` 等物理网卡上的。只要它们没了，就算关干净了。\n\n典型输出与处理方式：\n\n| 服务名 | 是什么 | 要不要关 IPv6 |\n|---|---|---|\n| `Wi-Fi` | 无线网卡，日常上网主力 | **必须关** |\n| `iPhone USB` | 用数据线连 iPhone 走个人热点（USB 网络共享） | **必须关**——它是一条真实的上网通道，走它上网时 IPv6 照样能出去 |\n| `Thunderbolt Bridge` | 雷雳网桥，两台 Mac 之间直连组成的本地网络 | 视用途而定，见下 |\n\n所以你的机器要执行的是：\n\n```bash\nsudo networksetup -setv6off \"Wi-Fi\"\nsudo networksetup -setv6off \"iPhone USB\"\n```\n\n**服务名含空格必须加引号**，否则 `networksetup` 会把它当成多个参数报错。\n\n**`Thunderbolt Bridge` 关不关？** 它不用于访问互联网，只在你用雷雳线直连另一台 Mac 时才有流量，所以**不关也不会造成泄漏**。但要注意它反过来的影响：Mac 之间的点对点发现依赖 IPv6 链路本地地址，关掉可能让雷雳网桥传文件不可用。**如果你用这个功能就别关；不用的话，关掉更省心**——将来插上雷雳设备时不会突然多出一条没设防的通道。\n\n第 2 层是 TUN 只配 IPv4 地址，第 3 层是 DNS 拦 AAAA/HTTPS 记录，两者都已写在配置里（见 2.2、2.3）。\n\n恢复用 `sudo networksetup -setv6automatic \"Wi-Fi\"`。\n\n> **这个设置按网络服务生效，不会继承。** 以后接新网卡、或连手机热点时系统新建了网络服务，都要重新执行一次。这是\"以为关了其实没关\"最常见的来源——所以 5.7 的复查脚本值得在换网络、换硬件后跑一遍。\n\n### 4.2 把系统 DNS 指向非局域网地址\n\n这一步最容易被跳过，症状却最迷惑：**能上网，但访问 Google 之类被污染的域名时解析出一个完全无关的 IP**（比如 `157.240.x.x`，那是 Facebook 的段），连接自然失败。\n\n**根因**：`auto_route` 把默认路由指向 utun，但局域网网段仍然直连物理网卡——`192.168.1.0/24 via en0` 比默认路由更具体。如果系统 DNS 是路由器地址（`192.168.1.1` 这类），这个查询根本不会进 TUN，也就轮不到配置里的 `hijack-dns` 规则，明文出去直接被投毒。\n\n`strict_route` 本可以解决，但 macOS 上开启它常导致局域网设备不可达（见 7.6），所以我们用另一种方式绕开：\n\n```bash\nsudo networksetup -setdnsservers \"Wi-Fi\" 1.1.1.1\nsudo dscacheutil -flushcache\n```\n\n填什么其实无所谓——反正会被 sing-box 劫持。填 `1.1.1.1` 只是为了保证它**不是内网地址**，这样查询才会走默认路由进 TUN。\n\n#### 4.2.1 脚本切系统 DNS 与 1.14 的 `dns_mode`：保留，不引入 `dns_mode`\n\nsing-box 1.14.0 给 `tun` 入站加了 `dns_mode`，文档说它能在 Apple 平台上做 per-interface DNS。\n这会让人以为脚本的 `networksetup -setdnsservers`（`dns_apply_proxy`）可以退休了——**不能**，立场是保留，\n依据如下：\n\n- sing-box v1.14.0 依赖 sing-tun `v0.9.0-beta.4`（`go.mod:58`）。那个版本的 `tun_darwin.go` **没有任何设置接口 DNS\n  的代码**；设置接口 DNS 的实现只有 `tun_windows.go:84-109` 的 `luid.SetDNS`，以及 Linux 的 nftables / iproute2 分支。\n- 文档里「per-interface DNS on Apple platforms」指的是图形客户端走 NetworkExtension 的路径，命令行内核在 macOS 上没有这条路。\n- 真机旁证：内核 1.14.0 运行中，Wi-Fi 的 DNS 仍是脚本设的 `1.1.1.1`，`scutil --dns` 里没有 utun 作用域的解析器。\n\n所以 `dns_backup_save` / `dns_apply_proxy` 的行为一字不动。**sing-tun 在 darwin 上实现接口 DNS 设置的那天要重评**——\n看点是 sing-tun 的 `tun_darwin.go` 出现 DNS 相关代码，届时 `dns_mode` 才有可能替代 `networksetup`。\n\n### 4.3 退掉其他 VPN 客户端\n\nmacOS 上同时只能有一个 TUN 客户端正常工作。启动前完全退出 Surge / Clash / Tailscale / 公司 VPN，否则 utun 抢占会导致虚拟网卡建不起来。\n\n**先说清楚一件事**：`ifconfig | grep utun` 一定会有输出，**这不代表有冲突**。macOS 自己就会为 iCloud 私密转发、Handoff、隔空播放等功能创建 `utun0`–`utun3` 之类的接口，它们始终存在、也不该动。真正会抢占的是第三方 VPN 客户端。\n\n**查谁在占**：\n\n```bash\n# 1) 常见的第三方 VPN / 代理进程\nps -axo pid,comm | grep -Ei \"tailscale|clash|surge|mihomo|xray|v2ray|openvpn|wireguard|warp|nord|express\"\n\n# 2) 系统级 VPN 配置（系统设置里添加的那种）\nscutil --nc list\n\n# 3) 看哪个 utun 真的承载了默认路由\nnetstat -rn -f inet | grep -E 'default|^0/1|^128\\.0/1'\n```\n\n**怎么退**：\n\n| 类型 | 操作 |\n|---|---|\n| 菜单栏 GUI 客户端 | 从菜单栏退出，或 `osascript -e 'quit app \"Surge\"'` |\n| Tailscale | `tailscale down`，或退出 App |\n| 系统设置里的 VPN | `scutil --nc stop \"\u003c配置名>\"`（名字取自 `scutil --nc list`） |\n| 后台守护进程 | `sudo launchctl list \\| grep -i \u003c关键字>` 找到 Label，再 `sudo launchctl bootout system/\u003cLabel>` |\n| iCloud 私密转发 | 系统设置 → Apple ID → iCloud → 关闭「私密转发」 |\n\n> **别用 `kill -9`。** 正常退出时这些客户端会自己拆掉 utun 并还原路由表；强杀会留下残留路由，症状是断网且看不出原因。理由同 6.3。\n>\n> 实在理不清谁在占，重启一次最省事——残留路由和孤儿 utun 都会被清掉。\n>\n> **iCloud 私密转发是特例**：它不抢 utun，但会接管 DNS 和部分流量，让分流结果对不上。排查阶段先关掉。\n\n### 4.4 浏览器自带 DoH 要关掉\n\nChrome 默认会对部分域名自动升级到**内置 DoH**，完全绕开系统 DNS、也就绕开了 sing-box。它可能用 HTTP/3 发这个请求，正好撞上配置里的 `udp/443 → reject`，于是解析卡死——典型症状是 Google 打不开而别的站正常。\n\n* Chrome：`chrome://settings/security` → 关闭「使用安全 DNS」\n* Firefox：`about:config` → `network.trr.mode` 设为 `5`\n\n---\n\n## 5. 验证清单\n\n**验证顺序的原则：先用不需要 root、不动系统路由表的手段，再上 TUN，最后才做成服务。** 前面几步出错不会把网络搞断，也不用反复重启服务；等它们都干净了，问题范围就只剩 TUN 那一层。\n\n每小节末尾都有「不通过时」分支，**照着分支走，不要跳回去改配置**——大多数返工都是因为在错误的层面上改东西。\n\n### 5.1 静态校验（不启动内核）\n\n```bash\nsing-box check  -c /usr/local/etc/sing-box/config.json    # 语法 + 引用完整性\nsing-box format -c /usr/local/etc/sing-box/config.json    # 规范化输出，加 -w 直接写回\nsing-box version                                          # 看编译标签\n```\n\n`format -w` 顺手统一缩进，配合 git 用能让 diff 干净很多。\n\n> 子命令在不同版本略有差异，`sing-box --help` 能确认你这版有哪些。\n\n**不通过时**\n\n| 报错 | 原因 | 处理 |\n|---|---|---|\n| `JSON syntax error` 之类 | 语法错 | `python3 -m json.tool config.json` 能报出具体行号，比 `check` 的提示更准 |\n| 提到某个 rule-set 找不到 | **悬空引用**——`dns.rules` 或 `route.rules` 引用了 `route.rule_set` 里没定义的 tag | 两边对齐；删规则集时记得同时删引用 |\n| `deprecated` 告警 | 用了旧字段 | 对照 2.9 改掉。**告警不阻止启动**，但可能已经静默降级 |\n| `version` 输出里没有 `with_gvisor` | 内核构建不带 gVisor | 把配置改成 `\"stack\": \"system\"`，或换官方 release 二进制（见 3.1） |\n\n### 5.2 规则集验证\n\n#### 规则集文件在哪\n\n**`type: remote` 的规则集不会在磁盘上留下 `.srs` 文件。** 它们下载后直接存进 `cache.db`，以二进制块的形式混在缓存里，没法单独取出来喂给 `rule-set match`。\n\n想确认内核实际下到了什么：\n\n```bash\nls -lh /usr/local/etc/sing-box/                            # cache.db 的大小和修改时间\ngrep -i \"rule-set\\|rule_set\" /var/log/sing-box.log | tail -30\n```\n\n`cache.db` 有几 MB 且时间是最近的，说明规则集确实下下来了。\n\n#### 自己下一份来排查\n\n要用 `match` / `decompile`，得另外下：\n\n```bash\nmkdir -p ~/singbox/rules && cd ~/singbox/rules\n\nBASE=https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/sing/geo\ncurl -x socks5h://127.0.0.1:10808 -LO \"$BASE/geosite/google.srs\"\ncurl -x socks5h://127.0.0.1:10808 -LO \"$BASE/geosite/cn.srs\"\n\nsing-box rule-set match google.srs services.googleapis.cn   # 某域名会不会命中\nsing-box rule-set decompile cn.srs | less                   # 看集合里到底有什么\n```\n\n`-x socks5h://127.0.0.1:10808` 走自己的代理下——`raw.githubusercontent.com` 在国内多半直连不了。这也正是配置里给每个规则集写 `http_client: {\"detour\": \"vpstrans\"}` 的原因。\n\n`match` 是排查分流最快的手段：怀疑某域名被误捞时一条命令就能证实，不用改配置重启试。\n\n#### 想锁定版本可以改成本地文件\n\n```json\n{\n  \"type\": \"local\",\n  \"tag\": \"geosite-google\",\n  \"format\": \"binary\",\n  \"path\": \"/usr/local/etc/sing-box/rules/google.srs\"\n}\n```\n\n**代价是不再自动更新**，得自己写定时任务重下。`cn`、`geolocation-!cn` 这类变动挺勤，除非有特殊理由要锁版本，否则 `remote` + `update_interval` 更省事。\n\n**不通过时**\n\n* **下载返回 404**：分类名不对。重点怀疑 `x`（上游可能叫 `twitter`）、`meta`（可能叫 `facebook`）、`anthropic` / `bing`（可能不单独成类）、`apple@cn`（MetaCubeX 文档里是 `apple-cn`）。改名或换源，改完记得配置里的 `url` 也要同步。\n* **`decompile` 报错但文件确实下下来了**：`.srs` 格式版本比你的内核新。换用与内核版本匹配的规则集源，或升级内核。\n* **`match` 结果与预期不符**：这不是故障，是规则集内容与你的假设不符。按 2.7 的原则决定是加显式补丁还是换源——**别急着改路由顺序**。\n\n### 5.3 连通性快测\n\n```bash\nsing-box tools connect your.vpstrans.host:443     # 端口通不通\nsudo sing-box tools fetch -c /usr/local/etc/sing-box/config.json https://api.ipify.org\n```\n\n`tools fetch` 用配置里的出站发一次请求，能确认**节点本身可用**（REALITY 握手成功、能取回内容）。\n\n> **它不能用来验证分流。** `tools fetch` 只是拿配置起一个临时上下文发请求，日志里不会输出路由匹配明细——即使把 `log.level` 调成 `debug` 也不会。真正能看到\"某域名命中哪条规则、派给哪个出站\"的，是 5.4 的 `sing-box run` 前台运行。分流验证放在那一步做。\n\n**到这一步为止都还没启动 TUN。**\n\n**不通过时**：连接超时或握手失败是节点问题，排查见 5.6；规则集相关报错回 5.2。\n\n### 5.4 前台试跑\n\n前三步都不需要 root、不动系统路由表。确认干净之后，才第一次把 TUN 拉起来——**仍然是前台运行**，不要直接做成服务：\n\n```bash\nsudo sing-box run -c /usr/local/etc/sing-box/config.json\n```\n\n`sudo` 不能省——TUN 建虚拟网卡、改路由表必须 root。缺了它报的是 `configure tun interface: operation not permitted`。\n\n盯着看三件事：内核是否正常启动、**每个 `rule_set` 是否下载成功**（下载失败不报错、只静默失效，见 2.7）、有没有 gVisor 相关告警。\n\n保持它在前台跑着，另开一个终端做完 5.5–5.9。**全部通过后回到这个终端 `Ctrl-C` 停掉**，再按第 6 节做成服务——前台实例不退，服务装上也起不来（端口被占）。\n\n**这一步不能跳过直接做服务**：后台运行时启动失败你什么都看不到，而 `KeepAlive` 还会不停把它拉起来刷日志。\n\n**启动失败时**\n\n| 报错 | 处理 |\n|---|---|\n| `operation not permitted` | 没有 root，加 `sudo` |\n| `address already in use` | 端口被占，见 7.2 |\n| `rule-set` 下载失败 | 回 5.2 |\n| 没报错但立刻退出 | 完整看输出，通常前几行就有原因；必要时把 `log.level` 调成 `debug` |\n\n### 5.5 服务与 TUN\n\n```bash\npgrep -fl sing-box                                       # 有输出\nifconfig | grep utun233                                  # 网卡建起来了吗\nnetstat -rn -f inet | grep -E 'default|^0/1|^128\\.0/1'   # 路由是否指向 utun\n```\n\n**第三条命令正常时应该输出什么**\n\n两种形式都算正常，取决于版本与 `auto_route` 的实现：\n\n```\ndefault            192.168.1.1        UGScg           en0\ndefault            link#20            UCSIg        utun233\n```\n\n或者\n\n```\n0/1                link#20            UCSI         utun233\ndefault            192.168.1.1        UGScg           en0\n128.0/1            link#20            UCSI         utun233\n```\n\n`0/1` + `128.0/1` 这一对合起来覆盖整个 IPv4 空间，且比 `default` 更具体，效果等同于接管默认路由。\n\n> **指向 `en0` 的那条 `default` 必须保留**，不是残留。sing-box 自己的出站流量要靠它才出得去，否则就成了自己套自己。判据是**有没有一条指向 `utun233` 的路由**，而不是\"只剩 utun 一条\"。\n\n**不正常的样子**：只有指向 `en0` 的 `default`，`utun233` 一行都没有。\n\n**默认路由没指向 utun 时怎么办**\n\n这说明 TUN 没生效，先定位原因：\n\n```bash\ntail -50 /var/log/sing-box.log      # 前台运行时直接看终端输出\n```\n\n常见原因就三个：**没有 root**（前台跑忘了 `sudo`，或服务装成了 LaunchAgent 而非 LaunchDaemon）、**别的 VPN 抢了 utun**（见 4.3）、**睡眠唤醒后路由丢了**（见 6.4）。\n\n**修好之后必须补两件事**，否则会以为还没好：\n\n```bash\n# 1) 确认 4.2 的 DNS 设置还在\nnetworksetup -getdnsservers \"Wi-Fi\"\n```\n\n返回 `1.1.1.1` 就没问题；返回 `There aren't any DNS Servers set` 或某个 `192.168.x.x`，说明被冲掉了，回 4.2 重做。公司 VPN、Tailscale MagicDNS 接管过 DNS 而退出时没还原，或系统设置里切换过\"位置\"，都会造成这种情况。\n\n```bash\n# 2) 清 DNS 缓存\nsudo dscacheutil -flushcache\ndig +short www.google.com\n```\n\n> **为什么一定要清缓存**：TUN 没生效的那段时间，DNS 查询是**明文直接出网**的——没有隧道劫持它，`1.1.1.1` 就只是一个普通的对外 UDP 请求，在国内既会被污染也构成泄漏。那期间的污染结果会留在系统缓存里，不清掉的话，TUN 修好了照样解析出错误 IP，很容易误判成\"没修好\"。\n\n### 5.6 先绕开 TUN 验证节点链路\n\n```bash\ncurl -s --max-time 10 -x socks5h://127.0.0.1:10808 https://api.ipify.org\n```\n\n返回 vpstrans 的 IP = 内核、节点、REALITY 全部正常。\n\n**不通过时——别去碰 TUN 和路由规则**，问题一定在更底层：\n\n1. **节点参数**：`uuid`、`server_name`(SNI)、`public_key`、`short_id` 任一处不对，REALITY 握手都会失败。逐字符比对服务端配置。\n2. **`flow` 与服务端不一致**：两边都得是 `xtls-rprx-vision`。\n3. **Mux 没关**：Vision 与 Mux 冲突。\n4. **服务端或网络本身有问题**：`sing-box tools connect your.vpstrans.host:443` 测端口通不通。\n\n### 5.7 系统层复查\n\n第 4 节那几项设置**按网络服务生效、不会继承**，所以这一步不只是首次验证——**换 Wi-Fi、插网卡、连手机热点之后都该跑一遍**。\n\n一条脚本把所有网络服务的 IPv6 与 DNS 一次看完：\n\n```bash\nnetworksetup -listallnetworkservices | tail -n +2 | sed 's/^\\*//' | while IFS= read -r svc; do\n  printf \"%-24s \" \"$svc\"\n  printf \"v6=%-4s \" \"$(networksetup -getinfo \"$svc\" | awk -F': ' '/^IPv6:/{print $2}')\"\n  printf \"dns=%s\\n\" \"$(networksetup -getdnsservers \"$svc\" | tr '\\n' ' ')\"\ndone\n```\n\n**每行都要满足**：`v6=Off`，且 `dns` 不是内网地址（`192.168.x.x` / `10.x.x.x` 这类）。任一条不满足，回 4.1 / 4.2 补。\n\n再验证实际效果：\n\n```bash\ndig +short www.google.com            # 真实 Google 地址，不是 157.240.x.x 这类污染答案\nifconfig | grep inet6                # 只应剩 fe80:: 与 ::1（utun 上的 fdxx:: ULA 也没关系）\n```\n\n* `https://dnsleaktest.com` → Extended Test，结果里**不应出现本地运营商**\n* `https://test-ipv6.com` → 判据是**未检测到 IPv6 连接**，不是看分数高低\n\n> 这两项过不去而前面各步都正常时，先怀疑浏览器自带 DoH（见 4.4）和 iCloud 私密转发（见 4.3）——它们都会绕过内核。\n\n### 5.8 QUIC 与局域网\n\n* `https://cloudflare-quic.com/` 应显示未使用 HTTP/3\n* `ping 192.168.1.1`、内网 SSH、AirDrop 发现设备、局域网打印机\n\n> **不要用 `curl --http3` 来验这一条。** macOS 自带的 curl（8.7.1，SecureTransport）\n> 没有编进 HTTP/3，`curl --http3 -V` 恒为失败——那不是\"QUIC 被挡住了\"，是这条命令\n> 压根测不了。`singbox verify` 第 4 步改用另一种测法：往 `cloudflare-quic.com:443`\n> 和 `quic.rocks:4433` 发一个 version 字段填保留值的 QUIC long-header 包，按 RFC 9000 §6，\n> 服务端认不出版本时**必须**回一个 Version Negotiation 包。**收到回包 = UDP/443 出得去\n> = 禁 QUIC 规则没生效**；两个端点全超时才算已阻断。\n>\n> 已知局限：全超时时\"已阻断\"与\"本机 UDP 整体出不去\"分不开，脚本按前者这个乐观读法判。\n\n**不通过时**\n\n* **仍在用 HTTP/3**：先清浏览器的 socket 缓存（Chrome：`chrome://net-internals/#sockets` → Flush socket pools），再确认禁 QUIC 那条规则在广告拦截之前、且 `network` 和 `port` 两个字段都写了。\n* **局域网设备不可达**：检查私有地址那几条规则是不是排在最前面（第 3–5 条）。如果你把 `strict_route` 打开了，关掉它——这是 macOS 上最常见的原因，见 7.6。\n* **AirDrop / 隔空播放失效**：确认 `domain_suffix` 里有 `local`，且 `224.0.0.0/4` 一类的组播地址被 `ip_is_private` 覆盖。\n\n### 5.9 出口 IP 与国内直连\n\n前面几步验的是\"流量派给了谁\"，这一步验\"**实际从哪里出网**\"——两者不是一回事。\n\n```bash\ncurl -s https://api.ipify.org         # 走 final 兜底 → 应是 vpstrans 机房 IP\ncurl -s https://ipinfo.io/json        # 已在社交组 → 应是 vpsre 住宅 IP\ncurl -s https://cip.cc                # 国内站直连 → 应显示本地城市与运营商\n```\n\n三条各验一件事：\n\n| 命令 | 验什么 | 判据 |\n|---|---|---|\n| `api.ipify.org` | 兜底出站可用 | 返回 vpstrans 的机房 IP |\n| `ipinfo.io/json` | **服务端按 UUID 分流是否生效** | 与上一条**必须是不同地址**，且 ISP 为住宅运营商而非机房 |\n| `cip.cc` | 国内直连未被代理 | 显示你本地的城市与运营商，且**这个 IP 不等于第一条走 SOCKS 拿到的出口 IP** |\n\n> 最后那半句是 `singbox verify` 第 5 步的机器判据：两者相等就说明国内流量全被代理接走了，\n> 直连规则没生效。`cip.cc` 抽风时脚本会依次退到 `myip.ipip.net`、`ip.3322.net`，\n> 三家全挂才报失败——\"这一步没有结论\"本身就是一条结论，不该被当成通过。\n\n**第二条最关键，也最容易被跳过。** 它验的是\"实际从哪里出网\"，而日志只能告诉你\"派给了谁\"——**证明不了 vpsre 的出口真是住宅 IP**。vpsre 到住宅节点那段中转在服务端，客户端看不见；中转挂了的话日志照样打 `outbound/vless[vpsre]`，出口却已经变回机房 IP。这是客户端侧唯一能发现它的手段。\n\n**配合日志看分流命中。** 5.4 还在前台跑着的话，那个终端里每条连接都有一行：\n\n```\nINFO [...] outbound/vless[vpsre]: outbound connection to \u003c某个 tiktok 域名>:443\n```\n\n**方括号里的出站 tag 就是路由结果。** 正常浏览一会儿，看社交类域名是不是都落在 `vpsre`、AI 和工具类落在 `vpstrans`、国内域名不出现在任何代理出站里——比逐个 `curl` 覆盖面大得多。\n\n想进一步看**为什么**走这条出站（命中第几条规则），把 `log.level` 调成 `debug` 或 `trace` 重跑；或用 Clash 面板的连接列表（见 2.8），它直接给出每条连接的规则与出站链。\n\n> 配置里已把 `ipinfo.io` 显式加进社交组（第 10 条），所以这条判断成立。换用别的配置时要先确认它确实命中 `vpsre`。\n\n再打开 bilibili / 淘宝，确认延迟在几十毫秒内。\n\n**不通过时**\n\n**前两条地址相同** → 服务端按 UUID 分流没生效，或 vpsre 的中转链路断了。这是服务端问题，客户端配置怎么改都没用。\n\n**`api.ipify.org` 返回你本机的公网 IP** → 流量根本没进代理，回 5.5 查 TUN 是否接管。\n\n**国内站点慢或绕路**，按可能性排序：\n\n1. **`geoip-cn` / `geosite-cn` 没下来** → 回 5.2 验证 URL。这是最常见的。\n2. **DNS 分流与路由分流不一致** → `dns.rules` 里判为国内解析的集合，必须和 `route.rules` 里判为 `direct` 的集合一致，见 2.2 结尾那条规律。\n3. **第 14/15 条顺序的固有代价** → 同时属于 `cn` 和 `geolocation-!cn` 的域名会走代理，见 2.6。这是设计取舍，不是故障；真的影响体验就把两条对调。\n\n> 注意排除干扰项：国内站点本身的抖动、以及 iCloud 私密转发（见 4.3）都会造成类似现象。\n\n## 6. 运行与开机自启\n\n**开始之前：先确认 5.4 的前台进程已经停掉。**\n\n```bash\npgrep -fl sing-box     # 应该没有输出\n```\n\n还在跑的话回那个终端 `Ctrl-C`。前台实例不退就装服务，launchd 拉起的新实例会因为 `listen tcp 127.0.0.1:10808 bind: address already in use` 起不来，而 `KeepAlive` 会不停重试刷日志——排查起来很费劲，见 7.2。\n\n**别用 `kill -9` 结束前台进程**，理由见 6.3。\n\n### 6.1 LaunchDaemon\n\n需要 root，所以必须放 `/Library/LaunchDaemons/`（系统级），不是 `~/Library/LaunchAgents/`（用户级，拿不到 root）。\n\n```bash\nsudo tee /Library/LaunchDaemons/sing-box.plist > /dev/null \u003c\u003c'EOF'\n\u003c?xml version=\"1.0\" encoding=\"UTF-8\"?>\n\u003c!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\"\n \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\">\n\u003cplist version=\"1.0\">\n\u003cdict>\n  \u003ckey>Label\u003c/key>\u003cstring>sing-box\u003c/string>\n  \u003ckey>ProgramArguments\u003c/key>\n  \u003carray>\n    \u003cstring>/usr/local/bin/sing-box\u003c/string>\n    \u003cstring>run\u003c/string>\n    \u003cstring>-c\u003c/string>\n    \u003cstring>/usr/local/etc/sing-box/config.json\u003c/string>\n  \u003c/array>\n  \u003ckey>WorkingDirectory\u003c/key>\u003cstring>/usr/local/etc/sing-box\u003c/string>\n  \u003ckey>RunAtLoad\u003c/key>\u003ctrue/>\n  \u003ckey>KeepAlive\u003c/key>\u003ctrue/>\n  \u003ckey>StandardOutPath\u003c/key>\u003cstring>/var/log/sing-box.log\u003c/string>\n  \u003ckey>StandardErrorPath\u003c/key>\u003cstring>/var/log/sing-box.err\u003c/string>\n\u003c/dict>\n\u003c/plist>\nEOF\n\nsudo chown root:wheel /Library/LaunchDaemons/sing-box.plist\nsudo chmod 644 /Library/LaunchDaemons/sing-box.plist\n\nplutil -lint /Library/LaunchDaemons/sing-box.plist          # 先验语法，必须输出 OK\nsudo launchctl bootstrap system /Library/LaunchDaemons/sing-box.plist\n```\n\n> **用 `bootstrap` 而不是老的 `load -w`。** `load` / `unload` 是遗留接口，报错信息含糊——最常见的 `Load failed: 5: Input/output error` 几乎不给任何线索。`bootstrap` 会明确指出是哪个字段、哪个路径的问题。旧系统（macOS 10.10 之前）才需要退回 `load`。\n\n> 若 `which sing-box` 不是 `/usr/local/bin/sing-box`，把 plist 里的路径改成实际值。\n\n**\"开机自启\"具体指什么**\n\n`RunAtLoad` + LaunchDaemon 意味着：**系统启动时、用户登录之前**就由 launchd 拉起。不需要你登录，机器一开机代理就在——这也是它与用户级 LaunchAgent 的区别之一。\n\n关键字段：\n\n| 字段 | 作用 |\n|---|---|\n| `RunAtLoad` | 加载时立即启动，配合 LaunchDaemon 即开机自启 |\n| `KeepAlive` | 进程**意外退出**时自动拉起 |\n| `disable` / `enable` | 持久开关，跨重启生效。与 `bootout` / `bootstrap`（只影响本次开机）是两回事 |\n\n**`KeepAlive` 与 `bootout` 不冲突**：`bootout` 是把整个 job 从 launchd 卸掉，没有 job 也就没有 KeepAlive，所以停下来之后不会自己起来。\n\n### 6.2 日常操作\n\n| 目的 | 命令 |\n|---|---|\n| 改完配置重启 | `sudo launchctl kickstart -k system/sing-box` |\n| 停止（卸载 job） | `sudo launchctl bootout system/sing-box` |\n| 启动（加载 job） | `sudo launchctl bootstrap system /Library/LaunchDaemons/sing-box.plist` |\n| **彻底停用（重启后也不启）** | `sudo launchctl disable system/sing-box` |\n| 解除停用 | `sudo launchctl enable system/sing-box` |\n| 看 job 状态 | `sudo launchctl print system/sing-box` |\n| 看日志 | `tail -f /var/log/sing-box.log` |\n| 确认在跑 | `pgrep -fl sing-box` |\n| 确认 TUN 生效 | `netstat -rn -f inet \\| grep -E 'default\\|^0/1\\|^128\\.0/1'` |\n\n### 6.3 三个必须知道的坑\n\n**① 调配置期间先 `bootout`。** `KeepAlive` 会在进程退出后自动拉起，配置写错时它会疯狂重启刷日志，且掩盖真正的报错。改配置时先停服务，前台手动跑。\n\n> **`bootout` 只对本次开机有效。** plist 还在 `/Library/LaunchDaemons/`，重启电脑后照样自启——调配置调到一半重启了机器，会发现它又跑起来，且很可能因为端口占用干扰你的前台调试。跨越重启的调试期间加一条 `sudo launchctl disable system/sing-box`，调完用 `enable` 恢复。\n\n**② 绝对不要 `kill -9`。** 正常退出时 sing-box 会拆掉 utun 并还原路由表；强杀会留下残留路由，症状是断网且看不出原因，只能手工清理或重启系统。用 `launchctl bootout` 或前台的 `Ctrl-C`。\n\n**③ 睡眠唤醒可能丢路由。** 表现是能连但全部超时。\n\n### 6.4 关于路由丢失\n\n**没有能 100% 根除的方案。** 根因在 macOS：唤醒或切换网络时系统会重建网络配置、重置默认路由，而 utun 是用户态程序创建的，系统不负责替它恢复。所有基于 utun 的客户端都有这个问题，只是概率不同。\n\n按性价比排序的缓解手段：\n\n**① 先确认真是路由丢失，而不是 DNS 缓存失效**\n\n```bash\nnetstat -rn -f inet | grep -E 'default|^0/1|^128\\.0/1'\n```\n正常应看到指向 utun 的路由。如果这些还在、只是打不开网页，那是 DNS 问题，`sudo dscacheutil -flushcache` 即可。\n\n**② 确保 `auto_detect_interface` 开着**，它能覆盖大部分切换 Wi-Fi / 插拔网线的场景，但覆盖不了深度睡眠唤醒。别手工指定固定出站网卡，那等于关掉自愈能力。\n\n**③ 换协议栈做 A/B。** `gvisor` 与 `system` 在唤醒后的表现因机器而异，两边各跑几天挑复发率低的。**这是实测里最有效的一步。**\n\n**④ 减少睡眠深度。** Intel Mac 进入 standby 后网络栈重建最彻底，丢路由概率最高：\n\n```bash\nsudo pmset -c standby 0\nsudo pmset -c powernap 0\n```\n恢复默认：`sudo pmset -c standby 1 powernap 1`。代价是插电待机耗电略增。\n\n**⑤ 自动化兜底：唤醒后自动重启服务**\n\n```bash\nbrew install sleepwatcher\ncat > ~/.wakeup \u003c\u003c'EOF'\n#!/bin/bash\nsleep 8\n/bin/launchctl kickstart -k system/sing-box\nEOF\nchmod +x ~/.wakeup\n```\n\n> sleepwatcher 本身要以 root 运行才能 kickstart 系统级服务。\n\n**不要用 `route add` 手工补路由**——sing-box 下发的是一组带 scope 的路由项，手补的那条与内核状态不一致，会出现\"路由表看着对、流量却仍然漏出去\"的情况，比直接超时更危险。\n\n---\n\n## 7. 故障排查\n\n### 7.1 速查表\n\n| 现象 | 最可能的原因 | 处理 |\n|---|---|---|\n| `configure tun interface: operation not permitted` | 没有 root | 用 `sudo` 跑；服务必须是 LaunchDaemon 不是 LaunchAgent |\n| `listen tcp 127.0.0.1:10808 bind: address already in use` | 旧实例或别的程序占着端口 | 见 7.2 |\n| 服务反复重启刷日志 | 配置有误 + `KeepAlive` 自动拉起 | 先 `unload`，按 5.4 前台手动跑看真实报错 |\n| 看不到 utun | 其他 VPN 占用 / 权限 | 退出 Tailscale、Surge、Clash；删掉 `interface_name` 让系统自动分配 |\n| 能连但全部超时 | 规则集下载失败，或路由丢失 | 查日志 rule-set 记录；按 5.5 看路由 |\n| **访问 Google 解析出 `157.240.x.x`** | 系统 DNS 是内网地址，查询没进 TUN 被投毒 | 见 4.2 |\n| 只有 Google 打不开，别的境外站正常 | 浏览器内置 DoH 绕过系统 DNS | 见 4.4 |\n| 日志里出现 `198.18.x.x` | 跑的不是这份配置（FakeIP 来自别处） | 见 7.3 |\n| IPv6 仍被检测到 | 第 1 层没做，或新网络服务未继承设置 | 见 4.1 |\n| 域名规则不生效、只有 IP 规则有效 | 缺 `{\"action\":\"sniff\"}` | 检查它是不是第一条 |\n| 某类流量莫名走了兜底 | 该规则集下载失败，静默不命中 | 按 2.7 验证 URL |\n| 国内网站很慢 | 第 14/15 条顺序的代价，或 DNS 分流不一致 | 见 2.6 |\n| 睡眠唤醒后断网 | 路由丢失 | `sudo launchctl kickstart -k system/sing-box` |\n| 换了内核二进制后起不来，`sing-box.err` 一行都没有 | macOS 26+ 的 BTM 把 ad-hoc 签名的 daemon 按 cdhash 钉进启动约束，`kickstart -k` 不重新登记 → `Launch Constraint Violation`（见 `log show --predicate 'process == \"launchd\"'` 与 `/Library/Logs/DiagnosticReports/sing-box-*.ips`） | `sudo launchctl bootout system/sing-box && sudo launchctl bootstrap system /Library/LaunchDaemons/sing-box.plist`；`singbox update` / `rollback` 已改走这条 |\n\n### 7.2 端口被占用\n\n```bash\nsudo lsof -nP -iTCP:10808 -sTCP:LISTEN\n```\n\n* **是自己的旧实例或别的代理客户端**：用它自己的方式退出（GUI 客户端从菜单栏退，或 `osascript -e 'quit app \"名称\"'`），再 `pgrep -fl \"sing-box|xray\"` 确认没有残留。有残留用 `sudo kill \u003cPID>`，**不要 `-9`**。\n* **是自己的旧实例**：`KeepAlive` 会拉起新实例而旧的还占着端口，于是无限重启。先 `sudo launchctl bootout system/sing-box`，确认 `pgrep` 无输出，再 `bootstrap` 重新加载。\n* **是别的程序**：改自己的端口更省事，改完记得所有验证命令里的 10808 也要跟着换。\n\n### 7.3 日志里出现 FakeIP 地址\n\n`198.18.0.0/15` 是 FakeIP 段——不存在于真实互联网的假地址。把它送进代理隧道，对端无从解析，连接必然失败。\n\n**本配置没有启用 FakeIP**（`dns.servers` 里没有 `type: \"fakeip\"`，`store_fakeip` 也没开）。出现它只有两种可能：实际生效的是别的配置，或者有别的客户端在跑。\n\n```bash\nps -ax | grep \"sing-box\" | grep -o \"\\-c [^ ]*\"     # 看 -c 指向哪个文件\ngrep -n \"fakeip\\|198.18\" /usr/local/etc/sing-box/config.json   # 应该搜不到\n```\n\n另外，即便开了 FakeIP，正常配置也不该把假地址送进出站——嗅探会在连接建立前把域名还原回来。假地址泄漏到 outbound 说明**嗅探链路是断的**，检查 `{\"action\":\"sniff\"}` 是不是第一条规则。\n\n### 7.4 排查顺序建议\n\n1. `sing-box check` — 配置本身有没有语法或引用错误（不启动，最快）\n2. `pgrep -fl sing-box` — 进程在不在\n3. `curl -x socks5h://127.0.0.1:10808` — 节点链路通不通（绕开 TUN）\n4. `netstat -rn -f inet | grep -E 'default'` — TUN 接管了没有（预期输出见 5.5）\n5. `dig +short` — DNS 解析对不对\n6. `sing-box run` 前台运行 + `log.level: debug` — 某条连接具体命中哪条规则、走哪个出站\n\n**前四步能把绝大多数问题定位到具体层面**，跳过它们直接改配置往往越改越乱。\n\n### 7.5 服务加载失败\n\n`sudo launchctl bootstrap system ...` 或旧语法 `load -w` 报错时，按顺序查：\n\n```bash\n# 1) plist 语法（最常中）\nplutil -lint /Library/LaunchDaemons/sing-box.plist        # 必须输出 OK\n\n# 2) 属主与权限\nls -l /Library/LaunchDaemons/sing-box.plist               # 应为 root wheel、-rw-r--r--\n\n# 3) job 是不是已经加载了\nsudo launchctl print system/sing-box                      # 有输出说明已在，重复加载会失败\n\n# 4) 可执行文件是否存在\nls -l /usr/local/bin/sing-box\n```\n\n**语法坏掉最常见的原因**：用 `sudo tee \u003c\u003c'EOF'` 创建 plist 时，如果整块命令是从 Markdown 代码围栏里复制的，内层的 `EOF` 可能连带终结外层，文件被截断。`plutil -lint` 不是 `OK` 就直接重写。\n\n修正后重新加载：\n\n```bash\nsudo chown root:wheel /Library/LaunchDaemons/sing-box.plist\nsudo chmod 644 /Library/LaunchDaemons/sing-box.plist\nsudo launchctl bootout system/sing-box 2>/dev/null        # 若已加载，先卸\nsudo launchctl bootstrap system /Library/LaunchDaemons/sing-box.plist\n```\n\n还看不出原因就查 launchd 自己的日志：\n\n```bash\nlog show --predicate 'process == \"launchd\"' --last 5m | grep -i sing-box\n```\n\n> `Load failed: 5: Input/output error` 是旧接口 `load` 的典型含糊报错，它几乎不给线索。**换成 `bootstrap` 重试一次**，同样的问题它会指出具体字段或路径。\n\n### 7.6 关于 `strict_route`\n\n官方说明它可以让不支持的网络不可达、并防止 Windows 多网卡 DNS 泄漏，代价是可能让某些应用无法工作。**macOS 上开启常导致局域网设备（AirDrop、打印机、内网 SSH）不可达**，所以本方案关闭它，转而用 2.2 的方式解决 DNS 不进 TUN 的问题。\n\n如果你的场景不需要局域网互访，可以试着打开它，那样 2.2 就不是必须的了。\n\n---\n\n## 8. 安全与维护\n\n* 只从 `github.com/SagerNet/sing-box/releases` 下载，校验 sha256。\n* REALITY 的 `public_key` / `short_id` 泄漏等于节点泄漏，别把完整参数贴到任何在线工具或聊天群。\n* 两条节点的 UUID 分别对应\"机房出口\"和\"住宅出口\"，住宅 IP 更宝贵，不要用于大流量下载或扫描类流量，容易被 ISP 判定异常。\n* 把 `/usr/local/etc/sing-box/` 做成 git 仓库。配置改动能回溯，升级内核时对照 4.9 的废弃表也方便。\n* 内核升级后：`sing-box check` → 手动触发一次规则集更新（srs 有格式版本）→ 重跑第 5 节验证清单。\n* LaunchDaemon 以 root 常驻是本方案的安全代价。确保 `/usr/local/bin/sing-box` 和配置文件的属主是 root、其他用户不可写。\n\n---\n\n## 9. 脚本的设计取舍\n\n操作手册（`docs/manual-*.md`）只讲怎么做；这一节讲脚本为什么那样做。\n\n### 9.1 几条纪律\n\n* **绝不 `kill -9`。** 正常退出时 sing-box 会拆掉 utun 并还原路由表；强杀留下残留路由，症状是断网且看不出原因。脚本一律 SIGTERM、等 8 秒，超时只警告。\n* **用 `bootstrap` / `bootout`，不用 `load` / `unload`。** 后者是遗留接口，`Load failed: 5: Input/output error` 几乎不给线索。\n* **配置永远不被就地破坏。** `install` 用工作副本，`edit` 校验不过不写入且保留修改，覆盖前一定备份、自动保留 10 份。\n* **并发保护。** 锁目录防两个实例同时改配置或加载服务，属于已死进程的锁自动清理。\n* **只读命令不要 sudo**（`verify` / `syscheck` / `rules`），**非 tty 自动取默认**，`--help` 在任何平台都能看（平台检查放在参数解析之后）。\n\n### 9.2 verify 的两档退出码\n\n分档的判据只有一条：**回滚到旧内核能不能把它换回来。** 能的是链路档（退 `1`）：SOCKS 不通、取不到出口 IP、两个出口相同、有全局 IPv6；不能的是策略档（退 `2`）：DNS、QUIC、国内直连、网关、参照站、废弃字段——这些是路由策略与环境的问题，换内核一个字都改不了。`update` 因此只认 `1` 才回滚。\n\n**第 2 步「两个出口 IP 不同」是全脚本最关键的一项。** 日志只能证明连接派给了 `vpsre` 出站，证明不了 `vpsre` 的出口真是住宅 IP——那段中转在服务端，客户端看不见。中转挂了日志照样打 `[vpsre]`，出口却已变回机房 IP。\n\n六步里没有静默跳过：`dig` 不可用降级到 `host` → `dscacheutil` → `python3`，四级全废才报「无解析手段」，与「疑似污染」分开报；QUIC 不依赖 `curl --http3`（macOS 自带的 curl 没编 HTTP/3），改为直接发一个 QUIC 版本协商包看对端回不回。\n\n### 9.3 日志为什么只能原地截断\n\nplist 把 stdout / stderr 指向 `/var/log/sing-box.log` 与 `.err`，launchd 只管写，不轮转、不封顶，实测能涨到几百 MB。那个 fd 是 launchd 打开、`dup2` 到子进程 fd 2 上的：一旦换了 inode（`mv`、`rm` 后重建、任何 rename 式轮转），守护进程会一直往没有名字的旧文件里写——磁盘收不回来，新日志也看不到。`logs truncate` 用 `: > 文件`，inode 不变。\n\n不配 `newsyslog`，因为它只会 rename + 新建，没有原地截断选项（`man newsyslog.conf` 的 flags 里没有一个是截断）。配上去等于装了一个看着在管日志、实际让守护进程往归档文件里写的东西。\n\n### 9.4 DNS 备份的归一化\n\n首次 `install` 改系统 DNS 之前，脚本把每个网络服务的原值记进 `~/.config/singbox/dns-backup`，还原时逐条写回。**备份里等于 `1.1.1.1` 的条目按 DHCP 处理**：如果装脚本之前就手动把 DNS 设成了 `1.1.1.1`，备份记下的就是它，照着回滚等于没还原。写备份和读备份两处都归一化。还原后回读实际生效值打印出来，避免「以为还原了其实没有」。\n\n### 9.5 edit 的编辑器回退\n\n优先级 `--editor` > 已保存偏好 > `$EDITOR` > `vi`，任一级不可用就降级并说明原因；已保存的编辑器被卸载会自动清除偏好。**只有「显式指定且确实可用」才写入偏好**——回退得到的结果不记住，免得一次意外把错的编辑器固化下来。验证只看命令的第一个词，所以 `code -w` 这类带参数的写法没问题。\n\n### 9.6 update 的沙箱与完整性校验\n\n`check -c` 校验的是语法与字段合法性，字段还在、语义变了它照样过；sing-box 迭代快（`1.11` 换 DNS 格式、`1.14` 移除 `domain_strategy`），静态校验通过但新内核起不来或代理坏了都真实发生过。所以阶段 1 要真的把新内核跑起来试一次，用**派生配置**：删掉 `tun` 入站（不然和现网撞设备）、`mixed` 端口换成从 `10900` 起探到的闲置端口、`cache_file.path` 指到临时目录。代价是沙箱验不到 TUN 与系统路由的回归，那类问题只能在阶段 2/3 暴露、靠回滚兜底。\n\n上游 release 没有 checksum 文件，但 GitHub Releases API 的每个 asset 带 `digest`（`sha256:\u003chex>`）。下载完当场比对，对不上就删；取不到就 warn 后放行，不装作校验过。它能挡传输损坏与单个镜像投毒，挡不住「API 与文件出自同一个坏镜像」——它不是签名。架构那一步仍照验：sha256 证明不了「下对了平台」。\n\n阶段 S（脚本自更新）**不许阻断内核升级**：取不到新版、下载失败、`bash -n` 不过，一律 warn 一句继续。远端版本相等或更低也不动——release 被回退时把用户降级，等于把修好的 bug 再装回去。替换 `/usr/local/bin/singbox` 用 `mv` 不用 `cp`：bash 边执行边按偏移量读脚本文件，`cp` 覆盖同一个 inode，正在跑的进程下一次读取会落在错误的偏移上。\n\n`.prev` 只由 `update` 写、只保留一份。`install` 的临时回滚点放在临时目录——早先两者共用 `$BIN.prev`，`update` 成功后再跑一次 `install` 会把退路无声删掉。\n\n### 9.7 镜像回退\n\n前缀式镜像站更替频繁，所以不假定哪个一定可用：内置一份列表，每次先用 HEAD 探测（每源最多 6 秒、建连 4 秒），只有探通的才真正下载；下载中 20 秒低于 2 KB/s 判为卡住换下一个。成功的镜像记进 `~/.config/singbox/prefs`，但直连始终排最前，网络恢复自然走直连。版本号查询三层兜底：GitHub API → 镜像上的 API → 解析 `releases/latest` 的 302 跳转。\n\n### 9.8 架构判定\n\n判据是硬件（`sysctl -n hw.optional.arm64`），**不是 `uname -m`**——后者报的是当前进程的架构，在 Rosetta 方式打开的终端、x86_64 的 Homebrew bash 或 `arch -x86_64 bash` 里会说 `x86_64`。早先按它判断，会在 ARM 机器上装 Intel 内核，一个常驻的网络路径守护进程被塞进翻译层，而且 `update` 走同一个函数，会把这个错误一直续下去。检测到当前 shell 被翻译（`sysctl.proc_translated` = 1）时 `install` 会明说，并提示用 `arch -arm64 zsh` 开原生 shell。\n"},{"path":"docs/config-audit-and-modernize.md","title":"配置审查与一键适配（`config audit`）","summary":"内核升级会把配置里的字段悄悄变成历史。2026-09-10 实测：本机内核已是 1.14.0，而 live 配置里 21 条 `route.ruleset[]` 全部带着 `downloaddetour`，内核每次启动都在 `/var/log/sing-box.err` 里写：","hash":"b75c0bb688ee1330","kind":"spec","inferred":false,"status":"shipped","headings":[{"level":1,"text":"配置审查与一键适配（`config audit`）","line":7},{"level":2,"text":"问题","line":13},{"level":2,"text":"决定","line":42},{"level":3,"text":"「不更改已配置的功能」怎么机械证明","line":105},{"level":2,"text":"不在范围内","line":130},{"level":2,"text":"受影响的文件与接口","line":152},{"level":3,"text":"`singbox.sh`","line":154},{"level":3,"text":"测试","line":193},{"level":3,"text":"文档","line":207},{"level":2,"text":"待定问题","line":218},{"level":2,"text":"验证","line":238},{"level":3,"text":"验收条件","line":240},{"level":3,"text":"机械验收（离线，进 CI 口径）","line":247},{"level":3,"text":"人工验收（要动 live，已 deny，须本人跑）","line":267},{"level":2,"text":"实现计划","line":281},{"level":3,"text":"三个待定问题的落地结论","line":291},{"level":3,"text":"spec 与实测不符的四处","line":301},{"level":3,"text":"实现过程中发现的一个真 bug（不在 spec 里）","line":327},{"level":3,"
