<script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById("sdlc-site-data").textContent);
var DOCS = DATA.docs || [], PATHS = DATA.paths || {}, META = DATA.meta || {};
var BY = {}; DOCS.forEach(function(d){ BY[d.path] = d; });
var KINDS = ["entry","manual","spec","design","progress","skill","agent"];
var KIND_ZH = {entry:"入口",manual:"手册",spec:"spec",design:"设计",progress:"进度",skill:"技能",agent:"agent",none:"未分类"};
var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); };
var dirname = function(p){ var i = p.lastIndexOf("/"); return i < 0 ? "" : p.slice(0, i); };
var basename = function(p){ return p.slice(p.lastIndexOf("/") + 1); };
var norm = function(p){ var out = []; p.split("/").forEach(function(s){ if (!s || s === ".") return; if (s === "..") out.pop(); else out.push(s); }); return out.join("/"); };
var docHref = function(p, frag){ return "#doc/" + encodeURI(p) + (frag ? "#" + frag : ""); };
var pathHref = function(p){ return "#path/" + encodeURI(p); };
var kindOf = function(d){ return d.kind || "none"; };
var seal = function(d){ return '<span class="seal' + (d.inferred ? " inf" : "") + '" title="' + (d.inferred ? "类型由路径推断" : "类型由 frontmatter 声明") + '">' + esc(KIND_ZH[kindOf(d)] || d.kind) + "</span>"; };
var badges = function(d){
  var h = seal(d);
  if (d.kind === "spec" && d.status) h += '<span class="state st-' + esc(d.status) + '">' + esc(d.status) + "</span>";
  return h;
};
var state = { tab: "kind", doc: null, q: "" };

// ---- 页头 ----
$("m-count").textContent = (META.count || DOCS.length) + " 份文档";
$("m-sha").textContent = META.sha ? "HEAD " + META.sha.slice(0, 7) : "";
$("m-built").textContent = META.builtAt ? "生成于 " + META.builtAt : "";
$("tgl").onclick = function(){ $("side").classList.toggle("hide"); };

// ---- marked：相对链接改写成 hash 路由 ----
var CUR = null;
marked.use({
  walkTokens: function(t){
    if (t.type !== "link" || !CUR) return;
    var h = t.href || "";
    if (/^[a-z][a-z0-9+.-]*:/i.test(h) || h.charAt(0) === "/" || h.charAt(0) === "#") return;
    var frag = "", i = h.indexOf("#"); if (i >= 0) { frag = h.slice(i + 1); h = h.slice(0, i); }
    var p = norm(dirname(CUR.path) + "/" + h);
    if (BY[p]) t.href = docHref(p, frag);
    else if (PATHS[p]) t.href = pathHref(p);
  }
});

// ---- 列表列 ----
function row(d, extra){
  var on = state.doc && state.doc.path === d.path ? " on" : "";
  return '<a class="row' + on + '" href="' + docHref(d.path) + '"><span class="t">' + seal(d) + esc(d.title) + "</span><small>" + esc(d.path) + "</small>" + (extra || "") + "</a>";
}
function listKind(){
  var groups = {}; DOCS.forEach(function(d){ (groups[kindOf(d)] = groups[kindOf(d)] || []).push(d); });
  var h = "";
  KINDS.concat(["none"]).forEach(function(k){
    if (!groups[k]) return;
    h += "<h4>" + esc(KIND_ZH[k]) + "<em>" + groups[k].length + "</em></h4>";
    groups[k].sort(function(a, b){ return a.path < b.path ? -1 : 1; }).forEach(function(d){ h += row(d); });
  });
  return h;
}
function listDir(){
  var tree = {};
  DOCS.forEach(function(d){ var n = tree, parts = d.path.split("/"); parts.slice(0, -1).forEach(function(s){ n = n[s] = n[s] || {}; }); (n.__f = n.__f || []).push(d); });
  var openDir = state.doc ? dirname(state.doc.path) : "";
  function render(n, prefix){
    var h = "";
    Object.keys(n).filter(function(k){ return k !== "__f"; }).sort().forEach(function(k){
      var full = prefix ? prefix + "/" + k : k, open = openDir === full || openDir.indexOf(full + "/") === 0;
      h += "<details" + (open || !prefix ? " open" : "") + "><summary>" + esc(k) + "/</summary>" + render(n[k], full) + "</details>";
    });
    (n.__f || []).sort(function(a, b){ return a.path < b.path ? -1 : 1; }).forEach(function(d){ h += row(d); });
    return h;
  }
  return render(tree, "");
}
function listPaths(){
  var keys = Object.keys(PATHS).sort();
  if (!keys.length) return '<div class="empty" style="padding:1em 20px;font-size:13px">没有文档声明 covers，正文里也没提到任何仍存在的路径。</div>';
  var h = "<h4>改了它该回看哪些文档<em>" + keys.length + " 个路径</em></h4>";
  keys.forEach(function(k){
    var e = PATHS[k], on = location.hash === pathHref(k) ? " on" : "";
    h += '<a class="row' + on + '" href="' + pathHref(k) + '"><span class="t"><code>' + esc(k) + "</code></span><small>声明覆盖 " + e.covers.length + "，正文提到 " + e.mentions.length + "</small></a>";
  });
  return h;
}
function listSearch(){
  var q = state.q.trim().toLowerCase();
  var h = '<input id="qbox" type="search" placeholder="标题 / 各级标题 / 全文，子串匹配" value="' + esc(state.q) + '">';
  if (!q) return h + '<div class="empty" style="padding:0 20px;font-size:13px">先搜标题，再搜各级标题，最后搜全文。</div>';
  var hits = [];
  DOCS.forEach(function(d){
    var rank = 0, snip = "";
    if ((d.title || "").toLowerCase().indexOf(q) >= 0) rank = 3;
    else if ((d.headings || []).some(function(x){ return x.text.toLowerCase().indexOf(q) >= 0; })) rank = 2;
    else { var i = (d.body || "").toLowerCase().indexOf(q); if (i >= 0) { rank = 1; var s = Math.max(0, i - 40), body = d.body.slice(s, i + q.length + 60).replace(/\s+/g, " "); snip = esc(body).replace(new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "ig"), function(m){ return "<mark>" + m + "</mark>"; }); } }
    if (rank) hits.push({ d: d, rank: rank, snip: snip });
  });
  hits.sort(function(a, b){ return b.rank - a.rank || (a.d.path < b.d.path ? -1 : 1); });
  h += "<h4>结果<em>" + hits.length + " 条</em></h4>";
  hits.slice(0, 80).forEach(function(x){ h += row(x.d, x.snip ? '<span class="snip">…' + x.snip + "…</span>" : ""); });
  return h;
}
function renderList(){
  var tabs = $("tabs").children; for (var i = 0; i < tabs.length; i++) tabs[i].className = tabs[i].getAttribute("data-tab") === state.tab ? "on" : "";
  var h = state.tab === "dir" ? listDir() : state.tab === "paths" ? listPaths() : state.tab === "q" ? listSearch() : listKind();
  $("list").innerHTML = h;
  var box = $("qbox");
  if (box) {
    var timer = null;
    box.oninput = function(){ clearTimeout(timer); var v = box.value; timer = setTimeout(function(){ state.q = v; history.replaceState(null, "", "#q/" + encodeURIComponent(v)); renderList(); var b = $("qbox"); if (b) { b.focus(); b.setSelectionRange(v.length, v.length); } }, 200); };
    if (document.activeElement !== box && !state.doc) box.focus();
  }
  var on = $("list").querySelector(".row.on"); if (on && on.scrollIntoView) on.scrollIntoView({ block: "nearest" });
}

// ---- 正文列 ----
function relList(title, items, fn){
  if (!items || !items.length) return "";
  return "<dt>" + esc(title) + "</dt><dd><ul>" + items.map(fn).join("") + "</ul></dd>";
}
function docLink(p){ var d = BY[p]; return "<li><a href=\"" + docHref(p) + "\">" + esc(d ? d.title : p) + "</a> <small>" + esc(p) + "</small></li>"; }
function refLink(r){ var i = r.indexOf("#"), p = r.slice(0, i), s = r.slice(i + 1); return "<li><a href=\"" + docHref(p, s) + "\">" + esc(basename(p).slice(0, 2) + " §" + s) + "</a> <small>" + esc(p) + "</small></li>"; }
function linkifyRefs(root, d){
  var map = {}; (d.refs || []).forEach(function(r){ var i = r.indexOf("#"), p = r.slice(0, i), s = r.slice(i + 1); map[basename(p).slice(0, 2) + " §" + s] = docHref(p, s); });
  if (!Object.keys(map).length) return;
  var re = /(\d{2})[ \u00a0]§(\d+(?:\.\d+)?)/g;
  var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false), nodes = [], n;
  while ((n = walker.nextNode())) { var e = n.parentNode, skip = false; while (e && e !== root) { if (/^(A|CODE|PRE)$/.test(e.nodeName)) { skip = true; break; } e = e.parentNode; } if (!skip && re.test(n.nodeValue)) nodes.push(n); re.lastIndex = 0; }
  nodes.forEach(function(tn){
    var s = tn.nodeValue, frag = document.createDocumentFragment(), last = 0, m; re.lastIndex = 0;
    while ((m = re.exec(s))) {
      var key = m[1] + " §" + m[2]; if (!map[key]) continue;
      frag.appendChild(document.createTextNode(s.slice(last, m.index)));
      var a = document.createElement("a"); a.href = map[key]; a.textContent = m[0]; frag.appendChild(a); last = m.index + m[0].length;
    }
    frag.appendChild(document.createTextNode(s.slice(last))); tn.parentNode.replaceChild(frag, tn);
  });
}
function findHeading(root, frag){
  if (!frag) return null;
  var byId = root.querySelector("#" + CSS.escape(frag)); if (byId) return byId;
  var hs = root.querySelectorAll("h1,h2,h3,h4,h5,h6"), re = new RegExp("^(§\\s*)?" + frag.replace(/\./g, "\\.") + "(?!\\d)(?!\\.\\d)");
  for (var i = 0; i < hs.length; i++) if (re.test(hs[i].textContent.trim())) return hs[i];
  return null;
}
function showDoc(d, frag){
  var same = state.doc && state.doc.path === d.path;
  state.doc = d;
  if (!same) {
    CUR = d;
    var fm = "";
    if (d.front && Object.keys(d.front).length) {
      fm = '<div class="meta"><dl>' + Object.keys(d.front).map(function(k){ var v = d.front[k]; return "<dt>" + esc(k) + "</dt><dd>" + (Array.isArray(v) ? v.map(function(x){ return "<code>" + esc(x) + "</code>"; }).join(" ") : esc(v)) + "</dd>"; }).join("") + "</dl></div>";
    }
    var rel = relList("链接到", d.links, docLink) + relList("被链接", d.backlinks, docLink) + relList("引用的章节", d.refs, refLink) + relList("被引用", d.backrefs, docLink)
      + relList("提到的路径", d.mentions, function(p){ return "<li><a href=\"" + pathHref(p) + "\"><code>" + esc(p) + "</code></a></li>"; });
    var html = '<div class="hdr"><div class="marks">' + badges(d) + '</div><h1>' + esc(d.title) + '</h1><div class="p">' + esc(d.path) + "</div></div>"
      + fm + '<div class="md">' + marked.parse(d.body || "") + "</div>" + (rel ? '<div class="rel"><h4>关联</h4><dl>' + rel + "</dl></div>" : "");
    $("content").innerHTML = html;
    var md = $("content").querySelector(".md");
    var h1 = md.querySelector("h1"); if (h1 && h1.textContent.trim() === d.title) h1.parentNode.removeChild(h1);
    linkifyRefs(md, d);
    var hs = md.querySelectorAll("h2,h3"), toc = "";
    for (var i = 0; i < hs.length; i++) { hs[i].id = hs[i].id || "h-" + (i + 1); toc += '<a class="l' + hs[i].nodeName.charAt(1) + '" href="' + docHref(d.path, hs[i].id) + '">' + esc(hs[i].textContent) + "</a>"; }
    $("toc").innerHTML = toc ? "<h5 style=\"margin:0 0 .4em;color:var(--muted)\">目录</h5>" + toc : "";
    document.title = d.title + " · 文档站";
  }
  var target = findHeading($("content"), frag);
  if (target) target.scrollIntoView({ block: "start" }); else if (!same) window.scrollTo(0, 0);
}
function showPath(p){
  state.doc = null; CUR = null;
  var e = PATHS[p];
  $("toc").innerHTML = ""; document.title = p + " · 文档站";
  if (!e) { $("content").innerHTML = '<div class="empty">没有文档 cover 或提到 <code>' + esc(p) + "</code>。</div>"; return; }
  $("content").innerHTML = '<div class="hdr"><div class="marks"><span class="seal">代码路径</span></div><h1><code>' + esc(p) + '</code></h1><p class="lede">改了它该回看的文档</p></div><div class="rel" style="margin-top:1.5em"><dl>'
    + (relList("声明覆盖它的", e.covers, docLink) || "<dt>声明覆盖它的</dt><dd>无</dd>") + (relList("正文提到它的", e.mentions, docLink) || "<dt>正文提到它的</dt><dd>无</dd>") + "</dl></div>";
  window.scrollTo(0, 0);
}
function showHome(){
  state.doc = null; CUR = null; $("toc").innerHTML = ""; document.title = "文档站";
  var pend = DOCS.filter(function(d){ return d.kind === "spec" && (d.status === "draft" || d.status === "building"); });
  var counts = {}; DOCS.forEach(function(d){ counts[kindOf(d)] = (counts[kindOf(d)] || 0) + 1; });
  var tally = KINDS.concat(["none"]).filter(function(k){ return counts[k]; }).map(function(k){ return '<span class="n">' + counts[k] + '</span><a href="#kind">' + esc(KIND_ZH[k]) + "</a>"; }).join("");
  $("content").innerHTML = '<div class="home"><h1>' + esc(META.project || "文档站") + '</h1><p class="lede">' + DOCS.length + " 份文档，从四种约定织成一页：frontmatter、行内代码路径、章节引用、markdown 链接。文档之间的关系都是算出来的，页面上没有一个字是另外写的。</p>"
    + '<div class="tally">' + tally + "</div>"
    + (pend.length ? '<div class="rel" style="margin-top:1.5em"><h4>还悬着的 spec</h4><dl>' + relList("draft / building", pend.map(function(d){ return d.path; }), docLink) + "</dl></div>" : "")
    + '<div class="note">生成于 ' + esc(META.builtAt || "") + (META.sha ? "，HEAD " + esc(META.sha.slice(0, 7)) : "") + "。页面不判过期：要看哪些文档改了而页面还没跟上，跑 <code>sdlc-doc site --stale</code>；重生成跑 <code>sdlc-doc site</code>。"
    + ((META.sources || []).length ? "<br>扫描集：" + META.sources.map(function(x){ return "<code>" + esc(x) + "</code>"; }).join("　") : "") + "</div></div>";
}

// ---- 路由 ----
function route(){
  var h = location.hash.slice(1);
  if (h.indexOf("doc/") === 0) {
    var rest = h.slice(4), i = rest.indexOf("#"), p = decodeURI(i < 0 ? rest : rest.slice(0, i)), frag = i < 0 ? "" : decodeURIComponent(rest.slice(i + 1));
    if (BY[p]) showDoc(BY[p], frag); else { state.doc = null; $("content").innerHTML = '<div class="empty">页面里没有 <code>' + esc(p) + "</code>——它可能是生成之后才加的。</div>"; }
  } else if (h.indexOf("path/") === 0) { state.tab = "paths"; showPath(decodeURI(h.slice(5))); }
  else if (h.indexOf("q") === 0) { state.tab = "q"; state.q = h.length > 2 ? decodeURIComponent(h.slice(2)) : state.q; showHome(); }
  else if (h === "kind" || h === "dir" || h === "paths") { state.tab = h; showHome(); }
  else showHome();
  renderList();
  if (window.innerWidth <= 900 && state.doc) $("side").classList.add("hide");
}
window.addEventListener("hashchange", route);
route();
setTimeout(route, 60);   // 首屏带 #frag 打开时，浏览器自己的锚点处理会盖掉第一次滚动，再定位一次
})();
</script>
